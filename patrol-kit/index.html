n\u003c/td>\u003ctd>están\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>SER — what something IS\u003c/h4>\n\u003cp>Identity, origin, nationality, occupation, time, permanent traits.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Soy agente. ¿De dónde es usted? Es mexicano. Son las tres.\u003c/span>\u003c/div>\n\u003ch4>ESTAR — where or how something is\u003c/h4>\n\u003cp>Location, temporary conditions, results of change.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde está su familia? Está herido. Estamos cerca del río. Usted está detenido.\u003c/span>\u003c/div>\n\u003cp>Memory hook: for \u003cb>how you feel\u003c/b> and \u003cb>where you are\u003c/b>, always use estar.\u003c/p>","quiz":[{"q":"'Where is the bridge?' =","opts":["¿Dónde es el puente?","¿Dónde está el puente?","¿Dónde son el puente?","¿Adónde es el puente?"],"a":1,"why":"Location = ESTAR, even for permanent things like bridges."},{"q":"'He is a Canadian citizen' =","opts":["Está ciudadano canadiense","Es ciudadano canadiense","Están canadiense","Ser canadiense"],"a":1,"why":"Nationality and identity = SER."},{"q":"'Are you hurt?' =","opts":["¿Es usted herido?","¿Está usted herido?","¿Son ustedes herido?","¿Eres herido?"],"a":1,"why":"Condition/state = ESTAR."},{"q":"'It's 3 o'clock' =","opts":["Están las tres","Es las tres","Son las tres","Hay las tres"],"a":2,"why":"Time uses SER; plural 'son' for hours after one."},{"q":"'You are detained' =","opts":["Usted es detenido","Usted está detenido","Usted son detenido","Usted hay detenido"],"a":1,"why":"Result of an action = ESTAR + past participle."}]},{"id":"g5","title":"Tener & Its Idioms","tag":"Lesson V + Idioms section","body":"\n\u003ch4>Tener — to have\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>yo\u003c/th>\u003cth>tú\u003c/th>\u003cth>usted/él\u003c/th>\u003cth>nosotros\u003c/th>\u003cth>ustedes/ellos\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tengo\u003c/td>\u003ctd>tienes\u003c/td>\u003ctd>tiene\u003c/td>\u003ctd>tenemos\u003c/td>\u003ctd>tienen\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Spanish 'has' what English 'is'\u003c/h4>\n\u003cp>The manual's idiom list is gold — these use tener, not ser/estar:\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Idiom\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tener ... años\u003c/td>\u003ctd>to be ... years old\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener frío / calor\u003c/td>\u003ctd>to be cold / hot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener hambre / sed\u003c/td>\u003ctd>to be hungry / thirsty\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener miedo\u003c/td>\u003ctd>to be afraid\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener sueño\u003c/td>\u003ctd>to be sleepy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener prisa\u003c/td>\u003ctd>to be in a hurry\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener razón\u003c/td>\u003ctd>to be right\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener la culpa\u003c/td>\u003ctd>to be to blame\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener cuidado\u003c/td>\u003ctd>to be careful\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Obligation\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">tener que + infinitive\u003c/span> — \u003cspan class=\"e\">Tengo que revisar su mochila. (I have to search your backpack.)\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">hay que + infinitive\u003c/span> — \u003cspan class=\"e\">Hay que esperar. (One must wait — impersonal.)\u003c/span>\u003c/div>","quiz":[{"q":"'How old are you?' =","opts":["¿Cuántos años es usted?","¿Cuántos años tiene usted?","¿Qué años está usted?","¿Cómo años tiene?"],"a":1,"why":"Age = tener años. Literally 'how many years do you have?'"},{"q":"'I am cold' =","opts":["Soy frío","Estoy frío","Tengo frío","Hago frío"],"a":2,"why":"Personal cold = tener frío. (Hace frío = the weather is cold.)"},{"q":"'They are afraid' =","opts":["Son miedo","Están miedo","Tienen miedo","Hay miedo"],"a":2,"why":"Tener miedo = to be afraid."},{"q":"'You have to sign' =","opts":["Tiene que firmar","Tiene firmar","Hay firmar","Es que firmar"],"a":0,"why":"Tener que + infinitive = obligation."},{"q":"'Hay que decir la verdad' means...","opts":["He has to tell the truth","There is truth","One must tell the truth","Say the truth loudly"],"a":2,"why":"Hay que = impersonal necessity: one must / it's necessary to."}]},{"id":"g6","title":"Polite Commands — Your Workhorse","tag":"Lessons VII & XVIII","body":"\n\u003ch4>How to build an usted command\u003c/h4>\n\u003cp>1. Take the \u003cb>yo\u003c/b> form of the present. 2. Drop the -o. 3. Flip the vowel: -AR verbs → \u003cb>-e\u003c/b>, -ER/-IR verbs → \u003cb>-a\u003c/b>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>yo form\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>hablar\u003c/td>\u003ctd>hablo\u003c/td>\u003ctd>hable (speak)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>correr\u003c/td>\u003ctd>corro\u003c/td>\u003ctd>corra (run)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>subir\u003c/td>\u003ctd>subo\u003c/td>\u003ctd>suba (get in)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>poner\u003c/td>\u003ctd>pongo\u003c/td>\u003ctd>ponga (put)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>venir\u003c/td>\u003ctd>vengo\u003c/td>\u003ctd>venga (come)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>decir\u003c/td>\u003ctd>digo\u003c/td>\u003ctd>diga (say)\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>True irregulars: \u003cb>vaya\u003c/b> (go), \u003cb>sea\u003c/b> (be), \u003cb>esté\u003c/b> (be), \u003cb>dé\u003c/b> (give), \u003cb>sepa\u003c/b> (know).\u003c/p>\n\u003ch4>Pronoun placement — the detail that marks fluency\u003c/h4>\n\u003cp>Affirmative: pronoun attaches to the end. Negative: pronoun goes before.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Siéntese.\u003c/span> \u003cspan class=\"e\">Sit down.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">No se mueva.\u003c/span> \u003cspan class=\"e\">Don't move.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Dígame la verdad.\u003c/span> \u003cspan class=\"e\">Tell me the truth.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">No me mienta.\u003c/span> \u003cspan class=\"e\">Don't lie to me.\u003c/span>\u003c/div>","quiz":[{"q":"Command of 'esperar' (to wait):","opts":["espera","espere","esperar","espero"],"a":1,"why":"-AR verb → -e ending: Espere aquí."},{"q":"'Come here' (formal) =","opts":["Viene acá","Ven acá","Venga acá","Vengo acá"],"a":2,"why":"Venir → yo vengo → venga."},{"q":"'Don't move' =","opts":["No muévase","No se mueva","No mueva se","Muévase no"],"a":1,"why":"Negative command: pronoun BEFORE the verb."},{"q":"'Sit down' =","opts":["Se siente","Siéntese","Sientese usted no","Sentar"],"a":1,"why":"Affirmative: pronoun attaches to the end (with a written accent)."},{"q":"Command of 'ir' (to go):","opts":["vaya","va","iga","vea"],"a":0,"why":"Ir is truly irregular: vaya. (Vea is from ver.)"}]},{"id":"g7","title":"Question Words","tag":"Lesson VII","body":"\n\u003ch4>The interrogatives\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Word\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>¿Qué?\u003c/td>\u003ctd>What?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuál? / ¿Cuáles?\u003c/td>\u003ctd>Which? / What? (before ser)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Quién? / ¿Quiénes?\u003c/td>\u003ctd>Who?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Dónde?\u003c/td>\u003ctd>Where?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Adónde?\u003c/td>\u003ctd>Where to?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿De dónde?\u003c/td>\u003ctd>Where from?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuándo?\u003c/td>\u003ctd>When?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuánto/a/os/as?\u003c/td>\u003ctd>How much / how many?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cómo?\u003c/td>\u003ctd>How?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Por qué?\u003c/td>\u003ctd>Why?\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>All carry a written accent. Prepositions come FIRST: ¿\u003cb>Con\u003c/b> quién viaja? ¿\u003cb>De\u003c/b> qué país es?\u003c/p>\n\u003ch4>Qué vs. Cuál before 'es'\u003c/h4>\n\u003cp>¿\u003cb>Qué\u003c/b> es? asks for a definition. ¿\u003cb>Cuál\u003c/b> es su nombre? asks which one out of the possibilities — that's why name, nationality, and address questions use cuál.\u003c/p>","quiz":[{"q":"'What is your name?' =","opts":["¿Qué es su nombre?","¿Cuál es su nombre?","¿Quién es su nombre?","¿Cómo es su nombre?"],"a":1,"why":"Selecting from possibilities before 'es' → cuál."},{"q":"'Where are you going?' =","opts":["¿Dónde va?","¿Adónde va?","¿De dónde va?","¿Cuándo va?"],"a":1,"why":"Motion toward → adónde."},{"q":"'Who are you traveling with?' =","opts":["¿Quién viaja con?","¿Con quién viaja?","¿Quién con viaja?","¿Cuál viaja?"],"a":1,"why":"The preposition must lead: con quién."},{"q":"'How many children?' =","opts":["¿Cuánto niños?","¿Cuántos niños?","¿Cuántas niños?","¿Qué niños?"],"a":1,"why":"Cuántos agrees: masculine plural."},{"q":"'¿Por qué corrió?' means...","opts":["Where did he run?","Why did he run?","How did he run?","When did he run?"],"a":1,"why":"Por qué = why. (Porque, one word, = because.)"}]},{"id":"g8","title":"Object Pronouns","tag":"Lesson XV","body":"\n\u003ch4>Direct object (whom/what)\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>me\u003c/th>\u003cth>te\u003c/th>\u003cth>lo / la\u003c/th>\u003cth>nos\u003c/th>\u003cth>los / las\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>me\u003c/td>\u003ctd>you (inf.)\u003c/td>\u003ctd>him, it, you-formal / her, it, you-formal-fem\u003c/td>\u003ctd>us\u003c/td>\u003ctd>them, you all\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Indirect object (to/for whom)\u003c/h4>\n\u003cp>\u003cb>le\u003c/b> = to him/her/you &nbsp;•&nbsp; \u003cb>les\u003c/b> = to them/you all\u003c/p>\n\u003ch4>Placement\u003c/h4>\n\u003cp>Before a conjugated verb; attached to infinitives and affirmative commands.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Lo veo.\u003c/span> \u003cspan class=\"e\">I see him/it.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">Voy a esposarlo.\u003c/span> \u003cspan class=\"e\">I'm going to cuff him.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Quién lo ayudó?\u003c/span> \u003cspan class=\"e\">Who helped you?\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">Déme su pasaporte.\u003c/span> \u003cspan class=\"e\">Give me your passport.\u003c/span>\u003c/div>\n\u003cp>Field tip: when addressing a man formally, \"you\" as a direct object is \u003cb>lo\u003c/b>; a woman, \u003cb>la\u003c/b>. 'Le' for indirect: Le voy a hacer unas preguntas — I'm going to ask you some questions.\u003c/p>","quiz":[{"q":"'I see them (the men)' =","opts":["Veo los","Los veo","Les veo los","Veo ellos"],"a":1,"why":"Direct object pronoun goes before the conjugated verb: Los veo."},{"q":"'Give me your license' =","opts":["Dé me su licencia","Déme su licencia","Me dé su licencia","Su licencia déme"],"a":1,"why":"Pronoun attaches to affirmative commands: Déme."},{"q":"'I'm going to search it (the bag, la bolsa)' =","opts":["Voy a revisarlo","Voy a revisarla","La voy a revisarla","Voy a lo revisar"],"a":1,"why":"Bolsa is feminine → la, attached to the infinitive."},{"q":"'Who helped you (a man)?' =","opts":["¿Quién le ayudó a cruzar?","¿Quién lo ayudó?","¿Quién los ayudó a él?","Both A and B are heard"],"a":3,"why":"Lo is the textbook direct object; le is widespread too (leísmo). You'll hear both — use lo."},{"q":"'I'm going to ask you some questions' =","opts":["Voy a hacerle unas preguntas","Voy a hacer usted preguntas","Le voy a hacerle preguntas","Hago le preguntas"],"a":0,"why":"Indirect le attaches to the infinitive: hacerle."}]},{"id":"g9","title":"Preterite — The Interview Tense","tag":"Lesson XI","body":"\n\u003ch4>Completed past actions\u003c/h4>\n\u003cp>When did you cross? Who brought you? How much did you pay? — every one of these is preterite. It's the single most useful past tense for field questioning.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>cruzAR\u003c/th>\u003cth>comER/vivIR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>crucé\u003c/td>\u003ctd>comí\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>cruzaste\u003c/td>\u003ctd>comiste\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>\u003cb>cruzó\u003c/b>\u003c/td>\u003ctd>\u003cb>comió\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>cruzamos\u003c/td>\u003ctd>comimos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>cruzaron\u003c/td>\u003ctd>comieron\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>The irregular stems worth memorizing\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>usted form\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tener\u003c/td>\u003ctd>tuvo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>estar\u003c/td>\u003ctd>estuvo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>hacer\u003c/td>\u003ctd>hizo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>decir\u003c/td>\u003ctd>dijo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>venir\u003c/td>\u003ctd>vino\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ir / ser\u003c/td>\u003ctd>fue (identical!)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>dar\u003c/td>\u003ctd>dio\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Cuándo cruzó? ¿Quién vino con usted? ¿Qué dijo el guía?\u003c/span>\u003cbr>\u003cspan class=\"e\">When did you cross? Who came with you? What did the guide say?\u003c/span>\u003c/div>","quiz":[{"q":"'When did you cross?' =","opts":["¿Cuándo cruza?","¿Cuándo cruzó?","¿Cuándo cruzaba?","¿Cuándo cruzar?"],"a":1,"why":"Completed past event → preterite usted form: cruzó."},{"q":"'He came alone' =","opts":["Vino solo","Venía solo","Viene solo","Vengo solo"],"a":0,"why":"Venir → vino in the preterite."},{"q":"'They paid $5,000' =","opts":["Pagan cinco mil","Pagaron cinco mil dólares","Pagaban cinco mil","Pagar cinco mil"],"a":1,"why":"-aron = ustedes/ellos preterite of -AR verbs."},{"q":"'Fue' can mean...","opts":["Only 'he went'","Only 'he was'","Either 'he went' or 'he was'","He will go"],"a":2,"why":"Ir and ser share identical preterite forms — context decides."},{"q":"'What did he say?' =","opts":["¿Qué dice?","¿Qué dijo?","¿Qué decía?","¿Qué diga?"],"a":1,"why":"Decir → dijo. One of the must-know irregulars."}]},{"id":"g10","title":"Imperfect — Setting the Scene","tag":"Lesson XI & XIII","body":"\n\u003ch4>The other past tense\u003c/h4>\n\u003cp>The imperfect describes ongoing, habitual, or background past — what \u003ci>was happening\u003c/i>, what things \u003ci>used to be\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>-AR (caminar)\u003c/th>\u003cth>-ER/-IR (vivir)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>caminaba\u003c/td>\u003ctd>vivía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>caminaba\u003c/td>\u003ctd>vivía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>caminábamos\u003c/td>\u003ctd>vivíamos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>caminaban\u003c/td>\u003ctd>vivían\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Only three irregulars in the whole language: \u003cb>ser → era\u003c/b>, \u003cb>ir → iba\u003c/b>, \u003cb>ver → veía\u003c/b>.\u003c/p>\n\u003ch4>Preterite vs. imperfect in an interview\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Caminábamos por el bosque cuando vimos la luz.\u003c/span>\u003cbr>\u003cspan class=\"e\">We were walking through the woods (background–imperfect) when we saw the light (event–preterite).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde vivía usted en Canadá?\u003c/span>\u003cbr>\u003cspan class=\"e\">Where were you living in Canada? (ongoing state)\u003c/span>\u003c/div>","quiz":[{"q":"'We were walking' (background action) =","opts":["Caminamos","Caminábamos","Caminaron","Caminemos"],"a":1,"why":"Ongoing past action → imperfect."},{"q":"'Where were you living?' =","opts":["¿Dónde vivió?","¿Dónde vivía?","¿Dónde vive?","¿Dónde vivirá?"],"a":1,"why":"Ongoing residence → imperfect vivía."},{"q":"The imperfect of 'ir' is...","opts":["fue","iba","vaya","irá"],"a":1,"why":"One of only three irregular imperfects: iba."},{"q":"'Había tres personas' means...","opts":["There will be three people","There were three people (scene)","Three people arrived","There are three people"],"a":1,"why":"Había = imperfect of hay: there was/were, describing a scene."},{"q":"Pick the correct combo: 'They were sleeping when we arrived' =","opts":["Durmieron cuando llegábamos","Dormían cuando llegamos","Duermen cuando llegaron","Dormían cuando llegábamos"],"a":1,"why":"Background = imperfect (dormían); interrupting event = preterite (llegamos)."}]},{"id":"g11","title":"Talking About the Future","tag":"Lesson XXI","body":"\n\u003ch4>The easy way: ir a + infinitive\u003c/h4>\n\u003cp>Conjugate ir (voy, va, vamos, van) + a + any infinitive. This covers 90% of field needs.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Voy a revisar su mochila. Vamos a la estación. ¿Quién lo va a recoger?\u003c/span>\u003c/div>\n\u003ch4>The true future tense\u003c/h4>\n\u003cp>Add endings straight onto the infinitive: \u003cb>-é, -ás, -á, -emos, -án\u003c/b>. Hablaré = I will speak. Irregular stems: tendr- (tener), har- (hacer), dir- (decir), podr- (poder), sabr- (saber), vendr- (venir), saldr- (salir), pondr- (poner).\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Un agente hablará con usted pronto.\u003c/span>\u003cbr>\u003cspan class=\"e\">An agent will speak with you soon.\u003c/span>\u003c/div>\n\u003cp>Bonus use — the future of probability: \u003cb>¿Dónde estarán los demás?\u003c/b> = I wonder where the others are.\u003c/p>","quiz":[{"q":"'I am going to help you' =","opts":["Voy ayudar","Voy a ayudarle","Iré a ayudo","Vaya ayudar"],"a":1,"why":"ir a + infinitive; the 'a' is required."},{"q":"'You will have an appointment' =","opts":["Tener una cita","Tendrá una cita","Tenerá una cita","Tiene que cita"],"a":1,"why":"Future of tener uses the irregular stem tendr-: tendrá."},{"q":"'We will return tomorrow' =","opts":["Regresamos ayer","Regresaremos mañana","Regresábamos mañana","Regresen mañana"],"a":1,"why":"Future -emos on the infinitive: regresaremos."},{"q":"'¿Serán las cinco?' most likely expresses...","opts":["A command","Probability: 'I wonder if it's five'","Past time","A negative"],"a":1,"why":"Future tense can express present probability or wondering."},{"q":"'He will say' =","opts":["decirá","dirá","dijá","dice"],"a":1,"why":"Decir → dir- + á."}]},{"id":"g12","title":"Reflexive Verbs","tag":"Lesson XXIII","body":"\n\u003ch4>Actions done to oneself\u003c/h4>\n\u003cp>Reflexive pronouns: \u003cb>me, te, se, nos, se\u003c/b>. The infinitive carries -se: llamarse, sentarse, pararse, quedarse, ponerse.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>Field use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>llamarse\u003c/td>\u003ctd>¿Cómo se llama? — What's your name?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pararse\u003c/td>\u003ctd>¡Párese! — Stop/stand!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>sentarse\u003c/td>\u003ctd>Siéntese. — Sit down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>quedarse\u003c/td>\u003ctd>Quédese aquí. — Stay here.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>calmarse\u003c/td>\u003ctd>Cálmese. — Calm down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>quitarse\u003c/td>\u003ctd>Quítese la mochila. — Take off the backpack.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>esconderse\u003c/td>\u003ctd>¿Dónde se escondieron? — Where did they hide?\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>The reflexive passive\u003c/h4>\n\u003cp>Spanish prefers \u003cb>se\u003c/b> + verb where English uses the passive — straight from Lesson XXIII:\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Se prohíbe estacionarse aquí.\u003c/span> \u003cspan class=\"e\">Parking is prohibited here.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Aquí se habla español.\u003c/span> \u003cspan class=\"e\">Spanish is spoken here.\u003c/span>\u003c/div>","quiz":[{"q":"'What is your name?' literally asks...","opts":["What are you named by others?","How do you call yourself?","Which name is yours?","Who calls you?"],"a":1,"why":"¿Cómo se llama? = reflexive llamarse."},{"q":"'Stay here' =","opts":["Queda aquí","Quédese aquí","Se quede aquí","Quedarse aquí"],"a":1,"why":"Affirmative command with attached pronoun: Quédese."},{"q":"'Where did they hide?' =","opts":["¿Dónde escondieron?","¿Dónde se escondieron?","¿Dónde se esconden ayer?","¿Dónde escondían?"],"a":1,"why":"Esconderse is reflexive when hiding oneself."},{"q":"'Se venden carros' means...","opts":["They sell themselves cars","Cars are sold / for sale","Sell the cars!","The cars sold out"],"a":1,"why":"Se + verb = passive substitute."},{"q":"'Take off your jacket' =","opts":["Quite la chamarra","Quítese la chamarra","Se quite la chamarra","Quitarse chamarra"],"a":1,"why":"Quitarse = to take off (clothing); command form Quítese + article (not 'su')."}]},{"id":"g13","title":"Por vs. Para","tag":"Lesson XIV","body":"\n\u003ch4>PARA — destination & purpose\u003c/h4>\n\u003cp>Toward a goal: destination, purpose, deadline, recipient.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Salieron para Boston.\u003c/span> \u003cspan class=\"e\">They left FOR Boston (destination).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Documentos para trabajar.\u003c/span> \u003cspan class=\"e\">Documents (in order) to work.\u003c/span>\u003c/div>\n\u003ch4>POR — through, along, exchange, cause\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Cruzaron por el río.\u003c/span> \u003cspan class=\"e\">They crossed BY WAY OF the river.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Caminaron por el bosque por tres horas.\u003c/span> \u003cspan class=\"e\">Through the woods, for three hours (route + duration).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Pagó dos mil por el viaje.\u003c/span> \u003cspan class=\"e\">He paid two thousand FOR (in exchange for) the trip.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Por su seguridad.\u003c/span> \u003cspan class=\"e\">For (the sake of) your safety.\u003c/span>\u003c/div>\n\u003cp>Interview shortcut: route and payment questions take \u003cb>por\u003c/b>; destination and purpose take \u003cb>para\u003c/b>.\u003c/p>","quiz":[{"q":"'They crossed through the woods' =","opts":["Cruzaron para el bosque","Cruzaron por el bosque","Cruzaron en para bosque","Cruzaron al bosque por"],"a":1,"why":"Route/through = por."},{"q":"'How much did you pay for the trip?' =","opts":["¿Cuánto pagó para el viaje?","¿Cuánto pagó por el viaje?","¿Cuánto para pagó?","¿Qué pagó a viaje?"],"a":1,"why":"Exchange = por."},{"q":"'They're heading for Montreal' =","opts":["Van por Montreal","Van para Montreal","Van en Montreal","Van de Montreal"],"a":1,"why":"Destination = para."},{"q":"'For your safety and mine' =","opts":["Para su seguridad","Por su seguridad y la mía","De su seguridad","En su seguridad"],"a":1,"why":"For the sake of = por."},{"q":"'He walked for two hours' =","opts":["Caminó para dos horas","Caminó por dos horas","Caminó a dos horas","Caminó en dos horas para"],"a":1,"why":"Duration = por."}]},{"id":"g14","title":"Numbers, Time & Dates","tag":"Lessons XII & XX","body":"\n\u003ch4>Numbers you'll actually say\u003c/h4>\n\u003cp>1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez · 11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 20 veinte · 21 veintiuno · 30 treinta · 31 treinta y uno · 40 cuarenta · 50 cincuenta · 60 sesenta · 70 setenta · 80 ochenta · 90 noventa · 100 cien(to) · 500 quinientos · 1000 mil\u003c/p>\n\u003cp>Only 16–29 are written as one word; 31+ use \u003cb>y\u003c/b>: cuarenta y cinco.\u003c/p>\n\u003ch4>Telling time\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Qué hora es? — Es la una. / Son las tres y media. / Son las diez menos cuarto.\u003c/span>\u003cbr>\u003cspan class=\"e\">It's one. / It's 3:30. / It's 9:45.\u003c/span>\u003c/div>\n\u003ch4>Dates & days\u003c/h4>\n\u003cp>Days: lunes, martes, miércoles, jueves, viernes, sábado, domingo (not capitalized). Months: enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Cuál es su fecha de nacimiento? — El quince de marzo de mil novecientos noventa.\u003c/span>\u003cbr>\u003cspan class=\"e\">March 15, 1990. Day first, then month.\u003c/span>\u003c/div>","quiz":[{"q":"45 =","opts":["cuarenta cinco","cuarenta y cinco","cuatro y cinco","cuarenticinco"],"a":1,"why":"31 and up: tens + y + units."},{"q":"'It's 3:30' =","opts":["Es las tres y media","Son las tres y media","Son tres treinta hora","Está las tres y media"],"a":1,"why":"Plural hours take son; y media = half past."},{"q":"15 =","opts":["diez y cinco","quince","cincuenta","doce"],"a":1,"why":"Quince. (Cincuenta = 50.)"},{"q":"In Spanish dates, which comes first?","opts":["Month","Day","Year","Weekday is required"],"a":1,"why":"Day first: el quince de marzo. A DOB given as 3/15 vs 15/3 matters on paperwork."},{"q":"500 =","opts":["cinco cientos","quinientos","cincocientos","quincecientos"],"a":1,"why":"Irregular hundred: quinientos."}]},{"id":"g15","title":"Subjunctive Starter Kit","tag":"Lesson XXV — simplified","body":"\n\u003ch4>Don't fear it — you already know it\u003c/h4>\n\u003cp>The usted command IS the subjunctive. Hable, venga, diga, se siente — same forms. The subjunctive appears after expressions of wanting, requesting, and necessity aimed at another person.\u003c/p>\n\u003ch4>The three triggers to start with\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Trigger\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>querer que\u003c/td>\u003ctd>Quiero que se siente. — I want you to sit down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>es necesario que\u003c/td>\u003ctd>Es necesario que diga la verdad. — It's necessary that you tell the truth.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>para que\u003c/td>\u003ctd>Hable despacio para que yo entienda. — Speak slowly so that I understand.\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Why English speakers miss it\u003c/h4>\n\u003cp>English says 'I want you TO SIT'; Spanish can't use the infinitive when the subject changes — it must switch to que + subjunctive.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Necesito que espere aquí.\u003c/span> \u003cspan class=\"e\">I need you to wait here.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Dígale a su amigo que venga.\u003c/span> \u003cspan class=\"e\">Tell your friend to come.\u003c/span>\u003c/div>","quiz":[{"q":"'I want you to sit down' =","opts":["Quiero usted sentarse","Quiero que se siente","Quiero que se sienta usted bien","Quiero sentarse"],"a":1,"why":"Change of subject → que + subjunctive: que se siente."},{"q":"'It's necessary that you sign' =","opts":["Es necesario que firma","Es necesario que firme","Es necesario firmar que","Necesario usted firma"],"a":1,"why":"Es necesario que + subjunctive: firme."},{"q":"The usted command and the usted subjunctive are...","opts":["Totally different forms","The same form","Only the same for -AR verbs","Only the same for irregulars"],"a":1,"why":"Master commands and you've already got the present subjunctive."},{"q":"'Tell him to come' =","opts":["Dígale que viene","Dígale que venga","Diga él venir","Dile que vino"],"a":1,"why":"Indirect command → que + subjunctive: venga."},{"q":"'Speak slowly so that I understand' =","opts":["...para que yo entiendo","...para que yo entienda","...por que entiendo","...para entiendo"],"a":1,"why":"Para que always triggers the subjunctive: entienda."}]}];
const VERBS=[{"inf":"hablar","en":"to speak","pres":["hablo","hablas","habla","hablamos","hablan"],"pret":["hablé","hablaste","habló","hablamos","hablaron"],"cmd":"hable"},{"inf":"caminar","en":"to walk","pres":["camino","caminas","camina","caminamos","caminan"],"pret":["caminé","caminaste","caminó","caminamos","caminaron"],"cmd":"camine"},{"inf":"comer","en":"to eat","pres":["como","comes","come","comemos","comen"],"pret":["comí","comiste","comió","comimos","comieron"],"cmd":"coma"},{"inf":"vivir","en":"to live","pres":["vivo","vives","vive","vivimos","viven"],"pret":["viví","viviste","vivió","vivimos","vivieron"],"cmd":"viva"},{"inf":"cruzar","en":"to cross","pres":["cruzo","cruzas","cruza","cruzamos","cruzan"],"pret":["crucé","cruzaste","cruzó","cruzamos","cruzaron"],"cmd":"cruce"},{"inf":"tener","en":"to have","pres":["tengo","tienes","tiene","tenemos","tienen"],"pret":["tuve","tuviste","tuvo","tuvimos","tuvieron"],"cmd":"tenga"},{"inf":"hacer","en":"to do, make","pres":["hago","haces","hace","hacemos","hacen"],"pret":["hice","hiciste","hizo","hicimos","hicieron"],"cmd":"haga"},{"inf":"decir","en":"to say, tell","pres":["digo","dices","dice","decimos","dicen"],"pret":["dije","dijiste","dijo","dijimos","dijeron"],"cmd":"diga"},{"inf":"venir","en":"to come","pres":["vengo","vienes","viene","venimos","vienen"],"pret":["vine","viniste","vino","vinimos","vinieron"],"cmd":"venga"},{"inf":"poder","en":"to be able, can","pres":["puedo","puedes","puede","podemos","pueden"],"pret":["pude","pudiste","pudo","pudimos","pudieron"],"cmd":"pueda"},{"inf":"querer","en":"to want","pres":["quiero","quieres","quiere","queremos","quieren"],"pret":["quise","quisiste","quiso","quisimos","quisieron"],"cmd":"quiera"},{"inf":"saber","en":"to know (facts)","pres":["sé","sabes","sabe","sabemos","saben"],"pret":["supe","supiste","supo","supimos","supieron"],"cmd":"sepa"},{"inf":"conocer","en":"to know (people/places)","pres":["conozco","conoces","conoce","conocemos","conocen"],"pret":["conocí","conociste","conoció","conocimos","conocieron"],"cmd":"conozca"},{"inf":"ir","en":"to go","pres":["voy","vas","va","vamos","van"],"pret":["fui","fuiste","fue","fuimos","fueron"],"cmd":"vaya"},{"inf":"ser","en":"to be (identity)","pres":["soy","eres","es","somos","son"],"pret":["fui","fuiste","fue","fuimos","fueron"],"cmd":"sea"},{"inf":"estar","en":"to be (location/state)","pres":["estoy","estás","está","estamos","están"],"pret":["estuve","estuviste","estuvo","estuvimos","estuvieron"],"cmd":"esté"},{"inf":"poner","en":"to put","pres":["pongo","pones","pone","ponemos","ponen"],"pret":["puse","pusiste","puso","pusimos","pusieron"],"cmd":"ponga"},{"inf":"salir","en":"to leave, go out","pres":["salgo","sales","sale","salimos","salen"],"pret":["salí","saliste","salió","salimos","salieron"],"cmd":"salga"},{"inf":"traer","en":"to bring","pres":["traigo","traes","trae","traemos","traen"],"pret":["traje","trajiste","trajo","trajimos","trajeron"],"cmd":"traiga"},{"inf":"dar","en":"to give","pres":["doy","das","da","damos","dan"],"pret":["di","diste","dio","dimos","dieron"],"cmd":"dé"},{"inf":"ver","en":"to see","pres":["veo","ves","ve","vemos","ven"],"pret":["vi","viste","vio","vimos","vieron"],"cmd":"vea"},{"inf":"oír","en":"to hear","pres":["oigo","oyes","oye","oímos","oyen"],"pret":["oí","oíste","oyó","oímos","oyeron"],"cmd":"oiga"},{"inf":"pagar","en":"to pay","pres":["pago","pagas","paga","pagamos","pagan"],"pret":["pagué","pagaste","pagó","pagamos","pagaron"],"cmd":"pague"},{"inf":"buscar","en":"to look for","pres":["busco","buscas","busca","buscamos","buscan"],"pret":["busqué","buscaste","buscó","buscamos","buscaron"],"cmd":"busque"}];

const FIELD=[{"id":"fp-roving-dusk","title":"Roving Stop at Dusk","situation":"Late afternoon on a rural two-lane road a few miles from the line. An overloaded sedan with rear windows covered passes you, slows sharply, and the driver avoids eye contact.","steps":[{"narrative":"You want to stop it. A trainee riding with you says the passengers 'look foreign'.","type":"scenario","deck":"caselaw","feeds":["cl-brignoni","cl-sc-roving"],"setup":"Your factors: riding heavy, covered windows, abrupt slowing, avoiding eye contact, a road used to bypass the port. The trainee adds the occupants' appearance.","q":"What is the legal basis for the stop, and how should appearance figure?","choices":["Reasonable suspicion from the articulable factors; appearance alone can never carry it","No basis needed within 100 air miles","Probable cause is required for any roving stop","Appearance is enough near the border"],"answer":0,"explain":"Brignoni-Ponce: specific articulable facts amounting to reasonable suspicion. Apparent ancestry can be one factor, never the whole basis."},{"narrative":"Defense will later argue each factor has an innocent explanation.","ref":"cl-sc-factors"},{"narrative":"The driver rolls down the window and answers only in Spanish.","type":"mc","deck":"spanish","feeds":["es-p20"],"q":"Ask the driver's country of citizenship.","choices":["¿De qué país es usted ciudadano?","¿Dónde vive usted?","¿Adónde va?","¿Cómo se llama usted?"],"answer":0,"explain":"Citizenship uses ser: « ¿De qué país es usted ciudadano? ». Where someone lives or is going isn't citizenship."},{"narrative":"You ask when they crossed. The driver says « Hace dos días. »","type":"mc","deck":"spanish","feeds":["es-p104","es-p41"],"q":"What did the driver tell you?","choices":["Two days ago","In two days","For two days","Two times"],"answer":0,"explain":"Hace + time = ago. « Hace dos días » = two days ago."},{"narrative":"A rear passenger keeps reaching under a jacket and won't show his hands.","ref":"cl-sc-passenger"},{"narrative":"Four occupants admit entering illegally. The driver says he was 'just giving rides'.","ref":"st-sc-driver"},{"narrative":"Dispatch reads back the plate and you lose the last half in static.","ref":"rd-sc-sayagain"}]},{"id":"fp-snow-sign","title":"Sign in Fresh Snow","situation":"Early morning after overnight snow. You cut fresh foot sign of a small group heading away from the line into hardwoods. Your GPS battery is failing in the cold.","steps":[{"narrative":"The sign runs along a stream for most of a kilometer before turning uphill.","ref":"ln-sc-handrail"},{"narrative":"A road crosses about 300 m past where you expect to catch them.","ref":"ln-sc-catching"},{"narrative":"The sign leaves the stream and heads for a small spot in thick woods, 200 m past an obvious stream junction.","ref":"ln-sc-attack"},{"narrative":"Deep snow, uphill, light snowfall. You're keeping a pace count.","ref":"ln-pace-snow"},{"narrative":"The sign hits a plowed gravel road and disappears.","ref":"trk-sc-gravel"},{"narrative":"You close on the group. One runs, empty-handed, toward thicker cover.","ref":"uf-sc-runner"},{"narrative":"The others stop. One is shivering, clothes soaked from a stream crossing, and speaks only Spanish.","type":"mc","deck":"spanish","feeds":["es-p64","es-w4"],"q":"Which two questions fit what you're seeing?","choices":["« ¿Tiene frío? » and « ¿Se mojó? ¿Se cayó al agua? »","« ¿Adónde va? » and « ¿De dónde viene? »","« ¿Tiene armas? » and « No se mueva. »","« ¿Cómo se llama usted? » and « Gracias. »"],"answer":0,"explain":"Cold and getting wet are the immediate hazards. Ask them first."},{"narrative":"Dispatch: 'Hold the group there, transport en route.' You understand and will comply.","ref":"rd-sc-wilco"}]},{"id":"fp-checkpoint","title":"Checkpoint Secondary","situation":"You're working an interior immigration checkpoint. A minivan is referred to secondary after the driver gives inconsistent answers about the trip.","steps":[{"narrative":"Before the referral, a car crested the hill, braked hard and turned into a roadside lot short of the checkpoint.","ref":"cl-sc-avoid"},{"narrative":"In secondary the driver declines a search of the cargo area.","ref":"cl-sc-checkpoint-search"},{"narrative":"Documents check out, and you've finished every immigration and traffic task. A K-9 is 15 minutes out.","ref":"cl-sc-dog"},{"narrative":"The front passenger's name returns a prior removal with no consent to reapply.","ref":"st-sc-found-in"},{"narrative":"The passenger speaks only Spanish. You confirm birthplace.","type":"mc","deck":"spanish","feeds":["es-p22"],"q":"Ask where they were born.","choices":["¿Dónde nació usted?","¿Dónde vive usted?","¿De dónde viene?","¿Adónde va?"],"answer":0,"explain":"Preterite of nacer: « ¿Dónde nació usted? ». « ¿De dónde viene? » only asks where they're coming from."},{"narrative":"Records also show an aggravated-felony conviction before that removal.","ref":"st-1326b"},{"narrative":"The passenger is now under arrest and you want to ask about the reentry.","type":"scenario","deck":"caselaw","feeds":["cl-miranda"],"setup":"The passenger is handcuffed in your vehicle. You want to ask when and how they came back in.","q":"What has to happen first?","choices":["Miranda warnings and a knowing, voluntary waiver","Nothing; immigration questions are exempt","Only a supervisor's approval","A warrant"],"answer":0,"explain":"Custody plus interrogation: warn and get a valid waiver, or the statements can't be used at trial."}]},{"id":"fp-farm-field","title":"Farm Field Follow-Up","situation":"A landowner reports people crossing a back field toward a barn. You follow tracks across private land a few miles from the boundary.","steps":[{"narrative":"The tracks cross open fields past the farmhouse and toward the barn.","ref":"st-sc-land"},{"narrative":"Two people step out from behind the barn. You identify yourself in Spanish and order them to stop.","type":"mc","deck":"spanish","feeds":["es-p1"],"q":"Your command?","choices":["¡Alto! Patrulla Fronteriza.","¡Venga acá!","Buenos días.","¿Me entiende?"],"answer":0,"explain":"« ¡Alto! » is the universal halt command, and it identifies you in the same breath."},{"narrative":"One keeps a hand in a pocket.","type":"mc","deck":"spanish","feeds":["es-p6","es-p73"],"q":"Best next words?","choices":["Muéstreme las manos.","Siéntese.","Firme aquí, por favor.","Gracias."],"answer":0,"explain":"Hands first. Then « ¿Tiene algo en los bolsillos que me pueda lastimar? » before the pat-down."},{"narrative":"The second subject twists away as you reach for an arm. Nothing suggests a weapon.","ref":"uf-287-nondeadly"},{"narrative":"Both admit being unlawfully present. One has a bus ticket out of state for tonight. No warrant exists.","ref":"st-sc-arrest-interior"},{"narrative":"You make the arrest.","ref":"st-2878-c2iii"},{"narrative":"Tell them in Spanish that they're detained.","type":"mc","deck":"spanish","feeds":["es-p80"],"q":"Which is correct?","choices":["Usted está detenido.","Usted es detenido.","Usted hay detenido.","Usted tiene detenido."],"answer":0,"explain":"ESTAR + past participle for the resulting state. « Detenida » for a woman."}]},{"id":"fp-port-phone","title":"Traveler's Phone","situation":"You're assisting at a port of entry. A traveler arriving by land is in secondary. Answers about the trip don't line up, and the traveler speaks only Spanish.","steps":[{"narrative":"Start with where the trip began.","type":"mc","deck":"spanish","feeds":["es-p48"],"q":"Ask where the traveler is coming from.","choices":["¿De dónde viene?","¿Adónde va?","¿Dónde vive usted?","¿Dónde nació usted?"],"answer":0,"explain":"« ¿De dónde viene? » = Where are you coming from? « ¿Adónde va? » asks where they're headed."},{"narrative":"Tell the traveler why you're holding the paperwork.","type":"mc","deck":"spanish","feeds":["es-p100"],"q":"Which phrase?","choices":["Tengo que verificar sus documentos.","Hay que esperar.","Firme aquí, por favor.","Voy a revisarlo."],"answer":0,"explain":"« Tengo que verificar sus documentos. » = I have to verify your documents. TENER QUE + infinitive."},{"narrative":"Before the phone, you want to search the traveler's bag for documents that would show inadmissibility.","ref":"st-1357-c"},{"narrative":"You want to scroll through the unlocked phone. There's no specific suspicion yet.","ref":"cl-sc-phone-border"},{"narrative":"A colleague suggests a full forensic extraction instead.","type":"scenario","deck":"caselaw","feeds":["cl-alisigwe","cl-cotterman"],"setup":"Forensic extraction of the same phone, at the border, in the 2d Circuit.","q":"Where does the law stand?","choices":["Undecided in the 2d Circuit. The 9th Circuit (persuasive) requires reasonable suspicion, so have it articulated","Clearly allowed with no suspicion in the 2d Circuit","Always requires a warrant","Prohibited"],"answer":0,"explain":"Alisigwe decided manual searches only. Cotterman (9th Cir.) is persuasive, not binding here."},{"narrative":"Days later, a different subject is arrested inland and their phone is seized.","ref":"cl-sc-phone-arrest"}]},{"id":"fp-night-pursuit","title":"Night Vehicle Flight","situation":"After dark, a vehicle you've signaled to stop accelerates away on a winding rural road with oncoming traffic.","steps":[{"narrative":"You call in the plate as you follow: K Z R.","ref":"rd-l-plate"},{"narrative":"The driver passes on blind curves and forces an oncoming car onto the shoulder.","ref":"uf-scott"},{"narrative":"The vehicle crashes into a ditch. The driver bails out and runs, unarmed as far as you can see.","ref":"uf-garner"},{"narrative":"A passenger climbs out holding a knife. He's shouting in Spanish.","type":"mc","deck":"spanish","feeds":["es-p2"],"q":"Your command?","choices":["No se mueva.","Venga acá.","Camine despacio hacia mí.","Buenas noches."],"answer":0,"explain":"« No se mueva » = Don't move. Never call a man with a knife toward you."},{"narrative":"He keeps advancing on your partner, ignoring commands.","ref":"uf-sc-knife"},{"narrative":"Afterward, review will look at the whole encounter, including the chase.","ref":"uf-barnes"},{"narrative":"The passenger is injured.","ref":"uf-dhs-aid"},{"narrative":"Now you write it up.","ref":"uf-sc-report"}]},{"id":"fp-open-field","title":"Open Field, Locked Gate","situation":"Before dawn you cut sign of two people crossing a posted, gated hayfield toward a farmstead. Snow on the ground, single digits.","steps":[{"narrative":"The tracks go under a No Trespassing gate into the field, half a mile from the house.","ref":"cl-sc-open-field"},{"narrative":"They lead to a barn about 60 yards from the house, outside its fence.","ref":"cl-sc-barn"},{"narrative":"Your supervisor asks whether the farm rule in § 1357(e) applies out here.","ref":"st-1357-e"},{"narrative":"You step out of the truck to shoot an azimuth toward the barn.","ref":"ln-vehicle"},{"narrative":"Behind the barn you find one subject shaking, boots soaked. He speaks Spanish.","type":"mc","deck":"spanish","feeds":["es-w1","es-w4"],"q":"Which two questions come first?","choices":["« ¿Siente los dedos de los pies? » and « ¿Se mojó? »","« ¿Adónde va? » and « ¿Cuánto pagó? »","« ¿Qué hora es? » and « ¿Cómo se llama? »","« Firme aquí » and « Gracias »"],"answer":0,"explain":"Feeling in the feet and whether he got wet go straight to cold exposure. Status questions can wait."},{"narrative":"Getting him to the unit: offer warmth in his language.","type":"mc","deck":"spanish","feeds":["es-w5","es-w6"],"q":"Which phrase?","choices":["Suba al vehículo; hay calefacción.","Espere aquí.","No se mueva.","Vacíe sus bolsillos."],"answer":0,"explain":"« Suba al vehículo; hay calefacción. » = Get in, the heat's on. Pair it with « Aquí tiene una manta. »"},{"narrative":"The second subject is still out. You follow into dark, flat woods with no landmarks in sight.","ref":"ln-sc-fog"}]},{"id":"fp-papers","title":"Papers That Don't Add Up","situation":"A vehicle stop on a lawful basis. The front passenger hands over a permanent resident card. The driver answers your Spanish questions about the trip.","steps":[{"narrative":"The card's security features are wrong and records show no such card was issued.","ref":"st-sc-fake-card"},{"narrative":"The passenger then gives a false name and claims U.S. citizenship. Prints show otherwise.","ref":"st-sc-false-name"},{"narrative":"The driver gives a date of birth in Spanish: « Nací el cinco de marzo de mil novecientos noventa. »","type":"mc","deck":"spanish","feeds":["es-n12","es-n7"],"q":"What date was given?","choices":["March 5, 1990","May 3, 1990","March 5, 1980","March 15, 1970"],"answer":0,"explain":"El cinco de marzo = 5 March. Mil novecientos noventa = 1990."},{"narrative":"You ask the driver, 'Can I search the car for anyone hiding or any IDs?' — 'Sure.' There's a locked hard case in the trunk.","ref":"cl-sc-consent-scope"},{"narrative":"The passenger is arrested and handcuffed in your unit.","ref":"cl-sc-gant"},{"narrative":"Before transport, the passenger says they're afraid to go back to their country.","ref":"st-sc-fear"}]},{"id":"fp-911","title":"The 911 Call","situation":"Dispatch relays a 911 call: a specific pickup just ran the caller off the road. Plate, color and direction given. You spot it minutes later.","steps":[{"narrative":"The pickup is driving normally when you find it.","ref":"cl-sc-911"},{"narrative":"Dispatch reads the plate number back with « FIFE » in it.","ref":"rd-n-mc"},{"narrative":"At the window the driver answers only in Spanish. You ask what time they left.","type":"mc","deck":"spanish","feeds":["es-n13","es-n14"],"q":"The driver says « a las ocho de la noche ». When?","choices":["8 a.m.","8 p.m.","At night, 8 hours ago","Eight days ago"],"answer":1,"explain":"De la noche = in the evening or at night. 8 p.m."},{"narrative":"A few roadside questions later, the driver is handcuffed and in your unit.","ref":"cl-sc-custody"},{"narrative":"A passenger grabs a tire iron and swings it at you.","ref":"st-18-111-mc"},{"narrative":"Your report on the force you used to stop the swing.","ref":"uf-graham-order"}]},{"id":"fp-lost-hiker","title":"Overdue Hiker","situation":"Dispatch relays a call: a hiker is overdue, last seen at a trailhead near the line. The temperature is dropping fast toward dark.","steps":[{"narrative":"Before anyone heads in, you start the search estimate.","ref":"trk-first2"},{"narrative":"She left about four hours ago, moving about 2.5 km/h. Nobody knows which way.","ref":"trk-area-mc"},{"narrative":"Her family says she left about an hour ago.","ref":"trk-first2"},{"narrative":"A tracker finds her prints leaving the trail, heading downhill.","ref":"trk-sector-mc"},{"narrative":"You find her curled under a spruce, shivering. She answers only in Spanish.","type":"mc","deck":"spanish","feeds":["es-p64"],"q":"Ask if she's cold.","choices":["¿Tiene frío?","¿Tiene armas?","¿Tiene identificación?","¿Qué hora es?"],"answer":0,"explain":"« ¿Tiene frío? » TENER idiom: literally 'Do you have cold?'"},{"narrative":"You check her hands.","type":"mc","deck":"spanish","feeds":["es-w7","es-w2"],"q":"Which two questions?","choices":["« ¿Siente las manos? » and « ¿Puede mover los dedos? »","« ¿Tiene armas? » and « Levante las manos. »","« ¿Adónde va? » and « ¿De dónde viene? »","« Muéstreme las manos. » and « No se mueva. »"],"answer":0,"explain":"Can you feel your hands? Can you move your fingers? These check for cold injury. The others are control commands."},{"narrative":"Dispatch asks for your 10-20 to send medical.","ref":"rd-10-mc1"},{"narrative":"You walk her out on the reverse of the 250° azimuth you came in on.","ref":"ln-backaz-calc"}]},{"id":"fp-night-field","title":"Group in the Snow","situation":"Near midnight, heavy snow falling. Fresh foot sign from the line crosses a hayfield toward a tree line. Your flashlight is your only light.","steps":[{"narrative":"The prints are faint in the flashlight beam.","ref":"trk-sun"},{"narrative":"New snow is filling the prints, but old tire ruts at the field gate are catching fresh sign.","ref":"trk-snow"},{"narrative":"You need to know how many people you're following.","ref":"trk-count-mc"},{"narrative":"At the tree line you find them huddled together. They speak Spanish.","type":"mc","deck":"spanish","feeds":["es-p51"],"q":"Ask how many people there are.","choices":["¿Cuántas personas hay?","¿Cuánto pagó?","¿Cuántos años tiene usted?","¿Dónde están los demás?"],"answer":0,"explain":"« ¿Cuántas personas hay? » Cuántas agrees with personas."},{"narrative":"You see small boots among the prints.","type":"mc","deck":"spanish","feeds":["es-p52"],"q":"Ask whether there are children in the group.","choices":["¿Hay niños en el grupo?","¿Hay más personas con usted?","¿Con quién viaja usted?","¿Está usted casado?"],"answer":0,"explain":"« ¿Hay niños en el grupo? » = Are there children in the group?"},{"narrative":"One man sits down in the snow and refuses to get up. No threats, no weapon.","ref":"uf-sc-passive"},{"narrative":"Everyone is in the vehicles. You radio '10-15'.","ref":"rd-10-mc3"}]},{"id":"fp-citizen-claim","title":"Citizenship Claim","situation":"On a lawful stop near the line, a passenger with no ID says he's a U.S. citizen. He answers only in Spanish.","steps":[{"narrative":"You start by asking his citizenship in Spanish.","type":"mc","deck":"spanish","feeds":["es-p20"],"q":"Which question?","choices":["¿De qué país es usted ciudadano?","¿Dónde vive usted?","¿De dónde viene?","¿Habla usted inglés?"],"answer":0,"explain":"« ¿De qué país es usted ciudadano? » = Of what country are you a citizen?"},{"narrative":"He says he's American. You keep questioning him about his right to be here.","ref":"st-1357-a1"},{"narrative":"Ask for identification.","type":"mc","deck":"spanish","feeds":["es-p30"],"q":"Which question?","choices":["¿Tiene identificación?","¿Tiene armas?","¿Dónde vive usted?","¿Cómo se llama usted?"],"answer":0,"explain":"« ¿Tiene identificación? » = Do you have identification?"},{"narrative":"He has none. You ask dispatch to check his claim.","type":"mc","deck":"radio","feeds":["rd-10-35"],"q":"Which 10-code is a false claim check?","choices":["10-35","10-39","10-34","10-15"],"answer":0,"explain":"10-35 = False Claim Check. 10-39 is a positive record check."},{"narrative":"Records show he's a foreign national who never naturalized.","ref":"st-sc-citizen-claim"},{"narrative":"He also wrote a false name on the form you gave him.","ref":"st-18-1001"},{"narrative":"He's now cuffed in your unit. Earlier you'd only asked roadside questions.","ref":"cl-berkemer"}]},{"id":"fp-pickup-load","title":"Loaded Pickup","situation":"You stop a pickup with a heavy, tarped bed on a back road a few miles from the line. You have reasonable suspicion. The driver is a U.S. citizen.","steps":[{"narrative":"When the driver opens the door you see a handgun and drug bundles on the floor.","ref":"st-sc-drugs"},{"narrative":"You now have probable cause the bed holds more contraband.","ref":"cl-carroll"},{"narrative":"Under the tarp, two people are hiding among the bundles. The driver was moving them inland.","ref":"st-1324-ii"},{"narrative":"One of them speaks only Spanish.","type":"mc","deck":"spanish","feeds":["es-p44","es-p45"],"q":"Which two questions go after the smuggling arrangement?","choices":["« ¿Quién lo ayudó a cruzar? » and « ¿Cuánto pagó? »","« ¿Tiene frío? » and « ¿Puede caminar? »","« ¿Qué hora es? » and « ¿Dónde vive usted? »","« Siéntese. » and « Espere aquí. »"],"answer":0,"explain":"Who helped you cross? How much did you pay? Both go to the smuggling arrangement."},{"narrative":"You report the drugs seized.","type":"mc","deck":"radio","feeds":["rd-10-46","rd-10-45"],"q":"Which code means apprehended narcotics?","choices":["10-46","10-45","10-55","10-36"],"answer":0,"explain":"10-46 = Apprehended Narcotics. 10-45 = Apprehended Illegal Aliens."},{"narrative":"The driver's phone lights up on the seat after the arrest.","ref":"cl-riley"}]},{"id":"fp-checkpoint-run","title":"Checkpoint Runner","situation":"You're working an interior immigration checkpoint on a two-lane highway. Traffic is light.","steps":[{"narrative":"A new agent asks how you can stop every car without suspicion.","ref":"cl-martinez-fuerte"},{"narrative":"A sedan's driver refuses to get out and starts the engine. You could step in front of the bumper.","ref":"uf-sc-veh-path"},{"narrative":"It swerves around the lane and speeds off. You follow and key up.","type":"mc","deck":"radio","feeds":["rd-10-31"],"q":"Which code means engaging in pursuit?","choices":["10-31","10-33","10-25","10-13"],"answer":0,"explain":"10-31 = Engaging in Pursuit. 10-13 is en route, 10-33 dangerous subject."},{"narrative":"Your partner wants to shoot out the tires.","ref":"uf-veh-disable"},{"narrative":"You read the last digits of the plate: 4519.","ref":"rd-pr-digits-mc"},{"narrative":"Local and federal units chase it well over the speed limit before it stops.","ref":"st-sc-checkpoint-run"},{"narrative":"The driver jumps out and runs into the woods. You see nothing in his hands.","ref":"cl-sc-flee"}]},{"id":"fp-resisting","title":"Hands Behind Your Back","situation":"You're arresting a man on a farm road. He's bigger than you, agitated, and speaks Spanish. Backup is ten minutes out.","steps":[{"narrative":"Before going hands-on, you have a few seconds.","ref":"uf-dhs-warning"},{"narrative":"Tell him you're going to handcuff him for his safety and yours.","type":"mc","deck":"spanish","feeds":["es-p81"],"q":"Which phrase?","choices":["Voy a esposarlo por su seguridad y la mía.","Voy a revisarlo.","Usted está detenido.","Suba a la camioneta."],"answer":0,"explain":"« Voy a esposarlo por su seguridad y la mía. » Revisar is to search him."},{"narrative":"He tenses and yanks his arm away.","ref":"uf-287-grounds"},{"narrative":"Pulling away from you during the arrest may itself be a federal crime.","ref":"st-18-111"},{"narrative":"Your partner arrives. The man is cuffed face-down, still struggling. Both of you press on his back and he says he can't breathe.","ref":"uf-sc-prone"},{"narrative":"Sitting up now, cuffed and not resisting, he curses at you.","ref":"uf-sc-cuffed"},{"narrative":"Your partner reaches for his neck to quiet him down.","ref":"uf-dhs-choke"},{"narrative":"Later, review applies the governing case on force during an arrest.","ref":"cl-graham"}]},{"id":"fp-rocks","title":"Rocks Over the Ditch","situation":"At dusk you're on foot near the line checking sign along a drainage ditch. Voices on the far side, then a rock bangs off your truck.","steps":[{"narrative":"Fist-sized rocks keep coming. Your truck and a concrete barrier are a few steps away.","ref":"uf-sc-rocks"},{"narrative":"Your partner draws and asks if he can fire.","ref":"uf-cbp-thrown"},{"narrative":"You need help now.","ref":"rd-10-mc2"},{"narrative":"Another agent suggests a shot into the air to scatter them.","ref":"uf-sc-warning-shot"},{"narrative":"A rock hits your partner in the head. He's bleeding.","type":"mc","deck":"statutes","feeds":["st-18-111"],"q":"Assaulting an agent on duty and causing bodily injury falls under which § 111 tier?","choices":["(b): deadly or dangerous weapon or bodily injury, up to 20 years","Simple assault, up to 1 year","Physical contact, up to 8 years","None; § 111 covers only firearms"],"answer":0,"explain":"§ 111(b) covers a deadly or dangerous weapon, or bodily injury: up to 20 years."},{"narrative":"Two throwers are caught. One has a cut hand from the arrest.","ref":"uf-cbp-medical"}]},{"id":"fp-processing","title":"After the Arrest","situation":"You made a warrantless arrest under § 1357(a)(2) of a woman who crossed between ports. Processing starts back at the station.","steps":[{"narrative":"You'd like to do her examination yourself. Another qualified agent is in the next room.","ref":"st-2873-a"},{"narrative":"The clock is running on her custody decision.","ref":"st-2873-d"},{"narrative":"She also faces a criminal charge, so a judge has to weigh in.","ref":"cl-riverside"},{"narrative":"She speaks only Spanish. Tell her about consular access.","type":"mc","deck":"spanish","feeds":["es-p87"],"q":"Which phrase?","choices":["Tiene derecho a hablar con su consulado.","¿Entiende sus derechos?","Firme aquí, por favor.","Espere su turno."],"answer":0,"explain":"« Tiene derecho a hablar con su consulado. » = You have the right to speak with your consulate."},{"narrative":"Time for prints.","type":"mc","deck":"spanish","feeds":["es-p89"],"q":"Which phrase?","choices":["Ponga su huella aquí.","Firme aquí, por favor.","Vacíe sus bolsillos.","Ponga las manos en la cabeza."],"answer":0,"explain":"« Ponga su huella aquí. » Huella is a fingerprint, and also a footprint."},{"narrative":"She has no valid documents and says she's afraid to go back.","ref":"st-1225-b1"},{"narrative":"A colleague tells her she'll never see her kids again unless she waives and talks.","ref":"st-2878-c2vii"}]},{"id":"fp-interview","title":"The Interview","situation":"A smuggling suspect is in custody at the station. You've read him his Miranda rights in Spanish and sit down to interview him.","steps":[{"narrative":"First, confirm he understood the warnings.","type":"mc","deck":"spanish","feeds":["es-p90"],"q":"Which question?","choices":["¿Entiende sus derechos?","¿Me entiende?","¿Habla usted inglés?","¿Está usted bien?"],"answer":0,"explain":"« ¿Entiende sus derechos? » asks about his rights specifically. « ¿Me entiende? » only asks if he follows you."},{"narrative":"He nods and starts talking, but never says he waives anything.","ref":"cl-berghuis"},{"narrative":"Forty minutes in, he says 'Maybe I should get a lawyer or something.'","ref":"cl-sc-lawyer-maybe"},{"narrative":"An hour later he says plainly, 'I want a lawyer.'","ref":"cl-edwards"},{"narrative":"The next morning a colleague wants to re-warn him and try again.","ref":"cl-sc-reapproach"},{"narrative":"The colleague says another office questions first and warns afterward.","ref":"cl-seibert"},{"narrative":"Defense later claims he was threatened into talking.","ref":"st-2878-c2vii"}]},{"id":"fp-abandoned-car","title":"Abandoned Car","situation":"A car is nose-down in a ditch on a dirt road near the line, doors open, engine still warm. A K-9 team and a tracker are on the way.","steps":[{"narrative":"You're first on scene.","ref":"trk-park"},{"narrative":"On the radio, another agent calls the occupants 'bailouts'.","ref":"rd-j-8"},{"narrative":"Two agents start walking around the car looking for footprints.","ref":"trk-contam"},{"narrative":"The K-9 handler arrives and wants to deploy right away.","ref":"trk-start"},{"narrative":"The sign line reaches a muddy ditch.","ref":"trk-tt-primary"},{"narrative":"In the mud there's one clear print.","ref":"trk-draw"},{"narrative":"The sign leads to a farmhouse. The owner has the group hidden in his garage.","ref":"st-1324-iii"}]},{"id":"fp-camp-scene","title":"Protect the Scene","situation":"A hunter was assaulted at a remote camp. Another unit arrested a suspect a mile away. You're first at the camp, and investigators are hours out.","steps":[{"narrative":"Before anyone else shows up, think about what will ruin the sign.","ref":"trk-contam-who"},{"narrative":"You need one way in and out. An obvious trail runs straight to the camp.","ref":"trk-entry-sc"},{"narrative":"The camp itself is taped off.","ref":"trk-outside"},{"narrative":"Legally, the phone's contents have to wait.","ref":"cl-riley"},{"narrative":"Dispatch asks for the victim's injuries and the suspect's name on the open channel.","ref":"rd-e-sensitive"}]},{"id":"fp-emergency-traffic","title":"Emergency Traffic","situation":"Midshift, routine radio chatter. Then an agent's voice breaks in, breathing hard.","steps":[{"narrative":"Another unit calls emergency traffic. You're miles away and not involved.","ref":"rd-e-emergency"},{"narrative":"Then you hear '10-99'.","ref":"rd-10-mc6"},{"narrative":"You key up to say you're responding and hear a squeal.","ref":"rd-e-sc-double"},{"narrative":"Dispatch asks you to send the subject's hard-to-spell surname.","ref":"rd-pr-spell"},{"narrative":"You arrive. The other agent is still striking the subject, who is cuffed and face-down.","ref":"uf-sc-intervene"},{"narrative":"Once it stops, the subject says his wrist hurts. You see no swelling or blood.","ref":"uf-sc-aid"},{"narrative":"He speaks Spanish. Tell him help is coming.","type":"mc","deck":"spanish","feeds":["es-p71"],"q":"Which phrase?","choices":["La ayuda viene en camino.","Voy a revisarlo.","Hay que esperar.","Vamos a la estación."],"answer":0,"explain":"« La ayuda viene en camino. » = Help is on the way."},{"narrative":"After the incident, you know what you saw.","ref":"uf-cbp-report-improper"}]},{"id":"fp-camp-report","title":"Reported Camp","situation":"A hunter reports people camped in the woods and gives a rough spot on a map. You head in on foot from the end of a logging road.","steps":[{"narrative":"At the tailgate you spread the map out to match the ground.","ref":"ln-orient"},{"narrative":"The diagram in the margin shows the angle between the needle and map north.","ref":"ln-declination"},{"narrative":"Before taking a bearing, you check what's around you.","ref":"ln-c-metal"},{"narrative":"A wide beaver pond sits across your azimuth.","ref":"ln-detour"},{"narrative":"The hunter said the camp is in a dip between two hills.","ref":"ln-t-saddle"},{"narrative":"You find it empty, with grass pressed flat where people lay.","ref":"trk-nesting"},{"narrative":"You radio the time you found it: 1:15 p.m.","ref":"rd-pr-time"},{"narrative":"Sign leaving camp heads toward a road. Teams try to get ahead.","ref":"trk-leapfrog"}]},{"id":"fp-french-family","title":"Family at Dawn","situation":"Before dawn in deep cold, you find a family at the edge of a field near the line: two adults, a young child, and a woman who looks pregnant. They speak Spanish.","steps":[{"narrative":"First, find out if anyone is hurt.","type":"mc","deck":"spanish","feeds":["es-p60"],"q":"Which question?","choices":["¿Está usted herido?","¿Tiene armas?","¿Adónde va?","¿Cuánto pagó?"],"answer":0,"explain":"« ¿Está usted herido? » = Are you hurt? ESTAR for conditions; « herida » for a woman."},{"narrative":"The mother is frightened. Tell her you're going to help.","type":"mc","deck":"spanish","feeds":["es-p70"],"q":"Which phrase?","choices":["Voy a ayudarle.","Voy a revisarlo.","Usted está detenido.","Hay que esperar."],"answer":0,"explain":"« Voy a ayudarle. » = I am going to help you. IR A + infinitive."},{"narrative":"You check on the woman who looks pregnant.","type":"mc","deck":"spanish","feeds":["es-p69"],"q":"Which question?","choices":["¿Está embarazada?","¿Está usted herido?","¿Tiene frío?","¿Puede caminar?"],"answer":0,"explain":"« ¿Está embarazada? » = Are you pregnant?"},{"narrative":"The child's lips are blue. Get them into the heat.","type":"mc","deck":"spanish","feeds":["es-w6"],"q":"Which phrase?","choices":["Suba al vehículo; hay calefacción.","Espere aquí.","Vamos a la estación.","No se mueva."],"answer":0,"explain":"« Suba al vehículo; hay calefacción. » = Get in the vehicle; the heat's on."},{"narrative":"The father says their 8-year-old wandered off an hour ago. You find small prints, then lose them on hard ground.","ref":"trk-lost-stop"},{"narrative":"None of them have documents. The father says they're afraid to go back.","ref":"st-sc-fear"},{"narrative":"You start transporting the mother and the young child.","type":"mc","deck":"radio","feeds":["rd-10-97"],"q":"Which code?","choices":["10-97","10-98","10-96","10-16"],"answer":0,"explain":"10-97 = Begin Transport of Juvenile/Female. 10-98 ends it."}]},{"id":"fp-customs-goods","title":"Goods in the Van","situation":"On roving patrol near the line, you stop a minivan riding low on reasonable suspicion. The driver answers only in Spanish.","steps":[{"narrative":"Start with where the trip began.","type":"mc","deck":"spanish","feeds":["es-p48"],"q":"Ask where the driver is coming from.","choices":["¿De dónde viene?","¿Adónde va?","¿Dónde vive usted?","¿Con quién viaja usted?"],"answer":0,"explain":"« ¿De dónde viene? » = Where are you coming from? « ¿Adónde va? » asks where he's headed."},{"narrative":"You suspect the van carries merchandise brought in contrary to law.","ref":"st-482"},{"narrative":"Under a false floor are cartons of undeclared goods. The driver admits bringing them across between ports.","ref":"st-sc-goods-vehicle"},{"narrative":"And the cartons themselves?","ref":"st-1595a"},{"narrative":"The criminal charge for bringing them in.","ref":"st-18-545"},{"narrative":"Asked about anything else in the van, the driver says « Nada. »","type":"mc","deck":"spanish","feeds":["es-v161"],"q":"What did he tell you?","choices":["Nothing","Everything","No one","Not much"],"answer":0,"explain":"« Nada » = nothing. « Todo » is everything; « nadie » is no one."},{"narrative":"You read the plate letters Q J V over the air.","type":"mc","deck":"radio","feeds":["rd-l-q","rd-l-j","rd-l-v"],"q":"How do you send them?","choices":["QUEBEC JULIETT VICTOR","QUEEN JULIET VICTOR","QUEBEC JOHNNY VICTOR","KILO JULIETT VICTOR"],"answer":0,"explain":"Q = QUEBEC, J = JULIETT, V = VICTOR."}]},{"id":"fp-consent-search","title":"Asking to Search","situation":"Daytime on a two-lane highway near the line. You stop a car for a burned-out headlight. You suspect more but can't articulate it yet.","steps":[{"narrative":"Is the headlight a valid reason to stop the car, given what you really suspect?","ref":"cl-sc-pretext"},{"narrative":"You're alone. You advise dispatch of the stop.","ref":"rd-10-mc4"},{"narrative":"The driver speaks only Spanish. Tell him you need to check his papers.","type":"mc","deck":"spanish","feeds":["es-p100"],"q":"Which phrase?","choices":["Tengo que verificar sus documentos.","H
