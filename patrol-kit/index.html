<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- BUILT FILE — do not edit. Source: patrol-kit/src + patrol-kit/decks; run `node tools/build.mjs`. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Patrol Kit</title>
<meta name="description" content="Border Patrol study cards — Spanish, French, case law, statutes, first aid and more. Spaced repetition, offline, no account.">
<meta name="theme-color" content="#131C15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrol Kit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131C15;
  --panel:#1B291E;
  --panel-hi:#223425;
  --line:#35493A;
  --ink:#EDE7D6;
  --muted:#93A18F;
  --gold:#C9A227;
  --gold-deep:#9A7C1B;
  --miss:#C75B2A;
  --ok:#7FA35C;
  --radius:10px;
  --disp:'Staatliches','Arial Narrow',Impact,sans-serif;
  --body:'Public Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:none;
}
#app{max-width:520px;margin:0 auto;padding:14px 16px 60px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:38px}
.back{font-family:var(--disp);font-size:1.05rem;letter-spacing:.08em;color:var(--gold);padding:6px 10px 6px 0}
.topbar h2{font-family:var(--disp);font-weight:400;font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase}
.topbar .spacer{flex:1}

/* ---------- home header ---------- */
.brand{border:2px solid var(--gold);border-radius:var(--radius);padding:16px 14px 12px;text-align:center;position:relative;margin-bottom:14px;background:linear-gradient(180deg,var(--panel-hi),var(--panel))}
.brand h1{font-family:var(--disp);font-weight:400;font-size:2.1rem;letter-spacing:.14em;line-height:1;color:var(--ink)}
.brand h1 span{color:var(--gold)}
.brand .sub{font-size:.68rem;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.brand::before,.brand::after{content:"★";color:var(--gold);position:absolute;top:10px;font-size:.8rem}
.brand::before{left:12px}.brand::after{right:12px}

/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.panel .head h3{font-family:var(--disp);font-weight:400;font-size:1.15rem;letter-spacing:.14em;color:var(--gold)}
.panel .date{font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.panel p{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.panel .done-note{color:var(--ok);font-weight:600;font-size:.9rem}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;text-align:center;background:var(--gold);color:#181503;font-family:var(--disp);font-size:1.15rem;letter-spacing:.12em;padding:12px;border-radius:8px;text-transform:uppercase}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.small{font-size:.95rem;padding:9px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---------- mode grid ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.mode:active{background:var(--panel-hi)}
.mode .t{font-family:var(--disp);font-weight:400;font-size:1.12rem;letter-spacing:.09em;text-transform:uppercase}
.mode .d{font-size:.72rem;color:var(--muted);line-height:1.35;margin-top:6px}
.mode .tag{font-size:.62rem;color:var(--gold);letter-spacing:.15em}

/* ---------- stats ---------- */
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.stat .n{font-family:var(--disp);font-size:1.5rem;color:var(--gold)}
.stat .l{font-size:.6rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* ---------- flashcard ---------- */
.cardwrap{perspective:900px;margin-bottom:14px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center;width:100%}
.fcard .kind{font-size:.62rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.fcard .big{font-size:1.55rem;font-weight:700;line-height:1.3}
.fcard .big.es{font-weight:600}
.fcard .trans{font-size:1.15rem;color:var(--ink);margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);width:100%}
.fcard .note{font-size:.8rem;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.4}
.fcard .hint{font-size:.72rem;color:var(--muted);margin-top:16px;letter-spacing:.1em;text-transform:uppercase}
.speak{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:.8rem;letter-spacing:.1em;margin-top:12px;border:1px solid var(--gold-deep);border-radius:20px;padding:6px 14px}
.gradebtns{display:flex;gap:10px}
.gradebtns .btn.missed{background:var(--miss);color:#fff}
.gradebtns .btn.got{background:var(--ok);color:#101508}
.progress{display:flex;gap:5px;justify-content:center;margin:12px 0}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pdot.done{background:var(--gold)}
.pdot.miss{background:var(--miss)}
.pdot.cur{outline:2px solid var(--gold);outline-offset:1px}

/* ---------- lists ---------- */
.catlist .cat{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px;text-align:left}
.catlist .cat .t{font-family:var(--disp);font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.catlist .cat .c{font-size:.7rem;color:var(--muted)}
.catlist .cat .arrow{color:var(--gold);font-size:1.1rem}
.phrase{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.phrase .es{font-size:1.02rem;font-weight:600;line-height:1.35}
.phrase .en{font-size:.85rem;color:var(--muted);margin-top:3px;line-height:1.35}
.phrase .note{font-size:.75rem;color:var(--gold);margin-top:5px;font-style:italic;line-height:1.4}
.phrase .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phrase .sp{color:var(--gold);font-size:1rem;padding:2px 6px;flex-shrink:0}

/* ---------- lesson ---------- */
.lesson-item{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;text-align:left}
.lesson-item .num{font-family:var(--disp);font-size:1.2rem;color:var(--gold);min-width:30px}
.lesson-item .t{flex:1}
.lesson-item .t .name{font-weight:600;font-size:.95rem}
.lesson-item .t .tag{font-size:.7rem;color:var(--muted)}
.lesson-item .check{color:var(--ok);font-size:1.1rem}
.lessonbody{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;line-height:1.55;font-size:.93rem}
.lessonbody h4{font-family:var(--disp);font-weight:400;letter-spacing:.1em;color:var(--gold);font-size:1.05rem;margin:14px 0 6px;text-transform:uppercase}
.lessonbody h4:first-child{margin-top:0}
.lessonbody p{margin-bottom:8px;color:var(--ink)}
.lessonbody .ex{background:var(--bg);border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.lessonbody .ex .s{font-weight:600}
.lessonbody .ex .e{color:var(--muted);font-size:.85rem}
.lessonbody table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.85rem}
.lessonbody th{font-family:var(--disp);font-weight:400;letter-spacing:.08em;color:var(--gold);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-size:.85rem}
.lessonbody td{padding:5px 8px;border-bottom:1px solid rgba(53,73,58,.4)}
.lessonbody td:first-child{color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.quiz .q{font-weight:600;font-size:1rem;line-height:1.4;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:.93rem;line-height:1.35}
.opt.correct{border-color:var(--ok);background:rgba(127,163,92,.14)}
.opt.wrong{border-color:var(--miss);background:rgba(199,91,42,.14)}
.quiz .why{font-size:.82rem;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.45}
.quiz .why b{color:var(--gold)}
.scoreline{font-family:var(--disp);font-size:1.05rem;letter-spacing:.1em;color:var(--gold);text-align:center;margin-bottom:10px}

/* ---------- verb trainer ---------- */
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:.82rem;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.08)}
.vprompt{text-align:center;padding:10px 0 4px}
.vprompt .inf{font-family:var(--disp);font-size:1.9rem;letter-spacing:.06em}
.vprompt .meta{font-size:.78rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-top:4px}
.vprompt .en{font-size:.82rem;color:var(--muted);margin-top:2px;font-style:italic}

.sectionlabel{font-family:var(--disp);font-size:.95rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:4px 2px 10px}
.footer{margin-top:22px;text-align:center}
.footer button{color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:8px}
.footer .src{font-size:.65rem;color:var(--muted);opacity:.7;margin-top:8px;line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#181503;font-weight:700;font-size:.85rem;padding:10px 20px;border-radius:24px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

/* ================= v2 additions ================= */
.brand .sub{font-size:.68rem}
.fcard,.quiz.card{border-left:4px solid var(--deck,var(--gold))}
.fcard .kind,.quiz.card .kind{color:var(--deck,var(--gold))}
.quiz.card .kind{display:block;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
.quiz .setup{font-size:.9rem;line-height:1.5;color:var(--ink);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.meta-back{width:100%;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);text-align:left}
.meta-back .why{font-size:.8rem;color:var(--ink);line-height:1.45;font-style:normal;margin:0 0 6px}
.meta-back .why b,.meta-back .src b{color:var(--gold);font-weight:600;letter-spacing:.08em;font-size:.68rem;text-transform:uppercase;margin-right:4px}
.meta-back .src{font-size:.72rem;color:var(--muted);line-height:1.4}
.flagchip{display:block;background:rgba(199,91,42,.14);border:1px solid var(--miss);color:#F0B48F;border-radius:8px;padding:7px 10px;font-size:.78rem;line-height:1.4;margin-bottom:8px;text-align:left}
.flagchip b{color:var(--miss);letter-spacing:.08em;font-size:.68rem;margin-right:4px}
.bindtag{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:.62rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-left:6px;vertical-align:middle}
.bindtag.binding{border-color:var(--ok);color:var(--ok)}
/* step ordering */
.olist{counter-reset:o;margin-bottom:10px}
.ostep{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;font-size:.9rem;line-height:1.35}
.ostep .n{font-family:var(--disp);color:var(--deck,var(--gold));min-width:18px}
.ostep.placed{border-style:dashed}
.ostep.correct{border-color:var(--ok);background:rgba(127,163,92,.14)}
.ostep.wrong{border-color:var(--miss);background:rgba(199,91,42,.14)}
.ostep .fix{display:block;font-size:.75rem;color:var(--muted);margin-top:3px}
.olabel{font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:6px 0 6px}
/* deck list */
.decklist{margin-bottom:16px}
.deckrow{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--deck);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.deckrow.off{opacity:.5}
.deckrow .open{flex:1;text-align:left;padding:11px 12px;min-width:0}
.deckrow .open .t{font-family:var(--disp);font-size:1.08rem;letter-spacing:.08em;text-transform:uppercase}
.deckrow .open .c{font-size:.7rem;color:var(--muted)}
.deckrow .open .c b{color:var(--deck);font-weight:600}
.toggle{width:62px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line)}
.toggle .sw{width:36px;height:20px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle[aria-checked="true"] .sw{background:var(--deck)}
.toggle[aria-checked="true"] .sw::after{left:18px}
.shuffle{margin-bottom:16px}
.shuffle .btn .sub{display:block;font-family:var(--body);font-size:.68rem;letter-spacing:.12em;opacity:.75;margin-top:2px}
.deckhead{border-left:5px solid var(--deck);padding:4px 0 4px 12px;margin-bottom:14px}
.deckhead p{font-size:.85rem;color:var(--muted)}
.mode{border-top:3px solid var(--deck,var(--line))}
.card-list .phrase{border-left:3px solid var(--deck)}
textarea.io{width:100%;min-height:140px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-bottom:10px}
.toast{white-space:nowrap}
.fcard .rule{display:block;width:100%;text-align:left;font-size:.86rem;line-height:1.45;margin-top:10px}
.fcard .rule b{color:var(--deck,var(--gold));font-weight:600;letter-spacing:.1em;font-size:.66rem;text-transform:uppercase;margin-right:6px}
.fcard .trans{font-size:1.02rem;line-height:1.45}
.progress .counter{font-family:var(--disp);letter-spacing:.12em;color:var(--muted);font-size:.95rem}
.shuffle .btn:not(.ghost){font-size:1.6rem;padding:16px 12px}
.linkbtn{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font-family:var(--body);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:8px 12px;cursor:pointer}
.shuffle .missedbtn{margin-top:10px}
.skiprow{display:flex;justify-content:space-between;margin-top:14px}
.skiprow .linkbtn{margin:0;font-size:.95rem}
.skiprow .linkbtn:last-child{color:var(--ink);text-decoration:none;font-weight:600}
.situation{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:.88rem;line-height:1.5}
.situation:empty{display:none}
.situation h3{font-family:var(--disp);font-weight:400;letter-spacing:.1em;color:var(--gold);font-size:1.1rem;margin-bottom:6px;text-transform:uppercase}
.situation p+p{margin-top:6px}
.smallprint{font-size:.78rem;color:var(--muted);line-height:1.5;margin-bottom:12px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const DECKS=[{"meta":{"id":"caselaw","name":"Case Law","short":"LAW","color":"#7FA3C8","order":3,"requireVerified":true,"blurb":"Core Supreme Court and Second Circuit cases. Vermont sits in the 2d Circuit.","subModes":["browse"]},"categories":{"Stops & Suspicion":{"why":"Every stop you make has to fit one of these standards."},"Border & Checkpoints":{"why":"The border-search exception and checkpoint rules are what make BP authority different."},"Vehicles & Searches":{"why":"Most enforcement contact happens in or around a vehicle."},"Statements":{"why":"An unwarned custodial statement can't be used at trial."},"Force":{"why":"Every use of force is judged against these cases."},"Liability":{"why":"Tells you what remedies exist when an agent is sued."},"Which Case Governs?":{"why":"Picking the right case quickly is how you articulate your legal basis."}},"cards":[{"id":"cl-terry","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Terry v. Ohio","cite":"392 U.S. 1","year":1968,"back":"Police may briefly stop a person on reasonable suspicion that criminal activity is afoot, and frisk for weapons if they reasonably suspect the person is armed and dangerous. Neither requires probable cause.","rule":"Stop = reasonable suspicion of crime. Frisk = reasonable suspicion of armed and dangerous.","field":"Articulate two separate justifications: one for the stop, one for the pat-down.","why":"The foundation for every investigative detention short of arrest.","source":"Terry v. Ohio, 392 U.S. 1 (1968)","verified":"https://www.acluohio.org/cases/terry-v-ohio-392-us-1-1968/"},{"id":"cl-brignoni","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"United States v. Brignoni-Ponce","cite":"422 U.S. 873","year":1975,"back":"Away from the border and its functional equivalents, a roving patrol may stop a vehicle only on specific articulable facts, plus rational inferences, that reasonably warrant suspicion the vehicle contains aliens who may be illegally in the country. Apparent Mexican ancestry alone is not enough.","rule":"Roving-patrol stop = reasonable suspicion. Apparent ethnicity can be a factor but never the only one.","field":"Build the stop on articulable factors: driving behavior, the vehicle and its load, the area, recent crossings, your experience.","why":"The governing standard for every roving-patrol vehicle stop.","source":"United States v. Brignoni-Ponce, 422 U.S. 873 (1975)","verified":"https://en.wikipedia.org/wiki/United_States_v._Brignoni-Ponce"},{"id":"cl-cortez","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"United States v. Cortez","cite":"449 U.S. 411","year":1981,"back":"Reasonable suspicion requires a particularized and objective basis for suspecting the particular person stopped, judged on the whole picture. Trained Border Patrol agents may draw inferences from facts that would mean nothing to an untrained observer.","rule":"Totality of the circumstances, weighed as a trained agent would weigh them.","field":"Your training and experience (sign cutting, crossing patterns, timing) count as part of the basis. Write them into the report.","why":"Shows that agent expertise is part of reasonable suspicion. It came out of a Border Patrol sign-cutting case.","source":"United States v. Cortez, 449 U.S. 411 (1981)","verified":"https://supreme.justia.com/cases/federal/us/449/411/"},{"id":"cl-arvizu","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"United States v. Arvizu","cite":"534 U.S. 266","year":2002,"back":"Reasonable suspicion supported a Border Patrol stop on a remote road even though each factor, taken alone, had an innocent explanation. Courts may not use a 'divide-and-conquer' analysis that discards factors one at a time.","rule":"Factors are weighed together. Innocent-looking facts can add up to reasonable suspicion.","field":"List every factor in your report, including the ones that are weak on their own.","why":"Blocks the defense tactic of picking off your factors one at a time.","source":"United States v. Arvizu, 534 U.S. 266 (2002)","verified":"https://www.law.cornell.edu/supct/html/00-1519.ZS.html"},{"id":"cl-sokolow","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"United States v. Sokolow","cite":"490 U.S. 1","year":1989,"back":"Reasonable suspicion existed from a set of factors (cash payment, short trip to a source city, travel under another name, nervousness, no checked bags), each consistent with innocent travel but suspicious taken together.","rule":"Totality of the circumstances. There is no required 'ongoing criminal activity' fact.","field":"Probabilistic facts count. Articulate why the combination is suspicious.","why":"Confirms the whole-picture test outside the border context.","source":"United States v. Sokolow, 490 U.S. 1 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-1.pdf"},{"id":"cl-wardlow","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Illinois v. Wardlow","cite":"528 U.S. 119","year":2000,"back":"Presence in a high-crime area alone isn't reasonable suspicion, but location is relevant. Unprovoked headlong flight on seeing police, combined with the area, justified a stop.","rule":"Unprovoked flight + context can supply reasonable suspicion. Location alone cannot.","field":"Flight is a strong factor. Document what prompted it and the setting it happened in.","why":"Flight on seeing a marked unit is a common fact pattern.","source":"Illinois v. Wardlow, 528 U.S. 119 (2000)","verified":"https://law.justia.com/cases/federal/us/528/119/"},{"id":"cl-glover","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Kansas v. Glover","cite":"589 U.S. ___, 140 S. Ct. 1183","year":2020,"back":"After running a plate and learning the registered owner's license is revoked, an officer may stop the vehicle on the commonsense inference that the owner is driving, unless the officer has information negating that inference.","rule":"Registered owner revoked + nothing suggesting someone else is driving = reasonable suspicion.","field":"If you can see the driver doesn't match the owner's description, the inference is gone.","why":"Lets a records check alone justify a stop.","source":"Kansas v. Glover, 589 U.S. ___, 140 S. Ct. 1183 (2020)","verified":"https://www.supremecourt.gov/opinions/19pdf/589us2r21_a7bf.pdf"},{"id":"cl-heien","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Heien v. North Carolina","cite":"574 U.S. 54","year":2014,"back":"An officer's reasonable mistake of law can supply the reasonable suspicion for a traffic stop (a single brake light out, under an ambiguous state statute).","rule":"A reasonable mistake of law doesn't invalidate the stop. An unreasonable one does.","field":"Know the traffic code you rely on. The mistake must be one a reasonable officer could make.","why":"Your basis for the stop survives an honest, reasonable misreading of an unclear statute.","source":"Heien v. North Carolina, 574 U.S. 54 (2014)","verified":"https://law.justia.com/cases/federal/us/574/54/"},{"id":"cl-delgado","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"INS v. Delgado","cite":"466 U.S. 210","year":1984,"back":"Factory surveys where agents questioned workers about citizenship while others stood at the exits did not seize the workforce. Questioning about identity or citizenship is not by itself a seizure.","rule":"Asking about status isn't a seizure unless a reasonable person would believe they weren't free to leave.","field":"Consensual questioning needs no suspicion. Once you restrain movement, you need reasonable suspicion.","why":"Draws the line between a consensual status question and a detention.","source":"INS v. Delgado, 466 U.S. 210 (1984)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-466/pdf/USREPORTS-466-210.pdf"},{"id":"cl-drayton","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"United States v. Drayton","cite":"536 U.S. 194","year":2002,"back":"Officers who boarded a bus and asked passengers questions and for consent to search did not seize them. The Fourth Amendment does not require telling people they may refuse.","rule":"An encounter is consensual if a reasonable person would feel free to decline. No advisement of rights is required.","field":"Keep transit checks consensual: a reasonable person must feel free to decline.","why":"Governs consensual transportation checks.","source":"United States v. Drayton, 536 U.S. 194 (2002)","verified":"https://www.law.cornell.edu/supremecourt/text/536/194"},{"id":"cl-bostick","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Florida v. Bostick","cite":"501 U.S. 429","year":1991,"back":"A police encounter on a bus is not automatically a seizure. The test is whether a reasonable person would feel free to decline the officers' requests or otherwise end the encounter.","rule":"The 'free to decline or terminate' test applies in confined spaces like buses.","field":"Consent questions on a bus are allowed. How you conduct them decides whether they stay consensual.","why":"The baseline test for consensual encounters.","source":"Florida v. Bostick, 501 U.S. 429 (1991)","verified":"https://www.law.cornell.edu/supct/html/89-1717.ZO.html"},{"id":"cl-martinez-fuerte","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"United States v. Martinez-Fuerte","cite":"428 U.S. 543","year":1976,"back":"Routine stops for brief questioning at a reasonably located permanent checkpoint are constitutional without individualized suspicion. Referral to secondary for limited further questioning also needs no individualized suspicion.","rule":"Checkpoint stop and brief questioning = no suspicion needed. Searching the vehicle is a different question (see Ortiz).","field":"At a checkpoint you may stop, ask and refer to secondary. To search, you need consent or probable cause.","why":"Legal basis for immigration checkpoints.","source":"United States v. Martinez-Fuerte, 428 U.S. 543 (1976)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-428/pdf/USREPORTS-428-543.pdf"},{"id":"cl-ortiz","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"United States v. Ortiz","cite":"422 U.S. 891","year":1975,"back":"At traffic checkpoints removed from the border and its functional equivalents, Border Patrol may not search private vehicles without consent or probable cause.","rule":"Interior checkpoint search = consent or probable cause.","field":"Stopping a car at the checkpoint and opening its trunk need different justifications.","why":"Keeps checkpoint stops from turning into suspicionless searches.","source":"United States v. Ortiz, 422 U.S. 891 (1975)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-422/pdf/USREPORTS-422-891.pdf"},{"id":"cl-almeida","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"Almeida-Sanchez v. United States","cite":"413 U.S. 266","year":1973,"back":"A roving-patrol search of a car about 25 air miles from the border, made without a warrant, probable cause or consent, violated the Fourth Amendment. A statute authorizing searches within a 'reasonable distance' doesn't override that.","rule":"Away from the border or its functional equivalent, a vehicle search needs probable cause or consent.","field":"8 U.S.C. § 1357(a)(3) authority to search conveyances is limited by the Fourth Amendment. It is not a suspicionless search power.","why":"Defines the limit of the statutory 'reasonable distance' authority.","source":"Almeida-Sanchez v. United States, 413 U.S. 266 (1973)","verified":"https://en.wikipedia.org/wiki/Almeida-Sanchez_v._United_States"},{"id":"cl-flores-montano","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"United States v. Flores-Montano","cite":"541 U.S. 149","year":2004,"back":"At the international border, the government may remove, disassemble and reassemble a vehicle's fuel tank without any suspicion.","rule":"Border vehicle searches, including taking the vehicle apart, are routine. No suspicion needed.","field":"Applies at the border and its functional equivalent, not at interior stops.","why":"Shows how far the border-search exception reaches for vehicles.","source":"United States v. Flores-Montano, 541 U.S. 149 (2004)","verified":"https://www.law.cornell.edu/supremecourt/text/541/149"},{"id":"cl-montoya","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"United States v. Montoya de Hernandez","cite":"473 U.S. 531","year":1985,"back":"Detaining a traveler at the border beyond a routine search is justified when officers reasonably suspect she is smuggling contraband in her alimentary canal.","rule":"Non-routine border detention or search = reasonable suspicion.","field":"Routine border search: no suspicion. Prolonged or intrusive: articulate reasonable suspicion.","why":"Source of the routine vs. non-routine border-search line.","source":"United States v. Montoya de Hernandez, 473 U.S. 531 (1985)","verified":"https://www.law.cornell.edu/supremecourt/text/473/531"},{"id":"cl-ramsey","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"United States v. Ramsey","cite":"431 U.S. 606","year":1977,"back":"Customs may open incoming international mail at the border without a warrant or probable cause. Border searches are reasonable simply because they happen at the border. Reading correspondence still requires a warrant under the regulations.","rule":"Border searches are reasonable in themselves, including searches of international mail.","field":"The border-search exception applies to items crossing as well as people.","why":"A leading statement that border searches are reasonable in themselves.","source":"United States v. Ramsey, 431 U.S. 606 (1977)","verified":"https://law.cornell.edu/supremecourt/text/431/606"},{"id":"cl-alisigwe","type":"flip","cat":"Border & Checkpoints","binding":"2d Cir.","front":"United States v. Alisigwe","cite":"No. 24-960 (2d Cir. Sept. 17, 2026)","year":2026,"back":"Manual searches of a traveler's cell phone at the border (scrolling through and photographing what's on it) may be done without a warrant and without any suspicion. The court left open whether a forensic search requires reasonable suspicion.","rule":"In the 2d Circuit, a manual phone search at the border is routine. Forensic extraction is undecided.","field":"Binding in Vermont. For a forensic search, have reasonable suspicion articulated; the question is still open here.","why":"Current binding law in Vermont on border device searches.","flag":"Decided Sept. 2026. Watch for rehearing en banc or Supreme Court review.","source":"United States v. Alisigwe, No. 24-960 (2d Cir. Sept. 17, 2026)","verified":"https://law.justia.com/cases/federal/appellate-courts/ca2/24-960/24-960-2026-09-17.html"},{"id":"cl-cotterman","type":"flip","cat":"Border & Checkpoints","binding":"persuasive (9th Cir.)","front":"United States v. Cotterman","cite":"709 F.3d 952 (9th Cir. 2013) (en banc)","year":2013,"back":"A forensic examination of a laptop seized at the border required reasonable suspicion because of how comprehensive and intrusive it is. Reasonable suspicion existed on those facts.","rule":"Ninth Circuit: forensic device search at the border = reasonable suspicion.","field":"Not binding in Vermont. It shows how other circuits treat forensic searches, which the 2d Circuit hasn't decided.","why":"The most-cited case on the forensic-search question the 2d Circuit left open.","source":"United States v. Cotterman, 709 F.3d 952 (9th Cir. 2013) (en banc)","verified":"https://en.wikipedia.org/wiki/United_States_v._Cotterman"},{"id":"cl-irving","type":"flip","cat":"Border & Checkpoints","binding":"2d Cir.","front":"United States v. Irving","cite":"452 F.3d 110 (2d Cir. 2006)","year":2006,"back":"Routine border searches of belongings need no suspicion. More invasive non-routine searches need reasonable suspicion, which can rest on unusual conduct, incriminating finds in a routine search, records showing propensity, or a suspicious itinerary.","rule":"2d Cir.: routine border search = none; non-routine = reasonable suspicion.","field":"Lists the reasonable-suspicion factors this circuit accepts at the border.","why":"The 2d Circuit's routine / non-routine framework.","source":"United States v. Irving, 452 F.3d 110 (2d Cir. 2006)","verified":"https://law.resource.org/pub/us/case/reporter/F3/452/452.F3d.110.04-0971-.html"},{"id":"cl-tabbaa","type":"flip","cat":"Border & Checkpoints","binding":"2d Cir.","front":"Tabbaa v. Chertoff","cite":"509 F.3d 89 (2d Cir. 2007)","year":2007,"back":"Detaining U.S. citizens returning from Canada for several hours of questioning, pat-down, fingerprinting and photographing, without individualized suspicion, was a routine border search the Fourth Amendment permits.","rule":"2d Cir.: multi-hour questioning, fingerprinting and photographing at entry can still be routine.","field":"Shows how broadly the 2d Circuit reads 'routine' for travelers entering from Canada.","why":"A northern-border application of the routine-search doctrine.","source":"Tabbaa v. Chertoff, 509 F.3d 89 (2d Cir. 2007)","verified":"https://pnj.prisonlegalnews.org/news/2007/oct/1/tabbaa-v-chertoff-no-06-0119-cv-2nd-cir-509-f3d-89-november-26-2007-judge-chester-j-straub-1/"},{"id":"cl-singh","type":"flip","cat":"Border & Checkpoints","binding":"2d Cir.","front":"United States v. Singh","cite":"415 F.3d 288 (2d Cir. 2005)","year":2005,"back":"A Border Patrol roving stop near the Canadian border was supported by reasonable suspicion under Brignoni-Ponce. The aliens found in the vehicle were admissible and the § 1324 transporting conviction was affirmed.","rule":"2d Cir. applies Brignoni-Ponce and Cortez to northern-border roving stops.","field":"Brignoni-Ponce is the standard on the northern border as well as the southern.","why":"Binding 2d Circuit application of the roving-patrol standard.","source":"United States v. Singh, 415 F.3d 288 (2d Cir. 2005)","verified":"https://case-law.vlex.com/vid/u-s-v-singh-894865920"},{"id":"cl-compton","type":"flip","cat":"Border & Checkpoints","binding":"2d Cir.","front":"United States v. Compton","cite":"830 F.3d 55 (2d Cir. 2016)","year":2016,"back":"Agents had reasonable suspicion for a Terry stop of a driver who appeared to avoid an immigration checkpoint near the Canadian border, and did not unreasonably extend the stop.","rule":"2d Cir.: apparent checkpoint avoidance is a relevant reasonable-suspicion factor.","field":"Document exactly what the avoidance looked like: abrupt slowing, turning off before the checkpoint, timing.","why":"Binding authority that checkpoint avoidance counts.","source":"United States v. Compton, 830 F.3d 55 (2d Cir. 2016)","verified":"https://case-law.vlex.com/vid/830-f-3d-55-683725773"},{"id":"cl-lopez-mendoza","type":"flip","cat":"Border & Checkpoints","binding":"SCOTUS","front":"INS v. Lopez-Mendoza","cite":"468 U.S. 1032","year":1984,"back":"The exclusionary rule does not generally apply in civil deportation proceedings, and a person's identity is not suppressible as the fruit of an unlawful arrest.","rule":"Civil removal case: evidence generally isn't suppressed for a Fourth Amendment violation. Criminal case: it can be.","field":"A bad stop can still lose a § 1325/1326/1324 prosecution. Lopez-Mendoza doesn't save a criminal case.","why":"Explains why the same stop can play out differently in immigration court and federal court.","source":"INS v. Lopez-Mendoza, 468 U.S. 1032 (1984)","verified":"https://www.law.cornell.edu/wex/i.n.s._v._lopez-mendoza"},{"id":"cl-carroll","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Carroll v. United States","cite":"267 U.S. 132","year":1925,"back":"Officers may search a vehicle without a warrant when they have probable cause to believe it contains contraband, because a vehicle can be quickly moved.","rule":"Automobile exception: probable cause, no warrant needed.","field":"Probable cause for the vehicle (not reasonable suspicion) is what lets you search it without a warrant.","why":"Origin of the automobile exception (a Prohibition-era liquor-smuggling case).","source":"Carroll v. United States, 267 U.S. 132 (1925)","verified":"https://www.pastpaperhero.com/resources/carroll-v-united-states-267-us-132-1925"},{"id":"cl-whren","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Whren v. United States","cite":"517 U.S. 806","year":1996,"back":"A traffic stop supported by probable cause of a traffic violation is reasonable regardless of the officer's subjective motive.","rule":"Objective probable cause of a violation = valid stop. A pretextual motive doesn't matter under the Fourth Amendment.","field":"If you rely on a traffic violation, it must actually have happened. Document it.","why":"Allows pretext stops when an objective violation exists.","source":"Whren v. United States, 517 U.S. 806 (1996)","verified":"https://law.justia.com/cases/federal/us/517/806/"},{"id":"cl-rodriguez","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Rodriguez v. United States","cite":"575 U.S. 348","year":2015,"back":"Without reasonable suspicion, officers may not extend a completed traffic stop to conduct a dog sniff. Authority for the stop ends when its mission is, or reasonably should be, finished.","rule":"The stop lasts only as long as its mission. Extending it needs its own reasonable suspicion.","field":"Develop reasonable suspicion before the original tasks are done, or let them go.","why":"Every extra minute of a stop needs a reason.","source":"Rodriguez v. United States, 575 U.S. 348 (2015)","verified":"https://law.justia.com/cases/federal/us/575/13-9972/"},{"id":"cl-riley","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Riley v. California","cite":"573 U.S. 373","year":2014,"back":"Police generally may not search the digital contents of a cell phone seized during an arrest without a warrant. Exigent circumstances, such as an imminent remote wipe, can still apply.","rule":"Phone seized at arrest: get a warrant before searching its contents.","field":"Inland arrest: secure the phone and get a warrant. Border searches are governed by Alisigwe in the 2d Cir.","why":"Separates arrest phone searches from border phone searches.","source":"Riley v. California, 573 U.S. 373 (2014)","verified":"https://www.pastpaperhero.com/resources/riley-v-california-573-us-373-2014"},{"id":"cl-mimms","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Pennsylvania v. Mimms","cite":"434 U.S. 106","year":1977,"back":"An officer may, as a matter of course, order the driver of a lawfully stopped car to get out.","rule":"Lawful stop = you may order the driver out. No further justification needed.","field":"Exit orders are an officer-safety tool on any lawful stop.","why":"Gives you control of the driver's position.","source":"Pennsylvania v. Mimms, 434 U.S. 106 (1977)","verified":"https://en.wikipedia.org/wiki/Maryland_v._Wilson"},{"id":"cl-wilson","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Maryland v. Wilson","cite":"519 U.S. 408","year":1997,"back":"The Mimms rule extends to passengers: an officer may order passengers out of a lawfully stopped car.","rule":"Lawful stop = you may order passengers out too.","field":"Control everyone in the vehicle, not only the driver.","why":"Extends exit orders to passengers.","source":"Maryland v. Wilson, 519 U.S. 408 (1997)","verified":"https://law.justia.com/cases/federal/us/519/408/"},{"id":"cl-brendlin","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Brendlin v. California","cite":"551 U.S. 249","year":2007,"back":"In a traffic stop, a passenger is seized just as the driver is, and may challenge the stop's legality.","rule":"Passengers are seized. A bad stop taints evidence against them too.","field":"The basis for the stop protects (or sinks) the case against every occupant.","why":"Passengers have standing to challenge the stop.","source":"Brendlin v. California, 551 U.S. 249 (2007)","verified":"https://case-law.vlex.com/vid/551-u-s-249-605969122"},{"id":"cl-johnson","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Arizona v. Johnson","cite":"555 U.S. 323","year":2009,"back":"During a lawful traffic stop, an officer may frisk a passenger if the officer reasonably suspects the passenger is armed and dangerous, even without suspecting the passenger of a crime.","rule":"Frisk passenger = reasonable suspicion of armed and dangerous.","field":"The lawful stop supplies the detention. You still need the armed-and-dangerous articulation.","why":"Applies Terry frisks to passengers.","source":"Arizona v. Johnson, 555 U.S. 323 (2009)","verified":"https://supreme.justia.com/cases/federal/us/555/323"},{"id":"cl-miranda","type":"flip","cat":"Statements","binding":"SCOTUS","front":"Miranda v. Arizona","cite":"384 U.S. 436","year":1966,"back":"Statements from custodial interrogation are inadmissible unless the suspect was warned of the right to silence, that statements can be used in court, the right to an attorney, and appointed counsel if indigent, and then waived those rights knowingly, voluntarily and intelligently.","rule":"Custody + interrogation = warnings and a valid waiver before questioning.","field":"Once a subject is in custody, warn before asking about the crime.","why":"Protects the admissibility of your best evidence.","source":"Miranda v. Arizona, 384 U.S. 436 (1966)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-384/pdf/USREPORTS-384-436.pdf"},{"id":"cl-graham","type":"flip","cat":"Force","binding":"SCOTUS","front":"Graham v. Connor","cite":"490 U.S. 386","year":1989,"back":"Excessive-force claims arising from an arrest, stop or other seizure are judged by objective reasonableness: from the view of a reasonable officer on the scene, not with 20/20 hindsight, allowing for split-second decisions. Factors include the severity of the crime, whether the suspect is an immediate threat, and whether the suspect is actively resisting or trying to flee.","rule":"Objective reasonableness, judged by a reasonable officer on the scene. Intent is irrelevant.","field":"Write the facts as you perceived them at the time, covering each Graham factor.","why":"The constitutional test for every use of force.","source":"Graham v. Connor, 490 U.S. 386 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"cl-garner","type":"flip","cat":"Force","binding":"SCOTUS","front":"Tennessee v. Garner","cite":"471 U.S. 1","year":1985,"back":"Deadly force to prevent a suspect's escape is a Fourth Amendment seizure and is allowed only if the officer has probable cause to believe the suspect poses a significant threat of death or serious physical injury to the officer or others.","rule":"Fleeing alone never justifies deadly force. A significant threat of death or serious injury must exist.","field":"An unarmed subject running away is not a deadly-force situation.","why":"Ended the common-law 'fleeing felon' rule.","source":"Tennessee v. Garner, 471 U.S. 1 (1985)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"cl-scott","type":"flip","cat":"Force","binding":"SCOTUS","front":"Scott v. Harris","cite":"550 U.S. 372","year":2007,"back":"An officer's attempt to end a dangerous high-speed chase by ramming the fleeing car was reasonable, because the driver's reckless flight posed a substantial and immediate risk of serious injury to others. The Court weighed the number of lives at risk and the relative culpability of the parties.","rule":"Force to end a chase is weighed against the danger the fleeing driver creates to the public.","field":"Document the danger the flight created: speeds, traffic, near-misses.","why":"The leading vehicle-pursuit force case.","source":"Scott v. Harris, 550 U.S. 372 (2007)","verified":"https://law.justia.com/cases/federal/us/550/372/"},{"id":"cl-barnes","type":"flip","cat":"Force","binding":"SCOTUS","front":"Barnes v. Felix","cite":"605 U.S. 73","year":2025,"back":"Courts must judge excessive force by the totality of the circumstances. They may not look only at the 'moment of the threat' and ignore what led up to it.","rule":"Events before the moment force is used are part of the reasonableness analysis.","field":"Your actions before the critical moment (positioning, tactics) will be weighed.","why":"Rejected the narrow test the 2d Circuit had used. The whole encounter now counts in Vermont.","flag":"Changes prior 2d Cir. law, which used the narrower 'moment of threat' approach.","source":"Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://en.wikipedia.org/wiki/Barnes_v._Felix"},{"id":"cl-hernandez-mesa","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Hernandez v. Mesa","cite":"589 U.S. 93","year":2020,"back":"No Bivens damages action is available for a cross-border shooting by a Border Patrol agent standing in the U.S., because the claim implicates foreign relations and national security.","rule":"Courts won't extend Bivens into new contexts like cross-border shootings.","field":"Personal damages suits against agents under Bivens are now very limited.","why":"Defines federal agents' personal civil exposure.","source":"Hernandez v. Mesa, 589 U.S. 93 (2020)","verified":"https://www.supremecourt.gov/opinions/19pdf/17-1678_m6io.pdf"},{"id":"cl-egbert","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Egbert v. Boule","cite":"596 U.S. 482","year":2022,"back":"Bivens does not extend to a Fourth Amendment excessive-force claim against a Border Patrol agent, or to a First Amendment retaliation claim. Courts won't create damages remedies in new contexts touching national security or where an alternative remedial structure exists.","rule":"No Bivens claim for excessive force by a BP agent, even inside the U.S.","field":"The facts arose on the northern border, at a property next to the Canadian line.","why":"The leading case on agents' personal damages liability.","source":"Egbert v. Boule, 596 U.S. 482 (2022)","verified":"https://law.justia.com/cases/federal/us/596/21-147/"},{"id":"cl-sc-roving","type":"scenario","cat":"Which Case Governs?","setup":"On roving patrol well inland, you see a vehicle you want to stop. Your only observation so far is the occupants' apparent ethnicity.","q":"Which case controls, and can you stop it?","choices":["Brignoni-Ponce: no, ethnicity alone isn't reasonable suspicion","Martinez-Fuerte: yes, no suspicion needed","Whren: yes, motive doesn't matter","Flores-Montano: yes, border search"],"answer":0,"explain":"Roving stops need specific articulable facts. Apparent ancestry can be one factor, never the only one.","source":"United States v. Brignoni-Ponce, 422 U.S. 873 (1975)","verified":"https://en.wikipedia.org/wiki/United_States_v._Brignoni-Ponce"},{"id":"cl-sc-checkpoint-search","type":"scenario","cat":"Which Case Governs?","setup":"At an interior immigration checkpoint you've referred a car to secondary. The driver's answers are fine. You want to look in the trunk; the driver says no.","q":"What do you need to search the trunk?","choices":["Nothing: checkpoints are suspicionless (Martinez-Fuerte)","Probable cause or consent (Ortiz)","Reasonable suspicion (Brignoni-Ponce)","A warrant in every case (Riley)"],"answer":1,"explain":"Checkpoint stops and questioning are suspicionless, but searching the vehicle at an interior checkpoint needs consent or probable cause.","source":"United States v. Ortiz, 422 U.S. 891 (1975)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-422/pdf/USREPORTS-422-891.pdf"},{"id":"cl-sc-factors","type":"scenario","cat":"Which Case Governs?","setup":"Defense counsel argues each of your six stop factors has an innocent explanation, so each should get zero weight.","q":"Which case answers that argument?","choices":["Terry v. Ohio","United States v. Arvizu","Tennessee v. Garner","Riley v. California"],"answer":1,"explain":"Arvizu rejects 'divide-and-conquer'. Factors are weighed together under the totality of the circumstances.","source":"United States v. Arvizu, 534 U.S. 266 (2002)","verified":"https://www.law.cornell.edu/supct/html/00-1519.ZS.html"},{"id":"cl-sc-dog","type":"scenario","cat":"Which Case Governs?","setup":"Traffic stop. Citation written and documents returned. Nothing else suggests a crime, but you want to hold the car ten minutes for a K-9.","q":"Can you?","choices":["Yes: Whren allows any pretext","Yes: a dog sniff isn't a search","No: Rodriguez. The mission is over, and extending it needs reasonable suspicion","No: Riley requires a warrant"],"answer":2,"explain":"Authority ends when the stop's tasks are or should be done. A sniff isn't part of the traffic mission.","source":"Rodriguez v. United States, 575 U.S. 348 (2015)","verified":"https://law.justia.com/cases/federal/us/575/13-9972/"},{"id":"cl-sc-phone-border","type":"scenario","cat":"Which Case Governs?","setup":"A traveler entering from Canada is in secondary. You want to scroll through the traveler's unlocked phone. No specific suspicion yet.","q":"In Vermont today, what governs?","choices":["Riley: warrant required","Cotterman: reasonable suspicion required","Alisigwe (2d Cir.): manual border search needs no suspicion","Terry: reasonable suspicion of armed and dangerous"],"answer":2,"explain":"Alisigwe is binding in the 2d Circuit for manual searches. Cotterman (9th Cir.) is only persuasive here, and the forensic-search question is still open.","source":"United States v. Alisigwe, No. 24-960 (2d Cir. Sept. 17, 2026)","verified":"https://law.justia.com/cases/federal/appellate-courts/ca2/24-960/24-960-2026-09-17.html"},{"id":"cl-sc-phone-arrest","type":"scenario","cat":"Which Case Governs?","setup":"You arrest a driver inland for § 1324 transporting. The driver's phone is on the seat.","q":"Can you go through the phone's contents now?","choices":["Yes: search incident to arrest","Yes: Alisigwe","No: Riley. Secure it and get a warrant, absent an exigency","Yes: automobile exception (Carroll)"],"answer":2,"explain":"Away from the border, Riley controls. Seize and secure the phone and get a warrant unless there's a real exigency.","source":"Riley v. California, 573 U.S. 373 (2014)","verified":"https://www.pastpaperhero.com/resources/riley-v-california-573-us-373-2014"},{"id":"cl-sc-flee","type":"scenario","cat":"Which Case Governs?","setup":"A subject you believe entered illegally runs from you into the woods. You see no weapon and nothing indicates a threat to anyone.","q":"Is deadly force authorized to stop the escape?","choices":["Yes: a felony is being committed","No: Garner. Flight alone isn't a significant threat of death or serious injury","Yes: Scott v. Harris","Yes, if the subject ignores commands"],"answer":1,"explain":"Deadly force requires probable cause of a significant threat of death or serious physical injury. Escape alone is never enough.","source":"Tennessee v. Garner, 471 U.S. 1 (1985)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"cl-sc-avoid","type":"scenario","cat":"Which Case Governs?","setup":"A vehicle crests a hill, sees the checkpoint ahead, brakes hard and pulls into a roadside lot short of it.","q":"Which binding case says that conduct counts toward reasonable suspicion?","choices":["United States v. Compton (2d Cir.)","Illinois v. Wardlow","Kansas v. Glover","INS v. Delgado"],"answer":0,"explain":"Compton (2d Cir. 2016) treats apparent checkpoint avoidance as a relevant factor. Wardlow is about foot flight, not checkpoints.","source":"United States v. Compton, 830 F.3d 55 (2d Cir. 2016)","verified":"https://case-law.vlex.com/vid/830-f-3d-55-683725773"},{"id":"cl-sc-plate","type":"scenario","cat":"Which Case Governs?","setup":"A records check shows the registered owner of a pickup has a revoked license. You can't see the driver clearly.","q":"Can you stop the truck?","choices":["No: you need to see the driver first","Yes: Kansas v. Glover","Only with probable cause","Only at a checkpoint"],"answer":1,"explain":"Absent information that someone else is driving, it's reasonable to infer the owner is driving.","source":"Kansas v. Glover, 589 U.S. ___, 140 S. Ct. 1183 (2020)","verified":"https://www.supremecourt.gov/opinions/19pdf/589us2r21_a7bf.pdf"},{"id":"cl-sc-passenger","type":"scenario","cat":"Which Case Governs?","setup":"On a lawful stop, a rear passenger keeps reaching under a jacket and won't show his hands. You have no reason to think the passenger committed a crime.","q":"Can you order the passenger out and frisk him?","choices":["No: passengers aren't seized","Yes: Maryland v. Wilson (exit) + Arizona v. Johnson (frisk on armed-and-dangerous suspicion)","Only with probable cause","Only with consent"],"answer":1,"explain":"Exit orders to passengers are automatic on a lawful stop. The frisk needs reasonable suspicion the passenger is armed and dangerous.","source":"Arizona v. Johnson, 555 U.S. 323 (2009)","verified":"https://supreme.justia.com/cases/federal/us/555/323"},{"id":"cl-sc-pretext","type":"scenario","cat":"Which Case Governs?","setup":"You suspect smuggling but don't yet have reasonable suspicion. The car then rolls through a stop sign.","q":"Can you stop it for the stop sign?","choices":["Yes: Whren. Objective probable cause of a violation makes the stop valid","No: your real motive is immigration","Only if you tell the driver your real reason","No: Brignoni-Ponce"],"answer":0,"explain":"Subjective motive is irrelevant under the Fourth Amendment if the traffic violation is real. Rodriguez still limits how long you can hold the car.","source":"Whren v. United States, 517 U.S. 806 (1996)","verified":"https://law.justia.com/cases/federal/us/517/806/"},{"id":"cl-sc-bus","type":"scenario","cat":"Which Case Governs?","setup":"On a transportation check you board a bus and ask passengers where they're headed and about their status. You don't block the aisle or hold anyone's documents.","q":"Is each passenger seized?","choices":["Yes: confined space","No: Drayton/Bostick. A reasonable person would feel free to decline","Yes, unless you advise them they can refuse","Only foreign nationals are seized"],"answer":1,"explain":"No advisement of the right to refuse is required. The test is whether a reasonable person would feel free to decline.","source":"United States v. Drayton, 536 U.S. 194 (2002)","verified":"https://www.law.cornell.edu/supremecourt/text/536/194"},{"id":"cl-mc-binding","type":"mc","cat":"Which Case Governs?","q":"Which of these is NOT binding on a federal court in Vermont?","choices":["United States v. Alisigwe","United States v. Cotterman","Tabbaa v. Chertoff","United States v. Brignoni-Ponce"],"answer":1,"explain":"Cotterman is a 9th Circuit case: persuasive only. Vermont is in the 2d Circuit.","source":"28 U.S.C. § 41 (2d Cir. = Connecticut, New York, Vermont); United States v. Cotterman, 709 F.3d 952 (9th Cir. 2013)","verified":"https://www.law.cornell.edu/uscode/text/28/41"},{"id":"cl-mc-removal","type":"mc","cat":"Which Case Governs?","q":"A stop is later found unlawful. In which proceeding is suppression most likely to matter?","choices":["Civil removal hearing","Federal criminal prosecution under § 1326","Neither","Both equally"],"answer":1,"explain":"Lopez-Mendoza: the exclusionary rule generally doesn't apply in civil deportation proceedings. It does apply in criminal cases.","source":"INS v. Lopez-Mendoza, 468 U.S. 1032 (1984)","verified":"https://www.law.cornell.edu/wex/i.n.s._v._lopez-mendoza"},{"id":"cl-oliver","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Oliver v. United States","cite":"466 U.S. 170","year":1984,"back":"Open fields carry no reasonable expectation of privacy and aren't protected by the Fourth Amendment, even behind a locked gate and No Trespassing signs. An entry that is a common-law trespass isn't automatically a Fourth Amendment search.","rule":"Open fields = no Fourth Amendment protection. Curtilage around the home is protected (see Dunn).","field":"Fields and woods beyond the curtilage aren't protected spaces. The house and the area immediately around it are.","why":"Most foot sign is followed across open fields and woods.","source":"Oliver v. United States, 466 U.S. 170 (1984)","verified":"https://chanrobles.com/usa/us_supremecourt/466/170/"},{"id":"cl-dunn","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"United States v. Dunn","cite":"480 U.S. 294","year":1987,"back":"Curtilage is judged by four factors: (1) proximity to the home, (2) whether the area is inside an enclosure surrounding the home, (3) the nature of its use, and (4) steps taken to protect it from view. A barn about 60 yards from the house, outside the fence around the house, was not curtilage.","rule":"Four factors: proximity, enclosure, use, steps taken to shield it.","field":"Before treating an outbuilding as open field, run the four Dunn factors.","why":"Draws the line between a farm's open fields and the protected area around the house.","source":"United States v. Dunn, 480 U.S. 294 (1987)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-480/pdf/USREPORTS-480-294.pdf"},{"id":"cl-berkemer","type":"flip","cat":"Statements","binding":"SCOTUS","front":"Berkemer v. McCarty","cite":"468 U.S. 420","year":1984,"back":"Miranda applies to custodial interrogation regardless of how minor the offense. Ordinary roadside questioning during a traffic stop isn't custody, but once a motorist is subjected to treatment that renders him 'in custody' for practical purposes, the full Miranda protections apply.","rule":"Routine stop questioning = no warnings needed. Custody, even for a minor offense, means warnings.","field":"Watch for the point where the stop becomes custody.","why":"Tells you when roadside questioning stops being free of Miranda.","source":"Berkemer v. McCarty, 468 U.S. 420 (1984)","verified":"https://www.law.cornell.edu/supremecourt/text/468/420"},{"id":"cl-schneckloth","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Schneckloth v. Bustamonte","cite":"412 U.S. 218","year":1973,"back":"For a consent search of someone not in custody, the government must show the consent was voluntary under the totality of the circumstances. Knowing about the right to refuse is a factor but not a requirement.","rule":"Consent = voluntary, judged on totality. No warning of the right to refuse required.","field":"Ask, don't order. Telling someone they can refuse isn't required, but it strengthens voluntariness.","why":"The foundation of every consent search.","source":"Schneckloth v. Bustamonte, 412 U.S. 218 (1973)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-412/pdf/USREPORTS-412-218.pdf"},{"id":"cl-jimeno","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Florida v. Jimeno","cite":"500 U.S. 248","year":1991,"back":"The scope of consent is measured by objective reasonableness: what a typical reasonable person would have understood from the exchange. Consent to search a car for narcotics reasonably covered a closed paper bag on the floor. No container-by-container permission needed.","rule":"Scope of consent = what a reasonable person understood. The object of the search sets the limits.","field":"Say what you're looking for when you ask. That defines which containers you can open.","why":"Keeps a consent search from exceeding its scope.","source":"Florida v. Jimeno, 500 U.S. 248 (1991)","verified":"https://www.law.cornell.edu/supct/html/90-622.ZO.html"},{"id":"cl-gant","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Arizona v. Gant","cite":"556 U.S. 332","year":2009,"back":"Police may search a vehicle's passenger compartment incident to a recent occupant's arrest only if (1) the arrestee is unsecured and could reach it at the time of the search, or (2) it's reasonable to believe evidence of the offense of arrest is in the vehicle.","rule":"Handcuffed in the back of a unit + an offense with no evidence in the car = no search incident to arrest.","field":"For the vehicle, use another basis such as probable cause (Carroll) or consent.","why":"Limits the most common vehicle search after an arrest.","source":"Arizona v. Gant, 556 U.S. 332 (2009)","verified":"https://case-law.vlex.com/vid/556-u-s-332-606040026"},{"id":"cl-long","type":"flip","cat":"Vehicles & Searches","binding":"SCOTUS","front":"Michigan v. Long","cite":"463 U.S. 1032","year":1983,"back":"A protective search of a car's passenger compartment, limited to areas where a weapon may be placed or hidden, is reasonable when officers reasonably believe the suspect is dangerous and could gain immediate control of weapons.","rule":"A Terry frisk extends to the passenger compartment on reasonable belief of danger.","field":"A weapon spotted inside, plus a subject going back to the car, justifies the area frisk.","why":"Officer safety at vehicle stops.","source":"Michigan v. Long, 463 U.S. 1032 (1983)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-463/pdf/USREPORTS-463-1032.pdf"},{"id":"cl-navarette","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Navarette v. California","cite":"572 U.S. 393","year":2014,"back":"A 911 call reporting that a specific truck had just run the caller off the road had enough indicia of reliability to support reasonable suspicion of an ongoing crime such as drunk driving, even if the caller was anonymous. The officer didn't have to personally see more dangerous driving first.","rule":"A specific, contemporaneous, eyewitness 911 report can supply reasonable suspicion. Tips aren't automatically reliable.","field":"Note the caller's specificity (vehicle, plate, location), timing, and the use of 911.","why":"Governs stops built on citizen calls.","source":"Navarette v. California, 572 U.S. 393 (2014)","verified":"https://supreme.justia.com/cases/federal/us/572/12-9490"},{"id":"cl-hiibel","type":"flip","cat":"Stops & Suspicion","binding":"SCOTUS","front":"Hiibel v. Sixth Judicial District Court of Nevada","cite":"542 U.S. 177","year":2004,"back":"A state 'stop and identify' law requiring a person lawfully detained in a Terry stop to state their name doesn't violate the Fourth Amendment, and on those facts didn't violate the Fifth.","rule":"Stop-and-identify statutes are constitutional when tied to a lawful Terry stop.","field":"The duty to give a name comes from a specific state statute (Nevada's here). Hiibel only says such statutes are valid.","why":"Clarifies what you can require during a stop.","source":"Hiibel v. Sixth Judicial Dist. Ct. of Nev., 542 U.S. 177 (2004)","verified":"https://www.chanrobles.com/usa/us_supremecourt/542/177/"},{"id":"cl-riverside","type":"flip","cat":"Statements","binding":"SCOTUS","front":"County of Riverside v. McLaughlin","cite":"500 U.S. 44","year":1991,"back":"Someone arrested without a warrant must generally get a judicial probable-cause determination within 48 hours. Absent extraordinary circumstances, a longer delay violates the Fourth Amendment.","rule":"Warrantless arrest → probable-cause determination by a judge within 48 hours.","field":"On criminal cases, track the clock from arrest. Processing delays count.","why":"Sets the outer limit on holding a criminal arrestee without a judge.","source":"County of Riverside v. McLaughlin, 500 U.S. 44 (1991)","verified":"https://www.law.cornell.edu/supct/html/89-1817.ZS.html"},{"id":"cl-plumhoff","type":"flip","cat":"Force","binding":"SCOTUS","front":"Plumhoff v. Rickard","cite":"572 U.S. 765","year":2014,"back":"Officers didn't violate the Fourth Amendment by using deadly force to end a dangerous high-speed chase (over 100 mph, weaving through traffic), firing 15 shots as the driver kept trying to flee. If a threat continues, officers need not stop shooting until it has ended. They also had qualified immunity.","rule":"Deadly force to end a chase that gravely endangers the public can be reasonable, until the threat ends.","field":"Document the danger and why it was continuing at each point force was used.","why":"With Scott v. Harris, frames force in vehicle pursuits.","source":"Plumhoff v. Rickard, 572 U.S. 765 (2014)","verified":"https://www.law.cornell.edu/supremecourt/text/12-1117"},{"id":"cl-mullenix","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Mullenix v. Luna","cite":"577 U.S. 7","year":2015,"back":"An officer who shot at a fleeing car got qualified immunity. A right is 'clearly established' only if existing precedent put the question beyond debate in the specific context, not at a high level of generality.","rule":"Qualified immunity asks whether specific precedent clearly made this exact conduct unlawful.","field":"Immunity is judged on your specific facts. Your report is where those facts live.","why":"Explains how courts decide whether an officer's conduct was clearly unlawful.","source":"Mullenix v. Luna, 577 U.S. 7 (2015) (per curiam)","verified":"https://law.cornell.edu/supremecourt/text/14-1143"},{"id":"cl-sc-open-field","type":"scenario","cat":"Which Case Governs?","setup":"Fresh sign crosses a posted No Trespassing fence line into a hayfield half a mile from the farmhouse.","q":"Does the Fourth Amendment stop you from following it?","choices":["Yes: posted land is protected","No: Oliver. Open fields aren't protected","Only with consent","Only within 25 miles"],"answer":1,"explain":"Oliver: open fields carry no Fourth Amendment protection, signs or not. Statutory access is a separate question (§ 1357(a)(3), (e)).","source":"Oliver v. United States, 466 U.S. 170 (1984)","verified":"https://chanrobles.com/usa/us_supremecourt/466/170/"},{"id":"cl-sc-barn","type":"scenario","cat":"Which Case Governs?","setup":"Tracks lead to a barn about 60 yards from the farmhouse, outside the fence around the house. Nothing shields it from view.","q":"Which case and test decide whether the barn area is protected curtilage?","choices":["Dunn: four factors (proximity, enclosure, use, screening)","Oliver: everything outside the house is open field","Gant","Riley"],"answer":0,"explain":"Dunn's four factors. On similar facts the Court found the barn area wasn't curtilage.","source":"United States v. Dunn, 480 U.S. 294 (1987)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-480/pdf/USREPORTS-480-294.pdf"},{"id":"cl-sc-gant","type":"scenario","cat":"Which Case Governs?","setup":"You arrest the driver for a § 1324 transporting offense. The driver is handcuffed in the back of your unit.","q":"Can you search the car incident to that arrest?","choices":["Never once the driver is secured","Yes, if it's reasonable to believe evidence of the transporting offense is in the car (Gant)","Only with a warrant","Yes, always"],"answer":1,"explain":"Secured arrestee = no reach-based search, but Gant's evidence prong can apply when evidence of the offense of arrest may be inside.","source":"Arizona v. Gant, 556 U.S. 332 (2009)","verified":"https://case-law.vlex.com/vid/556-u-s-332-606040026"},{"id":"cl-sc-consent-scope","type":"scenario","cat":"Which Case Governs?","setup":"You ask, 'Can I search the car for anyone hiding or any IDs?' The driver says 'Sure.' There's a locked hard-shell case in the trunk.","q":"What controls whether you can force it open?","choices":["Jimeno: objective scope. A reasonable person wouldn't read 'sure' as permission to break a locked case","Schneckloth: any consent covers everything","Carroll","Martinez-Fuerte"],"answer":0,"explain":"Scope is what a reasonable person understood. Forcing open a locked case is likely beyond a general consent. Ask specifically or get another basis.","source":"Florida v. Jimeno, 500 U.S. 248 (1991)","verified":"https://www.law.cornell.edu/supct/html/90-622.ZO.html"},{"id":"cl-sc-911","type":"scenario","cat":"Which Case Governs?","setup":"A 911 caller reports that a specific pickup (color, plate, direction) just ran her off the road. You find it minutes later driving normally.","q":"Can you stop it?","choices":["No: you must see bad driving yourself","Yes: Navarette. A specific, contemporaneous 911 report can supply reasonable suspicion","Only with probable cause","Only if the caller gives her name"],"answer":1,"explain":"Detailed, contemporaneous eyewitness report through 911. The officer didn't have to wait to see more.","source":"Navarette v. California, 572 U.S. 393 (2014)","verified":"https://supreme.justia.com/cases/federal/us/572/12-9490"},{"id":"cl-sc-custody","type":"scenario","cat":"Which Case Governs?","setup":"Roadside, you ask the driver a few questions about the trip. Later the driver is handcuffed and placed in the unit, and you start asking about the crossing.","q":"When do Miranda warnings first become required?","choices":["Before the first roadside question","Once the driver is in custody and you question about the crime","Never for immigration matters","Only at the station"],"answer":1,"explain":"Berkemer: ordinary roadside questioning isn't custody. Handcuffed in the unit is. Warn before interrogating.","source":"Berkemer v. McCarty, 468 U.S. 420 (1984)","verified":"https://www.law.cornell.edu/supremecourt/text/468/420"}]},{"meta":{"id":"force","name":"Use of Force","short":"UOF","color":"#B07A9E","order":5,"requireVerified":true,"blurb":"Graham factors, Garner, the regulation, and published CBP/DHS policy.","subModes":["browse"]},"categories":{"Constitutional Standard":{"why":"Courts judge every use of force against this standard."},"Policy":{"why":"Policy can be stricter than the Constitution, and you are held to both."},"Scenarios":{"why":"Applying the standard under stress is the skill being tested."}},"cards":[{"id":"uf-graham-order","type":"order","cat":"Constitutional Standard","binding":"SCOTUS","q":"Graham v. Connor: put the three factors in the order the Court listed them.","steps":["Severity of the crime at issue","Whether the suspect poses an immediate threat to the safety of officers or others","Whether the suspect is actively resisting arrest or attempting to evade arrest by flight"],"explain":"Severity → immediate threat → resisting or evading, judged from the view of a reasonable officer on the scene.","why":"Your report should address each factor.","source":"Graham v. Connor, 490 U.S. 386 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"uf-graham-perspective","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Under Graham, from whose perspective is the reasonableness of force judged?","choices":["The subject's","A reasonable officer on the scene, without 20/20 hindsight","The reviewing judge with all facts later learned","The officer's own good-faith intent"],"answer":1,"explain":"Objective test, at the moment, allowing for split-second decisions. The officer's intent, good or bad, is irrelevant.","why":"Write what you perceived at the time, not what you learned afterward.","source":"Graham v. Connor, 490 U.S. 386 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"uf-garner","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Tennessee v. Garner: deadly force to stop a fleeing suspect is allowed only when the officer has probable cause to believe the suspect…","choices":["committed any felony","poses a significant threat of death or serious physical injury to the officer or others","is likely to escape","refuses lawful commands"],"answer":1,"explain":"Flight alone, even from a felony, is not enough.","why":"The constitutional floor for deadly force on a fleeing subject.","source":"Tennessee v. Garner, 471 U.S. 1 (1985)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"uf-barnes","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"After Barnes v. Felix (2025), a court reviewing a shooting may consider…","choices":["Only the final seconds before the shot","The totality of the circumstances, including events leading up to the threat","Only the officer's stated reasons","Only what the subject knew"],"answer":1,"explain":"The Court unanimously rejected the 'moment of the threat' test.","flag":"The 2d Circuit had used the narrower moment-of-threat approach. Barnes overrides it.","why":"Your tactics before the critical moment are part of the review.","source":"Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://en.wikipedia.org/wiki/Barnes_v._Felix"},{"id":"uf-scott","type":"flip","cat":"Constitutional Standard","binding":"SCOTUS","front":"Ending a dangerous vehicle flight with force — the test","back":"Scott v. Harris: weigh the risk the force creates for the fleeing driver against the actual and imminent threat the driver's reckless flight poses to others, considering the number of lives at risk and the relative culpability of the parties.","why":"The framework for pursuits and vehicle interventions.","source":"Scott v. Harris, 550 U.S. 372 (2007)","verified":"https://law.justia.com/cases/federal/us/550/372/"},{"id":"uf-287-nondeadly","type":"flip","cat":"Constitutional Standard","binding":"regulation","front":"8 C.F.R. 287.8(a): when may you move up to a higher level of non-deadly force?","back":"Only when warranted by the subject's actions, apparent intentions, and apparent capabilities. Always use the minimum non-deadly force necessary to accomplish the mission.","why":"The regulation adds a 'minimum necessary' rule on top of Graham.","source":"8 C.F.R. § 287.8(a)(1)","verified":"https://chanrobles.com/usa/uslaws/cfr/title08/8-1.0.1.2.57.0.1.8.php"},{"id":"uf-cbp-standard","type":"flip","cat":"Policy","binding":"policy","front":"CBP Use of Force Policy (2021): the general standard","back":"Officers and agents shall use only the force that is objectively reasonable to effectively bring an incident under control, while protecting the life of the officer/agent or others.","why":"CBP's own baseline, which tracks Graham.","flag":"Confirm against the current version issued to you. This is the publicly posted 2021 text.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-deadly","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: when is deadly force 'necessary'?","back":"When the officer/agent has a reasonable belief that the subject poses an imminent danger of death or serious bodily injury to the officer/agent or to another person.","why":"The policy deadly-force trigger.","flag":"Confirm against the current version issued to you.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-escape","type":"mc","cat":"Policy","binding":"policy","q":"CBP/DHS policy: may deadly force be used solely to prevent the escape of a fleeing subject?","choices":["Yes, if the subject is a felon","No","Yes, after a verbal warning","Only near the border"],"answer":1,"explain":"\"Deadly force shall not be used solely to prevent the escape of a fleeing subject.\" A fleeing subject who poses a significant threat of death or serious harm is a different analysis (Garner).","why":"Policy and Garner point the same way.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021); DHS Policy Statement 044-05","verified":"https://www.justsecurity.org/128498/dhs-doj-cbp-policy-force-vehicles/"},{"id":"uf-cbp-deesc","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: de-escalation","back":"When it is feasible and safe to do so, use de-escalation tactics and techniques to minimize the likelihood of needing force, or to minimize the force used.","why":"Expected whenever time and distance allow, and reviewed afterward.","flag":"Confirm against the current version issued to you.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-intervene","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: another agent is using clearly improper force","back":"The 2021 policy contains a duty to intervene in, and report, improper use of force.","why":"Silence carries its own exposure.","flag":"Confirm the exact wording and reporting chain in your current policy.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-dhs-choke","type":"mc","cat":"Policy","binding":"policy","q":"DHS Policy 044-05 Rev. 01 (2023): chokeholds and carotid restraints are…","choices":["Allowed at any level of resistance","Prohibited unless deadly force is otherwise authorized","Allowed if the subject is resisting","Prohibited in all circumstances"],"answer":1,"explain":"Prohibited unless the legal standard for deadly force is met.","flag":"DHS 044-05 Rev. 01 (Feb. 2023) status after 2025 is unclear in public sources. Confirm the policy currently in force.","why":"A department-wide rule that sits on top of CBP policy.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-dhs-aid","type":"flip","cat":"Policy","binding":"policy","front":"DHS 2023 policy: after you use force and someone is injured","back":"There is an affirmative duty to request and/or render medical aid.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"Aid after force is a policy duty, not a courtesy."
