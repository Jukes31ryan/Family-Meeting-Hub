nn, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 74","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-head","type":"flip","cat":"Sign","front":"Toe twisted to the right in a print","back":"The person probably turned their head to the left. Head left = toe twists right; head right = toe twists left.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 74","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-snow","type":"flip","cat":"Sign","front":"Sign in frost and snow","back":"Look for flattening, brushed frost and fresh melt. Older prints, snow hummocks and tire ruts leave bumps that catch new sign on top, especially at turns and junctions.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 72–74","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-water","type":"flip","cat":"Sign","front":"Tracking through water","back":"Check slippery or overturned stones, splash and slide marks, and mud on rocks. Eddies and still water keep sign longer. A mud cloud from a fresh step lasts from seconds up to about a quarter hour.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 76–78","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-stride-terrain","type":"flip","cat":"Following Sign","front":"What changes stride length?","back":"Pace (walking vs. running), slope (longer downhill, shorter uphill), and a heavy load or exhaustion (shorter).","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-measure-mc","type":"mc","cat":"Following Sign","q":"Mostly heel marks are showing. How do you measure stride?","choices":["Toe to toe","Heel to heel","Toe to heel","Don't measure"],"answer":1,"explain":"Toe to heel is the usual choice. Use heel to heel when mostly heels show, toe to toe when mostly toes show, and write down which one you used.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22–24","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-leftright","type":"flip","cat":"Following Sign","front":"Recording left or right foot","back":"Draw a short line on the outside of the heel, to the left or right. A print is a mirror image of the sole.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22–23","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-partial","type":"flip","cat":"Following Sign","front":"You only have partial prints","back":"Combine several partials like a puzzle to build the sole pattern. Measure sole length from several prints and note any wear, like a worn heel. Wear has matched prints to a suspect.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22–26","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-count-mc","type":"mc","cat":"Following Sign","q":"Best way to count how many people are in a group?","choices":["Count prints in one stride and divide by two","Find where they spread out, rest, sit or bunch at a hilltop and count individuals","Guess from depth of prints","Ask dispatch"],"answer":1,"explain":"The divide-by-two method is inaccurate. Count where people spread out: breaks, rest spots, the top or bottom of a hill.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 27","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-start","type":"order","cat":"Team & Scene","q":"Starting a track from the place last seen. Put it in order.","steps":["Secure the area and the likely routes out","Cut for sign at track traps first (vehicle door, doorways, trail entries)","Mark and secure the sign","Identify the sector","Start tracking, walking beside the sign"],"explain":"Find and protect the sign before anyone else walks the area.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 30","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-gate","type":"flip","cat":"Following Sign","front":"“Closing the gate”","back":"Confirming sector and direction 1–2 km out by cutting track traps, to contain the area before pushing further.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 30–31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-deadzone","type":"flip","cat":"Following Sign","front":"Sign runs into open ground (a dead zone)","back":"Don't cross it unless you have to. Circle around to track traps on the far side and pick the sign up again.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-norun","type":"mc","cat":"Following Sign","q":"When should a tracker run?","choices":["Whenever the sign is fresh","Only to cut off the subject or reach a perimeter point, never on the sign","On easy ground","Never"],"answer":1,"explain":"Running on the sign risks walking into an ambush and overrunning it.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-backtrack","type":"flip","cat":"Following Sign","front":"Why backtrack?","back":"People are less careful about their sign on the way in. Backtracking can lead to their vehicle, camp or lay-up spot, and more evidence.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 36, 42","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-tt-primary","type":"flip","cat":"Following Sign","front":"Primary (major) track traps","back":"Steep slopes, crossings, dry stream beds, embankments, sand, stream and mud banks, grass and broadleaf plants, water holes, ditches and dusty roads, fields, road cuts, man-made barriers.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 60–62","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-tt-secondary","type":"flip","cat":"Following Sign","front":"Secondary (minor) track traps and prime sign areas","back":"Funnels and steep sections, roadside debris, junctions. Prime sign areas: doors, gates and entry points.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 64","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-tt-keep","type":"flip","cat":"Following Sign","front":"Keeping track traps useful","back":"Maintain them (rake roads and stream beds) and don't patrol across natural ones like stream banks or tall grass, so new sign stands out.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 59","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-contam-who","type":"mc","cat":"Team & Scene","q":"According to the guide, what destroys the most sign?","choices":["Rain","Wind","People: bystanders, staff, colleagues, and yourself","Animals"],"answer":2,"explain":"The biggest challenge isn't weather or a lack of sign. It's people walking on it. Vehicles are second.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 34, 48","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-park","type":"mc","cat":"Team & Scene","q":"You're driving up to a scene. Where do you stop?","choices":["Right at the scene","At least 100 m away, and just stop: don't turn around","Anywhere on the road","Wherever there's room to turn"],"answer":1,"explain":"Turning around or driving in can wipe out the only track trap nearby and the sign leaving the scene.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 34, 48","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-entry-sc","type":"scenario","cat":"Team & Scene","setup":"You need one way in and out of a scene. There's an obvious trail leading straight to it.","q":"Where do you put the entry?","choices":["On the obvious trail, it's easiest","On an “unnatural” route where you can clearly see your own prints","Anywhere, as long as it's one route","Let everyone pick their own"],"answer":1,"explain":"The natural route is where the subject probably walked. Put your single entry and exit where your own sign will show, and mark it with tape or a dragged stick.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 34, 44","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-outside","type":"flip","cat":"Team & Scene","front":"Inner scene vs. outside it","back":"The inner scene won't change fast. Sign outside it, in the track traps leading away, disappears quickly. Secure at least a 100 m radius and check those track traps.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 34, 48","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-first2","type":"flip","cat":"Why Track","front":"The first two things you estimate in any search","back":"Time elapsed and the subject's likely speed. Together they set the radius of the search.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 14","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-double","type":"flip","cat":"Why Track","front":"How fast does the search area grow?","back":"Rule of thumb: a subject on foot doubles the search area about every 15 minutes (at least every hour) when direction is unknown. Expand the perimeter every 15–60 minutes.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 15","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-sector4","type":"flip","cat":"Why Track","front":"What does finding the general sector buy you?","back":"Rule of thumb: identifying the general sector (say, northeast) by a tracker cuts the search area, time and people needed by a factor of about 4.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 15","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-cordon-mc","type":"mc","cat":"Why Track","q":"In which ring is establishing the sector crucial because you're searching the full range?","choices":["Point search","Inner cordon","Middle cordon","Outer cordon"],"answer":3,"explain":"Point search: local, 100% coverage. Inner: ~95% intensity, sector preferred. Middle: ~50%, sector necessary. Outer: maximum distance, sector crucial.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 16","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-speed-light","type":"mc","cat":"Why Track","q":"Roughly how fast does someone with light gear walk on an open, flat trail?","choices":["1–2 km/h","4–6 km/h","8–12 km/h","15–20 km/h"],"answer":1,"explain":"Light gear on an open flat trail: 4–6 km/h. Running: 8–12. Heavily loaded or at night on difficult ground: 2–3.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 15","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-speed-bush","type":"mc","cat":"Why Track","q":"Light gear, through bush or forest on rugged terrain. Rough speed?","choices":["About 2 km/h","About 5 km/h","About 8 km/h","Under 0.5 km/h"],"answer":0,"explain":"About 2 km/h; 4–5 running; 1–2 heavily loaded; about 1 at night with no load.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 15","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-speed-sign","type":"flip","cat":"Why Track","front":"Estimating speed from the sign","back":"Besides terrain tables, read it from stride length, the sign itself and what you know about the subject.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 15","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-senses","type":"flip","cat":"Why Track","front":"What does a tracker use besides eyes?","back":"Mostly visual sign, but also smell, touch (fingertips), other signs in nature, and predicting where the subject will go.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 6","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-aging-train","type":"flip","cat":"Sign","front":"How do you learn to age sign?","back":"Make sign and revisit it at 1, 2 and 4 days old on different ground. Compare changes along the sign line and within single prints.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 12","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-scat","type":"flip","cat":"Sign","front":"Aging from human waste","back":"Feces quickly form a dry outer shell (faster in dry climates). Strong smell fades after 1–2 days but returns if the shell is broken. Insects are most active in the first 1–3 days.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 38","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-hardground","type":"flip","cat":"Lost Sign","front":"Ground where sign is hardest to relocate","back":"Hard gravel, roads, railroads, water, and contaminated areas like villages and trails. Cut the sides and track traps for the exit.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 9, 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-stick-any","type":"flip","cat":"Following Sign","front":"What can serve as a tracking stick?","back":"Any stick cut to length, a measuring tape or ruler, your forearm, or a long gun.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-nextsign","type":"flip","cat":"Following Sign","front":"Nothing at the tip of your stick","back":"Study the last print closely for a change of direction or a jump, then cut around in loops using track traps.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-protect-print","type":"flip","cat":"Following Sign","front":"Protecting a key print","back":"Ring it or stick a marker next to it so you and others don't step on it. Photograph it and also draw it, with measurements.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22–23","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-angle","type":"flip","cat":"Following Sign","front":"Besides sole length, what do you record?","back":"Foot angle, stride length measured in several spots, and how you measured it (toe to heel, heel to heel or toe to toe). Stride is information, not just a way to find the next print.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 22–23","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-first3","type":"order","cat":"Following Sign","q":"Once you're on the sign, what do you work out? Put it in the guide's order.","steps":["Direction and sector","Speed","Age of the sign","Other intel: print details, arms, activity, number, mindset and condition"],"explain":"Direction first. It shrinks the search more than anything else.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-oldscene","type":"flip","cat":"Following Sign","front":"The start point is trampled or the sign is too old","back":"Go step-by-step if you can. Otherwise cut track traps along the most likely escape route, and pick up the most likely sign further out. Keep marking partial prints.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-perp","type":"flip","cat":"Lost Sign","front":"How to move when circling for lost sign","back":"As close to perpendicular to the expected track as you can, stepping only where your own prints would clearly show.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-routes","type":"flip","cat":"Following Sign","front":"Where to expect the subject to go","back":"Natural travel routes and funneling terrain, and rugged spots where they might hide.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-scene-detail","type":"flip","cat":"Team & Scene","front":"Tracking inside a scene","back":"Slow down and get detailed. The order of prints, pressure points and twists tell you what happened, which way people moved, even where they looked.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 36","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-scene-check","type":"flip","cat":"Team & Scene","front":"Extra places to check at a scene","back":"Where a vehicle was parked (doors, sides, back), the shade at the time of the event, and any spot you'd have picked as an observation post overlooking it.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 50","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-scene-keep","type":"flip","cat":"Team & Scene","front":"When do you release a scene?","back":"Keep it taped off for a long while. You'll often need to come back for more after you thought you were done.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 34","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-cut-where","type":"flip","cat":"Following Sign","front":"Where to cut for sign","back":"Along roads, trails, natural track traps and natural lines in the landscape. Don't cut only where sign is very hard to see; you'll miss it.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 51","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost-stop","type":"mc","cat":"Lost Sign","q":"You realize you've lost the sign. What's the very first thing you do?","choices":["Speed up to the next track trap","STOP","Call it in and wait","Guess the most likely direction"],"answer":1,"explain":"Stop first, so you don't trample sign ahead. Then back up to the last sure print.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost-back-mc","type":"mc","cat":"Lost Sign","q":"After you stop, how far back does the guide say to go?","choices":["1–2 m","5–30 m, to the last certain track","100 m","All the way to the start point"],"answer":1,"explain":"Go back 5–30 m to the last print you're certain of, then look for the likely route of travel from there.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost-confirm","type":"flip","cat":"Lost Sign","front":"You found sign again. Before moving on?","back":"Confirm it's fresh and belongs to your subject, then continue. Re-confirm the sign line as often as you can.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 30, 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost-retry","type":"flip","cat":"Lost Sign","front":"Cutting around didn't find it","back":"Go back to the last positive, marked print and try again. If you have to, go step-by-step from there.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 32","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost-why","type":"flip","cat":"Lost Sign","front":"Common reasons the sign is lost","back":"Hard or contaminated ground, water, counter-tracking, or an eager tracker overshooting. Speed and jumping ahead to track traps can cost you the line, so confirm often.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 11, 30","verified":"https://bibsok.no/?tnr=387081"}]},{"meta":{"id":"visas","name":"Visas & Entry Docs","short":"VISA","color":"#C9B37E","order":7,"requireVerified":true,"reverseFlip":true,"reverseAsk":"Which visa or document is this?","reverseMatch":"^(?!Rule: )","blurb":"Visa classes and entry documents an agent actually runs into, and what each one allows.","subModes":["browse"]},"categories":{"Visitors":{"why":"Visitors are the most common nonimmigrants you'll meet, and the most common to drift out of status."},"Canada & Mexico":{"why":"Canadians and Mexicans enter under rules that differ from everyone else's."},"Workers":{"why":"Most work classes are tied to one employer and one job. Work outside that is a status violation."},"Students & Exchange":{"why":"Students and exchange visitors are tracked by program, not just by a date."},"Family & Fiancé":{"why":"K and V holders are on a path to a green card, with short and strict windows."},"Humanitarian & Law Enforcement":{"why":"These statuses protect victims and witnesses, or let people in without an admission."},"Status Documents":{"why":"The document in hand tells you the status claimed. Know what each one proves and what it doesn't."},"Is This Person in Status?":{"why":"In the field you start with facts, not a class code."}},"cards":[{"id":"vi-b1","type":"flip","cat":"Visitors","binding":"statute","front":"B-1","back":"Temporary visitor for business. Can consult with business associates, negotiate contracts and attend conventions or meetings. Can't take local employment, and pay may not come from a U.S. source.","note":"The visitor must keep a residence abroad they don't intend to abandon (8 U.S.C. 1101(a)(15)(B)).","why":"\"Business\" isn't \"work\". A paid U.S. job is out of status.","source":"8 U.S.C. § 1101(a)(15)(B); USCIS B-1 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-visitors-for-business/b-1-temporary-business-visitor"},{"id":"vi-b2","type":"flip","cat":"Visitors","binding":"statute","front":"B-2","back":"Temporary visitor for pleasure: tourism, visiting friends or relatives, medical treatment and similar. No employment of any kind.","note":"State: a visitor \"is not permitted to accept employment or work in the United States.\"","why":"A tourist with a job is out of status.","source":"8 U.S.C. § 1101(a)(15)(B); travel.state.gov Visitor Visa","verified":"https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html"},{"id":"vi-b1b2","type":"flip","cat":"Visitors","binding":"regulation","front":"B-1/B-2","back":"The combined visitor visa most consulates issue, covering both business and pleasure. Admission is up to one year. CBP sets the actual admit-until date, and an extension (Form I-539) may add up to six months at a time.","note":"Admission rule quoted in a 2010 CBP memo (secondary copy). Check the I-94 for the real date.","why":"The visa can last 10 years while the stay is months. The I-94 date controls.","source":"8 C.F.R. § 214.2(b)(1)","verified":"https://aila.org/aila-files/28B9ACD5-8EC9-4671-B1B8-969F80899FDE/18120735.pdf"},{"id":"vi-bcc","type":"flip","cat":"Visitors","binding":"regulation","front":"Border Crossing Card (DSP-150)","back":"Card for citizens and residents of Mexico that is both a border pass and a B-1/B-2 visa, usually valid 10 years. Without an I-94, the holder may stay up to 30 days within 25 miles of the Mexican border (75 in Arizona; in New Mexico, 55 miles or south of I-10, whichever is farther north). Going farther or staying longer needs an I-94.","note":"Under 9 FAM 302.1, the card isn't a visa per se, so it isn't voided by an overstay under INA 222(g).","flag":"The zone limits are set by regulation and have changed (30 days in 2004, New Mexico in 2013). Confirm current 8 C.F.R. 235.1(h).","why":"Location and time limits are conditions of entry. Outside them, the holder is out of status.","source":"8 C.F.R. § 235.1(h); 78 Fed. Reg. 35103 (2013)","verified":"https://www.cbp.gov/newsroom/national-media-release/border-crossers-new-mexico-can-now-travel-further-without-i-94"},{"id":"vi-vwp","type":"flip","cat":"Visitors","binding":"statute","front":"Visa Waiver Program (ESTA)","back":"Nationals of participating countries can visit for business or tourism for 90 days or less without a visa, after online travel authorization (usually valid 2 years). No extension of stay, no change of status. Entrants waive any right to contest removal, except by applying for asylum.","note":"An overstay ends eligibility. Future trips need a visa.","why":"An overstayer under this program gets no removal hearing beyond an asylum claim.","source":"8 U.S.C. § 1187; CBP VWP/ESTA FAQ","verified":"https://www.cbp.gov/travel/international-visitors/esta/frequently-asked-questions-about-visa-waiver-program-vwp-and-electronic-system-travel"},{"id":"vi-c1d","type":"flip","cat":"Visitors","binding":"policy","front":"C-1 and D (C-1/D)","back":"Transit and crewmember classes. The first covers passing through the U.S., for example to join a ship. The second covers crew of commercial vessels or international airlines who will leave on a vessel within 29 days. Combined, the stay can't exceed 29 days.","note":"Lightering crews use C-4/D-3, up to 180 days (State, 2024).","why":"A crewmember found inland, away from the vessel, is a status question.","source":"8 U.S.C. § 1101(a)(15)(C), (D); travel.state.gov Crewmember Visa","verified":"https://travel.state.gov/content/travel/en/us-visas/other-visa-categories/crewmember-visa.html"},{"id":"vi-vwp-mc","type":"mc","cat":"Visitors","binding":"statute","q":"A Visa Waiver Program entrant overstays. What may they contest removal on?","choices":["Anything, before an immigration judge","Only an application for asylum","Nothing at all","Only a change of status to B-2"],"answer":1,"explain":"8 U.S.C. 1187(b): the entrant waives the right to contest removal other than on the basis of an asylum application. The Third Circuit called this condition \"ironclad\".","why":"VWP overstays are handled differently from visa overstays.","source":"8 U.S.C. § 1187(b)","verified":"https://www2.ca3.uscourts.gov/opinarch/084184p.pdf"},{"id":"vi-ca-rule","type":"flip","cat":"Canada & Mexico","binding":"regulation","front":"Rule: Canadians and visas (8 C.F.R. 212.1(a))","back":"A visa is generally not required for Canadian citizens entering as nonimmigrants, except those in classes E, K, S or V. A valid passport is still required unless the person uses another accepted document, such as NEXUS, FAST or an enhanced driver's license.","why":"A Canadian with no visa is normal. A Canadian claiming E or K status should have one.","source":"8 C.F.R. § 212.1(a)(1)","verified":"https://www.law.cornell.edu/cfr/text/8/212.1"},{"id":"vi-ca-visitor","type":"flip","cat":"Canada & Mexico","binding":"policy","front":"Canadian visitor (B status, no visa)","back":"A Canadian citizen coming for tourism, visits or temporary business. Admitted as a B-1 or B-2 visitor without a visa. Most Canadian visitors at land crossings get no I-94. The same no-work rules apply as for any visitor.","why":"No visa and no I-94 doesn't mean no status rules.","source":"travel.state.gov Visitor Visa; CBP I-94 page","verified":"https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html"},{"id":"vi-tn","type":"flip","cat":"Canada & Mexico","binding":"regulation","front":"TN","back":"USMCA professional from Canada or Mexico, in a profession on the USMCA list, working for a U.S. employer. Canadians can apply at a designated port of entry with no visa. Mexicans need a visa from a consulate. Admitted in increments of up to 3 years, with no cap on renewals as long as the stay stays temporary.","note":"Permanent residents of Canada who aren't citizens don't qualify.","why":"Common on the northern border. Tied to the employer and job the officer approved.","source":"8 C.F.R. § 214.6; USCIS TN page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/tn-usmca-professionals"},{"id":"vi-td","type":"flip","cat":"Canada & Mexico","binding":"policy","front":"TD","back":"Spouse or unmarried child under 21 of a USMCA professional. May attend school full-time. May not work. Status lasts no longer than the principal's. The dependent doesn't have to be Canadian or Mexican, but a non-Canadian dependent needs a visa.","why":"A dependent working is out of status.","source":"USCIS Policy Manual, Vol. 2, Part P, Ch. 5","verified":"https://www.uscis.gov/policy-manual/volume-2-part-p-chapter-5"},{"id":"vi-edl","type":"flip","cat":"Canada & Mexico","binding":"policy","front":"Enhanced driver's license (EDL)","back":"State- or province-issued license that also shows identity and citizenship, with an RFID chip that points to a CBP record and stores no personal data. Accepted for land and sea entry from Canada, Mexico, Bermuda and the Caribbean at any port. Not valid for international air travel.","note":"CBP lists Michigan, Minnesota, New York, Vermont and Washington as issuing states. Check the current list.","why":"An EDL is evidence of citizenship, not only a driving permit.","source":"CBP WHTI FAQ","verified":"https://www.cbp.gov/travel/us-citizens/western-hemisphere-travel-initiative/faqs"},{"id":"vi-nexus","type":"flip","cat":"Canada & Mexico","binding":"policy","front":"NEXUS / FAST card","back":"Joint U.S.–Canada trusted traveler cards. One is for pre-approved low-risk travelers; the other is for pre-approved commercial truck drivers. Both are vetted by both countries and are accepted travel documents at the land border.","why":"Membership means prior vetting. It isn't a status or a work authorization.","source":"CBP Trusted Traveler Programs","verified":"https://www.cbp.gov/travel/trusted-traveler-programs"},{"id":"vi-whti","type":"flip","cat":"Canada & Mexico","binding":"regulation","front":"Rule: WHTI documents at the land border","back":"Since June 1, 2009, U.S. and Canadian citizens entering by land or sea need a passport or another accepted document: U.S. passport card, enhanced driver's license, or trusted traveler card (NEXUS, FAST, SENTRI). U.S. and Canadian citizen children under 16 arriving by land or sea may show a birth certificate or other proof of citizenship.","why":"Knowing the accepted documents helps you judge a citizenship claim.","source":"73 Fed. Reg. 18384 (Apr. 3, 2008); CBP WHTI FAQ","verified":"https://www.cbp.gov/travel/us-citizens/western-hemisphere-travel-initiative/faqs"},{"id":"vi-register","type":"flip","cat":"Canada & Mexico","binding":"regulation","front":"Rule: registration for Canadian stays of 30 days or more","back":"Canadians admitted visa-exempt at land crossings without an I-94 must register (Form G-325R) if they'll stay 30 days or more in one visit. The interim rule took effect April 11, 2025 and was adopted as final in June 2026.","flag":"This changed recently or is in litigation. Confirm current policy before relying on it.","why":"Long-staying Canadian visitors now have a registration duty.","source":"USCIS Alien Registration Requirement; 91 Fed. Reg. 39248 (June 29, 2026)","verified":"https://www.uscis.gov/alienregistration"},{"id":"vi-ca-mc","type":"mc","cat":"Canada & Mexico","binding":"regulation","q":"A Canadian citizen generally needs a visa for which group of classes?","choices":["B, TN, F","E, K, S, V","H, L, O","All work classes"],"answer":1,"explain":"212.1(a)(1): visa generally not required for Canadian citizens, except classes E, K, S or V.","why":"A Canadian claiming E or K status with no visa should get a closer look.","source":"8 C.F.R. § 212.1(a)(1)","verified":"https://www.law.cornell.edu/cfr/text/8/212.1"},{"id":"vi-h1b","type":"flip","cat":"Workers","binding":"statute","front":"H-1B","back":"Worker in a specialty occupation that generally needs at least a bachelor's degree in a specific field. Employer-sponsored, with a Department of Labor labor condition application. Admitted up to 3 years at a time, 6 years total, with limited extensions past 6 tied to a green card case.","note":"Can start with a new employer once that employer properly files a new petition (portability).","why":"The most common professional work class.","source":"8 U.S.C. §§ 1101(a)(15)(H)(i)(b), 1184(g)(4); USCIS H-1B page","verified":"https://www.uscis.gov/working-in-the-united-states/h-1b-specialty-occupations"},{"id":"vi-h2a","type":"flip","cat":"Workers","binding":"regulation","front":"H-2A","back":"Temporary or seasonal agricultural worker. Employer needs a Department of Labor temporary labor certification. Status is tied to the petitioning employer. Maximum stay 3 years, then an absence of at least 60 days resets the clock.","note":"The employer must notify DHS within 2 workdays if a worker absconds (5 consecutive workdays absent without consent) or is terminated early.","flag":"The H-2 modernization rule (effective Jan. 17, 2025) changed the reset rule and added grace periods. Confirm current text.","why":"Farm workers are common in rural border areas. Leaving the employer affects status.","source":"8 U.S.C. § 1101(a)(15)(H)(ii)(a); 8 C.F.R. § 214.2(h)(5)","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-2a-temporary-agricultural-workers"},{"id":"vi-h2b","type":"flip","cat":"Workers","binding":"regulation","front":"H-2B","back":"Temporary non-agricultural worker. The employer's need must be temporary: one-time occurrence, seasonal, peakload or intermittent, generally one year or less. Needs DOL labor certification and is subject to an annual cap. Maximum stay generally 3 years.","note":"Typical industries include landscaping, hospitality, seafood and construction.","why":"Seasonal resort and hospitality workers often hold this class.","source":"8 U.S.C. § 1101(a)(15)(H)(ii)(b); 8 C.F.R. § 214.2(h)(6)","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-2b-non-agricultural-workers/guidance-on-temporary-need-in-h-2b-petitions"},{"id":"vi-l1a","type":"flip","cat":"Workers","binding":"regulation","front":"L-1A","back":"Intracompany transferee coming as a manager or executive to a U.S. branch, parent, affiliate or subsidiary. Must have worked abroad for the company for one continuous year in the prior three. Initial stay 3 years (1 year for a new office), extensions of 2 years, maximum 7 years.","why":"Know which L is which; the limits differ.","source":"8 C.F.R. § 214.2(l); USCIS L-1A page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/l-1a-intracompany-transferee-executive-or-manager"},{"id":"vi-l1b","type":"flip","cat":"Workers","binding":"regulation","front":"L-1B","back":"Intracompany transferee with specialized knowledge of the company's products, processes or procedures. Same one-year-abroad requirement. Initial stay up to 3 years, extensions of 2 years, maximum 5 years.","why":"Know which L is which; the limits differ.","source":"8 C.F.R. § 214.2(l); USCIS L-1B page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/l-1b-intracompany-transferee-specialized-knowledge"},{"id":"vi-o1","type":"flip","cat":"Workers","binding":"regulation","front":"O-1","back":"Person with extraordinary ability in the sciences, arts, education, business or athletics, or extraordinary achievement in film or TV. Initial approval up to 3 years, then extensions of up to 1 year to continue the same event or activity. No overall limit.","why":"Petition-based. Tied to the event or activity approved.","source":"8 U.S.C. § 1101(a)(15)(O); USCIS O-1 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/o-1-visa-individuals-with-extraordinary-ability-or-achievement"},{"id":"vi-p","type":"flip","cat":"Workers","binding":"regulation","front":"P-1 / P-2 / P-3","back":"Performer classes: (1) internationally recognized athletes and entertainment groups; (2) artists or entertainers in a reciprocal exchange program; (3) artists or entertainers in a culturally unique program.","why":"Touring athletes and performers cross often. Status covers the approved events.","source":"8 U.S.C. § 1101(a)(15)(P); USCIS Policy Manual, Vol. 2, Part N","verified":"https://www.uscis.gov/policy-manual/volume-2-part-n-chapter-4"},{"id":"vi-r1","type":"flip","cat":"Workers","binding":"regulation","front":"R-1","back":"Religious worker (minister or religious vocation or occupation) for a bona fide nonprofit religious organization, at least 20 hours a week on average. Must have been a member of the denomination for 2 years. Initial stay up to 30 months, maximum 5 years total.","flag":"DHS dropped the 1-year-abroad requirement after reaching 5 years, effective Jan. 16, 2026. Confirm current rule.","why":"Know who's covered and the 5-year limit.","source":"8 C.F.R. § 214.2(r); USCIS R-1 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/r-1-nonimmigrant-religious-workers"},{"id":"vi-e1","type":"flip","cat":"Workers","binding":"regulation","front":"E-1","back":"Treaty trader: national of a treaty country carrying on substantial trade, mainly between the U.S. and that country. Initial stay up to 2 years, extensions of up to 2 years, no limit on extensions. Must intend to leave when status ends.","note":"Canadians need a visa for this class.","why":"Treaty classes don't need a labor certification and can last a long time.","source":"8 U.S.C. § 1101(a)(15)(E)(i); USCIS E-1 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-1-treaty-traders"},{"id":"vi-e2","type":"flip","cat":"Workers","binding":"regulation","front":"E-2","back":"Treaty investor: national of a treaty country who has invested, or is actively investing, a substantial amount in a U.S. business to develop and direct it. Initial stay up to 2 years, extensions of up to 2 years, no limit on extensions.","note":"Canadians need a visa for this class.","why":"Common for Canadian small-business owners in the U.S.","source":"8 U.S.C. § 1101(a)(15)(E)(ii); USCIS E-2 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-2-treaty-investors"},{"id":"vi-e3","type":"flip","cat":"Workers","binding":"statute","front":"E-3","back":"Specialty occupation worker who is a national of Australia. Needs a job offer, a qualifying degree and a DOL labor condition application. Initial stay up to 2 years, extensions of up to 2 years, no limit on extensions.","why":"It looks like an H-1B, but it's limited to one nationality.","source":"8 U.S.C. § 1101(a)(15)(E)(iii); USCIS E-3 page","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/e-3-specialty-occupation-workers-from-australia"},{"id":"vi-q1","type":"flip","cat":"Workers","binding":"regulation","front":"Q-1","back":"International cultural exchange participant: practical training and work that shares the culture of the home country, where the cultural part is essential to the job. Maximum 15 months, then a year abroad before qualifying again.","why":"Seen at theme parks and cultural attractions.","source":"8 U.S.C. § 1101(a)(15)(Q); 8 C.F.R. § 214.2(q)","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/q-cultural-exchange"},{"id":"vi-work-mc","type":"mc","cat":"Workers","binding":"regulation","q":"Farm work at harvest versus seasonal hotel work. Which pair of classes?","choices":["H-1B and H-2B","H-2A and H-2B","H-2B and H-2A","TN and Q-1"],"answer":1,"explain":"H-2A covers temporary or seasonal agricultural labor; H-2B covers temporary non-agricultural work.","why":"Mixing them up mislabels the status you're checking.","source":"8 U.S.C. § 1101(a)(15)(H)(ii)(a)–(b)","verified":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-2a-temporary-agricultural-workers"},{"id":"vi-f1","type":"flip","cat":"Students & Exchange","binding":"regulation","front":"F-1","back":"Academic student at an SEVP-certified school (university, college, high school, language program), using a Form I-20. Must keep a full course of study. Limited work: on campus during studies, and authorized practical training.","note":"Before Sept. 15, 2026, these students were admitted for duration of status (\"D/S\"). New admissions now get a fixed admit-until date of up to 4 years plus 30 days, and a 30-day departure period.","flag":"This changed recently or is in litigation. Confirm current policy before relying on it.","why":"The status depends on staying enrolled, not just a date.","source":"8 U.S.C. § 1101(a)(15)(F); 8 C.F.R. § 214.2(f); DHS final rule (July 17, 2026)","verified":"https://studyinthestates.dhs.gov/final-rule-establishing-a-fixed-time-period-of-admission-and-an-extension-of-stay-procedure-quick"},{"id":"vi-m1","type":"flip","cat":"Students & Exchange","binding":"regulation","front":"M-1","back":"Vocational or other nonacademic student. Admitted for a fixed period: program length plus practical training plus 30 days, but no more than 1 year at a time. Work only as practical training after finishing the course. Can't change to an academic student class.","why":"Vocational students always get a date certain.","source":"8 U.S.C. § 1101(a)(15)(M); USCIS Policy Manual, Vol. 2, Part F, Ch. 8","verified":"https://www.uscis.gov/policy-manual/volume-2-part-f-chapter-8"},{"id":"vi-j1","type":"flip","cat":"Students & Exchange","binding":"regulation","front":"J-1","back":"Exchange visitor in a State Department program (scholars, researchers, trainees, au pairs, camp counselors, students and others), using Form DS-2019. The program dates govern; maximum length depends on the category. Some are subject to a two-year home-residence requirement.","flag":"Duration of status for these visitors is being replaced by fixed admission periods under a 2026 DHS rule. Confirm current I-94 practice.","why":"Common in summer work programs. Status follows the sponsor program.","source":"8 U.S.C. § 1101(a)(15)(J); USCIS Policy Manual, Vol. 2, Part D, Ch. 3","verified":"https://www.uscis.gov/policy-manual/volume-2-part-d-chapter-3"},{"id":"vi-f2m2","type":"flip","cat":"Students & Exchange","binding":"regulation","front":"F-2 / M-2","back":"Spouse or child of an academic or vocational student. Can't work. Children may attend K-12 full-time. Since 2015, may study part-time at an SEVP-certified school; full-time college study needs a change to student status.","why":"A dependent of a student working is out of status.","source":"8 C.F.R. § 214.2(f)(15), (m)(17); SEVP (2015)","verified":"https://studyinthestates.dhs.gov/2015/06/dependents-offered-part-time-study-opportunities"},{"id":"vi-j2","type":"flip","cat":"Students & Exchange","binding":"regulation","front":"J-2","back":"Spouse or child of an exchange visitor. Unlike student dependents, may apply to USCIS for work authorization (Form I-765). It's valid only once the EAD is issued.","why":"This dependent may work, but only with an EAD.","source":"USCIS Policy Manual, Vol. 2, Part D, Ch. 6","verified":"https://www.uscis.gov/policy-manual/volume-2-part-d-chapter-6"},{"id":"vi-212e","type":"flip","cat":"Students & Exchange","binding":"statute","front":"Rule: 212(e) two-year home-country requirement","back":"Some exchange visitors (and their J-2 dependents) must spend two years in their home country before getting an immigrant visa, adjustment of status, or H or L status. It applies through government funding, the Exchange Visitor Skills List, or U.S. graduate medical training. A waiver is possible on five statutory bases.","why":"Explains why some former exchange visitors can't change status in the U.S.","source":"INA § 212(e); travel.state.gov waiver page","verified":"https://travel.state.gov/content/travel/en/us-visas/study/exchange/waiver-of-the-exchange-visitor.html"},{"id":"vi-fm-mc","type":"mc","cat":"Students & Exchange","binding":"regulation","q":"A student in a 9-month welding certificate program at a trade school holds which class?","choices":["F-1","M-1","J-1","H-2B"],"answer":1,"explain":"F is for academic students, M for vocational students. Vocational students get a fixed admission period capped at one year at a time.","why":"Academic vs. vocational sets the rules on work and length of stay.","source":"USCIS Policy Manual, Vol. 2, Part F","verified":"https://www.uscis.gov/policy-manual/volume-2-part-f-chapter-8"},{"id":"vi-k1","type":"flip","cat":"Family & Fiancé","binding":"statute","front":"K-1","back":"Fiancé(e) of a U.S. citizen, admitted to marry that citizen within 90 days of entry. The 90 days can't be extended, and with limited exceptions the holder can't change to another class. After the marriage, they apply to adjust status.","note":"Canadians need a visa for this class.","why":"Day 91 with no marriage means the status has ended.","source":"8 U.S.C. § 1101(a)(15)(K)(i); USCIS fiancé(e) page","verified":"https://www.uscis.gov/family/family-of-us-citizens/visas-for-fiancees-of-us-citizens"},{"id":"vi-k2","type":"flip","cat":"Family & Fiancé","binding":"statute","front":"K-2","back":"Child of a U.S. citizen's fiancé(e), admitted with or following the parent. Status ends on the same 90-day timeline. Must stay unmarried to get a green card on this basis.","why":"Follows the parent's timeline.","source":"8 U.S.C. § 1101(a)(15)(K)(iii); USCIS fiancé(e) page","verified":"https://www.uscis.gov/family/family-of-us-citizens/visas-for-fiancees-of-us-citizens"},{"id":"vi-k3","type":"flip","cat":"Family & Fiancé","binding":"policy","front":"K-3 / K-4","back":"Spouse (and children) of a U.S. citizen, admitted to wait in the U.S. for an immigrant petition to be decided. Rarely issued now: when the immigrant petition is approved first, the nonimmigrant case is closed and the spouse immigrates directly.","why":"Rare, but still on the books.","source":"8 U.S.C. § 1101(a)(15)(K)(ii); USCIS K-3/K-4 page","verified":"https://www.uscis.gov/family/family-of-us-citizens/k-3k-4-nonimmigrant-visas"},{"id":"vi-v","type":"flip","cat":"Family & Fiancé","binding":"statute","front":"V","back":"Spouse or child of a permanent resident whose immigrant petition was filed on or before Dec. 21, 2000 and has been pending, or waiting for a visa, for at least 3 years. Created by the LIFE Act.","note":"Few people still qualify because of the 2000 filing cutoff.","why":"Rare. Recognize it if you see it.","source":"8 U.S.C. § 1101(a)(15)(V); USCIS V page","verified":"https://www.uscis.gov/family/family-of-green-card-holders-permanent-residents/v-nonimmigrant-visas"},{"id":"vi-k1-mc","type":"mc","cat":"Family & Fiancé","binding":"statute","q":"A fiancé(e) visa holder entered 4 months ago and never married the petitioner. Status?","choices":["In status until the visa expires","Status ended at 90 days; it can't be extended","Automatically converted to B-2","In status while a new I-129F is pending"],"answer":1,"explain":"USCIS: K-1/K-2 status automatically expires after 90 days and cannot be extended. Generally they must leave; a later marriage can be pursued through an I-130.","why":"The 90-day limit is strict.","source":"USCIS fiancé(e) page","verified":"https://www.uscis.gov/family/family-of-us-citizens/visas-for-fiancees-of-us-citizens"},{"id":"vi-u","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"statute","front":"U","back":"Victim of qualifying criminal activity who has been, is, or is likely to be helpful to law enforcement in investigating or prosecuting the crime. Needs a certification from a certifying agency (Form I-918, Supplement B). Up to 4 years. Capped at 10,000 principals a year; those on the waiting list may get deferred action and work authorization.","why":"Law enforcement certifies these. Know what's being asked.","source":"8 U.S.C. § 1101(a)(15)(U); 8 C.F.R. § 214.14","verified":"https://www.uscis.gov/humanitarian/victims-of-criminal-activity-u-nonimmigrant-status"},{"id":"vi-t","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"statute","front":"T","back":"Victim of a severe form of human trafficking who is in the U.S. (or at a port of entry) on account of the trafficking. Must comply with reasonable requests from law enforcement (exceptions for minors and trauma) and show extreme hardship if removed. Valid up to 4 years.","why":"Trafficking indicators in the field can lead to this status.","source":"8 U.S.C. § 1101(a)(15)(T); USCIS T page","verified":"https://www.uscis.gov/humanitarian/victims-of-human-trafficking-t-nonimmigrant-status"},{"id":"vi-s","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"regulation","front":"S","back":"Witness or informant with critical, reliable information about a criminal organization or enterprise, who is essential to an investigation or prosecution. Requested by a law enforcement agency and certified through the Justice Department's Criminal Division. Canadians need a visa for it.","why":"Requested by a law enforcement agency, not by the person.","source":"8 U.S.C. § 1101(a)(15)(S); 8 C.F.R. § 214.2(t); 60 Fed. Reg. (Aug. 25, 1995)","verified":"https://www.govinfo.gov/content/pkg/FR-1995-08-25/pdf/95-21115.pdf"},{"id":"vi-parole","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"statute","front":"Parole (INA 212(d)(5))","back":"Temporary permission to be in the U.S., granted case by case for urgent humanitarian reasons or significant public benefit. It is not an admission; the person is still treated as an applicant for admission. A travel document granting it doesn't guarantee entry.","flag":"Group parole programs have been ended or are in litigation (CHNV terminated 2025; family reunification parole in court). Check current status.","why":"A parolee isn't \"admitted\". That changes which charges and processes apply.","source":"8 U.S.C. § 1182(d)(5)(A); USCIS humanitarian parole page","verified":"https://www.uscis.gov/humanitarian/humanitarian_parole"},{"id":"vi-ref-asy","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"statute","front":"Rule: refugee vs. asylee","back":"Refugee: applied and was approved from outside the U.S. (INA 207), then admitted. Must apply for a green card after 1 year. Asylee: applied in the U.S. or at a port of entry (INA 208) and was granted asylum. May apply for a green card after 1 year, but doesn't have to.","why":"Both may work and travel with the right document, but they got here differently.","source":"INA §§ 207, 208; USCIS Refugees and Asylum","verified":"https://www.uscis.gov/humanitarian/refugees-asylum"},{"id":"vi-ag","type":"flip","cat":"Humanitarian & Law Enforcement","binding":"policy","front":"A and G classes (diplomats and international organizations)","back":"Two official classes: diplomats and foreign government officials (heads of state included); and representatives to, or employees of, designated international organizations, plus their personal staff. Some holders have immunities.","note":"Immunity depends on the class and the position. Follow agency procedures for any immunity claim.","why":"Immunity questions are above the field level.","source":"8 U.S.C. § 1101(a)(15)(A), (G); 9 FAM 402.3","verified":"https://fam.state.gov/fam/09FAM/09FAM040203.html"},{"id":"vi-parole-mc","type":"mc","cat":"Humanitarian & Law Enforcement","binding":"statute","q":"Someone paroled in under INA 212(d)(5). Were they admitted?","choices":["Yes, as a nonimmigrant","Yes, as an LPR","No. Parole is not an admission; they remain an applicant for admission","Only if they hold an EAD"],"answer":2,"explain":"USCIS: parole under 212(d)(5)(A) is not an admission; the paroled person is treated as an applicant for admission.","why":"Admission status affects the legal process that applies later.","source":"8 U.S.C. § 1182(d)(5)(A); USCIS glossary","verified":"https://www.uscis.gov/glossary-term/51412"},{"id":"vi-ut-mc","type":"mc","cat":"Humanitarian & Law Enforcement","binding":"statute","q":"A woman was brought in by force and fraud for forced labor and has helped investigators. Which status fits best?","choices":["U","T","S","V"],"answer":1,"explain":"T is for victims of a severe form of trafficking present on account of the trafficking. U covers a list of qualifying crimes with a law enforcement certification. S is for witnesses and informants.","why":"Trafficking victims have their own class.","source":"8 U.S.C. § 1101(a)(15)(T); USCIS T page","verified":"https://www.uscis.gov/humanitarian/victims-of-human-trafficking-t-nonimmigrant-status"},{"id":"vi-i551","type":"flip","cat":"Status Documents","binding":"regulation","front":"Form I-551","back":"Permanent Resident Card (green card). Usually valid 10 years; conditional residents get 2-year cards. The status doesn't expire with the card. Works as an entry document only after an absence of less than 1 year.","note":"Cards issued 1977–1989 may have no expiration date. Holders 18 and over must carry evidence of registration (8 U.S.C. 1304(e)).","why":"The most common status document you'll see.","source":"USCIS international travel as a permanent resident","verified":"https://www.uscis.gov/green-card/after-we-grant-your-green-card/international-travel-as-a-permanent-resident"},{"id":"vi-i327","type":"flip","cat":"Status Documents","binding":"regulation","front":"Form I-327","back":"Re-entry Permit for a permanent resident planning a long trip abroad. Generally valid 2 years from issuance and can't be extended. While it's valid, the length of the absence alone won't be treated as abandoning residence.","why":"Explains a returning LPR who has been gone more than a year.","source":"USCIS international travel as a permanent resident","verified":"https://www.uscis.gov/green-card/after-we-grant-your-green-card/international-travel-as-a-permanent-resident"},{"id":"vi-sb1","type":"flip","cat":"Status Documents","binding":"policy","front":"SB-1","back":"Returning resident visa from a consulate, for a permanent resident who stayed abroad beyond the green card's 1 year or the re-entry permit's 2 years for reasons beyond their control.","why":"The way back in for a long-absent LPR without a valid permit.","source":"travel.state.gov Returning Resident Visas","verified":"https://travel.state.gov/content/travel/en/us-visas/immigrate/returning-resident.html"},{"id":"vi-i94","type":"flip","cat":"Status Documents","binding":"regulation","front":"Form I-94","back":"Arrival/Departure Record, now electronic and issued by CBP at entry. Its \"admit until\" date is when the person's status expires: a hard date, or \"D/S\" (duration of status) for students and exchange visitors. Short trips of less than 30 days to Canada or Mexico don't reset it.","note":"The visa's expiration date is not the authorized stay. The I-94 is.","why":"The single best answer to \"how long can they stay?\"","source":"CBP I-94 page","verified":"https://www.cbp.gov/travel/international-visitors/i-94"},{"id":"vi-i766","type":"flip","cat":"Status Documents","binding":"policy","front":"Form I-766","back":"Employment Authorization Document (EAD). Proves the holder may work in the U.S. for a specific period. An EAD is not a status, but the category code on it shows the basis.","flag":"USCIS shortened maximum validity for many categories in late 2025 (parole and TPS EADs: one year or the end of parole/TPS). Check the dates on the card.","why":"An EAD alone doesn't tell you someone was admitted.","source":"USCIS Employment Authorization Document page","verified":"https://www.uscis.gov/green-card/green-card-processes-and-procedures/employment-authorization-document"},{"id":"vi-i512","type":"flip","cat":"Status Documents","binding":"policy","front":"Form I-512L","back":"Advance parole document, issued so a person in the U.S. (often with a pending green card case) can travel abroad and seek to return. It doesn't guarantee re-entry; the person is paroled, not admitted, on return.","flag":"USCIS changed how departure on this document is treated for unlawful-presence bars as of Aug. 13, 2026. Confirm current policy.","why":"Travel on this document returns the person as a parolee.","source":"USCIS Travel Documents page","verified":"https://www.uscis.gov/green-card/green-card-processes-and-procedures/travel-documents"},{"id":"vi-i571","type":"flip","cat":"Status Documents","binding":"regulation","front":"Form I-571","back":"Refugee Travel Document for a refugee or asylee (or an LPR who got that status as a refugee or asylee) to travel abroad and return. Valid 1 year and can't be extended.","why":"A refugee or asylee usually needs this, or advance parole, to come back.","source":"USCIS Form I-131 instructions","verified":"https://www.uscis.gov/sites/default/files/document/forms/i-131instr.pdf"},{"id":"vi-ppcard","type":"flip","cat":"Status Documents","binding":"policy","front":"U.S. passport card","back":"Wallet-size citizenship and identity document for entering the U.S. by land or sea from Canada, Mexico, Bermuda and some Caribbean destinations. Not valid for international air travel. Accepted by TSA as domestic flight ID.","why":"Proof of U.S. citizenship in card form.","source":"travel.state.gov passport card page","verified":"https://travel.state.gov/content/travel/en/passports/need-passport/card.html"},{"id":"vi-natcert","type":"flip","cat":"Status Documents","binding":"policy","front":"Certificate of Naturalization (N-550) / Certificate of Citizenship (N-560)","back":"Proof of U.S. citizenship issued by USCIS. One goes automatically to people who naturalized; the other must be applied for by people who got citizenship through a U.S. citizen parent. Both show the holder's A-number and never need renewing.","note":"Many people who derived citizenship never got the certificate, but they are still citizens.","why":"A non-passport citizenship document you may be shown.","source":"USCIS Policy Manual, Vol. 12, Part K","verified":"https://www.uscis.gov/policy-manual/volume-12-part-k-chapter-2"},{"id":"vi-anumber","type":"flip","cat":"Status Documents","binding":"policy","front":"A-Number","back":"Alien Registration Number: a unique 7-, 8- or 9-digit number DHS assigns to an alien, written with an \"A\" prefix. It stays the same across cases and documents. The USCIS number on newer cards is the same number without the \"A\".","why":"The key that ties one person's records together.","source":"USCIS glossary","verified":"https://www.uscis.gov/glossary-term/50684"},{"id":"vi-lpr-rule","type":"flip","cat":"Status Documents","binding":"statute","front":"Rule: returning LPRs and long absences","back":"An LPR absent continuously for more than 180 days is regarded as seeking admission (INA 101(a)(13)(C)(ii)). The green card alone is an entry document only after an absence of less than 1 year. Abandonment of residence turns on intent; more than a year away is a guide, not an automatic loss.","why":"A long-absent LPR is an applicant for admission, not automatically a non-LPR.","source":"INA § 101(a)(13)(C)(ii); USCIS international travel page","verified":"https://www.uscis.gov/green-card/after-we-grant-your-green-card/international-travel-as-a-permanent-resident"},{"id":"vi-222g","type":"flip","cat":"Status Documents","binding":"statute","front":"Rule: overstay voids the visa (INA 222(g))","back":"A nonimmigrant who stays past the authorized period has the visa used to enter automatically voided. Generally they must get a new visa in their home country. A Border Crossing Card isn't voided this way, and D/S admissions are treated differently.","why":"An overstayer's visa stamp may look valid but isn't.","source":"INA § 222(g); 9 FAM 302.1","verified":"https://fam.state.gov/fam/09FAM/09FAM030201.html"},{"id":"vi-sc-canadian-overstay","type":"scenario","cat":"Is This Person in Status?","binding":"statute","setup":"A Canadian citizen's I-94 shows admission as a B-2 visitor with an admit-until date two months ago. No extension was filed and they haven't left.","q":"Are they in status?","choices":["Yes. Canadians can stay without limit","No. They stayed past the admit-until date","Yes, as long as their passport is valid","Yes, because they didn't need a visa"],"answer":1,"explain":"The I-94 admit-until date is when status ends. Being visa-exempt doesn't change the admission period. Remaining in violation of law is a deportability ground (INA 237(a)(1)(B)).","why":"Visa-exempt doesn't mean time-unlimited.","source":"CBP I-94 page; 8 U.S.C. § 1227(a)(1)(B)","verified":"https://www.cbp.gov/travel/international-visitors/i-94"},{"id":"vi-sc-b2-work","type":"scenario","cat":"Is This Person in Status?","binding":"regulation","setup":"A B-2 visitor admitted three weeks ago, well within the admit-until date, is found working for cash at a local business.","q":"Status?","choices":["In status. The admit-until date hasn't passed","Out of status. Unauthorized work is a failure to maintain status","In status if the job is part-time","In status if the employer is a relative"],"answer":1,"explain":"Visitors may not work. Unauthorized employment by a nonimmigrant is a failure to maintain status (8 C.F.R. 214.1(e)), a deportability ground under INA 237(a)(1)(C)(i).","why":"Status can end before the date does.","source":"8 C.F.R. § 214.1(e); travel.state.gov Visitor Visa","verified":"https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html"},{"id":"vi-sc-f1-ds","type":"scenario","cat":"Is This Person in Status?","binding":"regulation","setup":"An F-1 student admitted before September 2026 has an I-94 reading \"D/S\". It has no end date.","q":"What decides whether they're in status?","choices":["Nothing; D/S never ends","Whether they're still pursuing a full course of study (or authorized practical training) under a valid I-20","Whether the visa stamp is unexpired","Whether they've been in the U.S. less than 4 years"],"answer":1,"explain":"D/S lasts while the student pursues a full course of study plus authorized practical training. For students already on D/S, the 2026 rule lets them stay until the program end date, capped at Nov. 14, 2030.","flag":"This changed recently or is in litigation. Confirm current policy before relying on it.","why":"A D/S student is in status only while enrolled and compliant.","source":"USCIS Policy Manual, Vol. 2, Part F, Ch. 8; DHS final rule (2026)","verified":"https://studyinthestates.dhs.gov/final-rule-establishing-a-fixed-time-period-of-admission-and-an-extension-of-stay-procedure-quick"},{"id":"vi-sc-tn-employer","type":"scenario","cat":"Is This Person in Status?","binding":"policy","setup":"A Canadian admitted in TN status to work for one company quit and started working for a different company last month. No new petition was filed, and they haven't been readmitted as a TN for the new job.","q":"Is the new employment authorized?","choices":["Yes. TN covers any USMCA job","No. Work for a new employer isn't authorized until a new TN is approved or granted at a port","Yes, if the new job is in the same profession","Yes, for 60 days"],"answer":1,"explain":"USCIS: employment with a different or additional employer is not authorized until USCIS approves the petition. A Canadian outside the U.S. can instead apply at a designated port.","why":"TN is employer-specific.","source":"USCIS Policy Manual, Vol. 2, Part P, Ch. 5","verified":"https://www.uscis.gov/policy-manual/volume-2-part-p-chapter-5"},{"id":"vi-sc-lpr-14mo","type":"scenario","cat":"Is This Person in Status?","binding":"statute","setup":"A permanent resident returns after 14 months abroad with only their green card. No re-entry permit, no returning resident visa.","q":"Which is accurate?","choices":["The green card is a valid entry document; nothing more to it","They're regarded as seeking admission, and the card alone isn't a valid entry document after a year away; abandonment depends on intent","They lost LPR status automatically at 12 months","They need a B-2 visa"],"answer":1,"explain":"Absence over 180 days makes them an applicant for admission (101(a)(13)(C)(ii)). The card works as an entry document only for absences under 1 year. Abandonment is about intent, not an automatic cutoff.","why":"Long absence opens the question; it doesn't settle it.","source":"INA § 101(a)(13)(C)(ii); USCIS international travel page","verified":"https://www.uscis.gov/green-card/after-we-grant-your-green-card/international-travel-as-a-permanent-resident"},{"id":"vi-sc-bcc-zone","type":"scenario","cat":"Is This Person in Status?","binding":"regulation","setup":"A Mexican national admitted on a Border Crossing Card without an I-94 is found several hundred miles from the Mexican border, two weeks after entry.","q":"Status?","choices":["In status. BCC holders can go anywhere for 30 days","Out of status. Travel beyond the border zone required an I-94","In status, because the card is valid 10 years","In status if they're on business"],"answer":1,"explain":"Without an I-94, a BCC holder is limited to the border zone (25 miles; 75 in Arizona; 55 or I-10 in New Mexico) for up to 30 days. Going beyond it requires an I-94.","flag":"Confirm the current zone in 8 C.F.R. 235.1(h).","why":"The zone is a condition of admission.","source":"8 C.F.R. § 235.1(h); travel.state.gov Border Crossing Card","verified":"https://travel.state.gov/content/travel/en/us-visas/tourism-visit/border-crossing-card.html"},{"id":"vi-sc-vwp-overstay","type":"scenario","cat":"Is This Person in Status?","binding":"statute","setup":"A national of a Visa Waiver Program country entered under the program 5 months ago and is still here. They say they want a hearing before a judge.","q":"Which is accurate?","choices":["They're entitled to a full removal hearing","They overstayed the 90 days and waived the right to contest removal except through an asylum application","They can extend through USCIS","They're in status until the ESTA expires"],"answer":1,"explain":"VWP admission is 90 days at most with no extension. Under 1187(b) the entrant waived any right to contest removal other than by applying for asylum.","why":"VWP overstays move fast unless there's an asylum claim.","source":"8 U.S.C. § 1187(b); CBP VWP/ESTA FAQ","verified":"https://www2.ca3.uscourts.gov/opinarch/084184p.pdf"},{"id":"vi-sc-h2a-left","type":"scenario","cat":"Is This Person in Status?","binding":"regulation","setup":"An H-2A worker stopped showing up at the farm that petitioned for them three months ago and has been working construction for cash since.","q":"Status?","choices":["In status until the I-94 date","Out of status. Their status is tied to the petitioning employer and agricultural work, and they're working without authorization","In status. H-2A lets workers change employers freely","In status if the construction job is seasonal"],"answer":1,"explain":"Five workdays without showing up counts as absconding, and the employer must notify DHS within 2 workdays. Working for an employer who hasn't petitioned is unauthorized employment.","flag":"The 2025 H-2 rule added grace periods (up to 60 days after employment ends), confirmed only through secondary summaries. Confirm current text.","why":"The H-2A worker's status depends on the employer and the job.","source":"8 C.F.R. § 214.2(h)(5)(vi); H-2 modernization rule (eff. Jan. 17, 2025)","verified":"https://www.federalregister.gov/documents/2008/12/18/E8-29888/changes-to-requirements-affecting-h-2a-nonimmigrants"},{"id":"vi-sc-k1-ca","type":"scenario","cat":"Is This Person in Status?","binding":"regulation","setup":"A Canadian citizen says they crossed last week \"as a visitor\" to marry their U.S. citizen fiancé and stay permanently. They have no visa.","q":"What's the issue?","choices":["None. Canadians need no visa for anything","The fiancé(e) class is one of the classes Canadians need a visa for, and a visitor must intend a temporary stay","They need a TN","They need an ESTA"],"answer":1,"explain":"212.1(a): Canadians are visa-exempt except in E, K, S and V. A visitor also needs a foreign residence they don't intend to abandon, and planning to stay permanently is inconsistent with visitor status.","why":"Visa-exempt entry is for the class claimed at entry, not the real plan.","source":"8 C.F.R. § 212.1(a)(1); 8 U.S.C. § 1101(a)(15)(B)","verified":"https://www.law.cornell.edu/cfr/text/8/212.1"},{"id":"vi-sc-h1b-port","type":"scenario","cat":"Is This Person in Status?","binding":"statute","setup":"An H-1B worker in valid status switched to a new employer, which filed a proper new H-1B petition before the worker started. The petition is still pending.","q":"Can they work for the new employer?","choices":["No, not until approval","Yes. H-1B portability allows work once a non-frivolous petition is properly filed","Only for 30 days","Only if the new job is with the same company"],"answer":1,"explain":"INA 214(n): an eligible H-1B worker may begin working for a new employer once that employer properly files a non-frivolous petition. If the petition is denied, the portability work authorization ends.","why":"Unlike TN, H-1B has portability.","source":"INA § 214(n); USCIS H-1B page","verified":"https://www.uscis.gov/working-in-the-united-states/h-1b-specialty-occupations"}]}];
const GRAMMAR=[{"id":"g1","title":"Pronunciation Essentials","tag":"Lesson I of the manual","body":"\n\u003ch4>Vowels are pure\u003c/h4>\n\u003cp>Five vowels, one sound each, always: \u003cb>a\u003c/b> (father), \u003cb>e\u003c/b> (they, clipped), \u003cb>i\u003c/b> (machine), \u003cb>o\u003c/b> (note, clipped), \u003cb>u\u003c/b> (rule). No English-style gliding.\u003c/p>\n\u003ch4>The consonants that trip people up\u003c/h4>\n\u003cp>\u003cb>J\u003c/b> sounds like a hard English H (Juárez = HWAH-res). \u003cb>H\u003c/b> is always silent (hombre = OM-bre). \u003cb>Ñ\u003c/b> = \"ny\" (año = AH-nyo). \u003cb>LL\u003c/b> and \u003cb>Y\u003c/b> sound like English Y (calle = KAH-yeh). \u003cb>RR\u003c/b> is trilled; a single R between vowels is a quick tap. \u003cb>B\u003c/b> and \u003cb>V\u003c/b> are pronounced identically. \u003cb>Z\u003c/b> and soft \u003cb>C\u003c/b> (before e/i) = S in Latin American Spanish.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">mucho, muchacho, chico\u003c/span>\u003cbr>\u003cspan class=\"e\">CH is like English \"church\" — the manual's first examples.\u003c/span>\u003c/div>\n\u003ch4>Stress rules\u003c/h4>\n\u003cp>Words ending in a vowel, N, or S stress the next-to-last syllable (ha-BLA-mos). Words ending in other consonants stress the last (ha-BLAR). A written accent overrides everything (está, rápido).\u003c/p>","quiz":[{"q":"How is the J in 'trabajo' pronounced?","opts":["Like English J in 'jump'","Like a hard English H","Silent","Like Y in 'yes'"],"a":1,"why":"J = strong H sound: tra-BAH-ho."},{"q":"The H in 'herido' is...","opts":["Pronounced like English H","Pronounced like J","Always silent","Only pronounced at the start of sentences"],"a":2,"why":"Spanish H is always silent: eh-REE-do."},{"q":"'Calle' (street) sounds closest to...","opts":["KAL-leh","KAH-yeh","KAH-cheh","SAH-yeh"],"a":1,"why":"LL sounds like English Y in Mexican Spanish."},{"q":"Where is the stress in 'hablan'? (ends in N)","opts":["ha-BLAN","HA-blan","Equal stress","Depends on region"],"a":1,"why":"Ends in N → stress the next-to-last syllable: HA-blan."},{"q":"B and V in Spanish are...","opts":["Always distinct sounds","Pronounced the same","Both silent","Swapped compared to English"],"a":1,"why":"The manual is blunt about it: 'B and V are pronounced exactly alike.'"}]},{"id":"g2","title":"Gender, Articles & Plurals","tag":"Lesson II & IV","body":"\n\u003ch4>Every noun has a gender\u003c/h4>\n\u003cp>Nouns in \u003cb>-o\u003c/b> are usually masculine (el río), nouns in \u003cb>-a\u003c/b> usually feminine (la frontera). Memorize the exceptions you'll actually use: \u003cb>la mano\u003c/b> (hand), \u003cb>el día\u003c/b> (day), \u003cb>el mapa\u003c/b>, \u003cb>el problema\u003c/b>.\u003c/p>\n\u003ch4>Articles\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>the\u003c/th>\u003cth>a / an\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>masc.\u003c/td>\u003ctd>el / los\u003c/td>\u003ctd>un / unos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>fem.\u003c/td>\u003ctd>la / las\u003c/td>\u003ctd>una / unas\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Feminine nouns beginning with a stressed A take \u003cb>el\u003c/b> in the singular: \u003cb>el agua\u003c/b>, \u003cb>el arma\u003c/b> — but they stay feminine: las armas.\u003c/p>\n\u003ch4>Plurals\u003c/h4>\n\u003cp>Vowel ending → add \u003cb>-s\u003c/b> (documento → documentos). Consonant ending → add \u003cb>-es\u003c/b> (papel → papeles). Z → CES (cicatriz → cicatrices — \"scar,\" a word the 1943 manual taught for descriptions).\u003c/p>\n\u003ch4>The only two contractions in Spanish\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">a + el = al &nbsp;&nbsp;•&nbsp;&nbsp; de + el = del\u003c/span>\u003cbr>\u003cspan class=\"e\">Vamos al puente. Viene del sur.\u003c/span>\u003c/div>","quiz":[{"q":"Which is correct?","opts":["la problema","el problema","los problema","una problema"],"a":1,"why":"Problema is masculine despite ending in -a."},{"q":"'The weapon' is...","opts":["la arma","el arma","lo arma","las arma"],"a":1,"why":"Arma is feminine but takes EL because it starts with stressed A. Plural: las armas."},{"q":"Plural of 'el papel' (paper):","opts":["los papels","los papeles","las papeles","los papelos"],"a":1,"why":"Consonant ending → add -es."},{"q":"'We're going to the river' =","opts":["Vamos a el río","Vamos al río","Vamos del río","Vamos el río"],"a":1,"why":"a + el always contracts to al."},{"q":"'The hand' is...","opts":["el mano","la mano","lo mano","un mano"],"a":1,"why":"Mano is feminine despite the -o. La mano, las manos."}]},{"id":"g3","title":"Subject Pronouns & Present Tense","tag":"Lesson II & III","body":"\n\u003ch4>The pronouns you'll use\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Spanish\u003c/th>\u003cth>English\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>I\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>you (informal — kids, friends)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>usted\u003c/b>\u003c/td>\u003ctd>\u003cb>you (formal — your default on duty)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>él / ella\u003c/td>\u003ctd>he / she\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>we\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes\u003c/td>\u003ctd>you all\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ellos / ellas\u003c/td>\u003ctd>they\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Usted takes the same verb form as él/ella. Subject pronouns are usually dropped — the ending tells you who: \u003cb>Hablo\u003c/b> = I speak.\u003c/p>\n\u003ch4>Regular present tense\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>hablAR\u003c/th>\u003cth>comER\u003c/th>\u003cth>vivIR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>hablo\u003c/td>\u003ctd>como\u003c/td>\u003ctd>vivo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>hablas\u003c/td>\u003ctd>comes\u003c/td>\u003ctd>vives\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>habla\u003c/td>\u003ctd>come\u003c/td>\u003ctd>vive\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>hablamos\u003c/td>\u003ctd>comemos\u003c/td>\u003ctd>vivimos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>hablan\u003c/td>\u003ctd>comen\u003c/td>\u003ctd>viven\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde vive usted? — Vivo en Montreal.\u003c/span>\u003cbr>\u003cspan class=\"e\">Where do you live? — I live in Montreal.\u003c/span>\u003c/div>","quiz":[{"q":"On duty, questioning an adult, you should use...","opts":["tú","usted","vos","ellos"],"a":1,"why":"Usted is the formal, professional 'you' — the manual drills it exclusively."},{"q":"'You (usted) work' =","opts":["trabajo","trabajas","trabaja","trabajan"],"a":2,"why":"Usted takes the él/ella form: trabaja."},{"q":"'We live' =","opts":["vivemos","vivimos","viven","vivamos"],"a":1,"why":"-IR verbs: nosotros ending is -imos."},{"q":"'Hablan' by itself means...","opts":["I speak","You (formal) speak","They speak / You all speak","We speak"],"a":2,"why":"-an ending = ustedes/ellos. Pronoun optional."},{"q":"'¿Comen los niños?' means...","opts":["Do the children eat?","Did the children eat?","Will the children eat?","The children must eat"],"a":0,"why":"Present tense; Spanish questions just invert or add ¿? marks."}]},{"id":"g4","title":"Ser vs. Estar","tag":"Lesson VI — the big one","body":"\n\u003ch4>Two verbs for 'to be'\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>SER\u003c/th>\u003cth>ESTAR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>soy\u003c/td>\u003ctd>estoy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>eres\u003c/td>\u003ctd>estás\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>es\u003c/td>\u003ctd>está\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>somos\u003c/td>\u003ctd>estamos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>so
