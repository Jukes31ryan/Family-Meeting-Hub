it it, you know you've gone too far.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-collecting","type":"flip","cat":"Terms & Strategies","front":"Collecting features","back":"Distinctive features you pass along the route that confirm you're on track and tell you how far you've come.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-attack","type":"flip","cat":"Terms & Strategies","front":"Attack point","back":"An obvious, easy-to-find feature close to your objective. Navigate fast to it, then make a short, careful compass-and-pace leg to the objective.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://oq.orienteering.asn.au/forms-and-downloads/download/attack-points-pamphlet-2"},{"id":"ln-holds","type":"flip","cat":"Terms & Strategies","front":"Center-hold vs. compass-to-cheek","back":"Center-hold: compass held at the belly, turn your whole body. Used on the move to hold a general direction. Compass-to-cheek: sight through the wire to the target. Used when you need a precise azimuth.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-detour","type":"order","cat":"Terms & Strategies","q":"Bypassing an obstacle with 90° turns (detour method). Put the legs in order.","steps":["Turn 90° right (add 90°) and pace until you clear the obstacle's width","Turn back to the original azimuth and pace along the obstacle's length — these paces count toward your route","Turn 90° left (subtract 90°) and pace the same width back","Turn to the original azimuth and continue"],"explain":"Four legs around a box. The width legs cancel out, and the length leg adds to your route pace count.","source":"USMC detour method; TC 3-25.26 (bypassing obstacles)","verified":"https://snipercentral.com/nav-bypass.htm"},{"id":"ln-stop","type":"order","cat":"Terms & Strategies","q":"You realize you're lost. Put the STOP steps in order.","steps":["Stop: halt and stay calm","Think: back to your last known point and the time since","Observe: orient the map, find north, look for features","Plan: pick your next move, or stay put if unsure"],"explain":"Stop, Think, Observe, Plan. Moving without a plan usually makes it worse.","source":"STOP mnemonic (common wilderness-navigation practice)","verified":"https://www.people.vcu.edu/~albest/troop700/documents/StayingFoundWhatIfLost.pdf"},{"id":"ln-sc-handrail","type":"scenario","cat":"Terms & Strategies","setup":"Your route parallels a stream for most of the leg before you cut uphill to your objective.","q":"What is the stream for that stretch?","choices":["A handrail","An attack point","A catching feature","A collecting feature only"],"answer":0,"explain":"Follow it as a handrail, then leave it at a planned point.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://brainscape.com/flashcards/navigation-definitions-8369224/packs/14191102"},{"id":"ln-sc-catching","type":"scenario","cat":"Terms & Strategies","setup":"A paved road runs east–west about 300 m past your objective.","q":"How do you use the road?","choices":["As a catching feature: hit the road and you know you overshot","As your attack point","As a handrail all the way","Ignore it"],"answer":0,"explain":"A catching feature stops an overshoot from turning into a long search.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-sc-attack","type":"scenario","cat":"Terms & Strategies","setup":"Your objective is a small spot in thick woods. 200 m from it there's an obvious stream junction.","q":"Best plan?","choices":["Move fast to the stream junction (attack point), then a short compass-and-pace leg in","One long compass leg from the start","Wander until you find it","Wait for daylight"],"answer":0,"explain":"Use the easy-to-find feature as your attack point and save the precise work for the short final leg.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://oq.orienteering.asn.au/forms-and-downloads/download/attack-points-pamphlet-2"},{"id":"ln-sc-fog","type":"scenario","cat":"Terms & Strategies","setup":"Thick fog in flat, featureless woods. You can't see any landmarks.","q":"Which method?","choices":["Terrain association","Dead reckoning: azimuth plus pace count","Follow the nearest handrail wherever it goes","Wait for the fog to lift"],"answer":1,"explain":"With no visible features to match, hold a compass azimuth and keep a pace count.","source":"TC 3-25.26, ch. 11 (dead reckoning navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-sc-hold","type":"mc","cat":"Terms & Strategies","q":"You need a precise azimuth to a distant hilltop. Which compass hold?","choices":["Center-hold","Compass-to-cheek","Either is equally precise","Hold it at arm's length"],"answer":1,"explain":"Compass-to-cheek sights through the wire, which is more precise. Center-hold is for holding direction on the move.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-backaz","type":"flip","cat":"Compass & Declination","front":"Back azimuth rule","back":"Azimuth less than 180°: add 180. Azimuth 180° or more: subtract 180.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-backaz-calc","type":"mc","cat":"Compass & Declination","q":"Back azimuth of 250°?","choices":["70°","430°","110°","160°"],"answer":0,"explain":"250 is 180 or more, so subtract 180: 70°.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-declination","type":"flip","cat":"Compass & Declination","front":"Declination","back":"The difference between where your compass points (magnetic north) and the map's north. The diagram in the map's margin shows the angle and tells you whether to add or subtract it.","note":"Read the margin of the map you're carrying. Don't guess.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-pace-count","type":"flip","cat":"Pace & Distance","front":"Pace count","back":"The number of paces it takes you to walk 100 meters. Know yours, and count as you move to track how far you've gone.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-vehicle","type":"mc","cat":"Compass & Declination","q":"Minimum distance from a truck to get a trustworthy compass reading?","choices":["2 m","10 m","18 m","55 m"],"answer":2,"explain":"About 18 m for a truck, field gun or tank. Power lines need 55 m.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-pace-factors","type":"flip","cat":"Pace & Distance","front":"Five conditions that change your pace","back":"Slopes, winds, surfaces, elements, visibility.","note":"Uphill shortens the pace and downhill lengthens it. A headwind shortens it and a tailwind lengthens it. Sand, mud and snow shorten it. Falling snow, rain and ice shorten it. Poor visibility shortens it.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-pace-snow","type":"scenario","cat":"Pace & Distance","setup":"Deep snow, going uphill, in a light snowfall. Your normal count is 120 per 100 m.","q":"What happens to your count per 100 m?","choices":["Goes down","Stays the same","Goes up: pace is shorter, so more paces per 100 m","Can't be predicted"],"answer":2,"explain":"Upslope, snow surface and falling snow all shorten the pace. Expect well over 120.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-t-hill","type":"flip","cat":"Terrain","front":"From the top, ground slopes down in every direction.","back":"HILL (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-saddle","type":"flip","cat":"Terrain","front":"Dip between two hills: up on two sides, down on two sides.","back":"SADDLE (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-valley","type":"flip","cat":"Terrain","front":"Low ground between higher areas, often with a stream.","back":"VALLEY (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-ridge","type":"flip","cat":"Terrain","front":"A sloping line of high ground.","back":"RIDGE (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-depression","type":"flip","cat":"Terrain","front":"Low point or sinkhole, surrounded by higher ground.","back":"DEPRESSION (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-draw","type":"flip","cat":"Terrain","front":"A small valley, sometimes called a re-entrant.","back":"DRAW (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-spur","type":"flip","cat":"Terrain","front":"Short sloping high ground jutting out from a ridge.","back":"SPUR (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-cliff","type":"flip","cat":"Terrain","front":"Vertical or near-vertical drop.","back":"CLIFF (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-color-mc","type":"mc","cat":"Map","q":"On a military topo map, green shows…","choices":["Water","Vegetation","Man-made features","Relief"],"answer":1,"explain":"Green = vegetation (woods, orchards). Blue = water, brown = relief, black = man-made.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/FMTBE/Student%20Materials/FMSO%20Manual/212.pdf"},{"id":"ln-slope-mc","type":"mc","cat":"Terrain","q":"Contour lines bunched tightly together mean…","choices":["Gentle slope","Steep slope","A depression","A road cut"],"answer":1,"explain":"Close spacing = steep. Wide spacing = gentle.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://alanwood.co.uk/news/understanding-contour-lines-on-topographic-maps"},{"id":"ln-m-margin","type":"flip","cat":"Map","front":"Marginal information","back":"Everything printed around the edge of the map: its name, the scale, the legend, the contour interval and the declination diagram.","note":"Read the margin before you use a map you haven't carried before.","source":"TC 3-25.26, ch. 3 (marginal information and symbols)","verified":"https://www.uakron.edu/armyrotc/MS1/8.pdf"},{"id":"ln-m-legend","type":"flip","cat":"Map","front":"Map legend","back":"The key in the margin (usually lower left) that shows what each symbol on the map means.","note":"Symbols aren't the same on every map. Check the legend on the map you have.","source":"TC 3-25.26, ch. 3 (marginal information and symbols)","verified":"https://www.uakron.edu/armyrotc/MS1/krause-msl1-mapreading.pdf"},{"id":"ln-m-colors","type":"flip","cat":"Map","front":"Military map colors","back":"Black: man-made features (buildings, roads). Blue: water. Green: vegetation (woods, orchards). Brown: relief and contour lines. Red-brown or red: cultural features like main roads and built-up areas, depending on the map's edition.","note":"Any other color is explained in the margin.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.uakron.edu/armyrotc/MS1/krause-msl1-mapreading.pdf"},{"id":"ln-m-bar-scale","type":"flip","cat":"Map","front":"Bar scale","back":"The ruler printed in the bottom margin. Mark two points on the edge of a strip of paper, then hold the strip against the bar scale to read the distance on the ground.","why":"The quickest way to turn a map distance into meters you can walk.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/FMTBE/Student%20Materials/FMSO%20Manual/212.pdf"},{"id":"ln-m-contour","type":"flip","cat":"Map","front":"Contour line","back":"A brown line joining points of the same elevation. Lines close together = steep. Lines far apart = gentle. The heavier lines are labeled with their elevation.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://alanwood.co.uk/news/understanding-contour-lines-on-topographic-maps"},{"id":"ln-m-interval","type":"flip","cat":"Map","front":"Contour interval","back":"The height difference between two neighboring contour lines. It's printed in the bottom margin, under the bar scales.","note":"Newer maps give it in meters, older ones in feet. Check which.","source":"TC 3-25.26, ch. 3 (marginal information and symbols)","verified":"https://www.scribd.com/doc/131278528/ch3"},{"id":"ln-p-pace","type":"flip","cat":"Pace & Distance","front":"What counts as one pace?","back":"Each time the same foot (usually the left) hits the ground. One pace = two steps.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.baoc.org/wiki/Training/Pace_Counting"},{"id":"ln-p-course","type":"flip","cat":"Pace & Distance","front":"Finding your pace count","back":"Walk a measured 100 m course on flat ground a few times, counting paces, and average the counts.","note":"Check it again with your gear on, on rough ground and at night. The count goes up.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://sofrep.com/specialoperations/passing-sfas-know-pace-count/"},{"id":"ln-p-beads","type":"flip","cat":"Pace & Distance","front":"Pace beads (ranger beads)","back":"Beads on a cord that keep your count for you. Slide one lower bead every 100 m. When the lower beads run out, slide one upper bead (1 km) and reset the lower ones.","why":"Cold, stress and distractions make you lose a count kept in your head.","source":"Pace count beads (common military land-navigation practice)","verified":"https://en.wikipedia.org/wiki/Pace_count_beads"},{"id":"ln-p-eye","type":"flip","cat":"Pace & Distance","front":"Estimating distance by eye","back":"Picture a 100 m length you know well and count how many fit between you and the object.","note":"A football field is close (about 91 m). The method gets unreliable past about 400 m.","source":"Unit-of-measure range estimation (military training)","verified":"https://digital.jmpublishing.ie/i/426395/28"},{"id":"ln-p-eye-mc","type":"mc","cat":"Pace & Distance","q":"Bright sun behind you, clear air. Objects will look…","choices":["Closer than they really are","Farther than they really are","The same distance","Blurry, so you can't judge"],"answer":0,"explain":"Bright light makes objects seem closer, so you tend to underestimate the distance.","source":"Unit-of-measure range estimation (military training)","verified":"https://digital.jmpublishing.ie/i/426395/28"},{"id":"ln-c-parts","type":"flip","cat":"Compass & Declination","front":"Lensatic compass: three main parts","back":"Cover: protects the dial and holds the sighting wire. Base: holds the floating dial and the bezel ring. Lens: magnifies the dial so you can read it.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.scribd.com/doc/131270589/ch9"},{"id":"ln-c-level","type":"flip","cat":"Compass & Declination","front":"Why hold the compass level?","back":"So the dial floats freely and settles on magnetic north. A tilted compass can drag and give a false reading.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://fieldandstream.com/stories/survival-stories/wilderness-survival/how-to-read-compass"},{"id":"ln-c-steer","type":"flip","cat":"Compass & Declination","front":"Following an azimuth","back":"Sight along the azimuth and pick a distinct object on that line (a steering mark). Walk to it, then pick the next one. Repeat.","note":"Don't walk staring at the compass. Look up and walk to your mark.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://strands.cacadets.org/strands/Strand_008/Strand_008_Handouts/TA_8-H-8_Basic_Compass_Topo_Map.pdf"},{"id":"ln-c-metal","type":"flip","cat":"Compass & Declination","front":"Keep metal away from the compass","back":"Power lines: 55 m. Truck or vehicle: 18 m. Barbed wire or phone wire: 10 m. Rifle or steel helmet: ½ m.","note":"Phones, keys and belt buckles pull the needle too.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://strands.cacadets.org/strands/Strand_051/Strand_051_Posters_Letter/TA_51-P-2_Map_Reading_Lensatic_Compass.pdf"}]},{"meta":{"id":"processing","reverseFlip":true,"reverseAsk":"Which form or rule is this?","reverseMatch":"^(Forms? |\\d|8 |INA |Stipulated)","name":"Processing","short":"PROC","color":"#9FB6C9","order":6,"requireVerified":true,"blurb":"Which forms go with which case: expedited removal, reinstatement, NTA, voluntary return and more.","subModes":["browse"]},"categories":{"Expedited Removal":{"why":"8 C.F.R. 235.3(b) names the forms. A missing signature or step can undo the order."},"Reinstatement":{"why":"241.8 sets three findings and a notice. Skip one and the reinstatement is open to challenge."},"Notice to Appear":{"why":"An NTA case goes to an immigration judge, and the paperwork you start becomes the court record."},"Voluntary Return":{"why":"A return without a hearing has to be knowing and documented, or it won't hold up later."},"Administrative Removal":{"why":"For non-LPR aggravated felons an officer, not a judge, issues the order. The notice is the whole case."},"Common Forms":{"why":"These forms show up across dispositions. Know them by number."},"Which Packet?":{"why":"In the field you start from the subject's situation, not the form number."}},"cards":[{"id":"pr-er-i860","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"Form I-860","back":"Notice and Order of Expedited Removal. The officer advises the alien of the charges on the I-860. After supervisory concurrence the I-860 is served, and the alien signs the reverse to acknowledge receipt.","note":"Interpretive assistance is used if needed to communicate with the alien (235.3(b)(2)(i)).","why":"The charging document and the order in one form.","source":"8 C.F.R. § 235.3(b)(2)(i)","verified":"https://syfert.com/cfr/sections/8-235.3.html"},{"id":"pr-er-i867","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"Forms I-867A and I-867B","back":"Record of Sworn Statement in Proceedings under Section 235(b)(1) (I-867A) and its Jurat (I-867B). The officer reads the I-867A information to the alien, records the statement and the I-867B answers, and the alien signs and initials each page and each correction.","note":"The regulation calls the pair Form I-867AB. DHS has revised both forms recently, so use the current version.","why":"The sworn statement is the record of the case. Every ER case needs one.","source":"8 C.F.R. § 235.3(b)(2)(i)","verified":"https://syfert.com/cfr/sections/8-235.3.html"},{"id":"pr-er-sequence","type":"order","cat":"Expedited Removal","binding":"regulation","q":"Put the expedited removal record steps in the order 235.3(b)(2)(i) gives them.","steps":["Read the I-867A information to the alien and take the sworn statement","Record the I-867B answers; the alien reads, signs and initials each page","Advise the alien of the charges on the I-860 and let them respond in the statement","Get supervisory concurrence","Serve the I-860; the alien signs the reverse"],"explain":"Statement first, then charges, then supervisor, then service. The order isn't final without supervisory review (235.3(b)(7)).","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"The regulation sets the sequence. Courts look for each step.","source":"8 C.F.R. § 235.3(b)(2)(i)","verified":"https://syfert.com/cfr/sections/8-235.3.html"},{"id":"pr-er-charges","type":"mc","cat":"Expedited Removal","binding":"regulation","q":"In expedited removal, which inadmissibility charges may be lodged?","choices":["Any ground in 212(a)","Only 212(a)(6)(C) or 212(a)(7)","Only 212(a)(9)","Only 237(a) deportability grounds"],"answer":1,"explain":"235.3(b)(3): only 212(a)(6)(C) (fraud or misrepresentation) or 212(a)(7) (no valid documents). To pursue other grounds, the alien is referred for a removal hearing before an immigration judge.","why":"Charging the wrong ground in ER is a defect on the face of the I-860.","source":"8 C.F.R. § 235.3(b)(3)","verified":"https://www.govinfo.gov/content/pkg/CFR-2021-title8-vol1/xml/CFR-2021-title8-vol1-sec235-3.xml"},{"id":"pr-er-supervisor","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"8 C.F.R. 235.3(b)(7) — review of ER orders","back":"An ER order must be reviewed and approved by the appropriate supervisor before it is final. That review may not be delegated below a second-line supervisor (or someone acting in that role). It covers the sworn statement and any answers about fear of return.","note":"Checked via an INS expedited removal memo that states the same rule; confirm against the current eCFR text.","why":"No supervisory approval, no final order.","source":"8 C.F.R. § 235.3(b)(7)","verified":"https://www.aila.org/library/ins-memo-on-expedited-removal"},{"id":"pr-er-m444","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"Form M-444","back":"Information About Credible Fear Interview. The written disclosure given when an ER subject is referred for a credible fear interview. It covers: the purpose of the referral and the interview process; the right to consult others before the interview; the right to ask an immigration judge to review the asylum officer's finding; and the consequences of not establishing credible fear.","note":"At the interview the asylum officer verifies the alien received the M-444 (8 C.F.R. 208.30).","why":"The fear referral has its own paperwork.","source":"8 C.F.R. § 235.3(b)(4)(i)","verified":"https://www.govinfo.gov/content/pkg/CFR-2021-title8-vol1/xml/CFR-2021-title8-vol1-sec235-3.xml"},{"id":"pr-er-fear","type":"mc","cat":"Expedited Removal","binding":"regulation","q":"An ER subject says they're afraid to go back. Under 235.3(b)(4), what must the sworn statement record?","choices":["Nothing. Fear goes on a separate form only","Enough to show the alien expressed the fear or intent, and enough to establish inadmissibility","Only the alien's country of citizenship","A full asylum interview"],"answer":1,"explain":"Stop the removal and refer for an asylum officer interview. The sworn statement records enough to show the fear or intent was expressed, plus the inadmissibility facts.","why":"The supervisor reviews the fear answers before approving any order.","source":"8 C.F.R. § 235.3(b)(4)","verified":"https://www.govinfo.gov/content/pkg/CFR-2021-title8-vol1/xml/CFR-2021-title8-vol1-sec235-3.xml"},{"id":"pr-er-status-claim","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"ER subject claims to be an LPR, refugee, asylee or U.S. citizen","back":"The officer must try to verify the claim (235.3(b)(5)). If LPR, refugee or asylee status is verified and DHS starts section 240 proceedings: Form I-862 Notice to Appear (235.6(a)(1)). If the claim can't be verified and an ER order is entered: the order is referred to an immigration judge on Form I-863 (235.6(a)(2)).","why":"A status claim changes which form you need.","source":"8 C.F.R. §§ 235.3(b)(5), 235.6(a)","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-235/section-235.6"},{"id":"pr-er-i869-i863","type":"flip","cat":"Expedited Removal","binding":"regulation","front":"Forms I-869 and I-863 (negative credible fear)","back":"I-869: Record of Negative Credible Fear Finding and Request for Review by Immigration Judge. The alien marks whether they want review, and refusing to mark one counts as declining. I-863: Notice of Referral to Immigration Judge. Filing it with the record starts the judge's review.","note":"The judge's review is to finish within 24 hours if practicable, and no later than 7 days after the supervisory asylum officer concurs.","why":"Know what happens after the asylum officer, so you can explain it and track the case.","source":"8 C.F.R. § 1003.42","verified":"https://www.law.cornell.edu/cfr/text/8/1003.42"},{"id":"pr-ri-i871","type":"flip","cat":"Reinstatement","binding":"regulation","front":"Form I-871","back":"Notice of Intent/Decision to Reinstate Prior Order. The written notice of the officer's reinstatement determination under 241.8(b). It also tells the alien they may contest it.","note":"Courts treat a completed I-871 as the reinstated final order of removal.","why":"The single form at the center of a reinstatement case.","source":"8 C.F.R. § 241.8(b)","verified":"https://www.ca5.uscourts.gov/Opinions/unpub/04/04-60756.0.wpd.pdf"},{"id":"pr-ri-sequence","type":"order","cat":"Reinstatement","binding":"regulation","q":"Put the 241.8 reinstatement steps in order.","steps":["Determine the alien is subject to a prior order, and obtain that order","Confirm identity: the same person named in the prior order","Determine the alien unlawfully reentered","Give written notice (I-871) and advise the alien may make a written or oral statement","Consider any statement, then remove under the prior order"],"explain":"241.8(a)(1)–(3) are the three findings. (b) is notice and the chance to contest. (c) is removal under the prior order.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"Each finding needs support in the file.","source":"8 C.F.R. § 241.8(a)–(c)","verified":"https://syfert.com/cfr/sections/8-241.8.html"},{"id":"pr-ri-identity","type":"flip","cat":"Reinstatement","binding":"regulation","front":"241.8(a)(2) — disputed identity","back":"In disputed cases, identity is verified by comparing the fingerprints in the prior removal record with the subject's fingerprints. In a disputed case with no fingerprints, the alien may not be removed under 241.8.","why":"No print match in a disputed case means no reinstatement.","source":"8 C.F.R. § 241.8(a)(2)","verified":"https://syfert.com/cfr/sections/8-241.8.html"},{"id":"pr-ri-reentry","type":"flip","cat":"Reinstatement","binding":"regulation","front":"241.8(a)(3) — unlawful reentry","back":"In deciding whether the alien unlawfully reentered, the officer shall consider all relevant evidence, including statements made by the alien and any evidence in the alien's possession.","why":"Write down how you know the reentry was unlawful.","source":"8 C.F.R. § 241.8(a)(3)","verified":"https://syfert.com/cfr/sections/8-241.8.html"},{"id":"pr-ri-statement","type":"mc","cat":"Reinstatement","binding":"regulation","q":"After deciding to reinstate, what must the officer tell the alien under 241.8(b)?","choices":["They have a right to a hearing before an immigration judge","They may make a written or oral statement contesting the determination","They have 10 days to file an appeal with the BIA","Nothing; reinstatement needs no notice"],"answer":1,"explain":"Written notice plus the right to make a written or oral statement. If the alien makes one, the officer considers whether it warrants reconsidering. There is no right to a judge hearing (241.8(a)).","why":"The statement opportunity is a required step.","source":"8 C.F.R. § 241.8(a)–(b)","verified":"https://syfert.com/cfr/sections/8-241.8.html"},{"id":"pr-ri-statute","type":"flip","cat":"Reinstatement","binding":"statute","front":"8 U.S.C. § 1231(a)(5) — INA 241(a)(5)","back":"If an alien reenters illegally after removal (or after leaving under a removal order), the prior order is reinstated from its original date and is not subject to being reopened or reviewed. The alien is not eligible for and may not apply for any relief, and shall be removed under the prior order at any time after the reentry.","note":"Courts of appeals can still review constitutional claims and questions of law.","why":"Why reinstatement is fast, and why the three findings matter so much.","source":"8 U.S.C. § 1231(a)(5)","verified":"https://www.justice.gov/osg/media/227851/dl"},{"id":"pr-ri-fear","type":"flip","cat":"Reinstatement","binding":"regulation","front":"241.8(e) — fear after reinstatement","back":"If the alien expresses fear of returning to the country named in the prior order, they are immediately referred to an asylum officer for a reasonable fear interview under 8 C.F.R. 208.31.","note":"208.31: absent exceptional circumstances, the determination is made within 10 days of referral. A positive finding goes to an immigration judge on Form I-863 for withholding or CAT only. The reinstated order itself stays.","why":"Reinstatement fear claims use reasonable fear, not credible fear.","source":"8 C.F.R. §§ 241.8(e), 208.31","verified":"https://www.law.cornell.edu/cfr/text/8/208.31"},{"id":"pr-ri-cf-vs-rf","type":"mc","cat":"Reinstatement","binding":"regulation","q":"Which fear screening applies to reinstatement and 238(b) administrative removal cases?","choices":["Credible fear, 8 C.F.R. 208.30","Reasonable fear, 8 C.F.R. 208.31","A full asylum hearing in every case","No fear screening"],"answer":1,"explain":"208.31 covers aliens ordered removed under INA 238(b) or whose prior order is reinstated under INA 241(a)(5). Credible fear (208.30) is for expedited removal.","why":"The wrong screening type means the wrong referral.","source":"8 C.F.R. § 208.31(a)","verified":"https://www.law.cornell.edu/cfr/text/8/208.31"},{"id":"pr-nta-i862","type":"flip","cat":"Notice to Appear","binding":"regulation","front":"Form I-862","back":"Notice to Appear. The charging document for removal proceedings under INA section 240 before an immigration judge. DHS serves it, then files it with the immigration court. Proceedings begin when it is filed.","why":"The NTA starts the case. Its allegations and charges have to be right.","source":"8 C.F.R. §§ 239.1, 1003.13, 1003.14(a)","verified":"https://www.law.cornell.edu/cfr/text/8/part-1003/subpart-C"},{"id":"pr-nta-issuers","type":"mc","cat":"Notice to Appear","binding":"regulation","q":"Which regulation lists the officers (including chief patrol agents, patrol agents in charge and supervisory Border Patrol agents) who may issue an NTA?","choices":["8 C.F.R. 287.5(e)","8 C.F.R. 239.1(a)","8 C.F.R. 241.2(a)","8 C.F.R. 235.3(b)"],"answer":1,"explain":"239.1(a). Its last item covers other officers delegated the authority under 8 C.F.R. 2.1 who have completed the required training. 241.2(a) is the I-205 list.","why":"An NTA signed by someone without authority invites a challenge.","source":"8 C.F.R. § 239.1(a)","verified":"https://www.law.cornell.edu/cfr/text/8/239.1"},{"id":"pr-nta-2873c","type":"flip","cat":"Notice to Appear","binding":"regulation","front":"8 C.F.R. 287.3(c) — advisals for a warrantless arrest placed in proceedings","back":"Advise the alien of the reasons for arrest and the right to be represented at no expense to the government. Give the list of free legal service providers for the district where the hearing will be held, and note on the I-862 that the list was given. Advise that any statement made may be used against them in a later proceeding.","why":"The NTA itself records that you gave the legal services list.","source":"8 C.F.R. § 287.3(c)","verified":"https://syfert.com/cfr/sections/8-287.3.html"},{"id":"pr-nta-i200","type":"flip","cat":"Notice to Appear","binding":"regulation","front":"Form I-200","back":"Warrant of Arrest (the form itself reads \"Warrant for Arrest of Alien\"). From the time the NTA is issued until removal proceedings end, the respondent may be arrested and taken into custody under an I-200. Only officers listed in 287.5(e)(2) may issue it.","note":"An issuing-level officer may cancel an unserved I-200 (236.1(b)(2)).","why":"The administrative warrant that goes with an NTA case.","source":"8 C.F.R. § 236.1(b)","verified":"https://www.law.cornell.edu/cfr/text/8/236.1"},{"id":"pr-nta-i286","type":"flip","cat":"Notice to Appear","binding":"policy","front":"Form I-286","back":"Notice of Custody Determination. Records the initial DHS decision to detain or release, including release on recognizance, bond or conditions. Unless the alien is subject to mandatory detention, they may ask an immigration judge to review it.","note":"Description from a public practice advisory. The custody rules themselves are in 8 C.F.R. 236.1.","why":"The custody decision is part of every NTA case.","source":"8 C.F.R. § 236.1; ILRC bond-hearing practice advisory (2018)","verified":"https://store.ilrc.org/sites/default/files/resources/represent_detain_clients_bond_hearings-20180629v2.pdf"},{"id":"pr-nta-i863","type":"mc","cat":"Notice to Appear","binding":"regulation","q":"An asylum officer finds no credible fear and the alien requests a judge's review. Which form sends the case to the immigration judge?","choices":["I-862 Notice to Appear","I-863 Notice of Referral to Immigration Judge","I-871","I-851"],"answer":1,"explain":"235.6(a)(2): I-863 for negative credible fear reviews and some ER order reviews. 235.6(a)(1): I-862 for section 240 proceedings.","why":"I-862 and I-863 both go to a judge, but they start different proceedings.","source":"8 C.F.R. § 235.6(a)","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-235/section-235.6"},{"id":"pr-nta-stipulated","type":"flip","cat":"Notice to Appear","binding":"regulation","front":"Stipulated removal — 8 C.F.R. 1003.25(b)","back":"An immigration judge may enter a removal order on a written stipulation between DHS and the alien, without a hearing, based on the charging document, the stipulation and any supporting documents. The alien admits the factual allegations, concedes removability, says no relief is sought and designates a country. If the alien is unrepresented, the judge must find the waiver voluntary, knowing and intelligent.","note":"A stipulated order is a conclusive determination of removability.","why":"It's still an NTA case, so the charging document has to be filed.","source":"8 C.F.R. § 1003.25(b)","verified":"https://www.law.cornell.edu/cfr/text/8/1003.25"},{"id":"pr-vr-i826","type":"flip","cat":"Voluntary Return","binding":"policy","front":"Form I-826","back":"Notice of Rights and Request for Disposition. The Notice of Rights covers the right to a hearing before an immigration judge, to consult a lawyer, and to contact consular officials. The alternative is to ask to return without a hearing. The Request for Disposition lets the alien choose a hearing, say they fear return, or accept return.","note":"CBP uses the I-826 for voluntary return in lieu of removal proceedings.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"The signed I-826 is the proof that the return was knowing and voluntary.","source":"Rosario-Mijangos v. Holder, 717 F.3d 269 (2d Cir. 2013)","verified":"https://ww3.ca2.uscourts.gov/decisions/OPN/11-1607_opn.pdf"},{"id":"pr-vr-consequence","type":"mc","cat":"Voluntary Return","binding":"2d Cir.","q":"In Rosario-Mijangos, why did documented voluntary returns at the border matter years later?","choices":["They counted as removal orders","They broke his continuous physical presence for cancellation of removal","They made him a U.S. citizen","They had no legal effect"],"answer":1,"explain":"The returns came from a formal, documented process after an inadmissibility finding, so they broke continuous physical presence.","why":"An I-826 return can decide someone's eligibility for relief later. Complete it accurately.","source":"Rosario-Mijangos v. Holder, 717 F.3d 269 (2d Cir. 2013)","verified":"https://ww3.ca2.uscourts.gov/decisions/OPN/11-1607_opn.pdf"},{"id":"pr-vr-24025","type":"flip","cat":"Voluntary Return","binding":"regulation","front":"8 C.F.R. 240.25 — voluntary departure in lieu of proceedings","back":"Authorized officers, chief patrol agents among them, may grant it only if the alien requests it and agrees to its terms. Conditions can include bond, detention until departure, or removal under safeguards. The total time allowed, extensions included, can't exceed 120 days.","note":"The alien presents a passport or travel document for inspection and copying. Denial isn't appealable but doesn't bar asking an immigration judge under 240.26.","why":"The regulation behind a DHS voluntary departure grant.","source":"8 C.F.R. § 240.25","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-240/subpart-C/section-240.25"},{"id":"pr-vr-i210","type":"mc","cat":"Voluntary Return","binding":"regulation","q":"Under 240.25, every DHS decision on voluntary departure is communicated in writing on which form?","choices":["I-210","I-826","I-286","I-294"],"answer":0,"explain":"Form I-210, Notice of Action—Voluntary Departure. A revocation must also be in writing.","why":"Grant or deny, the decision goes on the I-210.","source":"8 C.F.R. § 240.25","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-240/subpart-C/section-240.25"},{"id":"pr-vr-120","type":"mc","cat":"Voluntary Return","binding":"regulation","q":"DHS voluntary departure under 240.25: maximum total period, extensions included?","choices":["30 days","60 days","120 days","1 year"],"answer":2,"explain":"120 days total. The authorized officer sets the period and may extend it within that cap.","why":"A date on the I-210 past the cap is an error.","source":"8 C.F.R. § 240.25","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-240/subpart-C/section-240.25"},{"id":"pr-vr-i770","type":"flip","cat":"Voluntary Return","binding":"regulation","front":"Form I-770 (minors)","back":"Notice of Rights and Request for Disposition for minors. Every minor or unaccompanied child entering DHS custody is issued an I-770. It is provided, read or explained in a language and manner they understand. It explains the rights to make phone calls, to have a lawyer, and to a removal hearing.","note":"The 2019 rule dropped the old under-14 qualifier. The phone-call safeguard comes from Perez-Funez v. District Director (C.D. Cal. 1985).","flag":"Juvenile custody rules are still being litigated (Flores). Follow current policy.","why":"Minors get their own rights form.","source":"8 C.F.R. § 236.3; 84 Fed. Reg. 44392 (Aug. 23, 2019)","verified":"https://www.govinfo.gov/content/pkg/FR-2019-08-23/pdf/2019-17927.pdf"},{"id":"pr-ar-who","type":"flip","cat":"Administrative Removal","binding":"statute","front":"INA 238(b) / 8 U.S.C. § 1228(b) — administrative removal","back":"DHS may order removed, without a hearing before an immigration judge, an alien deportable for an aggravated felony conviction who was not a lawful permanent resident when proceedings began, or held only conditional LPR status. A DHS officer makes the decision, and the alien is not eligible for discretionary relief.","why":"Know who qualifies before you start an I-851.","source":"8 U.S.C. § 1228(b)","verified":"https://m.openjurist.org/8/usc/1228"},{"id":"pr-ar-i851","type":"flip","cat":"Administrative Removal","binding":"regulation","front":"Form I-851","back":"Notice of Intent to Issue a Final Administrative Removal Order. It is the charging document, with factual allegations and conclusions of law. Proceedings begin when it is personally served on the alien.","why":"The I-851 is the whole charging case. There is no NTA.","source":"8 C.F.R. § 238.1(b)","verified":"https://www.govinfo.gov/content/pkg/CFR-2023-title8-vol1/pdf/CFR-2023-title8-vol1-part238.pdf"},{"id":"pr-ar-i851a","type":"flip","cat":"Administrative Removal","binding":"regulation","front":"Form I-851A","back":"Final Administrative Removal Order. Issued by the deciding officer, who must not be the same person as the officer who issued the I-851.","why":"The issuing officer and the deciding officer must be different people.","source":"8 C.F.R. § 238.1(a), (d)","verified":"https://www.justice.gov/sites/default/files/eoir/legacy/2014/08/15/8CFR12381.pdf"},{"id":"pr-ar-advisals","type":"mc","cat":"Administrative Removal","binding":"regulation","q":"How long does the alien have to rebut the charges in an I-851 that was personally served?","choices":["48 hours","10 calendar days","30 days","No rebuttal is allowed"],"answer":1,"explain":"10 calendar days after service (13 if served by mail). The I-851 also advises of the right to counsel at no government expense, the right to request withholding of removal, and the right to inspect the evidence.","why":"The advisals are printed requirements, not extras.","source":"8 C.F.R. § 238.1(b)(2)","verified":"https://www.govinfo.gov/content/pkg/CFR-2023-title8-vol1/pdf/CFR-2023-title8-vol1-part238.pdf"},{"id":"pr-ar-14day","type":"mc","cat":"Administrative Removal","binding":"statute","q":"After a final administrative removal order issues, how long before it can be executed (unless the alien waives)?","choices":["Immediately","72 hours","14 calendar days","90 days"],"answer":2,"explain":"INA 238(b)(3): not executed until 14 calendar days after issuance unless waived, so the alien has time to seek judicial review.","why":"Removal planning has to allow for the 14 days.","source":"8 U.S.C. § 1228(b)(3)","verified":"https://www.justice.gov/osg/media/199621/dl"},{"id":"pr-ar-sequence","type":"order","cat":"Administrative Removal","binding":"regulation","q":"Put the 238(b) administrative removal steps in order.","steps":["Issuing officer personally serves the I-851","Alien has 10 calendar days to rebut","A different deciding officer issues the I-851A","14 calendar days pass before execution, unless waived"],"explain":"Notice, rebuttal period, final order by a different officer, then the 14-day wait.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"Each step has a time or person requirement.","source":"8 C.F.R. § 238.1; 8 U.S.C. § 1228(b)(3)","verified":"https://www.govinfo.gov/content/pkg/CFR-2023-title8-vol1/pdf/CFR-2023-title8-vol1-part238.pdf"},{"id":"pr-cf-i213","type":"flip","cat":"Common Forms","binding":"persuasive (BIA)","front":"Form I-213","back":"Record of Deportable/Inadmissible Alien. The officer's official record summarizing what was learned at initial processing. Unless shown to be incorrect or obtained by coercion, the BIA treats it as inherently trustworthy and admissible.","note":"Matter of Mejia, 16 I&N Dec. 6 (BIA 1976); Matter of Barcenas, 19 I&N Dec. 609 (BIA 1988). An unchallenged I-213 can be enough to prove removability.","why":"Whatever the disposition, your I-213 narrative is evidence. Write it accurately.","source":"Matter of Mejia, 16 I&N Dec. 6 (BIA 1976)","verified":"https://www.justice.gov/eoir/vll/intdec/vol16/2527.pdf"},{"id":"pr-cf-i247a","type":"flip","cat":"Common Forms","binding":"policy","front":"Form I-247A","back":"Immigration Detainer – Notice of Action. Asks another law enforcement agency to notify DHS and hold the person for transfer. The officer needs probable cause that the person is a removable alien. Under ICE Policy 10074.2 (2017), it goes with a signed I-200 or I-205.","note":"The 48-hour hold limit is in 8 C.F.R. 287.7(d) (see Statutes).","flag":"Detainer policy and the warrant requirement have changed through litigation and settlements. Follow current policy.","why":"A detainer is only as good as its probable cause.","source":"ICE Form I-247A guidance (2017); ICE Policy 10074.2","verified":"https://ice.gov/sites/default/files/documents/Document/2017/I-247A-Guidance.PDF"},{"id":"pr-cf-i205","type":"flip","cat":"Common Forms","binding":"regulation","front":"Form I-205","back":"Warrant of Removal/Deportation. Issued on a final removal order by officials listed in 241.2(a)(1), chief patrol agents among them. Any officer authorized under 287.5(e)(3) to execute administrative arrest warrants may execute it.","why":"The I-205 is what authorizes carrying out the order.","source":"8 C.F.R. § 241.2","verified":"https://www.law.cornell.edu/cfr/text/8/241.2"},{"id":"pr-cf-i200-vs-i205","type":"mc","cat":"Common Forms","binding":"regulation","q":"The NTA is issued and proceedings are pending. Which warrant authorizes the arrest?","choices":["I-205 Warrant of Removal/Deportation","I-200 Warrant of Arrest","I-247A","I-871"],"answer":1,"explain":"I-200 for arrest while proceedings are pending (236.1(b)). I-205 comes after a final order (241.2).","why":"I-200 is before a final order. I-205 is after one.","source":"8 C.F.R. §§ 236.1(b), 241.2(a)","verified":"https://www.law.cornell.edu/cfr/text/8/236.1"},{"id":"pr-cf-i296","type":"flip","cat":"Common Forms","binding":"persuasive (9th Cir.)","front":"Form I-296","back":"Notice to Alien Ordered Removed/Departure Verification. Records the removal. The bottom half verifies the physical departure: date, port and manner of departure, the verifying officer's signature, and the alien's photo, signature and right index fingerprint.","note":"United States v. Lopez (9th Cir. 2014): the verification of removal is nontestimonial and admissible as a public record in a § 1326 prosecution.","why":"This is the proof of removal a later § 1326 case will rely on.","source":"United States v. Lopez, No. 12-50464 (9th Cir. 2014)","verified":"https://cdn.ca9.uscourts.gov/datastore/opinions/2014/08/07/12-50464.pdf"},{"id":"pr-cf-i294","type":"flip","cat":"Common Forms","binding":"policy","front":"Form I-294","back":"Warning to Alien Ordered Removed or Deported. Tells the alien they are barred from returning for a set period under INA 212(a)(9), and must get permission to reapply for admission (Form I-212) before coming back.","note":"Description from a public USCIS FOIA release of the form. The bar periods are statutory.","why":"The written warning supports a later reentry charge.","source":"USCIS FOIA release (Form I-294); INA § 212(a)(9)","verified":"https://uscis.gov/sites/default/files/document/foia/PRD2014000534-John_Demjanjuk.pdf"},{"id":"pr-cf-bars","type":"mc","cat":"Common Forms","binding":"statute","q":"Removed once as an arriving alien (no aggravated felony). How long is the 212(a)(9)(A) bar?","choices":["5 years","10 years","20 years","Permanent"],"answer":0,"explain":"5 years for arriving aliens removed once. 10 years if removed other than as an arriving alien. 20 years if removed more than once. Any time if convicted of an aggravated felony.","why":"The I-294 warning states these bars. Know them.","source":"INA § 212(a)(9)(A); USCIS Form I-212 instructions","verified":"https://www.uscis.gov/sites/default/files/document/forms/i-212instr.pdf"},{"id":"pr-sc-er","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"Adult subject, amenable to expedited removal, inadmissible under 212(a)(7). No fear claim, no claim to status, no prior orders.","q":"Which forms make up the core ER record and order?","choices":["I-862 and I-286","I-867A/B and I-860","I-871 only","I-851 and I-851A"],"answer":1,"explain":"Sworn statement on I-867A/B, then the charges and order on I-860, served after supervisory concurrence (235.3(b)(2)(i), (b)(7)).","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"Expedited removal: sworn statement plus I-860.","source":"8 C.F.R. § 235.3(b)(2)(i)","verified":"https://syfert.com/cfr/sections/8-235.3.html"},{"id":"pr-sc-er-fear","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"Halfway through the I-867B, an ER subject says they fear being harmed if returned.","q":"What do you do?","choices":["Finish and serve the I-860","Stop the removal, record the fear in the sworn statement, give the M-444 and refer for a credible fear interview","Switch to an I-871","Issue an I-826"],"answer":1,"explain":"235.3(b)(4): don't proceed with removal. Record enough to show the fear, give the M-444 disclosure, and refer to an asylum officer.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"A fear claim in ER means a referral, not a removal.","source":"8 C.F.R. § 235.3(b)(4)","verified":"https://www.govinfo.gov/content/pkg/CFR-2021-title8-vol1/xml/CFR-2021-title8-vol1-sec235-3.xml"},{"id":"pr-sc-reinstate","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"Fingerprints match a subject removed under a final order three years ago. The subject admits crossing between ports last week and says nothing about fear.","q":"Which disposition and form fit?","choices":["Expedited removal, I-860","Reinstatement, I-871","Administrative removal, I-851","NTA, I-862 only"],"answer":1,"explain":"Prior order, identity and unlawful reentry: the three 241.8(a) findings. Notice on I-871 with the chance to make a statement.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"A prior order plus unlawful reentry points to reinstatement.","source":"8 C.F.R. § 241.8","verified":"https://syfert.com/cfr/sections/8-241.8.html"},{"id":"pr-sc-reinstate-fear","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"Same reinstatement case. After the I-871 is served, the subject says they're afraid to return to the country named in the prior order.","q":"What happens next?","choices":["Credible fear referral with M-444","Immediate referral to an asylum officer for a reasonable fear interview","The prior order is cancelled and an NTA issues","Nothing; reinstated orders allow no fear claims"],"answer":1,"explain":"241.8(e) → 208.31 reasonable fear. The reinstated order stays; only withholding or CAT can be considered.","why":"Reasonable fear, not credible fear.","source":"8 C.F.R. § 241.8(e)","verified":"https://www.law.cornell.edu/cfr/text/8/208.31"},{"id":"pr-sc-aggfel","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"A non-LPR subject in custody has a final conviction that qualifies as an aggravated felony. No prior removal order.","q":"Which charging document fits a 238(b) case?","choices":["I-860","I-871","I-851 Notice of Intent","I-826"],"answer":2,"explain":"I-851, personally served, then the I-851A from a different deciding officer. 238.1 and 8 U.S.C. 1228(b).","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"Non-LPR aggravated felon with no prior order: think 238(b).","source":"8 C.F.R. § 238.1(b)","verified":"https://www.govinfo.gov/content/pkg/CFR-2023-title8-vol1/pdf/CFR-2023-title8-vol1-part238.pdf"},{"id":"pr-sc-status-verified","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"During ER processing the subject claims to be a lawful permanent resident, and you verify it. DHS will pursue removal.","q":"Which form starts the case?","choices":["I-860","I-862 Notice to Appear","I-871","I-826"],"answer":1,"explain":"235.6(a)(1): verified LPR, refugee or asylee status with section 240 proceedings → I-862.","why":"Verified status takes the case out of ER.","source":"8 C.F.R. § 235.6(a)(1)","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-235/section-235.6"},{"id":"pr-sc-vr","type":"scenario","cat":"Which Packet?","binding":"policy","setup":"An adult subject eligible for voluntary return is advised of their rights and chooses to go home without a hearing.","q":"Which form records the rights advisal and that choice?","choices":["I-826","I-860","I-851A","I-247A"],"answer":0,"explain":"I-826 Notice of Rights and Request for Disposition. Rights to a hearing, a lawyer and consular contact, then the chosen disposition.","flag":"Packet contents and order can vary by sector. Follow your current SOP.","why":"Voluntary return is documented on the I-826.","source":"Rosario-Mijangos v. Holder, 717 F.3d 269 (2d Cir. 2013)","verified":"https://ww3.ca2.uscourts.gov/decisions/OPN/11-1607_opn.pdf"},{"id":"pr-sc-minor","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"A 15-year-old with no parent or legal guardian is taken into DHS custody.","q":"Which rights form must be issued?","choices":["I-826 only","I-770","I-294","I-213 only"],"answer":1,"explain":"236.3: every minor or unaccompanied child entering DHS custody is issued an I-770, provided, read or explained in a language and manner they understand.","flag":"Juvenile custody rules are still being litigated (Flores). Follow current policy.","why":"Minors get the I-770.","source":"8 C.F.R. § 236.3","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-236/subpart-A/section-236.3"},{"id":"pr-sc-claimed-unverified","type":"scenario","cat":"Which Packet?","binding":"regulation","setup":"An ER subject swears they're a U.S. citizen. You can't verify it, and an ER order is entered.","q":"What happens to the order?","choices":["Executed right away","Referred to an immigration judge for review on I-863","Converted to an I-871","Replaced by an I-826"],"answer":1,"explain":"235.6(a)(2): an ER order entered on someone claiming LPR, refugee, asylee or citizen status that couldn't be verified is referred to the judge on I-863.","why":"Unverified status claims get a judge's review.","source":"8 C.F.R. §§ 235.3(b)(5), 235.6(a)(2)","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-235/section-235.6"}]},{"meta":{"id":"radio","name":"Radio","short":"RAD","color":"#8DB37A","order":11,"blurb":"ICAO alphabet, number pronunciation, prowords, and BP 10-codes and jargon.","subModes":["browse"]},"categories":{"Phonetic Alphabet":{"ask":"How do you say this letter on the radio?","why":"Plates and names have to get through noise and a bad signal on the first try."},"Numbers":{"ask":"How do you say this number on the radio?","why":"Radio numbers are said a set way so they aren't misheard on a weak signal. NIN-ER keeps 9 from sounding like 5 (FIFE), and TREE keeps 3 clear."},"Prowords":{"ask":"What does this proword mean?","why":"Prowords say in one word what you need from the other station."},"Procedure":{"why":"Clear, standard traffic keeps the channel open for whoever needs it next."},"Etiquette":{"why":"One channel, many units. Good habits keep it clear for the call that matters.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)"},"BP 10-Codes":{"ask":"What does this code mean?","why":"Know the codes you'll hear on BP traffic. On multi-agency incidents, use plain language (NIMS).","source":"HonorFirst.com, \"Border Patrol 10 Codes & Jargon\" (updated Mar. 2025)"},"BP Jargon":{"ask":"What does this mean?","why":"The shorthand you'll hear in the field and in reports.","source":"HonorFirst.com, \"Border Patrol 10 Codes & Jargon\" (updated Mar. 2025)"}},"cards":[{"id":"rd-l-a","type":"flip","cat":"Phonetic Alphabet","front":"A","back":"ALFA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-b","type":"flip","cat":"Phonetic Alphabet","front":"B","back":"BRAVO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-c","type":"flip","cat":"Phonetic Alphabet","front":"C","back":"CHARLIE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-d","type":"flip","cat":"Phonetic Alphabet","front":"D","back":"DELTA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-e","type":"flip","cat":"Phonetic Alphabet","front":"E","back":"ECHO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-f","type":"flip","cat":"Phonetic Alphabet","front":"F","back":"FOXTROT","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-g","type":"flip","cat":"Phonetic Alphabet","front":"G","back":"GOLF","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-h","type":"flip","cat":"Phonetic Alphabet","front":"H","back":"HOTEL","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-i","type":"flip","cat":"Phonetic Alphabet","front":"I","back":"INDIA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-j","type":"flip","cat":"Phonetic Alphabet","front":"J","back":"JULIETT","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-k","type":"flip","cat":"Phonetic Alphabet","front":"K","back":"KILO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-l","type":"flip","cat":"Phonetic Alphabet","front":"L","back":"LIMA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-m","type":"flip","cat":"Phonetic Alphabet","front":"M","back":"MIKE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-n","type":"flip","cat":"Phonetic Alphabet","front":"N","back":"NOVEMBER","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-o","type":"flip","cat":"Phonetic Alphabet","front":"O","back":"OSCAR","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-p","type":"flip","cat":"Phonetic Alphabet","front":"P","back":"PAPA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-q","type":"flip","cat":"Phonetic Alphabet","front":"Q","back":"QUEBEC","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-r","type":"flip","cat":"Phonetic Alphabet","front":"R","back":"ROMEO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-s","type":"flip","cat":"Phonetic Alphabet","front":"S","back":"SIERRA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-t","type":"flip","cat":"Phonetic Alphabet","front":"T","back":"TANGO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-u","type":"flip","cat":"Phonetic Alphabet","front":"U","back":"UNIFORM","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-v","type":"flip","cat":"Phonetic Alphabet","front":"V","back":"VICTOR","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-w","type":"flip","cat":"Phonetic Alphabet","front":"W","back":"WHISKEY","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-x","type":"flip","cat":"Phonetic Alphabet","front":"X","back":"X-RAY","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-y","type":"flip","cat":"Phonetic Alphabet","front":"Y","back":"YANKEE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-z","type":"flip","cat":"Phonetic Alphabet","front":"Z","back":"ZULU","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-spelling","type":"mc","cat":"Phonetic Alphabet","q":"Official ICAO spelling for A and J?","choices":["Alpha / Juliet","Alfa / Juliett","Alfa / Juliet","Alpha / Juliett"],"answer":1,"explain":"Alfa with an F and Juliett with a double T, so non-English speakers pronounce them correctly.","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-plate","type":"order","cat":"Phonetic Alphabet","q":"Read plate \"K Z R\" over the air, in order.","steps":["KILO","ZULU","ROMEO"],"explain":"Kilo, Zulu, Romeo. Say I SPELL first if it isn't clear you're spelling.","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-n-0","type":"flip","cat":"Numbers","front":"0","back":"ZE-RO","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-1","type":"flip","cat":"Numbers","front":"1","back":"WUN","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-2","type":"flip","cat":"Numbers","front":"2","back":"TOO","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-3","type":"flip","cat":"Numbers","front":"3","back":"TREE","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-4","type":"flip","cat":"Numbers","front":"4","back":"FOW-ER","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-5","type":"flip","cat":"Numbers","front":"5","back":"FIFE","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-6","type":"flip","cat":"Numbers","front":"6","back":"SIX","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-7","type":"flip","cat":"Numbers","front":"7","back":"SEV-EN","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-8","type":"flip","cat":"Numbers","front":"8","back":"AIT","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-9","type":"flip","cat":"Numbers","front":"9","back":"NIN-ER","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-mc","type":"mc","cat":"Numbers","q":"Which number is spoken \"FIFE\"?","choices":["4","5","9","3"],"answer":1,"explain":"FIFE = 5, FOW-ER = 4, NIN-ER = 9, TREE = 3.","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-p-roger","type":"flip","cat":"Prowords","front":"ROGER","back":"I have received your last transmission satisfactorily.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-wilco","type":"flip","cat":"Prowords","front":"WILCO","back":"I understand and will comply. Used on receipt of an order.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-say-again","type":"flip","cat":"Prowords","front":"SAY AGAIN","back":"I have not understood your message — repeat it. Often with ALL AFTER or ALL BEFORE.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-over","type":"flip","cat":"Prowords","front":"OVER","back":"End of my transmission; a response is necessary. Go ahead, transmit.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-out","type":"flip","cat":"Prowords","front":"OUT","back":"End of my transmission; no answer is required or expected.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-i-spell","type":"flip","cat":"Prowords","front":"I SPELL","back":"I will now spell the next word letter by letter, using the phonetic alphabet.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-correction","type":"flip","cat":"Prowords","front":"CORRECTION","back":"Disregard what I just sent; the correct version follows.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-break","type":"flip","cat":"Prowords","front":"BREAK","back":"Separates parts of a transmission.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-wait","type":"flip","cat":"Prowords","front":"WAIT","back":"Pause — wait for further transmission.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-overout","type":"mc","cat":"Prowords","q":"Why is \"OVER AND OUT\" incorrect?","choices":["It's too long","OVER asks for a reply and OUT says none is expected — they contradict","Only supervisors may say OUT","It's a 10-code"],"answer":1,"explain":"OVER and OUT are mutually exclusive. End with one or the other.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-sc-wilco","type":"scenario","cat":"Prowords","setup":"Dispatch tells you to hold your position and wait for backup. You understand and will do it.","q":"Best one-word reply?","choices":["ROGER WILCO","WILCO","OVER","COPY THAT, WILL DO"],"answer":1,"explain":"WILCO already means received, understood and will comply. ROGER WILCO is redundant.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-sc-sayagain","type":"scenario","cat":"Prowords","setup":"You copied the first half of a plate but lost the rest in static.","q":"What do you send?","choices":["REPEAT","SAY AGAIN ALL AFTER (last good word)","WHAT?","CORRECTION"],"answer":1,"explain":"SAY AGAIN with ALL AFTER or ALL BEFORE targets only the missed part.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-pr-plain","type":"mc","cat":"Procedure","q":"Under NIMS, what style of radio language is required when multiple agencies are working an incident?","choices":["Agency 10-codes","Plain language (common terminology)","Any code both units know","Phonetic alphabet only"],"answer":1,"explain":"NIMS/ICS requires common terminology: plain language that limits codes, abbreviations and jargon so mutual-aid responders understand each other.","source":"FEMA, NIMS Plain Language Guidance; IS-315 (ICS common terminology)","verified":"https://emilms.fema.gov/is_0315a/groups/143.html"},{"id":"rd-pr-why","type":"flip","cat":"Procedure","front":"Why did NIMS move away from 10-codes?","back":"Codes vary between agencies. Plain language lets responders from different agencies and disciplines understand each other, a problem highlighted in the September 11, 2001 response.","source":"FEMA, NIMS Plain Language Guidance","verified":"https://www.alicetraining.com/wp-content/uploads/2016/03/FEMA-Plain-Language-Guide.pdf"},{"id":"rd-pr-radiocheck","type":"flip","cat":"Procedure","front":"RADIO CHECK","back":"Asks the other station: what is my signal strength and readability? How do you hear me? The best answer is LOUD AND CLEAR.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (signal strength and readability)","verified":"https://en.wikipedia.org/wiki/Signal_strength_and_readability_report"},{"id":"rd-pr-report","type":"flip","cat":"Procedure","front":"Answering a radio check","back":"Strength first: LOUD, GOOD, WEAK, VERY WEAK, FADING. Then readability: CLEAR, READABLE, DISTORTED, WITH INTERFERENCE, UNREADABLE. Example: \"WEAK BUT READABLE.\"","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (signal strength and readability)","verified":"https://en.wikipedia.org/wiki/Signal_strength_and_readability_report"},{"id":"rd-pr-digits","type":"flip","cat":"Procedure","front":"Plate, serial or ID numbers","back":"Say each digit separately. 11495 = \"WUN WUN FOW-ER NIN-ER FIFE\", not \"eleven thousand four hundred ninety-five.\"","source":"FAA Order JO 7110.10, para. 2-3-4 (numbers usage)","verified":"https://www.faa.gov/air_traffic/publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-pr-digits-mc","type":"mc","cat":"Procedure","q":"How do you send the number 4519 on the radio?","choices":["Forty-five nineteen","FOW-ER FIFE WUN NIN-ER","Four thousand five hundred nineteen","Forty-five hundred and nineteen"],"answer":1,"explain":"Digit by digit, using radio pronunciation. Grouped numbers are easy to mishear.","source":"FAA Order JO 7110.10, para. 2-3-4 (numbers usage)","verified":"https://www.faa.gov/air_traffic/publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-pr-time","type":"flip","cat":"Procedure","front":"Saying a time","back":"24-hour clock, four separate digits. 1:15 p.m. = 1315 = \"WUN TREE WUN FIFE.\" 1:15 a.m. = 0115 = \"ZE-RO WUN WUN FIFE.\"","note":"FAA examples are in UTC (ZULU). Use the time zone your agency's SOP sets.","source":"FAA Order JO 7110.10, para. 2-3-4 (numbers usage: time)","verified":"https://www.faa.gov/air_traffic/publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-pr-spell","type":"order","cat":"Procedure","q":"Sending a hard-to-spell name. Put the steps in order.","steps":["Say the name","Say I SPELL","Spell it with the phonetic alphabet","Say the name again"],"explain":"Say it, spell it, say it again. Use just the code words (KILO, ZULU), not \"K as in kilo.\"","source":"U.S. Coast Guard Radiotelephone Handbook (I SPELL), via San Francisco ACS phonetics guide","verified":"https://sf.gov/sites/default/files/2022-07/Phonetics%20%26%20Associated%20Prowords.pdf"},{"id":"rd-e-listen","type":"flip","cat":"Etiquette","front":"Before you key up","back":"Listen first. Make sure nobody else is talking so you don't step on their traffic.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)","verified":"https://www.nifc.gov/sites/default/files/pio/documents/TuneIntoRadioDiscipline.doc"},{"id":"rd-e-think","type":"flip","cat":"Etiquette","front":"Think, then talk","back":"Know what you're going to say before you press the button. Dead air and \"uh\" waste the channel.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)","verified":"https://www.nifc.gov/sites/default/files/pio/documents/TuneIntoRadioDiscipline.doc"},{"id":"rd-e-brief","type":"flip","cat":"Etiquette","front":"How long should a transmission be?","back":"Short and simple. Cut unneeded words; don't stretch 5 seconds of information into 30.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)","verified":"https://www.nifc.gov/sites/default/files/pio/documents/TuneIntoRadioDiscipline.doc"},{"id":"rd-e-pause","type":"flip","cat":"Etiquette","front":"Press the button, then…","back":"Wait about a second before you speak. Talking the instant you key up clips your first word.","source":"Two-way radio training guides (common practice)","verified":"https://open-exam-prep.com/study-guides/dc-security-guard/communications-customer-service/radio-procedures-report-writing"},{"id":"rd-e-voice","type":"flip","cat":"Etiquette","front":"How to speak on the radio","back":"Normal pace, clear, calm voice. Don't shout; it distorts. Keep the mic a couple of inches from your mouth.","source":"Two-way radio training guides (common practice)","verified":"https://open-exam-prep.com/study-guides/dc-security-guard/communications-customer-service/radio-procedures-report-writing"},{"id":"rd-e-call","type":"flip","cat":"Etiquette","front":"Making a call","back":"Name the station you want, then yourself, and wait for them to answer before sending the message.","note":"Some agencies reverse the order. Follow your SOP.","source":"Two-way radio training guides (common practice)","verified":"https://open-exam-prep.com/study-guides/dc-security-guard/communications-customer-service/radio-procedures-report-writing"},{"id":"rd-e-sensitive","type":"flip","cat":"Etiquette","front":"What stays off the air?","back":"Sensitive details. Assume anyone with a scanner is listening; use a phone or a secure channel for anything that shouldn't be public.","source":"Two-way radio training guides (common practice)","verified":"https://open-exam-prep.com/study-guides/dc-security-guard/communications-customer-service/radio-procedures-report-writing"},{"id":"rd-e-emergency","type":"mc","cat":"Etiquette","q":"Another unit is calling emergency traffic. What do you do?","choices":["Keep your routine traffic short","Stay off the channel unless you're part of the emergency","Ask them to switch channels","Repeat their message for them"],"answer":1,"explain":"Emergency traffic has priority. Clear the channel and listen.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)","verified":"https://www.nifc.gov/sites/default/files/pio/documents/TuneIntoRadioDiscipline.doc"},{"id":"rd-e-sc-double","type":"scenario","cat":"Etiquette","setup":"You key up and hear a squeal: you and another unit transmitted at the same time.","q":"What now?","choices":["Key up again right away, louder","Let go, wait for clear air, then try again","Hold the button until they stop","Switch channels without telling anyone"],"answer":1,"explain":"Two stations at once means neither gets through. Release, listen, and go again when it's clear.","source":"NIFC, \"Tune In to Radio Discipline\" (wildland fire radio guidance)","verified":"https://www.nifc.gov/sites/default/files/pio/documents/TuneIntoRadioDiscipline.doc"},{"id":"rd-e-order","type":"order","cat":"Etiquette","q":"Put a routine radio call in order.","steps":["Listen to make sure the channel is clear","Plan what you'll say","Press the button and pause a second","Call the station, then identify yourself","Send the message, then release"],"explain":"Listen, plan, key and pause, call, send. Short and clear.","source":"Two-way radio training guides (common practice)","verified":"https://open-exam-prep.com/study-guides/dc-security-guard/communications-customer-service/radio-procedures-report-writing"},{"id":"rd-10-1","type":"flip","cat":"BP 10-Codes","front":"10-1","back":"Receiving Poorly","opsecReviewed":true},{"id":"rd-10-2","type":"flip","cat":"BP 10-Codes","front":"10-2","back":"Receiving Well","opsecReviewed":true},{"id":"rd-10-3","type":"flip","cat":"BP 10-Codes","front":"10-3","back":"Disregard","opsecReviewed":true},{"id":"rd-10-4","type":"flip","cat":"BP 10-Codes","front":"10-4","back":"Acknowledgement","opsecReviewed":true},{"id":"rd-10-5","type":"flip","cat":"BP 10-Codes","front":"10-5","back":"Be on the Lookout","opsecReviewed":true},{"id":"rd-10-6","type":"flip","cat":"BP 10-Codes","front":"10-6","back":"Temporarily Busy","opsecReviewed":true},{"id":"rd-10-7","type":"flip","cat":"BP 10-Codes","front":"10-7","back":"Out of Service — Unavailable","opsecReviewed":true},{"id":"rd-10-8","type":"flip","cat":"BP 10-Codes","front":"10-8","back":"In Service — Available","opsecReviewed":true},{"id":"rd-10-9","type":"flip","cat":"BP 10-Codes","fr anish uses 'las manos' (the hands), not 'sus manos' — body parts take the article."},{"id":"es-p7","type":"flip","cat":"Commands & Control","front":"Ponga las manos en la cabeza.","back":"Put your hands on your head."},{"id":"es-p8","type":"flip","cat":"Commands & Control","front":"Levante las manos.","back":"Raise your hands."},{"id":"es-p9","type":"flip","cat":"Commands & Control","front":"Siéntese.","back":"Sit down."},{"id":"es-p10","type":"flip","cat":"Commands & Control","front":"Levántese.","back":"Stand up. / Get up."},{"id":"es-p11","type":"flip","cat":"Commands & Control","front":"Póngase de rodillas.","back":"Get on your knees."},{"id":"es-p12","type":"flip","cat":"Commands & Control","front":"Cálmese.","back":"Calm down."},{"id":"es-p13","type":"flip","cat":"Commands & Control","front":"Silencio, por favor.","back":"Quiet, please."},{"id":"es-p14","type":"flip","cat":"Commands & Control","front":"Camine despacio hacia mí.","back":"Walk slowly toward me."},{"id":"es-p15","type":"flip","cat":"Commands & Control","front":"Suelte la mochila.","back":"Drop the backpack.","note":"From soltar (o→ue): suelte."},{"id":"es-p16","type":"flip","cat":"Commands & Control","front":"No toque nada.","back":"Don't touch anything.","note":"Double negative is correct Spanish: no + nada."},{"id":"es-p17","type":"flip","cat":"Commands & Control","front":"Espere aquí.","back":"Wait here."},{"id":"es-p18","type":"flip","cat":"Commands & Control","front":"Dese la vuelta.","back":"Turn around."},{"id":"es-p20","type":"flip","cat":"Identity & Citizenship","front":"¿De qué país es usted ciudadano?","back":"Of what country are you a citizen?","note":"The classic field question — uses SER for citizenship/origin."},{"id":"es-p21","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su nacionalidad?","back":"What is your nationality?","note":"'¿Cuál?' (not '¿Qué?') before 'es' when selecting from possibilities."},{"id":"es-p22","type":"flip","cat":"Identity & Citizenship","fr
