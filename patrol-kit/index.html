,"source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-dhs-self","type":"mc","cat":"Policy","binding":"policy","q":"DHS 2023 policy: may deadly force be used against a person who is a threat only to themselves or to property?","choices":["Yes","No","Only with a supervisor's approval","Only if the property is a vehicle"],"answer":1,"explain":"The 2023 update bars deadly force against someone who is only a threat to themselves or property.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"A suicidal subject or property damage alone doesn't meet the deadly-force threshold.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-sc-runner","type":"scenario","cat":"Scenarios","setup":"A subject who just crossed runs from you across an open field. Hands visible and empty, no weapon seen, no threat made.","q":"What force options are consistent with Garner and policy?","choices":["Deadly force to stop the escape","Pursue and use the minimum non-deadly force necessary to apprehend","Deadly force after a second ignored command","None. Let the subject go."],"answer":1,"explain":"No significant threat means no deadly force. Non-deadly force is limited to what's necessary, scaled to actions, apparent intentions and apparent capabilities.","source":"Tennessee v. Garner, 471 U.S. 1 (1985); 8 C.F.R. § 287.8(a)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"uf-sc-knife","type":"scenario","cat":"Scenarios","setup":"At about 15 feet, a subject pulls a knife and advances on your partner, ignoring commands.","q":"Which standard decides whether deadly force is justified?","choices":["Whether the subject committed a felony","Reasonable belief of imminent danger of death or serious bodily injury to your partner","Whether the subject is fleeing","Whether a supervisor approves"],"answer":1,"explain":"The regulation, CBP policy and Graham's threat factor all turn on imminent danger of death or serious bodily injury, judged as a reasonable officer would see it then.","source":"8 C.F.R. § 287.8(a)(2); CBP Use of Force Policy (2021)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"uf-sc-report","type":"scenario","cat":"Scenarios","setup":"You used a takedown on a resisting subject. Now you're writing the report.","q":"What should the narrative cover?","choices":["Only that force was 'necessary'","Each Graham factor as you perceived it at the time, the subject's actions, and the de-escalation tried","Your intent to be fair","What you later learned from records"],"answer":1,"explain":"Graham judges the facts as a reasonable officer perceived them then. Barnes adds that the lead-up counts too.","source":"Graham v. Connor, 490 U.S. 386 (1989); Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"}]},{"meta":{"id":"french","name":"French","short":"FR","color":"#5B8FC9","lang":"fr-CA","order":2,"blurb":"Field French for the Québec line: commands, status questions, medical, and Québécois usage.","source":"Patrol Kit French deck: standard French field phrases written for this app","subModes":["browse"]},"categories":{"Greetings & Courtesy":{"why":"A polite Bonjour sets the tone, and in Québec it's expected."},"Commands & Control":{"why":"Clear commands in the subject's language cut confusion and the need for force."},"Identity & Citizenship":{"why":"Alienage and status questions are the legal core of the encounter."},"Travel & Crossing":{"why":"Pins down time, place and manner of entry, and who else is out there."},"Medical & Safety":{"why":"Catch injuries, cold exposure and weapons early."},"What You'll Hear":{"why":"Recognizing common answers matters as much as asking the question."},"Québec Usage":{"why":"Québécois words differ from textbook French. Knowing them keeps you from misreading an answer."},"Numbers & Time":{"why":"Dates of birth, crossing times and head counts all come back as numbers."},"Cold Weather":{"why":"On the northern border, cold exposure is often the first thing to check."}},"cards":[{"id":"fr-g-bonjour","type":"flip","cat":"Greetings & Courtesy","front":"Bonjour.","back":"Hello. / Good morning.","note":"Used through the day until evening."},{"id":"fr-g-bonsoir","type":"flip","cat":"Greetings & Courtesy","front":"Bonsoir.","back":"Good evening."},{"id":"fr-g-agent","type":"flip","cat":"Greetings & Courtesy","front":"Je suis agent de la Patrouille frontalière des États-Unis.","back":"I am a United States Border Patrol agent.","note":"A female agent says « agente »."},{"id":"fr-g-anglais","type":"flip","cat":"Greetings & Courtesy","front":"Parlez-vous anglais ?","back":"Do you speak English?"},{"id":"fr-g-unpeu","type":"flip","cat":"Greetings & Courtesy","front":"Je parle un peu français.","back":"I speak a little French."},{"id":"fr-g-lentement","type":"flip","cat":"Greetings & Courtesy","front":"Parlez plus lentement, s'il vous plaît.","back":"Speak more slowly, please."},{"id":"fr-g-repeter","type":"flip","cat":"Greetings & Courtesy","front":"Pouvez-vous répéter, s'il vous plaît ?","back":"Can you repeat that, please?"},{"id":"fr-g-comprends","type":"flip","cat":"Greetings & Courtesy","front":"Je ne comprends pas.","back":"I don't understand."},{"id":"fr-g-comprenez","type":"flip","cat":"Greetings & Courtesy","front":"Vous me comprenez ?","back":"Do you understand me?"},{"id":"fr-g-merci","type":"flip","cat":"Greetings & Courtesy","front":"Merci. — Je vous en prie.","back":"Thank you. — You're welcome."},{"id":"fr-g-excusez","type":"flip","cat":"Greetings & Courtesy","front":"Excusez-moi.","back":"Excuse me."},{"id":"fr-c-arretez","type":"flip","cat":"Commands & Control","front":"Arrêtez ! Patrouille frontalière !","back":"Stop! Border Patrol!"},{"id":"fr-c-bougez","type":"flip","cat":"Commands & Control","front":"Ne bougez pas.","back":"Don't move."},{"id":"fr-c-courez","type":"flip","cat":"Commands & Control","front":"Ne courez pas.","back":"Don't run."},{"id":"fr-c-mains","type":"flip","cat":"Commands & Control","front":"Montrez-moi vos mains.","back":"Show me your hands."},{"id":"fr-c-levez","type":"flip","cat":"Commands & Control","front":"Levez les mains.","back":"Raise your hands."},{"id":"fr-c-tete","type":"flip","cat":"Commands & Control","front":"Mettez les mains sur la tête.","back":"Put your hands on your head."},{"id":"fr-c-arme","type":"flip","cat":"Commands & Control","front":"Lâchez l'arme !","back":"Drop the weapon!"},{"id":"fr-c-genoux","type":"flip","cat":"Commands & Control","front":"Mettez-vous à genoux.","back":"Get on your knees."},{"id":"fr-c-retournez","type":"flip","cat":"Commands & Control","front":"Retournez-vous.","back":"Turn around."},{"id":"fr-c-attendez","type":"flip","cat":"Commands & Control","front":"Attendez ici.","back":"Wait here."},{"id":"fr-c-venez","type":"flip","cat":"Commands & Control","front":"Venez ici.","back":"Come here."},{"id":"fr-c-calmez","type":"flip","cat":"Commands & Control","front":"Calmez-vous.","back":"Calm down."},{"id":"fr-c-moteur","type":"flip","cat":"Commands & Control","front":"Coupez le moteur.","back":"Turn off the engine."},{"id":"fr-c-cles","type":"flip","cat":"Commands & Control","front":"Donnez-moi les clés.","back":"Give me the keys."},{"id":"fr-c-restez","type":"flip","cat":"Commands & Control","front":"Restez dans le véhicule.","back":"Stay in the vehicle."},{"id":"fr-c-sortez","type":"flip","cat":"Commands & Control","front":"Sortez du véhicule.","back":"Get out of the vehicle."},{"id":"fr-c-mc","type":"mc","cat":"Commands & Control","q":"« Coupez le moteur » means…","choices":["Open the trunk","Turn off the engine","Get out of the car","Show me the registration"],"answer":1,"explain":"Couper = to cut / switch off. Le moteur = the engine."},{"id":"fr-i-citoyen","type":"flip","cat":"Identity & Citizenship","front":"De quel pays êtes-vous citoyen ?","back":"Of what country are you a citizen?","note":"To a woman: « citoyenne »."},{"id":"fr-i-nationalite","type":"flip","cat":"Identity & Citizenship","front":"Quelle est votre nationalité ?","back":"What is your nationality?"},{"id":"fr-i-ne","type":"flip","cat":"Identity & Citizenship","front":"Où êtes-vous né ?","back":"Where were you born?","note":"To a woman: « née » (same sound)."},{"id":"fr-i-nom","type":"flip","cat":"Identity & Citizenship","front":"Comment vous appelez-vous ?","back":"What is your name?"},{"id":"fr-i-nomfamille","type":"flip","cat":"Identity & Citizenship","front":"Quel est votre nom de famille ?","back":"What is your last name?"},{"id":"fr-i-naissance","type":"flip","cat":"Identity & Citizenship","front":"Quelle est votre date de naissance ?","back":"What is your date of birth?"},{"id":"fr-i-piece","type":"flip","cat":"Identity & Citizenship","front":"Avez-vous une pièce d'identité ?","back":"Do you have identification?"},{"id":"fr-i-passeport","type":"flip","cat":"Identity & Citizenship","front":"Avez-vous votre passeport ?","back":"Do you have your passport?"},{"id":"fr-i-permis","type":"flip","cat":"Identity & Citizenship","front":"Avez-vous un permis de conduire ?","back":"Do you have a driver's license?"},{"id":"fr-i-documents","type":"flip","cat":"Identity & Citizenship","front":"Avez-vous des documents qui vous autorisent à être aux États-Unis ?","back":"Do you have documents that allow you to be in the United States?"},{"id":"fr-i-habitez","type":"flip","cat":"Identity & Citizenship","front":"Où habitez-vous ?","back":"Where do you live?"},{"id":"fr-i-mc","type":"mc","cat":"Identity & Citizenship","q":"Best way to ask someone's citizenship?","choices":["Où habitez-vous ?","De quel pays êtes-vous citoyen ?","Comment allez-vous ?","D'où venez-vous ?"],"answer":1,"explain":"Where someone lives or came from isn't their citizenship. Ask directly."},{"id":"fr-t-allez","type":"flip","cat":"Travel & Crossing","front":"Où allez-vous ?","back":"Where are you going?"},{"id":"fr-t-venez","type":"flip","cat":"Travel & Crossing","front":"D'où venez-vous ?","back":"Where are you coming from?"},{"id":"fr-t-entre","type":"flip","cat":"Travel & Crossing","front":"Comment êtes-vous entré aux États-Unis ?","back":"How did you enter the United States?"},{"id":"fr-t-quand","type":"flip","cat":"Travel & Crossing","front":"Quand avez-vous traversé la frontière ?","back":"When did you cross the border?"},{"id":"fr-t-point","type":"flip","cat":"Travel & Crossing","front":"Êtes-vous passé par un point d'entrée officiel ?","back":"Did you go through an official port of entry?"},{"id":"fr-t-autres","type":"flip","cat":"Travel & Crossing","front":"Y a-t-il d'autres personnes avec vous ?","back":"Are there other people with you?"},{"id":"fr-t-combien","type":"flip","cat":"Travel & Crossing","front":"Combien de personnes ?","back":"How many people?"},{"id":"fr-t-vehicule","type":"flip","cat":"Travel & Crossing","front":"À qui appartient ce véhicule ?","back":"Whose vehicle is this?"},{"id":"fr-t-but","type":"flip","cat":"Travel & Crossing","front":"Quel est le but de votre voyage ?","back":"What is the purpose of your trip?"},{"id":"fr-t-aide","type":"flip","cat":"Travel & Crossing","front":"Qui vous a aidé à traverser ?","back":"Who helped you cross?"},{"id":"fr-t-paye","type":"flip","cat":"Travel & Crossing","front":"Combien avez-vous payé ?","back":"How much did you pay?"},{"id":"fr-m-blesse","type":"flip","cat":"Medical & Safety","front":"Êtes-vous blessé ?","back":"Are you hurt?","note":"To a woman: « blessée »."},{"id":"fr-m-mal","type":"flip","cat":"Medical & Safety","front":"Où avez-vous mal ?","back":"Where does it hurt?"},{"id":"fr-m-froid","type":"flip","cat":"Medical & Safety","front":"Avez-vous froid ?","back":"Are you cold?","note":"Like Spanish « tener frío », French uses avoir: « j'ai froid »."},{"id":"fr-m-mouille","type":"flip","cat":"Medical & Safety","front":"Vos vêtements sont-ils mouillés ?","back":"Are your clothes wet?"},{"id":"fr-m-marcher","type":"flip","cat":"Medical & Safety","front":"Pouvez-vous marcher ?","back":"Can you walk?"},{"id":"fr-m-medecin","type":"flip","cat":"Medical & Safety","front":"Avez-vous besoin d'un médecin ?","back":"Do you need a doctor?"},{"id":"fr-m-medicaments","type":"flip","cat":"Medical & Safety","front":"Prenez-vous des médicaments ?","back":"Do you take any medication?"},{"id":"fr-m-sante","type":"flip","cat":"Medical & Safety","front":"Avez-vous des problèmes de santé ?","back":"Do you have any health problems?"},{"id":"fr-m-enceinte","type":"flip","cat":"Medical & Safety","front":"Êtes-vous enceinte ?","back":"Are you pregnant?"},{"id":"fr-m-armes","type":"flip","cat":"Medical & Safety","front":"Avez-vous des armes ?","back":"Do you have any weapons?"},{"id":"fr-m-poches","type":"flip","cat":"Medical & Safety","front":"Avez-vous quelque chose de pointu dans vos poches ?","back":"Do you have anything sharp in your pockets?"},{"id":"fr-m-secours","type":"flip","cat":"Medical & Safety","front":"Les secours arrivent.","back":"Help is on the way."},{"id":"fr-m-respirez","type":"flip","cat":"Medical & Safety","front":"Respirez lentement.","back":"Breathe slowly."},{"id":"fr-h-sais","type":"flip","cat":"What You'll Hear","front":"Je ne sais pas.","back":"I don't know."},{"id":"fr-h-perdu","type":"flip","cat":"What You'll Hear","front":"Je suis perdu.","back":"I'm lost.","note":"Woman: « perdue »."},{"id":"fr-h-canadien","type":"flip","cat":"What You'll Hear","front":"Je suis canadien.","back":"I'm Canadian.","note":"Woman: « canadienne »."},{"id":"fr-h-rando","type":"flip","cat":"What You'll Hear","front":"Je fais de la randonnée.","back":"I'm hiking."},{"id":"fr-h-rien","type":"flip","cat":"What You'll Hear","front":"Je n'ai rien fait.","back":"I didn't do anything."},{"id":"fr-h-avocat","type":"flip","cat":"What You'll Hear","front":"Je veux parler à un avocat.","back":"I want to speak to a lawyer.","note":"« Avocat » = lawyer (and avocado). Treat it as a request for counsel."},{"id":"fr-h-aide","type":"flip","cat":"What You'll Hear","front":"J'ai besoin d'aide.","back":"I need help."},{"id":"fr-h-mc","type":"mc","cat":"What You'll Hear","q":"A subject says « Je veux parler à un avocat. » What is the request?","choices":["Food","A lawyer","An interpreter","The consulate"],"answer":1,"explain":"Avocat = lawyer."},{"id":"fr-q-repas","type":"flip","cat":"Québec Usage","front":"In Québec: déjeuner / dîner / souper","speak":"déjeuner, dîner, souper","back":"Breakfast / lunch / supper.","flag":"In France: petit-déjeuner / déjeuner / dîner. « Dîner » means lunch in Québec but dinner in France.","why":"« J'ai mangé au dîner » gives a noon time in Québec. That matters for a timeline.","source":"OQLF, Vitrine linguistique: meal names (déjeuner, dîner, souper)","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/redirection/ficheuid/8872574"},{"id":"fr-q-cell","type":"flip","cat":"Québec Usage","front":"« cellulaire » / « cell »","back":"Cell phone.","flag":"France: « portable ». Québec: « cellulaire ».","source":"OQLF, Grand dictionnaire terminologique: téléphone cellulaire","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8393991/telephone-cellulaire"},{"id":"fr-q-stationnement","type":"flip","cat":"Québec Usage","front":"« stationnement »","back":"Parking / parking lot.","flag":"France commonly says « parking ». The OQLF discourages it; Québec signage uses « stationnement ».","source":"OQLF, Grand dictionnaire terminologique: parc de stationnement","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/1298970/parc-de-stationnement"},{"id":"fr-q-bienvenue","type":"flip","cat":"Québec Usage","front":"« Merci ! » — « Bienvenue ! »","back":"Thank you! — You're welcome!","flag":"Heard in Québec as a calque of English \"you're welcome\". The OQLF discourages it. Standard: « Je vous en prie » or « De rien ».","source":"OQLF, Banque de dépannage linguistique: emploi déconseillé de l'emprunt « bienvenue »","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/21469/les-emprunts-a-langlais/emprunts-semantiques/emploi-deconseille-de-lemprunt-bienvenue"},{"id":"fr-q-depanneur","type":"flip","cat":"Québec Usage","front":"« le dépanneur »","back":"Convenience store.","note":"From dépanner, to help out of a jam. Common in Québec English too.","why":"A frequent stop or meeting point in a timeline.","source":"The Canadian Encyclopedia: Dépanneur","verified":"https://prod-front.thecanadianencyclopedia.ca/en/article/depanneur"},{"id":"fr-q-arret","type":"flip","cat":"Québec Usage","front":"Stop sign reading « ARRÊT »","speak":"Arrêt","back":"Stop.","flag":"Québec signs say ARRÊT (or STOP, but not both on one sign since 1992). France uses STOP.","source":"OQLF, Grand dictionnaire terminologique: panneau ARRÊT","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/redirection/ficheuid/8366697"},{"id":"fr-q-piastre","type":"flip","cat":"Québec Usage","front":"« une piastre » / « une piasse »","back":"A dollar (informal).","note":"« Vingt piasses » = twenty bucks.","why":"Comes up when you ask « Combien avez-vous payé ? ».","source":"OQLF, Banque de dépannage linguistique: différence entre dollar et piastre","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/23978/le-vocabulaire/nuances-semantiques/difference-entre-dollar-et-piastre"},{"id":"fr-q-char","type":"flip","cat":"Québec Usage","front":"« mon char »","back":"My car (informal Québécois).","flag":"Standard: « ma voiture ». In standard French « char » usually means a tank.","source":"Larousse French-English dictionary: char (Québec, familiar)","verified":"https://www.larousse.fr/dictionnaires/francais-anglais/char/14579"},{"id":"fr-q-chum","type":"flip","cat":"Québec Usage","front":"« mon chum » / « ma blonde »","back":"My boyfriend / my girlfriend.","note":"« Blonde » = girlfriend whatever her hair color. « Chum » can also mean a buddy.","why":"How a subject will describe who they're traveling with or meeting.","flag":"Secondary source only. See UNVERIFIED.md.","source":"Québec City tourism glossary: 100 expressions québécoises","verified":"https://www.quebec-cite.com/fr/ville-quebec/expressions-quebecoises"},{"id":"fr-q-tu","type":"flip","cat":"Québec Usage","front":"A Québécois subject calls you « tu »","speak":"tu, vous","back":"Common in Québec, where « tu » is used far more than in France, including with strangers. It isn't necessarily disrespect. Keep using « vous » yourself.","source":"Université Laval, Life and culture in Québec: French","verified":"https://www.ulaval.ca/en/student-zone/international-student-community/life-and-culture-in-quebec/french"},{"id":"fr-q-ramq","type":"flip","cat":"Québec Usage","front":"« ma carte d'assurance maladie » / « ma carte soleil »","back":"My Québec health insurance card (issued by the RAMQ).","why":"A common piece of ID a Québec resident may offer.","source":"Immigrant Québec: carte d'assurance maladie (RAMQ)","verified":"https://immigrantquebec.com/fr/reussir-votre-installation/demarches-des-premiers-jours/"},{"id":"fr-q-saaq","type":"flip","cat":"Québec Usage","front":"« mon permis de la SAAQ »","back":"My Québec driver's license (issued by the Société de l'assurance automobile du Québec).","source":"Société de l'assurance automobile du Québec (SAAQ)","verified":"https://saaq.gouv.qc.ca/prendre-un-rendez-vous/details/2"},{"id":"fr-q-mc-diner","type":"mc","cat":"Québec Usage","q":"A Québécois driver says « On s'est arrêtés pour dîner. » Around what time?","choices":["Morning","Midday","Evening","Late night"],"answer":1,"explain":"In Québec, dîner is the midday meal.","source":"OQLF, Vitrine linguistique: meal names (déjeuner, dîner, souper)","verified":"https://vitrinelinguistique.oqlf.gouv.qc.ca/redirection/ficheuid/8872574"},{"id":"fr-n1","type":"flip","cat":"Numbers & Time","front":"zéro, un, deux, trois, quatre","back":"0, 1, 2, 3, 4"},{"id":"fr-n2","type":"flip","cat":"Numbers & Time","front":"cinq, six, sept, huit, neuf","back":"5, 6, 7, 8, 9"},{"id":"fr-n3","type":"flip","cat":"Numbers & Time","front":"dix, onze, douze, treize, quatorze, quinze, seize","back":"10 – 16"},{"id":"fr-n4","type":"flip","cat":"Numbers & Time","front":"dix-sept, dix-huit, dix-neuf, vingt","back":"17, 18, 19, 20"},{"id":"fr-n5","type":"flip","cat":"Numbers & Time","front":"trente, quarante, cinquante, soixante","back":"30, 40, 50, 60"},{"id":"fr-n6","type":"flip","cat":"Numbers & Time","front":"soixante-dix, quatre-vingts, quatre-vingt-dix","back":"70, 80, 90","note":"Literally 60+10, 4×20, 4×20+10. Listen carefully: « quatre-vingt-dix-neuf » = 99."},{"id":"fr-n7","type":"flip","cat":"Numbers & Time","front":"cent / mille","back":"100 / 1,000","note":"Years: mille neuf cent quatre-vingt-dix = 1990; deux mille cinq = 2005."},{"id":"fr-n8","type":"flip","cat":"Numbers & Time","front":"lundi, mardi, mercredi, jeudi","back":"Monday, Tuesday, Wednesday, Thursday","note":"Days aren't capitalized in French."},{"id":"fr-n9","type":"flip","cat":"Numbers & Time","front":"vendredi, samedi, dimanche","back":"Friday, Saturday, Sunday"},{"id":"fr-n10","type":"flip","cat":"Numbers & Time","front":"janvier, février, mars, avril, mai, juin","back":"January – June","note":"Months aren't capitalized."},{"id":"fr-n11","type":"flip","cat":"Numbers & Time","front":"juillet, août, septembre, octobre, novembre, décembre","back":"July – December"},{"id":"fr-n12","type":"flip","cat":"Numbers & Time","front":"Je suis né le cinq mars mille neuf cent quatre-vingt-dix.","back":"I was born on March 5, 1990.","note":"Day, month, year: 05/03/1990 means 5 March. A woman says « née »."},{"id":"fr-n13","type":"flip","cat":"Numbers & Time","front":"Quelle heure est-il ? — Il est trois heures et demie.","back":"What time is it? — It's 3:30."},{"id":"fr-n14","type":"flip","cat":"Numbers & Time","front":"à vingt heures","back":"at 8 p.m.","note":"The 24-hour clock is common in spoken French."},{"id":"fr-n15","type":"flip","cat":"Numbers & Time","front":"hier soir / ce matin / la semaine dernière","back":"last night / this morning / last week"},{"id":"fr-n16","type":"flip","cat":"Numbers & Time","front":"il y a une heure","back":"an hour ago","note":"Il y a + time = ago."},{"id":"fr-w1","type":"flip","cat":"Cold Weather","front":"Sentez-vous vos orteils ?","back":"Can you feel your toes?"},{"id":"fr-w2","type":"flip","cat":"Cold Weather","front":"Pouvez-vous bouger les doigts ?","back":"Can you move your fingers?"},{"id":"fr-w3","type":"flip","cat":"Cold Weather","front":"Depuis combien de temps êtes-vous dehors ?","back":"How long have you been outside?"},{"id":"fr-w4","type":"flip","cat":"Cold Weather","front":"Êtes-vous tombé dans l'eau ?","back":"Did you fall in the water?","note":"A woman: « tombée »."},{"id":"fr-w5","type":"flip","cat":"Cold Weather","front":"Voici une couverture.","back":"Here's a blanket."},{"id":"fr-w6","type":"flip","cat":"Cold Weather","front":"Montez dans le véhicule, il fait chaud.","back":"Get in the vehicle, it's warm."},{"id":"fr-n-mc","type":"mc","cat":"Numbers & Time","q":"« quatre-vingt-dix-sept » is…","choices":["47","87","97","4,097"],"answer":2,"explain":"Quatre-vingt-dix (90) + sept = 97."}]},{"meta":{"id":"landnav","name":"Land Nav","short":"NAV","color":"#A3B86C","order":10,"blurb":"Basic navigation terms, compass use, pace count and terrain features.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","subModes":["browse"]},"categories":{"Terms & Strategies":{"why":"Choosing the right technique for the leg is most of navigation."},"Compass & Declination":{"why":"A wrong conversion puts you a few hundred meters off per kilometer walked."},"Pace & Distance":{"why":"When GPS fails in deep woods or cold, pace count is how you know how far you've gone."},"Terrain":{"why":"Matching contour shapes to the ground is how you confirm where you are."},"Map":{"why":"Reading the map's colors and margin quickly saves time on the ground."}},"cards":[{"id":"ln-azimuth","type":"flip","cat":"Terms & Strategies","front":"Azimuth","back":"A horizontal angle measured clockwise from a north base line, 0° to 360°. East = 90°, south = 180°, west = 270°.","note":"Always know which north it's measured from: grid, magnetic or true.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Azimuth"},{"id":"ln-norths","type":"flip","cat":"Terms & Strategies","front":"The three norths","back":"True north: toward the geographic North Pole (where meridians meet). Magnetic north: where the compass needle points; it drifts over time. Grid north: the direction of the map's vertical grid lines.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-norths-mc","type":"mc","cat":"Terms & Strategies","q":"Your compass needle points to…","choices":["True north","Magnetic north","Grid north","Whichever north the map uses"],"answer":1,"explain":"The needle points to magnetic north. Grid north is the map's grid lines. True north is the geographic pole.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-orient","type":"flip","cat":"Terms & Strategies","front":"Orienting the map","back":"Turning the map so its north matches north on the ground, so the terrain lines up with what you see. By compass: account for declination, then turn the map until map north matches the needle. By terrain association: hold the map level and match map features to ground features.","note":"Army task standard for terrain association: oriented to within 30° of magnetic north.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://sofrep.com/specialoperations/selection-land-nav-basics-pinpoint-location-orient-map/"},{"id":"ln-terrain-assoc","type":"flip","cat":"Terms & Strategies","front":"Terrain association","back":"Navigating by recognizing natural and man-made features around you and matching them to the map: hills, draws, streams, roads.","why":"Faster than compass-and-pace in good visibility, and it keeps you aware of where you are.","source":"TC 3-25.26, ch. 11 (terrain association navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-dead-reckoning","type":"flip","cat":"Terms & Strategies","front":"Dead reckoning","back":"Navigating from a known point by direction and distance: hold a set azimuth and keep a pace count to estimate where you are.","why":"Your method when terrain features are useless: dense woods, fog, darkness, flat ground.","source":"TC 3-25.26, ch. 11 (dead reckoning navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-handrail","type":"flip","cat":"Terms & Strategies","front":"Handrail","back":"A linear feature running along your route that you can follow: a stream, fence, road, power line, firebreak.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://brainscape.com/flashcards/navigation-definitions-8369224/packs/14191102"},{"id":"ln-catching","type":"flip","cat":"Terms & Strategies","front":"Catching feature","back":"An obvious feature (usually linear) just beyond your objective. If you hit it, you know you've gone too far.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-collecting","type":"flip","cat":"Terms & Strategies","front":"Collecting features","back":"Distinctive features you pass along the route that confirm you're on track and tell you how far you've come.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-attack","type":"flip","cat":"Terms & Strategies","front":"Attack point","back":"An obvious, easy-to-find feature close to your objective. Navigate fast to it, then make a short, careful compass-and-pace leg to the objective.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://oq.orienteering.asn.au/forms-and-downloads/download/attack-points-pamphlet-2"},{"id":"ln-holds","type":"flip","cat":"Terms & Strategies","front":"Center-hold vs. compass-to-cheek","back":"Center-hold: compass held at the belly, turn your whole body. Used on the move to hold a general direction. Compass-to-cheek: sight through the wire to the target. Used when you need a precise azimuth.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-detour","type":"order","cat":"Terms & Strategies","q":"Bypassing an obstacle with 90° turns (detour method). Put the legs in order.","steps":["Turn 90° right (add 90°) and pace until you clear the obstacle's width","Turn back to the original azimuth and pace along the obstacle's length — these paces count toward your route","Turn 90° left (subtract 90°) and pace the same width back","Turn to the original azimuth and continue"],"explain":"Four legs around a box. The width legs cancel out, and the length leg adds to your route pace count.","source":"USMC detour method; TC 3-25.26 (bypassing obstacles)","verified":"https://snipercentral.com/nav-bypass.htm"},{"id":"ln-stop","type":"order","cat":"Terms & Strategies","q":"You realize you're lost. Put the STOP steps in order.","steps":["Stop: halt and stay calm","Think: back to your last known point and the time since","Observe: orient the map, find north, look for features","Plan: pick your next move, or stay put if unsure"],"explain":"Stop, Think, Observe, Plan. Moving without a plan usually makes it worse.","source":"STOP mnemonic (common wilderness-navigation practice)","verified":"https://www.people.vcu.edu/~albest/troop700/documents/StayingFoundWhatIfLost.pdf"},{"id":"ln-sc-handrail","type":"scenario","cat":"Terms & Strategies","setup":"Your route parallels a stream for most of the leg before you cut uphill to your objective.","q":"What is the stream for that stretch?","choices":["A handrail","An attack point","A catching feature","A collecting feature only"],"answer":0,"explain":"Follow it as a handrail, then leave it at a planned point.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://brainscape.com/flashcards/navigation-definitions-8369224/packs/14191102"},{"id":"ln-sc-catching","type":"scenario","cat":"Terms & Strategies","setup":"A paved road runs east–west about 300 m past your objective.","q":"How do you use the road?","choices":["As a catching feature: hit the road and you know you overshot","As your attack point","As a handrail all the way","Ignore it"],"answer":0,"explain":"A catching feature stops an overshoot from turning into a long search.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://www.theoutbound.com/sarah-seads/3-easy-steps-to-navigating-the-backcountry"},{"id":"ln-sc-attack","type":"scenario","cat":"Terms & Strategies","setup":"Your objective is a small spot in thick woods. 200 m from it there's an obvious stream junction.","q":"Best plan?","choices":["Move fast to the stream junction (attack point), then a short compass-and-pace leg in","One long compass leg from the start","Wander until you find it","Wait for daylight"],"answer":0,"explain":"Use the easy-to-find feature as your attack point and save the precise work for the short final leg.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://oq.orienteering.asn.au/forms-and-downloads/download/attack-points-pamphlet-2"},{"id":"ln-sc-fog","type":"scenario","cat":"Terms & Strategies","setup":"Thick fog in flat, featureless woods. You can't see any landmarks.","q":"Which method?","choices":["Terrain association","Dead reckoning: azimuth plus pace count","Follow the nearest handrail wherever it goes","Wait for the fog to lift"],"answer":1,"explain":"With no visible features to match, hold a compass azimuth and keep a pace count.","source":"TC 3-25.26, ch. 11 (dead reckoning navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-sc-hold","type":"mc","cat":"Terms & Strategies","q":"You need a precise azimuth to a distant hilltop. Which compass hold?","choices":["Center-hold","Compass-to-cheek","Either is equally precise","Hold it at arm's length"],"answer":1,"explain":"Compass-to-cheek sights through the wire, which is more precise. Center-hold is for holding direction on the move.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-backaz","type":"flip","cat":"Compass & Declination","front":"Back azimuth rule","back":"Azimuth less than 180°: add 180. Azimuth 180° or more: subtract 180.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-backaz-calc","type":"mc","cat":"Compass & Declination","q":"Back azimuth of 250°?","choices":["70°","430°","110°","160°"],"answer":0,"explain":"250 is 180 or more, so subtract 180: 70°.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-declination","type":"flip","cat":"Compass & Declination","front":"Declination","back":"The difference between where your compass points (magnetic north) and the map's north. The diagram in the map's margin shows the angle and tells you whether to add or subtract it.","note":"Read the margin of the map you're carrying. Don't guess.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-pace-count","type":"flip","cat":"Pace & Distance","front":"Pace count","back":"The number of paces it takes you to walk 100 meters. Know yours, and count as you move to track how far you've gone.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-vehicle","type":"mc","cat":"Compass & Declination","q":"Minimum distance from a truck to get a trustworthy compass reading?","choices":["2 m","10 m","18 m","55 m"],"answer":2,"explain":"About 18 m for a truck, field gun or tank. Power lines need 55 m.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/TBS/B170249Lensatic%20Compass.pdf"},{"id":"ln-pace-factors","type":"flip","cat":"Pace & Distance","front":"Five conditions that change your pace","back":"Slopes, winds, surfaces, elements, visibility.","note":"Uphill shortens the pace and downhill lengthens it. A headwind shortens it and a tailwind lengthens it. Sand, mud and snow shorten it. Falling snow, rain and ice shorten it. Poor visibility shortens it.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-pace-snow","type":"scenario","cat":"Pace & Distance","setup":"Deep snow, going uphill, in a light snowfall. Your normal count is 120 per 100 m.","q":"What happens to your count per 100 m?","choices":["Goes down","Stays the same","Goes up: pace is shorter, so more paces per 100 m","Can't be predicted"],"answer":2,"explain":"Upslope, snow surface and falling snow all shorten the pace. Expect well over 120.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Land_navigation"},{"id":"ln-t-hill","type":"flip","cat":"Terrain","front":"From the top, ground slopes down in every direction.","back":"HILL (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-saddle","type":"flip","cat":"Terrain","front":"Dip between two hills: up on two sides, down on two sides.","back":"SADDLE (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-valley","type":"flip","cat":"Terrain","front":"Low ground between higher areas, often with a stream.","back":"VALLEY (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-ridge","type":"flip","cat":"Terrain","front":"A sloping line of high ground.","back":"RIDGE (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-depression","type":"flip","cat":"Terrain","front":"Low point or sinkhole, surrounded by higher ground.","back":"DEPRESSION (major)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-draw","type":"flip","cat":"Terrain","front":"A small valley, sometimes called a re-entrant.","back":"DRAW (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-spur","type":"flip","cat":"Terrain","front":"Short sloping high ground jutting out from a ridge.","back":"SPUR (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-t-cliff","type":"flip","cat":"Terrain","front":"Vertical or near-vertical drop.","back":"CLIFF (minor)","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.land-navigation.com/terrain-features.html"},{"id":"ln-color-mc","type":"mc","cat":"Map","q":"On a military topo map, green shows…","choices":["Water","Vegetation","Man-made features","Relief"],"answer":1,"explain":"Green = vegetation (woods, orchards). Blue = water, brown = relief, black = man-made.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://www.trngcmd.marines.mil/Portals/207/Docs/FMTBE/Student%20Materials/FMSO%20Manual/212.pdf"},{"id":"ln-slope-mc","type":"mc","cat":"Terrain","q":"Contour lines bunched tightly together mean…","choices":["Gentle slope","Steep slope","A depression","A road cut"],"answer":1,"explain":"Close spacing = steep. Wide spacing = gentle.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://alanwood.co.uk/news/understanding-contour-lines-on-topographic-maps"}]},{"meta":{"id":"radio","name":"Radio","short":"RAD","color":"#8DB37A","order":11,"blurb":"ICAO alphabet, number pronunciation, prowords, and BP 10-codes and jargon.","subModes":["browse"]},"categories":{"Phonetic Alphabet":{"why":"Plates, names and grid letters have to get through noise and bad signal on the first try."},"Numbers":{"why":"Clipped numbers like TREE, FIFE and NIN-ER keep 3/5 and 9/5 apart on a weak signal."},"Prowords":{"why":"Prowords say in one word what you need from the other station."},"Procedure":{"why":"Clear, standard traffic keeps the channel open for whoever needs it next."},"BP 10-Codes":{"why":"Know the codes you'll hear on BP traffic. On multi-agency incidents, use plain language (NIMS).","source":"HonorFirst.com, \"Border Patrol 10 Codes & Jargon\" (updated Mar. 2025)"},"BP Jargon":{"why":"The shorthand you'll hear in the field and in reports.","source":"HonorFirst.com, \"Border Patrol 10 Codes & Jargon\" (updated Mar. 2025)"}},"cards":[{"id":"rd-l-a","type":"flip","cat":"Phonetic Alphabet","front":"A","back":"ALFA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-b","type":"flip","cat":"Phonetic Alphabet","front":"B","back":"BRAVO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-c","type":"flip","cat":"Phonetic Alphabet","front":"C","back":"CHARLIE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-d","type":"flip","cat":"Phonetic Alphabet","front":"D","back":"DELTA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-e","type":"flip","cat":"Phonetic Alphabet","front":"E","back":"ECHO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-f","type":"flip","cat":"Phonetic Alphabet","front":"F","back":"FOXTROT","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-g","type":"flip","cat":"Phonetic Alphabet","front":"G","back":"GOLF","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-h","type":"flip","cat":"Phonetic Alphabet","front":"H","back":"HOTEL","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-i","type":"flip","cat":"Phonetic Alphabet","front":"I","back":"INDIA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-j","type":"flip","cat":"Phonetic Alphabet","front":"J","back":"JULIETT","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-k","type":"flip","cat":"Phonetic Alphabet","front":"K","back":"KILO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-l","type":"flip","cat":"Phonetic Alphabet","front":"L","back":"LIMA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-m","type":"flip","cat":"Phonetic Alphabet","front":"M","back":"MIKE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-n","type":"flip","cat":"Phonetic Alphabet","front":"N","back":"NOVEMBER","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-o","type":"flip","cat":"Phonetic Alphabet","front":"O","back":"OSCAR","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-p","type":"flip","cat":"Phonetic Alphabet","front":"P","back":"PAPA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-q","type":"flip","cat":"Phonetic Alphabet","front":"Q","back":"QUEBEC","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-r","type":"flip","cat":"Phonetic Alphabet","front":"R","back":"ROMEO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-s","type":"flip","cat":"Phonetic Alphabet","front":"S","back":"SIERRA","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-t","type":"flip","cat":"Phonetic Alphabet","front":"T","back":"TANGO","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-u","type":"flip","cat":"Phonetic Alphabet","front":"U","back":"UNIFORM","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-v","type":"flip","cat":"Phonetic Alphabet","front":"V","back":"VICTOR","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-w","type":"flip","cat":"Phonetic Alphabet","front":"W","back":"WHISKEY","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-x","type":"flip","cat":"Phonetic Alphabet","front":"X","back":"X-RAY","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-y","type":"flip","cat":"Phonetic Alphabet","front":"Y","back":"YANKEE","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-z","type":"flip","cat":"Phonetic Alphabet","front":"Z","back":"ZULU","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-spelling","type":"mc","cat":"Phonetic Alphabet","q":"Official ICAO spelling for A and J?","choices":["Alpha / Juliet","Alfa / Juliett","Alfa / Juliet","Alpha / Juliett"],"answer":1,"explain":"Alfa with an F and Juliett with a double T, so non-English speakers pronounce them correctly.","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-l-plate","type":"order","cat":"Phonetic Alphabet","q":"Read plate \"K Z R\" over the air, in order.","steps":["KILO","ZULU","ROMEO"],"explain":"Kilo, Zulu, Romeo. Say I SPELL first if it isn't clear you're spelling.","source":"ICAO spelling alphabet (ICAO Annex 10)","verified":"https://skybrary.aero/articles/icao-phonetic-alphabet"},{"id":"rd-n-0","type":"flip","cat":"Numbers","front":"0","back":"ZE-RO","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-1","type":"flip","cat":"Numbers","front":"1","back":"WUN","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-2","type":"flip","cat":"Numbers","front":"2","back":"TOO","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-3","type":"flip","cat":"Numbers","front":"3","back":"TREE","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-4","type":"flip","cat":"Numbers","front":"4","back":"FOW-ER","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-5","type":"flip","cat":"Numbers","front":"5","back":"FIFE","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-6","type":"flip","cat":"Numbers","front":"6","back":"SIX","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-7","type":"flip","cat":"Numbers","front":"7","back":"SEV-EN","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-8","type":"flip","cat":"Numbers","front":"8","back":"AIT","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-9","type":"flip","cat":"Numbers","front":"9","back":"NIN-ER","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-n-mc","type":"mc","cat":"Numbers","q":"Which number is spoken \"FIFE\"?","choices":["4","5","9","3"],"answer":1,"explain":"FIFE = 5, FOW-ER = 4, NIN-ER = 9, TREE = 3.","source":"FAA Order JO 7110.10, Ch. 2 Sec. 3 (ICAO number pronunciation)","verified":"https://www.faa.gov/Air_traffic/Publications/atpubs/fs_html/chap2_section_3.html"},{"id":"rd-p-roger","type":"flip","cat":"Prowords","front":"ROGER","back":"I have received your last transmission satisfactorily.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-wilco","type":"flip","cat":"Prowords","front":"WILCO","back":"I understand and will comply. Used on receipt of an order.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-say-again","type":"flip","cat":"Prowords","front":"SAY AGAIN","back":"I have not understood your message — repeat it. Often with ALL AFTER or ALL BEFORE.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-over","type":"flip","cat":"Prowords","front":"OVER","back":"End of my transmission; a response is necessary. Go ahead, transmit.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-out","type":"flip","cat":"Prowords","front":"OUT","back":"End of my transmission; no answer is required or expected.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-i-spell","type":"flip","cat":"Prowords","front":"I SPELL","back":"I will now spell the next word letter by letter, using the phonetic alphabet.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-correction","type":"flip","cat":"Prowords","front":"CORRECTION","back":"Disregard what I just sent; the correct version follows.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-break","type":"flip","cat":"Prowords","front":"BREAK","back":"Separates parts of a transmission.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-wait","type":"flip","cat":"Prowords","front":"WAIT","back":"Pause — wait for further transmission.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-p-overout","type":"mc","cat":"Prowords","q":"Why is \"OVER AND OUT\" incorrect?","choices":["It's too long","OVER asks for a reply and OUT says none is expected — they contradict","Only supervisors may say OUT","It's a 10-code"],"answer":1,"explain":"OVER and OUT are mutually exclusive. End with one or the other.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-sc-wilco","type":"scenario","cat":"Prowords","setup":"Dispatch tells you to hold your position and wait for backup. You understand and will do it.","q":"Best one-word reply?","choices":["ROGER WILCO","WILCO","OVER","COPY THAT, WILL DO"],"answer":1,"explain":"WILCO already means received, understood and will comply. ROGER WILCO is redundant.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-sc-sayagain","type":"scenario","cat":"Prowords","setup":"You copied the first half of a plate but lost the rest in static.","q":"What do you send?","choices":["REPEAT","SAY AGAIN ALL AFTER (last good word)","WHAT?","CORRECTION"],"answer":1,"explain":"SAY AGAIN with ALL AFTER or ALL BEFORE targets only the missed part.","source":"ACP 125, Communications Instructions — Radiotelephone Procedures (prowords)","verified":"https://en.wikipedia.org/wiki/Procedure_word"},{"id":"rd-pr-plain","type":"mc","cat":"Procedure","q":"Under NIMS, what style of radio language is required when multiple agencies are working an incident?","choices":["Agency 10-codes","Plain language (common terminology)","Any code both units know","Phonetic alphabet only"],"answer":1,"explain":"NIMS/ICS requires common terminology: plain language that limits codes, abbreviations and jargon so mutual-aid responders understand each other.","source":"FEMA, NIMS Plain Language Guidance; IS-315 (ICS common terminology)","verified":"https://emilms.fema.gov/is_0315a/groups/143.html"},{"id":"rd-pr-why","type":"flip","cat":"Procedure","front":"Why did NIMS move away from 10-codes?","back":"Codes vary between agencies. Plain language lets responders from different agencies and disciplines understand each other, a problem highlighted in the September 11, 2001 response.","source":"FEMA, NIMS Plain Language Guidance","verified":"https://www.alicetraining.com/wp-content/uploads/2016/03/FEMA-Plain-Language-Guide.pdf"},{"id":"rd-10-1","type":"flip","cat":"BP 10-Codes","front":" },{"id":"es-v124","type":"flip","cat":"Action Verbs","front":"esperar","back":"to wait; to hope"},{"id":"es-v125","type":"flip","cat":"Action Verbs","front":"hablar","back":"to speak, talk"},{"id":"es-v126","type":"flip","cat":"Action Verbs","front":"entender","back":"to understand"},{"id":"es-v127","type":"flip","cat":"Action Verbs","front":"ayudar","back":"to help"},{"id":"es-v128","type":"flip","cat":"Action Verbs","front":"buscar","back":"to look for, search"},{"id":"es-v129","type":"flip","cat":"Action Verbs","front":"encontrar","back":"to find"},{"id":"es-v130","type":"flip","cat":"Action Verbs","front":"llevar","back":"to carry, take (away)"},{"id":"es-v131","type":"flip","cat":"Action Verbs","front":"traer","back":"to bring"},{"id":"es-v132","type":"flip","cat":"Action Verbs","front":"mostrar","back":"to show"},{"id":"es-v133","type":"flip","cat":"Action Verbs","front":"firmar","back":"to sign"},{"id":"es-v134","type":"flip","cat":"Action Verbs","front":"mentir","back":"to lie (tell a lie)"},{"id":"es-v135","type":"flip","cat":"Action Verbs","front":"esconder(se)","back":"to hide (esconderse: hide oneself)"},{"id":"es-v136","type":"flip","cat":"Action Verbs","front":"escapar","back":"to escape"},{"id":"es-v137","type":"flip","cat":"Action Verbs","front":"pagar","back":"to pay"},{"id":"es-v138","type":"flip","cat":"Action Verbs","front":"trabajar","back":"to work"},{"id":"es-v139","type":"flip","cat":"Action Verbs","front":"regresar","back":"to return, go back"},{"id":"es-v140","type":"flip","cat":"Action Verbs","front":"entrar / salir","back":"to enter / to leave, exit"},{"id":"es-v141","type":"flip","cat":"Action Verbs","front":"subir / bajar","back":"to go up, get in / to go down, get out"},{"id":"es-v142","type":"flip","cat":"Action Verbs","front":"sentarse / levantarse","back":"to sit down / to stand up, get up"},{"id":"es-v143","type":"flip","cat":"Action Verbs","front":"dormir","back":"to sleep"},{"id":"es-v144","type":"flip","cat":"Action Verbs","front":"comer / beber","back":"to eat / to drink"},{"id":"es-v145","type":"flip","cat":"Action Verbs","front":"manejar","back":"to drive (Mex.; also 'conducir')"},{"id":"es-v150","type":"flip","cat":"Direction & Description","front":"rápido / despacio","back":"fast / slowly"},{"id":"es-v151","type":"flip","cat":"Direction & Description","front":"cerca / lejos","back":"near / far"},{"id":"es-v152","type":"flip","cat":"Direction & Description","front":"aquí / acá","back":"here (acá: over here, motion)"},{"id":"es-v153","type":"flip","cat":"Direction & Description","front":"allí / allá","back":"there / over there (farther)"},{"id":"es-v154","type":"flip","cat":"Direction & Description","front":"arriba / abajo","back":"up, above / down, below"},{"id":"es-v155","type":"flip","cat":"Direction & Description","front":"adelante / atrás","back":"forward, ahead / back, behind"},{"id":"es-v156","type":"flip","cat":"Direction & Description","front":"adentro / afuera","back":"inside / outside"},{"id":"es-v157","type":"flip","cat":"Direction & Description","front":"a la derecha / a la izquierda","back":"to the right / to the left"},{"id":"es-v158","type":"flip","cat":"Direction & Description","front":"juntos / solo","back":"together / alone"},{"id":"es-v159","type":"flip","cat":"Direction & Description","front":"peligroso / seguro","back":"dangerous / safe"},{"id":"es-v160","type":"flip","cat":"Direction & Description","front":"la verdad / la mentira","back":"the truth / the lie"},{"id":"es-v161","type":"flip","cat":"Direction & Description","front":"todo / nada","back":"everything / nothing"},{"id":"es-v162","type":"flip","cat":"Direction & Description","front":"alguien / nadie","back":"someone / no one"},{"id":"es-v163","type":"flip","cat":"Direction & Description","front":"más / menos","back":"more / less"},{"id":"es-v164","type":"flip","cat":"Direction & Description","front":"otro / otra","back":"another, other"},{"id":"es-p1","type":"flip","cat":"Commands & Control","front":"¡Alto! Patrulla Fronteriza.","back":"Stop! Border Patrol.","note":"'Alto' is the universal halt command — sharper than 'pare'."},{"id":"es-p2","type":"flip","cat":"Commands & Control","front":"No se mueva.","back":"Don't move.","note":"Negative command: no + subjunctive form. Pronoun 'se' goes BEFORE the verb in negatives."},{"id":"es-p3","type":"flip","cat":"Commands & Control","front":"No corra.","back":"Don't run."},{"id":"es-p4","type":"flip","cat":"Commands & Control","front":"Párese allí.","back":"Stand over there. / Stop there.","note":"From pararse. Pronoun attaches to the END of affirmative commands."},{"id":"es-p5","type":"flip","cat":"Commands & Control","front":"Venga acá.","back":"Come here.","note":"Irregular command of venir. 'Acá' implies motion toward you."},{"id":"es-p6","type":"flip","cat":"Commands & Control","front":"Muéstreme las manos.","back":"Show me your hands.","note":"Spanish uses 'las manos' (the hands), not 'sus manos' — body parts take the article."},{"id":"es-p7","type":"flip","cat":"Commands & Control","front":"Ponga las manos en la cabeza.","back":"Put your hands on your head."},{"id":"es-p8","type":"flip","cat":"Commands & Control","front":"Levante las manos.","back":"Raise your hands."},{"id":"es-p9","type":"flip","cat":"Commands & Control","front":"Siéntese.","back":"Sit down."},{"id":"es-p10","type":"flip","cat":"Commands & Control","front":"Levántese.","back":"Stand up. / Get up."},{"id":"es-p11","type":"flip","cat":"Commands & Control","front":"Póngase de rodillas.","back":"Get on your knees."},{"id":"es-p12","type":"flip","cat":"Commands & Control","front":"Cálmese.","back":"Calm down."},{"id":"es-p13","type":"flip","cat":"Commands & Control","front":"Silencio, por favor.","back":"Quiet, please."},{"id":"es-p14","type":"flip","cat":"Commands & Control","front":"Camine despacio hacia mí.","back":"Walk slowly toward me."},{"id":"es-p15","type":"flip","cat":"Commands & Control","front":"Suelte la mochila.","back":"Drop the backpack.","note":"From soltar (o→ue): suelte."},{"id":"es-p16","type":"flip","cat":"Commands & Control","front":"No toque nada.","back":"Don't touch anything.","note":"Double negative is correct Spanish: no + nada."},{"id":"es-p17","type":"flip","cat":"Commands & Control","front":"Espere aquí.","back":"Wait here."},{"id":"es-p18","type":"flip","cat":"Commands & Control","front":"Dese la vuelta.","back":"Turn around."},{"id":"es-p20","type":"flip","cat":"Identity & Citizenship","front":"¿De qué país es usted ciudadano?","back":"Of what country are you a citizen?","note":"The classic field question — uses SER for citizenship/origin."},{"id":"es-p21","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su nacionalidad?","back":"What is your nationality?","note":"'¿Cuál?' (not '¿Qué?') before 'es' when selecting from possibilities."},{"id":"es-p22","type":"flip","cat":"Identity & Citizenship","front":"¿Dónde nació usted?","back":"Where were you born?","note":"Preterite of nacer."},{"id":"es-p23","type":"flip","cat":"Identity & Citizenship","front":"¿Cómo se llama usted?","back":"What is your name?","note":"Literally 'How do you call yourself?' — reflexive llamarse."},{"id":"es-p24","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su nombre completo?","back":"What is your full name?"},{"id":"es-p25","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su apellido?","back":"What is your last name?"},{"id":"es-p26","type":"flip","cat":"Identity & Citizenship","front":"¿Cuántos años tiene usted?","back":"How old are you?","note":"Age uses TENER: literally 'How many years do you have?'"},{"id":"es-p27","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su fecha de nacimiento?","back":"What is your date of birth?"},{"id":"es-p28","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene documentos para estar legalmente en los Estados Unidos?","back":"Do you have documents to be in the United States legally?"},{"id":"es-p29","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene pasaporte o visa?","back":"Do you have a passport or visa?","note":"Spanish drops 'a/an' after tener in questions like this."},{"id":"es-p30","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene identificación?","back":"Do you have identification?"},{"id":"es-p31","type":"flip","cat":"Identity & Citizenship","front":"¿En qué trabaja usted?","back":"What do you do for work?","note":"The 1943 book's '¿En qué se ocupa Vd.?' — this is the modern version."},{"id":"es-p32","type":"flip","cat":"Identity & Citizenship","front":"¿Dónde vive usted?","back":"Where do you live?"},{"id":"es-p33","type":"flip","cat":"Identity & Citizenship","front":"¿Está usted casado?","back":"Are you married?","note":"ESTAR with marital status is standard in Mexico."},{"id":"es-p34","type":"flip","cat":"Identity & Citizenship","front":"¿Habla usted inglés?","back":"Do you speak English?"},{"id":"es-p35","type":"flip","cat":"Identity & Citizenship","front":"Hable más despacio, por favor.","back":"Speak more slowly, please."},{"id":"es-p36","type":"flip","cat":"Identity & Citizenship","front":"Repita, por favor.","back":"Repeat, please."},{"id":"es-p37","type":"flip","cat":"Identity & Citizenship","front":"No entiendo.","back":"I don't understand."},{"id":"es-p38","type":"flip","cat":"Identity & Citizenship","front":"¿Me entiende?","back":"Do you understand me?"},{"id":"es-p40","type":"flip","cat":"Crossing & Travel","front":"¿Cómo entró usted a los Estados Unidos?","back":"How did you enter the United States?","note":"Preterite of entrar."},{"id":"es-p41","type":"flip","cat":"Crossing & Travel","front":"¿Cuándo cruzó la frontera?","back":"When did you cross the border?"},{"id":"es-p42","type":"flip","cat":"Crossing & Travel","front":"¿Dónde cruzó?","back":"Where did you cross?"},{"id":"es-p43","type":"flip","cat":"Crossing & Travel","front":"¿Cruzó por el bosque?","back":"Did you cross through the woods?","note":"POR = through/along. Northern-border phrasing."},{"id":"es-p44","type":"flip","cat":"Crossing & Travel","front":"¿Quién lo ayudó a cruzar?","back":"Who helped you cross?","note":"'lo' = you (direct object, formal masc.). Use 'la' for a woman."},{"id":"es-p45","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto pagó?","back":"How much did you pay?"},{"id":"es-p46","type":"flip","cat":"Crossing & Travel","front":"¿Con quién viaja usted?","back":"Who are you traveling with?","note":"Preposition must come first: CON quién, never 'quién... con'."},{"id":"es-p47","type":"flip","cat":"Crossing & Travel","front":"¿Adónde va?","back":"Where are you going?","note":"'¿Adónde?' for motion, '¿Dónde?' for location."},{"id":"es-p48","type":"flip","cat":"Crossing & Travel","front":"¿De dónde viene?","back":"Where are you coming from?"},{"id":"es-p49","type":"flip","cat":"Crossing & Travel","front":"¿Quién lo va a recoger?","back":"Who is going to pick you up?"},{"id":"es-p50","type":"flip","cat":"Crossing & Travel","front":"¿Hay más personas con usted?","back":"Are there more people with you?","note":"HAY = there is / there are. One word, huge mileage."},{"id":"es-p51","type":"flip","cat":"Crossing & Travel","front":"¿Cuántas personas hay?","back":"How many people are there?","note":"Cuántas agrees with personas (fem. pl.)."},{"id":"es-p52","type":"flip","cat":"Crossing & Travel","front":"¿Hay niños en el grupo?","back":"Are there children in the group?"},{"id":"es-p53","type":"flip","cat":"Crossing & Travel","front":"¿Dónde están los demás?","back":"Where are the others?","note":"ESTAR for location, always."},{"id":"es-p54","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto tiempo caminó?","back":"How long did you walk?"},{"id":"es-p55","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto tiempo hace que está aquí?","back":"How long have you been here?","note":"HACER time idiom: hace + time + que + present tense."},{"id":"es-p60","type":"flip","cat":"Safety & Medical","front":"¿Está usted herido?","back":"Are you hurt?","note":"ESTAR for conditions. Use 'herida' for a woman."},{"id":"es-p61","type":"flip","cat":"Safety & Medical","front":"¿Está usted bien?","back":"Are you okay?"},{"id":"es-p62","type":"flip","cat":"Safety & Medical","front":"¿Necesita agua?","back":"Do you need water?"},{"id":"es-p63","type":"flip","cat":"Safety & Medical","front":"¿Necesita un médico?","back":"Do you need a doctor?"},{"id":"es-p64","type":"flip","cat":"Safety & Medical","front":"¿Tiene frío?","back":"Are you cold?","note":"TENER idiom: literally 'Do you have cold?' Critical question in a Vermont winter."},{"id":"es-p65","type":"flip","cat":"Safety & Medical","front":"¿Puede caminar?","back":"Can you walk?"},{"id":"es-p66","type":"flip","cat":"Safety & Medical","front":"¿Dónde le duele?","back":"Where does it hurt?","note":"Doler works like gustar: 'Me duele la cabeza' = my head hurts."},{"id":"es-p67","type":"flip","cat":"Safety & Medical","front":"¿Tiene alguna enfermedad?","back":"Do you have any illness?"},{"id":"es-p68","type":"flip","cat":"Safety & Medical","front":"¿Toma alguna medicina?","back":"Do you take any medicine?"},{"id":"es-p69","type":"flip","cat":"Safety & Medical","front":"¿Está embarazada?","back":"Are you pregnant?"},{"id":"es-p70","type":"flip","cat":"Safety & Medical","front":"Voy a ayudarle.","back":"I am going to help you.","note":"IR A + infinitive = going to. Your easiest future tense."},{"id":"es-p71","type":"flip","cat":"Safety & Medical","front":"La ayuda viene en camino.","back":"Help is on the way."},{"id":"es-p72","type":"flip","cat":"Safety & Medical","front":"¿Tiene armas?","back":"Do you have weapons?"},{"id":"es-p73","type":"flip","cat":"Safety & Medical","front":"¿Tiene algo en los bolsillos que me pueda lastimar?","back":"Do you have anything in your pockets that could hurt me?","note":"The standard pat-down question. 'Pueda' is subjunctive after an uncertain 'algo... que'."},{"id":"es-p74","type":"flip","cat":"Safety & Medical","front":"Todo va a estar bien.","back":"Everything is going to be okay."},{"id":"es-p75","type":"flip","cat":"Safety & Medical","front":"Respire despacio.","back":"Breathe slowly."},{"id":"es-p80","type":"flip","cat":"Processing & Transport","front":"Usted está detenido.","back":"You are detained / under arrest.","note":"ESTAR + past participle for a resulting state. 'Detenida' for a woman."},{"id":"es-p81","type":"flip","cat":"Processing & Transport","front":"Voy a esposarlo por su seguridad y la mía.","back":"I am going to handcuff you for your safety and mine.","note":"Pronoun 'lo' attaches to the infinitive. POR = for the sake of."},{"id":"es-p82","type":"flip","cat":"Processing & Transport","front":"Voy a revisarlo.","back":"I am going to search you."},{"id":"es-p83","type":"flip","cat":"Processing & Transport","front":"Vacíe sus bolsillos.","back":"Empty your pockets."},{"id":"es-p84","type":"flip","cat":"Processing & Transport","front":"Suba a la camioneta.","back":"Get in the van/truck.","note":"Subir = go up / get in. Irregular-yo verb: subo → suba."},{"id":"es-p85","type":"flip","cat":"Processing & Transport","front":"Cuidado con la cabeza.","back":"Watch your head."},{"id":"es-p86","type":"flip","cat":"Processing & Transport","front":"Vamos a la estación.","back":"We are going to the station."},{"id":"es-p87","type":"flip","cat":"Processing & Transport","front":"Tiene derecho a hablar con su consulado.","back":"You have the right to speak with your consulate."},{"id":"es-p88","type":"flip","cat":"Processing & Transport","front":"Firme aquí, por favor.","back":"Sign here, please."},{"id":"es-p89","type":"flip","cat":"Processing & Transport","front":"Ponga su huella aquí.","back":"Put your fingerprint here.","note":"'Huella' = fingerprint AND footprint/track — same word you use cutting sign."},{"id":"es-p90","type":"flip","cat":"Processing & Transport","front":"¿Entiende sus derechos?","back":"Do you understand your rights?"},{"id":"es-p91","type":"flip","cat":"Processing & Transport","front":"Diga la verdad.","back":"Tell the truth.","note":"Irregular command of decir: diga."},{"id":"es-p92","type":"flip","cat":"Processing & Transport","front":"Siga las instrucciones.","back":"Follow the instructions.","note":"From seguir (e→i): siga."},{"id":"es-p93","type":"flip","cat":"Processing & Transport","front":"Espere su turno.","back":"Wait your turn."},{"id":"es-p94","type":"flip","cat":"Processing & Transport","front":"Mentir es un delito.","back":"Lying is a crime.","note":"Infinitive used as a noun — Lesson XXVI of the old manual."},{"id":"es-p100","type":"flip","cat":"Everyday & Idioms","front":"Tengo que verificar sus documentos.","back":"I have to verify your documents.","note":"TENER QUE + infinitive = to have to. The workhorse obligation idiom."},{"id":"es-p101","type":"flip","cat":"Everyday & Idioms","front":"Hay que esperar.","back":"One must wait. / We have to wait.","note":"HAY QUE + infinitive = impersonal 'it is necessary to'."},{"id":"es-p102","type":"flip","cat":"Everyday & Idioms","front":"Hace frío. / Hace calor.","back":"It's cold. / It's hot.","note":"Weather uses HACER, not ser/estar."},{"id":"es-p103","type":"flip","cat":"Everyday & Idioms","front":"¿Qué hora es?","back":"What time is it?"},{"id":"es-p104","type":"flip","cat":"Everyday & Idioms","front":"Hace dos días.","back":"Two days ago.","note":"HACE + time = ago. '¿Cuándo cruzó?' — 'Hace dos días.'"},{"id":"es-p105","type":"flip","cat":"Everyday & Idioms","front":"Acaba de llegar.","back":"He/she just arrived.","note":"ACABAR DE + infinitive = to have just done something."},{"id":"es-p106","type":"flip","cat":"Everyday & Idioms","front":"Otra vez. / De nuevo.","back":"Again."},{"id":"es-p107","type":"flip","cat":"Everyday & Idioms","front":"Tenga cuidado.","back":"Be careful.","note":"TENER idiom in command form."},{"id":"es-p108","type":"flip","cat":"Everyday & Idioms","front":"Con permiso. / Perdón.","back":"Excuse me. / Pardon.","note":"Con permiso to pass by; perdón after a bump or to get attention."},{"id":"es-p109","type":"flip","cat":"Everyday & Idioms","front":"Buenos días. / Buenas tardes. / Buenas noches.","back":"Good morning. / Good afternoon. / Good evening."},{"id":"es-p110","type":"flip","cat":"Everyday & Idioms","front":"Gracias. — De nada.","back":"Thank you. — You're welcome."},{"id":"es-p111","type":"flip","cat":"Everyday & Idioms","front":"Ya voy.","back":"I'm coming (right now).","note":"Straight from the 1943 manual — still exactly how it's said."},{"id":"es-p112","type":"flip","cat":"Everyday & Idioms","front":"Usted se equivoca.","back":"You are mistaken.","note":"Reflexive equivocarse — useful when a story doesn't add up."},{"id":"es-p113","type":"flip","cat":"Everyday & Idioms","front":"Me parece que...","back":"It seems to me that..."},{"id":"es-p114","type":"flip","cat":"Everyday & Idioms","front":"¿De veras? / ¿En serio?","back":"Really? / Seriously?"},{"id":"es-p115","type":"flip","cat":"Everyday & Idioms","front":"Poco a poco.","back":"Little by little.","note":"Also the honest answer to '¿Habla español?' while you're learning."},{"id":"es-n1","type":"flip","cat":"Numbers & Time","front":"cero, uno, dos, tres, cuatro","back":"0, 1, 2, 3, 4"},{"id":"es-n2","type":"flip","cat":"Numbers & Time","front":"cinco, seis, siete, ocho, nueve","back":"5, 6, 7, 8, 9"},{"id":"es-n3","type":"flip","cat":"Numbers & Time","front":"diez, once, doce, trece, catorce, quince","back":"10, 11, 12, 13, 14, 15"},{"id":"es-n4","type":"flip","cat":"Numbers & Time","front":"dieciséis, diecisiete, dieciocho, diecinueve, veinte","back":"16, 17, 18, 19, 20"},{"id":"es-n5","type":"flip","cat":"Numbers & Time","front":"treinta, cuarenta, cincuenta, sesenta","back":"30, 40, 50, 60"},{"id":"es-n6","type":"flip","cat":"Numbers & Time","front":"setenta, ochenta, noventa, cien","back":"70, 80, 90, 100","note":"Cien alone; ciento before more digits: ciento veinte = 120."},{"id":"es-n7","type":"flip","cat":"Numbers & Time","front":"mil / dos mil","back":"1,000 / 2,000","note":"Years: mil novecientos noventa = 1990; dos mil cinco = 2005."},{"id":"es-n8","type":"flip","cat":"Numbers & Time","front":"lunes, martes, miércoles, jueves","back":"Monday, Tuesday, Wednesday, Thursday","note":"Days aren't capitalized in Spanish."},{"id":"es-n9","type":"flip","cat":"Numbers & Time","front":"viernes, sábado, domingo","back":"Friday, Saturday, Sunday"},{"id":"es-n10","type":"flip","cat":"Numbers & Time","front":"enero, febrero, marzo, abril, mayo, junio","back":"January – June","note":"Months aren't capitalized."},{"id":"es-n11","type":"flip","cat":"Numbers & Time","front":"julio, agosto, septiembre, octubre, noviembre, diciembre","back":"July – December"},{"id":"es-n12","type":"flip","cat":"Numbers & Time","front":"Nací el cinco de marzo de mil novecientos noventa.","back":"I was born on March 5, 1990.","note":"Spanish order is day, month, year. 05/03/1990 means 5 March."},{"id":"es-n13","type":"flip","cat":"Numbers & Time","front":"¿Qué hora es? — Son las tres y media.","back":"What time is it? — It's 3:30."},{"id":"es-n14","type":"flip","cat":"Numbers & Time","front":"a las ocho de la mañana / de la noche","back":"at 8 in the morning / at night"},{"id":"es-n15","type":"flip","cat":"Numbers & Time","front":"anoche / esta mañana / la semana pasada","back":"last night / this morning / last week"},{"id":"es-n16","type":"flip","cat":"Numbers & Time","front":"hace una hora","back":"an hour ago","note":"Hace + time = ago."},{"id":"es-w1","type":"flip","cat":"Cold Weather","front":"¿Siente los dedos de los pies?","back":"Can you feel your toes?"},{"id":"es-w2","type":"flip","cat":"Cold Weather","front":"¿Puede mover los dedos?","back":"Can you move your fingers?"},{"id":"es-w3","type":"flip","cat":"Cold Weather","front":"¿Cuánto tiempo estuvo afuera?","back":"How long were you outside?"},{"id":"es-w4","type":"flip","cat":"Cold Weather","front":"¿Se mojó? ¿Se cayó al agua?","back":"Did you get wet? Did you fall in the water?"},{"id":"es-w5","type":"flip","cat":"Cold Weather","front":"Aquí tiene una manta.","back":"Here's a blanket."},{"id":"es-w6","type":"flip","cat":"Cold Weather","front":"Suba al vehículo; hay calefacción.","back":"Get in the vehicle; the heat's on."},{"id":"es-n-mc","type":"mc","cat":"Numbers & Time","q":"A subject writes their date of birth as 05/03/1990. Most likely meaning?","choices":["May 3, 1990","March 5, 1990","It can't be either","March 1990, 5th week"],"answer":1,"explain":"Spanish-speaking countries write day/month/year. Confirm out loud: « ¿el cinco de marzo? »"}]},{"meta":{"id":"statutes","name":"Statutes & Authority","short":"USC","color":"#6FB3A8","order":4,"requireVerified":true,"blurb":"Where your authority comes from: 8 U.S.C. § 1357, 8 C.F.R. 287, and the crimes you charge.","subModes":["browse"]},"categories":{"Powers — 8 USC 1357":{"why":"Every warrantless action you take has to trace back to one of these powers."},"Regulations — 8 CFR 287":{"why":"The regulations define the terms in § 1357 and set the standards you're held to."},"Offenses":{"why":"Knowing the elements tells you what facts to document."},"Customs Authority":{"why":"Customs authority sits alongside immigration authority at and near the border."},"Which Authority?":{"why":"Naming the exact authority is how you articulate your legal basis."}},"cards":[{"id":"st-1357-a1","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(1) — interrogate","back":"Power without warrant \"to interrogate any alien or person believed to be an alien as to his right to be or to remain in the United States.\"","note":"The statute doesn't override the Fourth Amendment. Detaining someone to question them still needs reasonable suspicion (8 C.F.R. 287.8(b)).","why":"Your authority to ask about status.","source":"8 U.S.C. § 1357(a)(1)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-1357-a2","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(2) — warrantless immigration arrest","back":"Power to arrest any alien who, in the officer's presence or view, is entering or attempting to enter in violation of immigration law, or to arrest any alien in the U.S. if the officer has reason to believe the alien is here in violation of such law AND is likely to escape before a warrant can be obtained.","note":"Two prongs for interior arrests: reason to believe the person is unlawfully present + likelihood of escape. Document both.","why":"The basis for most administrative immigration arrests in the field.","source":"8 U.S.C. § 1357(a)(2)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-1357-a3","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(3) — conveyances and private lands","back":"Within a reasonable distance from any external boundary: board and search for aliens any vessel in U.S. territorial waters and any railway car, aircraft, conveyance or vehicle. Within 25 miles of the boundary: access to private lands, but not dwellings, to patrol the border and prevent illegal entry.","note":"'Reasonable distance' = 100 air miles under 8 C.F.R. 287.1(a)(2). The 25-mile private-lands access excludes dwellings.","flag":"The Fourth Amendment still applies: Almeida-Sanchez requires probable cause or consent for roving-patrol vehicle searches, and Brignoni-Ponce requires reasonable suspicion for roving stops.","why":"The geographic basis of Border Patrol authority, and its limits.","source":"8 U.S.C. § 1357(a)(3)","verified":"https://www.govinfo.gov/link/statute/66/26"},{"id":"st-1357-a4","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(4) — immigration felonies","back":"Power to arrest for felonies under laws regulating admission, exclusion, expulsion or removal of aliens, if the officer has reason to believe the person is guilty AND is likely to escape b
