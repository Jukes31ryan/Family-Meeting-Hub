efore a warrant can be obtained. The person must be taken without unnecessary delay before the nearest available officer empowered to commit persons charged with federal offenses.","why":"Covers felony arrests such as § 1326 reentry.","source":"8 U.S.C. § 1357(a)(4)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-a5","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(5) — general federal arrests","back":"(A) Any federal offense committed in the officer's presence. (B) Any federal felony, if there are reasonable grounds to believe the person committed or is committing it, the officer is performing immigration-enforcement duties at the time, and there is a likelihood of escape before a warrant can be obtained.","why":"Your authority for non-immigration federal crimes you come across, such as drugs or assault.","source":"8 U.S.C. § 1357(a)(5)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-c","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(c) — search of persons seeking admission","back":"Power to search, without warrant, the person and personal effects of anyone seeking admission, when the officer has reasonable cause to suspect that grounds for denial of admission exist that the search would reveal.","why":"Statutory search authority for people seeking admission.","source":"8 U.S.C. § 1357(c)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-2871-a2","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.1(a)(2) — 'reasonable distance'","back":"Within 100 air miles from any external boundary of the United States, or any shorter distance fixed by the chief patrol agent (CBP) or special agent in charge (ICE).","note":"287.1(b): fixing distances considers topography, transportation routes, population density, inconvenience to the public, conveyance types, and reliable information on illegal-entry movements. A longer distance needs a report to and approval by the CBP Commissioner.","why":"Defines the 'reasonable distance' in § 1357(a)(3).","source":"8 C.F.R. § 287.1(a)(2), (b)","verified":"https://www.law.cornell.edu/cfr/text/8/287.1"},{"id":"st-2878-b","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(b) — interrogation and brief detention","back":"Any officer may ask anyone questions as long as the officer doesn't restrain the freedom of a person not under arrest to walk away. With reasonable suspicion, based on specific articulable facts, that the person is engaged in an offense against the U.S. or is an alien illegally in the U.S., the officer may briefly detain the person for questioning.","why":"Codifies the consensual / Terry line for immigration officers.","source":"8 C.F.R. § 287.8(b)","verified":"https://www.govinfo.gov/content/pkg/CFR-2024-title8-vol1/pdf/CFR-2024-title8-vol1-sec287-8.pdf"},{"id":"st-2878-c2i","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(c)(2)(i) — basis for arrest","back":"An arrest shall be made only when the designated immigration officer has reason to believe the person has committed an offense against the United States or is an alien illegally in the United States.","why":"The regulatory arrest standard.","source":"8 C.F.R. § 287.8(c)(2)(i)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-2878-c2iii","type":"order","cat":"Regulations — 8 CFR 287","binding":"regulation","q":"At the time of arrest, as soon as it is practical and safe, what does 287.8(c)(2)(iii) require — in order?","steps":["Identify yourself as an immigration officer authorized to execute an arrest","State that the person is under arrest","State the reason for the arrest"],"explain":"Identify, then announce the arrest and its reason, as soon as practical and safe.","why":"Regulatory requirement on every arrest.","source":"8 C.F.R. § 287.8(c)(2)(iii)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-2878-a-nondeadly","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(a) — non-deadly force","back":"Always use the minimum non-deadly force necessary to accomplish the mission. Escalate to a higher level only when warranted by the subject's actions, apparent intentions, and apparent capabilities.","why":"The regulatory force continuum. Pairs with Graham v. Connor.","source":"8 C.F.R. § 287.8(a)(1)","verified":"https://chanrobles.com/usa/uslaws/cfr/title08/8-1.0.1.2.57.0.1.8.php"},{"id":"st-2878-a-deadly","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(a)(2) — deadly force","back":"Deadly force (force likely to cause death or serious physical injury) may be used only when the designated officer has reasonable grounds to believe it is necessary to protect the officer or others from the imminent danger of death or serious physical injury.","why":"The regulatory deadly-force standard.","source":"8 C.F.R. § 287.8(a)(2)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-1325a","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1325(a) — improper entry","back":"An alien who (1) enters or attempts to enter at any time or place other than as designated by immigration officers, (2) eludes examination or inspection, or (3) attempts to enter or obtains entry by a willfully false or misleading representation or willful concealment of a material fact. First offense: fine and/or up to 6 months. Subsequent: fine and/or up to 2 years.","why":"The base illegal-entry charge.","source":"8 U.S.C. § 1325(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2024-title8/html/USCODE-2024-title8-chap12-subchapII-partVIII-sec1325.htm"},{"id":"st-1326a","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1326(a) — reentry after removal","back":"An alien who has been denied admission, excluded, deported or removed (or departed while such an order was outstanding) and then enters, attempts to enter, or is at any time found in the U.S., without the Attorney General's express consent to reapply. Fine and/or up to 2 years.","note":"'Found in' — the offense can be complete when you encounter the person, not only at the moment of crossing.","why":"The reentry felony. Prior removal is the key fact to confirm.","source":"8 U.S.C. § 1326(a)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-1326b","type":"mc","cat":"Offenses","binding":"statute","q":"Under § 1326(b), what is the maximum sentence for reentry after removal that followed an aggravated-felony conviction?","choices":["2 years","10 years","20 years","Life"],"answer":2,"explain":"(b)(2): aggravated felony = up to 20 years. (b)(1): three or more drug or person misdemeanors, or a non-aggravated felony = up to 10 years. Base (a) = 2 years.","why":"Criminal history drives the charge. Run it every time.","source":"8 U.S.C. § 1326(b)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-1324-i","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(i) — bringing in","back":"Knowing that a person is an alien, bringing or attempting to bring the person to the U.S. in any manner at a place other than a designated port of entry or place designated by the Commissioner, regardless of whether the alien has prior official authorization.","why":"Smuggling at the line.","source":"8 U.S.C. § 1324(a)(1)(A)(i)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1324-ii","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(ii) — transporting","back":"Knowing or in reckless disregard of the fact that an alien came to, entered or remains in the U.S. in violation of law, transporting or moving (or attempting to) the alien within the U.S., by means of transportation or otherwise, in furtherance of that violation.","note":"Elements to document: transport, the alien's unlawful status, the driver's knowledge or reckless disregard, and 'in furtherance'.","why":"The most common smuggling charge from a vehicle stop.","source":"8 U.S.C. § 1324(a)(1)(A)(ii)","verified":"https://www.pbwt.com/second-circuit-blog/upon-further-review-second-circuit-holds-that-defendants-conduct-not-in-furtherance-of-aliens-unlawful-presence-in-united-states"},{"id":"st-1324-iii","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(iii) — harboring","back":"Knowing or in reckless disregard of an alien's unlawful entry or presence, concealing, harboring or shielding from detection (or attempting to) the alien in any place, including any building or means of transportation.","why":"Covers stash houses and hiding people in vehicles.","source":"8 U.S.C. § 1324(a)(1)(A)(iii)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1324-mc","type":"mc","cat":"Offenses","binding":"statute","q":"Which § 1324(a)(1)(A) clause covers encouraging or inducing an alien to come to or remain in the U.S.?","choices":["(i)","(ii)","(iii)","(iv)"],"answer":3,"explain":"(i) bringing in, (ii) transporting, (iii) harboring, (iv) encouraging/inducing, (v) conspiracy or aiding and abetting.","why":"The right subsection goes on the complaint.","source":"8 U.S.C. § 1324(a)(1)(A)(i)–(v)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1304e","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1304(e) — carrying registration","back":"Every alien 18 and over shall at all times carry and have in personal possession any certificate of alien registration or registration receipt card issued to him. Failure is a misdemeanor: fine up to $100 and/or up to 30 days per offense.","why":"Why lawful residents should be able to produce documents on request.","source":"8 U.S.C. § 1304(e)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2024-title8/html/USCODE-2024-title8-chap12-subchapII-partVII-sec1304.htm"},{"id":"st-1581a","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1581(a) — customs boarding","back":"Any officer of the customs may at any time go on board any vessel or vehicle at any place in the U.S. or within customs waters to examine the manifest and documents, and examine, inspect and search the vessel or vehicle and any person, trunk, package or cargo aboard. The officer may hail and stop it and use all necessary force to compel compliance.","flag":"Statutory breadth doesn't remove Fourth Amendment limits away from the border (see Almeida-Sanchez, Ortiz).","why":"The broad customs boarding power. Know its text and its Fourth Amendment limits.","source":"19 U.S.C. § 1581(a)","verified":"https://www.law.cornell.edu/uscode/text/19/1581"},{"id":"st-sc-land","type":"scenario","cat":"Which Authority?","setup":"Following foot sign across a farm field 10 miles from the boundary. There's a house and a barn on the property. The owner isn't around.","q":"What does § 1357(a)(3) allow?","choices":["Enter the fields and the house","Enter the private land to patrol, but not the dwelling","Nothing without the owner's consent","Only with a warrant"],"answer":1,"explain":"Within 25 miles: access to private lands, but not dwellings, to patrol the border.","source":"8 U.S.C. § 1357(a)(3)","verified":"https://www.govinfo.gov/link/statute/66/26"},{"id":"st-sc-distance","type":"scenario","cat":"Which Authority?","setup":"You're 60 air miles from the boundary and want to stop a vehicle on roving patrol.","q":"What do you need?","choices":["Nothing: inside 100 air miles any vehicle may be searched","Reasonable suspicion (Brignoni-Ponce). The 100-mile zone doesn't remove the Fourth Amendment","Probable cause to stop","A checkpoint"],"answer":1,"explain":"287.1 defines where § 1357(a)(3) applies. Brignoni-Ponce and Almeida-Sanchez still set the stop and search standards.","source":"8 C.F.R. § 287.1(a)(2); 8 U.S.C. § 1357(a)(3)","verified":"https://www.law.cornell.edu/cfr/text/8/287.1"},{"id":"st-sc-arrest-interior","type":"scenario","cat":"Which Authority?","setup":"Inland, a subject admits being unlawfully present and has a car and a bus ticket out of state tonight. No warrant exists.","q":"Which authority supports a warrantless administrative arrest?","choices":["§ 1357(a)(1)","§ 1357(a)(2): reason to believe unlawfully present + likely to escape","§ 1304(e)","§ 1357(c)"],"answer":1,"explain":"(a)(2) needs both prongs. The ticket and car support the likelihood of escape. Write them down.","source":"8 U.S.C. § 1357(a)(2)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-sc-found-in","type":"scenario","cat":"Which Authority?","setup":"Records show a subject you've just encountered was removed two years ago. The subject has no consent to reapply.","q":"What is the likely charge?","choices":["§ 1325(a) improper entry","§ 1326(a) reentry ('found in')","§ 1324(a)(1)(A)(ii)","§ 1304(e)"],"answer":1,"explain":"A prior removal plus being found in the U.S. without consent = § 1326. Then check (b) for prior convictions.","source":"8 U.S.C. § 1326(a)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-sc-driver","type":"scenario","cat":"Which Authority?","setup":"A driver picks up four people walking out of the woods just south of the line and drives them toward a city. Their story: 'I'm giving hitchhikers a ride.'","q":"Which offense, and what's the key element to develop?","choices":["§ 1325, entry","§ 1324(a)(1)(A)(ii) transporting: knowledge or reckless disregard of their status","§ 1326, reentry","§ 1304(e)"],"answer":1,"explain":"Transporting requires knowing or reckless disregard of unlawful status and 'in furtherance'. Document pickup location, timing, payment, phones, and what was said.","source":"8 U.S.C. § 1324(a)(1)(A)(ii)","verified":"https://www.pbwt.com/second-circuit-blog/upon-further-review-second-circuit-holds-that-defendants-conduct-not-in-furtherance-of-aliens-unlawful-presence-in-united-states"},{"id":"st-sc-drugs","type":"scenario","cat":"Which Authority?","setup":"During an immigration-status stop you see a firearm and drugs in plain view. The driver is a U.S. citizen.","q":"What is your arrest authority for the federal drug felony?","choices":["None: citizens are outside immigration authority","§ 1357(a)(5)(B): federal felony, reasonable grounds, on immigration duty, likely escape","§ 1357(a)(2)","§ 1304(e)"],"answer":1,"explain":"(a)(5) covers non-immigration federal offenses: in your presence (A), or felonies with the (B) conditions.","source":"8 U.S.C. § 1357(a)(5)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-e","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(e) — farms","back":"Except as provided in § 1357(a)(3), an officer may not enter the premises of a farm or other outdoor agricultural operation to question a person believed to be an alien about their right to be in the U.S. without the owner's (or agent's) consent or a properly executed warrant.","note":"The carve-out is (a)(3): within 25 miles, access to private lands (not dwellings) to patrol the border and prevent illegal entry is not limited by (e).","why":"Interior farm checks for questioning need consent or a warrant. Border patrolling inside 25 miles is different.","source":"8 U.S.C. § 1357(e)","verified":"https://uscode.house.gov/view.xhtml?req=%28title%3A8+section%3A1357+edition%3Aprelim%29"},{"id":"st-1182-a6ai","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1182(a)(6)(A)(i) — present without admission","back":"An alien present in the U.S. without being admitted or paroled, or who arrives at any time or place other than as designated, is inadmissible.","note":"A ground of inadmissibility (civil, removal), not a crime. The criminal counterpart for the entry itself is § 1325(a).","why":"The civil charge that goes with most EWIs (entries without inspection).","source":"8 U.S.C. § 1182(a)(6)(A)(i)","verified":"https://www.ca5.uscourts.gov/Opinions/pub/04/04-60234-CV0.wpd.pdf"},{"id":"st-1225-a","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1225(a)(1) and (a)(3) — applicants for admission","back":"(a)(1): an alien present in the U.S. who has not been admitted, or who arrives (at a port or not), is deemed an applicant for admission. (a)(3): all applicants for admission or others seeking admission, readmission or transit shall be inspected by immigration officers.","why":"Someone who crossed between ports is legally still an applicant for admission.","source":"8 U.S.C. § 1225(a)(1), (a)(3)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2017-title8/html/USCODE-2017-title8-chap12-subchapII-partIV-sec1225.htm"},{"id":"st-1225-b1","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1225(b)(1)(A) — expedited removal","back":"If an officer determines an arriving alien is inadmissible under § 1182(a)(6)(C) (fraud or misrepresentation) or (a)(7) (no valid documents), the officer orders removal without further hearing or review, UNLESS the alien indicates an intention to apply for asylum or a fear of persecution. Then the officer refers the alien for an interview by an asylum officer.","flag":"Who else is subject to expedited removal depends on current DHS designations. Confirm the scope in force.","why":"Any expression of fear triggers referral. Document it if it's said.","source":"8 U.S.C. § 1225(b)(1)(A)","verified":"https://www.law.cornell.edu/uscode/text/8/lii:usc:t:8:s:1225:b"},{"id":"st-18-111","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 111 — assaulting a federal officer","back":"Forcibly assaulting, resisting, opposing, impeding, intimidating or interfering with a covered federal officer engaged in, or because of, official duties. Simple assault: up to 1 year. Physical contact or intent to commit another felony: up to 8 years. (b) Deadly or dangerous weapon, or bodily injury: up to 20 years.","why":"Resisting you is a federal crime. The facts you document decide the tier.","source":"18 U.S.C. § 111","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap7-sec111.htm"},{"id":"st-18-111-mc","type":"mc","cat":"Offenses","binding":"statute","q":"A subject swings a tire iron at you during an arrest. Which § 111 tier?","choices":["Simple assault: up to 1 year","Physical contact: up to 8 years","(b) deadly or dangerous weapon: up to 20 years","Not covered: no injury"],"answer":2,"explain":"Using a deadly or dangerous weapon triggers (b), even with no injury.","source":"18 U.S.C. § 111(b)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap7-sec111.htm"},{"id":"st-18-1001","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 1001 — false statements","back":"In any matter within federal executive, legislative or judicial jurisdiction, knowingly and willfully (1) falsifying or concealing a material fact by trick, scheme or device, (2) making a materially false, fictitious or fraudulent statement, or (3) using a false writing knowing it contains one. Up to 5 years (8 if terrorism-related).","note":"Elements to document: the exact words, that they were false, that they were material, and that the subject knew.","why":"A false name or false citizenship claim to you can be its own federal charge.","source":"18 U.S.C. § 1001(a)","verified":"https://www.law.cornell.edu/uscode/text/18/1001"},{"id":"st-18-1546","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 1546(a) — fraudulent immigration documents","back":"Knowingly forging, counterfeiting or altering a visa, permit, border crossing card, alien registration receipt card or other entry or status document, or using, possessing or receiving one knowing it is forged, altered or obtained by fraud. Up to 10 years for the base offense.","why":"A fake green card or visa in a wallet is a felony, not just an inadmissibility ground.","source":"18 U.S.C. § 1546(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap75-sec1546.htm"},{"id":"st-18-922g5","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 922(g)(5)(A) — firearm possession","back":"Unlawful for an alien illegally or unlawfully in the U.S. to possess, in or affecting commerce, any firearm or ammunition. Penalty under § 924(a)(8): up to 15 years.","note":"The 2d Circuit upheld (g)(5) as applied in United States v. Perez.","why":"A gun or even ammunition found with an unlawfully present subject is a separate felony.","source":"18 U.S.C. §§ 922(g)(5)(A), 924(a)(8)","verified":"https://www.govinfo.gov/content/pkg/USCOURTS-ca2-19-00620/pdf/USCOURTS-ca2-19-00620-0.pdf"},{"id":"st-sc-farm-interior","type":"scenario","cat":"Which Authority?","setup":"Well beyond 25 miles from the line, you want to walk onto a working farm to question its field workers about status. The owner refuses and you have no warrant.","q":"Can you enter to question them?","choices":["Yes: § 1357(a)(1) lets you question anyone","No: § 1357(e) requires the owner's consent or a warrant","Yes, if you stay out of the farmhouse","Yes, inside 100 air miles"],"answer":1,"explain":"(e) bars entry onto farm premises for status questioning without consent or a warrant. Only (a)(3) border patrolling within 25 miles is carved out.","source":"8 U.S.C. § 1357(e)","verified":"https://uscode.house.gov/view.xhtml?req=%28title%3A8+section%3A1357+edition%3Aprelim%29"},{"id":"st-sc-false-name","type":"scenario","cat":"Which Authority?","setup":"A subject gives you a false name and claims U.S. citizenship. Fingerprints later show both were false and that the subject is a foreign national.","q":"Which federal statute covers the lie itself?","choices":["18 U.S.C. § 1001","8 U.S.C. § 1304(e)","18 U.S.C. § 111","8 U.S.C. § 1357(c)"],"answer":0,"explain":"Knowing and willful materially false statements in a federal matter. Record the exact words. A false claim to citizenship can carry other consequences too.","source":"18 U.S.C. § 1001(a)","verified":"https://www.law.cornell.edu/uscode/text/18/1001"},{"id":"st-sc-fake-card","type":"scenario","cat":"Which Authority?","setup":"A passenger hands you a permanent resident card. The security features are wrong and records show no such card was issued.","q":"Which criminal statute fits possessing and using it?","choices":["18 U.S.C. § 1546(a)","8 U.S.C. § 1325(a)","18 U.S.C. § 922(g)(5)","8 U.S.C. § 1326"],"answer":0,"explain":"Knowing possession or use of a forged alien registration receipt card. Seize it as evidence.","source":"18 U.S.C. § 1546(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap75-sec1546.htm"},{"id":"st-sc-fear","type":"scenario","cat":"Which Authority?","setup":"An arriving subject with no valid documents tells you they're afraid to go back to their country.","q":"Under § 1225(b)(1), what follows if expedited removal is in play?","choices":["Removal without further review","Referral for an asylum-officer interview","Release","Prosecution under § 1326"],"answer":1,"explain":"An expressed fear or asylum intent means referral to an asylum officer, not summary removal.","source":"8 U.S.C. § 1225(b)(1)(A)","verified":"https://www.law.cornell.edu/uscode/text/8/lii:usc:t:8:s:1225:b"}]}];
const GRAMMAR=[{"id":"g1","title":"Pronunciation Essentials","tag":"Lesson I of the manual","body":"\n\u003ch4>Vowels are pure\u003c/h4>\n\u003cp>Five vowels, one sound each, always: \u003cb>a\u003c/b> (father), \u003cb>e\u003c/b> (they, clipped), \u003cb>i\u003c/b> (machine), \u003cb>o\u003c/b> (note, clipped), \u003cb>u\u003c/b> (rule). No English-style gliding.\u003c/p>\n\u003ch4>The consonants that trip people up\u003c/h4>\n\u003cp>\u003cb>J\u003c/b> sounds like a hard English H (Juárez = HWAH-res). \u003cb>H\u003c/b> is always silent (hombre = OM-bre). \u003cb>Ñ\u003c/b> = \"ny\" (año = AH-nyo). \u003cb>LL\u003c/b> and \u003cb>Y\u003c/b> sound like English Y (calle = KAH-yeh). \u003cb>RR\u003c/b> is trilled; a single R between vowels is a quick tap. \u003cb>B\u003c/b> and \u003cb>V\u003c/b> are pronounced identically. \u003cb>Z\u003c/b> and soft \u003cb>C\u003c/b> (before e/i) = S in Latin American Spanish.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">mucho, muchacho, chico\u003c/span>\u003cbr>\u003cspan class=\"e\">CH is like English \"church\" — the manual's first examples.\u003c/span>\u003c/div>\n\u003ch4>Stress rules\u003c/h4>\n\u003cp>Words ending in a vowel, N, or S stress the next-to-last syllable (ha-BLA-mos). Words ending in other consonants stress the last (ha-BLAR). A written accent overrides everything (está, rápido).\u003c/p>","quiz":[{"q":"How is the J in 'trabajo' pronounced?","opts":["Like English J in 'jump'","Like a hard English H","Silent","Like Y in 'yes'"],"a":1,"why":"J = strong H sound: tra-BAH-ho."},{"q":"The H in 'herido' is...","opts":["Pronounced like English H","Pronounced like J","Always silent","Only pronounced at the start of sentences"],"a":2,"why":"Spanish H is always silent: eh-REE-do."},{"q":"'Calle' (street) sounds closest to...","opts":["KAL-leh","KAH-yeh","KAH-cheh","SAH-yeh"],"a":1,"why":"LL sounds like English Y in Mexican Spanish."},{"q":"Where is the stress in 'hablan'? (ends in N)","opts":["ha-BLAN","HA-blan","Equal stress","Depends on region"],"a":1,"why":"Ends in N → stress the next-to-last syllable: HA-blan."},{"q":"B and V in Spanish are...","opts":["Always distinct sounds","Pronounced the same","Both silent","Swapped compared to English"],"a":1,"why":"The manual is blunt about it: 'B and V are pronounced exactly alike.'"}]},{"id":"g2","title":"Gender, Articles & Plurals","tag":"Lesson II & IV","body":"\n\u003ch4>Every noun has a gender\u003c/h4>\n\u003cp>Nouns in \u003cb>-o\u003c/b> are usually masculine (el río), nouns in \u003cb>-a\u003c/b> usually feminine (la frontera). Memorize the exceptions you'll actually use: \u003cb>la mano\u003c/b> (hand), \u003cb>el día\u003c/b> (day), \u003cb>el mapa\u003c/b>, \u003cb>el problema\u003c/b>.\u003c/p>\n\u003ch4>Articles\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>the\u003c/th>\u003cth>a / an\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>masc.\u003c/td>\u003ctd>el / los\u003c/td>\u003ctd>un / unos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>fem.\u003c/td>\u003ctd>la / las\u003c/td>\u003ctd>una / unas\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Feminine nouns beginning with a stressed A take \u003cb>el\u003c/b> in the singular: \u003cb>el agua\u003c/b>, \u003cb>el arma\u003c/b> — but they stay feminine: las armas.\u003c/p>\n\u003ch4>Plurals\u003c/h4>\n\u003cp>Vowel ending → add \u003cb>-s\u003c/b> (documento → documentos). Consonant ending → add \u003cb>-es\u003c/b> (papel → papeles). Z → CES (cicatriz → cicatrices — \"scar,\" a word the 1943 manual taught for descriptions).\u003c/p>\n\u003ch4>The only two contractions in Spanish\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">a + el = al &nbsp;&nbsp;•&nbsp;&nbsp; de + el = del\u003c/span>\u003cbr>\u003cspan class=\"e\">Vamos al puente. Viene del sur.\u003c/span>\u003c/div>","quiz":[{"q":"Which is correct?","opts":["la problema","el problema","los problema","una problema"],"a":1,"why":"Problema is masculine despite ending in -a."},{"q":"'The weapon' is...","opts":["la arma","el arma","lo arma","las arma"],"a":1,"why":"Arma is feminine but takes EL because it starts with stressed A. Plural: las armas."},{"q":"Plural of 'el papel' (paper):","opts":["los papels","los papeles","las papeles","los papelos"],"a":1,"why":"Consonant ending → add -es."},{"q":"'We're going to the river' =","opts":["Vamos a el río","Vamos al río","Vamos del río","Vamos el río"],"a":1,"why":"a + el always contracts to al."},{"q":"'The hand' is...","opts":["el mano","la mano","lo mano","un mano"],"a":1,"why":"Mano is feminine despite the -o. La mano, las manos."}]},{"id":"g3","title":"Subject Pronouns & Present Tense","tag":"Lesson II & III","body":"\n\u003ch4>The pronouns you'll use\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Spanish\u003c/th>\u003cth>English\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>I\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>you (informal — kids, friends)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>usted\u003c/b>\u003c/td>\u003ctd>\u003cb>you (formal — your default on duty)\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>él / ella\u003c/td>\u003ctd>he / she\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>we\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes\u003c/td>\u003ctd>you all\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ellos / ellas\u003c/td>\u003ctd>they\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Usted takes the same verb form as él/ella. Subject pronouns are usually dropped — the ending tells you who: \u003cb>Hablo\u003c/b> = I speak.\u003c/p>\n\u003ch4>Regular present tense\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>hablAR\u003c/th>\u003cth>comER\u003c/th>\u003cth>vivIR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>hablo\u003c/td>\u003ctd>como\u003c/td>\u003ctd>vivo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>hablas\u003c/td>\u003ctd>comes\u003c/td>\u003ctd>vives\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>habla\u003c/td>\u003ctd>come\u003c/td>\u003ctd>vive\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>hablamos\u003c/td>\u003ctd>comemos\u003c/td>\u003ctd>vivimos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>hablan\u003c/td>\u003ctd>comen\u003c/td>\u003ctd>viven\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde vive usted? — Vivo en Montreal.\u003c/span>\u003cbr>\u003cspan class=\"e\">Where do you live? — I live in Montreal.\u003c/span>\u003c/div>","quiz":[{"q":"On duty, questioning an adult, you should use...","opts":["tú","usted","vos","ellos"],"a":1,"why":"Usted is the formal, professional 'you' — the manual drills it exclusively."},{"q":"'You (usted) work' =","opts":["trabajo","trabajas","trabaja","trabajan"],"a":2,"why":"Usted takes the él/ella form: trabaja."},{"q":"'We live' =","opts":["vivemos","vivimos","viven","vivamos"],"a":1,"why":"-IR verbs: nosotros ending is -imos."},{"q":"'Hablan' by itself means...","opts":["I speak","You (formal) speak","They speak / You all speak","We speak"],"a":2,"why":"-an ending = ustedes/ellos. Pronoun optional."},{"q":"'¿Comen los niños?' means...","opts":["Do the children eat?","Did the children eat?","Will the children eat?","The children must eat"],"a":0,"why":"Present tense; Spanish questions just invert or add ¿? marks."}]},{"id":"g4","title":"Ser vs. Estar","tag":"Lesson VI — the big one","body":"\n\u003ch4>Two verbs for 'to be'\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>SER\u003c/th>\u003cth>ESTAR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>soy\u003c/td>\u003ctd>estoy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>eres\u003c/td>\u003ctd>estás\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>es\u003c/td>\u003ctd>está\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>somos\u003c/td>\u003ctd>estamos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>son\u003c/td>\u003ctd>están\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>SER — what something IS\u003c/h4>\n\u003cp>Identity, origin, nationality, occupation, time, permanent traits.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Soy agente. ¿De dónde es usted? Es mexicano. Son las tres.\u003c/span>\u003c/div>\n\u003ch4>ESTAR — where or how something is\u003c/h4>\n\u003cp>Location, temporary conditions, results of change.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde está su familia? Está herido. Estamos cerca del río. Usted está detenido.\u003c/span>\u003c/div>\n\u003cp>Memory hook: for \u003cb>how you feel\u003c/b> and \u003cb>where you are\u003c/b>, always use estar.\u003c/p>","quiz":[{"q":"'Where is the bridge?' =","opts":["¿Dónde es el puente?","¿Dónde está el puente?","¿Dónde son el puente?","¿Adónde es el puente?"],"a":1,"why":"Location = ESTAR, even for permanent things like bridges."},{"q":"'He is a Canadian citizen' =","opts":["Está ciudadano canadiense","Es ciudadano canadiense","Están canadiense","Ser canadiense"],"a":1,"why":"Nationality and identity = SER."},{"q":"'Are you hurt?' =","opts":["¿Es usted herido?","¿Está usted herido?","¿Son ustedes herido?","¿Eres herido?"],"a":1,"why":"Condition/state = ESTAR."},{"q":"'It's 3 o'clock' =","opts":["Están las tres","Es las tres","Son las tres","Hay las tres"],"a":2,"why":"Time uses SER; plural 'son' for hours after one."},{"q":"'You are detained' =","opts":["Usted es detenido","Usted está detenido","Usted son detenido","Usted hay detenido"],"a":1,"why":"Result of an action = ESTAR + past participle."}]},{"id":"g5","title":"Tener & Its Idioms","tag":"Lesson V + Idioms section","body":"\n\u003ch4>Tener — to have\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>yo\u003c/th>\u003cth>tú\u003c/th>\u003cth>usted/él\u003c/th>\u003cth>nosotros\u003c/th>\u003cth>ustedes/ellos\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tengo\u003c/td>\u003ctd>tienes\u003c/td>\u003ctd>tiene\u003c/td>\u003ctd>tenemos\u003c/td>\u003ctd>tienen\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Spanish 'has' what English 'is'\u003c/h4>\n\u003cp>The manual's idiom list is gold — these use tener, not ser/estar:\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Idiom\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tener ... años\u003c/td>\u003ctd>to be ... years old\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener frío / calor\u003c/td>\u003ctd>to be cold / hot\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener hambre / sed\u003c/td>\u003ctd>to be hungry / thirsty\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener miedo\u003c/td>\u003ctd>to be afraid\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener sueño\u003c/td>\u003ctd>to be sleepy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener prisa\u003c/td>\u003ctd>to be in a hurry\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener razón\u003c/td>\u003ctd>to be right\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener la culpa\u003c/td>\u003ctd>to be to blame\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tener cuidado\u003c/td>\u003ctd>to be careful\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Obligation\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">tener que + infinitive\u003c/span> — \u003cspan class=\"e\">Tengo que revisar su mochila. (I have to search your backpack.)\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">hay que + infinitive\u003c/span> — \u003cspan class=\"e\">Hay que esperar. (One must wait — impersonal.)\u003c/span>\u003c/div>","quiz":[{"q":"'How old are you?' =","opts":["¿Cuántos años es usted?","¿Cuántos años tiene usted?","¿Qué años está usted?","¿Cómo años tiene?"],"a":1,"why":"Age = tener años. Literally 'how many years do you have?'"},{"q":"'I am cold' =","opts":["Soy frío","Estoy frío","Tengo frío","Hago frío"],"a":2,"why":"Personal cold = tener frío. (Hace frío = the weather is cold.)"},{"q":"'They are afraid' =","opts":["Son miedo","Están miedo","Tienen miedo","Hay miedo"],"a":2,"why":"Tener miedo = to be afraid."},{"q":"'You have to sign' =","opts":["Tiene que firmar","Tiene firmar","Hay firmar","Es que firmar"],"a":0,"why":"Tener que + infinitive = obligation."},{"q":"'Hay que decir la verdad' means...","opts":["He has to tell the truth","There is truth","One must tell the truth","Say the truth loudly"],"a":2,"why":"Hay que = impersonal necessity: one must / it's necessary to."}]},{"id":"g6","title":"Polite Commands — Your Workhorse","tag":"Lessons VII & XVIII","body":"\n\u003ch4>How to build an usted command\u003c/h4>\n\u003cp>1. Take the \u003cb>yo\u003c/b> form of the present. 2. Drop the -o. 3. Flip the vowel: -AR verbs → \u003cb>-e\u003c/b>, -ER/-IR verbs → \u003cb>-a\u003c/b>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>yo form\u003c/th>\u003cth>Command\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>hablar\u003c/td>\u003ctd>hablo\u003c/td>\u003ctd>hable (speak)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>correr\u003c/td>\u003ctd>corro\u003c/td>\u003ctd>corra (run)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>subir\u003c/td>\u003ctd>subo\u003c/td>\u003ctd>suba (get in)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>poner\u003c/td>\u003ctd>pongo\u003c/td>\u003ctd>ponga (put)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>venir\u003c/td>\u003ctd>vengo\u003c/td>\u003ctd>venga (come)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>decir\u003c/td>\u003ctd>digo\u003c/td>\u003ctd>diga (say)\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>True irregulars: \u003cb>vaya\u003c/b> (go), \u003cb>sea\u003c/b> (be), \u003cb>esté\u003c/b> (be), \u003cb>dé\u003c/b> (give), \u003cb>sepa\u003c/b> (know).\u003c/p>\n\u003ch4>Pronoun placement — the detail that marks fluency\u003c/h4>\n\u003cp>Affirmative: pronoun attaches to the end. Negative: pronoun goes before.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Siéntese.\u003c/span> \u003cspan class=\"e\">Sit down.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">No se mueva.\u003c/span> \u003cspan class=\"e\">Don't move.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Dígame la verdad.\u003c/span> \u003cspan class=\"e\">Tell me the truth.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">No me mienta.\u003c/span> \u003cspan class=\"e\">Don't lie to me.\u003c/span>\u003c/div>","quiz":[{"q":"Command of 'esperar' (to wait):","opts":["espera","espere","esperar","espero"],"a":1,"why":"-AR verb → -e ending: Espere aquí."},{"q":"'Come here' (formal) =","opts":["Viene acá","Ven acá","Venga acá","Vengo acá"],"a":2,"why":"Venir → yo vengo → venga."},{"q":"'Don't move' =","opts":["No muévase","No se mueva","No mueva se","Muévase no"],"a":1,"why":"Negative command: pronoun BEFORE the verb."},{"q":"'Sit down' =","opts":["Se siente","Siéntese","Sientese usted no","Sentar"],"a":1,"why":"Affirmative: pronoun attaches to the end (with a written accent)."},{"q":"Command of 'ir' (to go):","opts":["vaya","va","iga","vea"],"a":0,"why":"Ir is truly irregular: vaya. (Vea is from ver.)"}]},{"id":"g7","title":"Question Words","tag":"Lesson VII","body":"\n\u003ch4>The interrogatives\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Word\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>¿Qué?\u003c/td>\u003ctd>What?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuál? / ¿Cuáles?\u003c/td>\u003ctd>Which? / What? (before ser)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Quién? / ¿Quiénes?\u003c/td>\u003ctd>Who?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Dónde?\u003c/td>\u003ctd>Where?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Adónde?\u003c/td>\u003ctd>Where to?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿De dónde?\u003c/td>\u003ctd>Where from?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuándo?\u003c/td>\u003ctd>When?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cuánto/a/os/as?\u003c/td>\u003ctd>How much / how many?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Cómo?\u003c/td>\u003ctd>How?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>¿Por qué?\u003c/td>\u003ctd>Why?\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>All carry a written accent. Prepositions come FIRST: ¿\u003cb>Con\u003c/b> quién viaja? ¿\u003cb>De\u003c/b> qué país es?\u003c/p>\n\u003ch4>Qué vs. Cuál before 'es'\u003c/h4>\n\u003cp>¿\u003cb>Qué\u003c/b> es? asks for a definition. ¿\u003cb>Cuál\u003c/b> es su nombre? asks which one out of the possibilities — that's why name, nationality, and address questions use cuál.\u003c/p>","quiz":[{"q":"'What is your name?' =","opts":["¿Qué es su nombre?","¿Cuál es su nombre?","¿Quién es su nombre?","¿Cómo es su nombre?"],"a":1,"why":"Selecting from possibilities before 'es' → cuál."},{"q":"'Where are you going?' =","opts":["¿Dónde va?","¿Adónde va?","¿De dónde va?","¿Cuándo va?"],"a":1,"why":"Motion toward → adónde."},{"q":"'Who are you traveling with?' =","opts":["¿Quién viaja con?","¿Con quién viaja?","¿Quién con viaja?","¿Cuál viaja?"],"a":1,"why":"The preposition must lead: con quién."},{"q":"'How many children?' =","opts":["¿Cuánto niños?","¿Cuántos niños?","¿Cuántas niños?","¿Qué niños?"],"a":1,"why":"Cuántos agrees: masculine plural."},{"q":"'¿Por qué corrió?' means...","opts":["Where did he run?","Why did he run?","How did he run?","When did he run?"],"a":1,"why":"Por qué = why. (Porque, one word, = because.)"}]},{"id":"g8","title":"Object Pronouns","tag":"Lesson XV","body":"\n\u003ch4>Direct object (whom/what)\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>me\u003c/th>\u003cth>te\u003c/th>\u003cth>lo / la\u003c/th>\u003cth>nos\u003c/th>\u003cth>los / las\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>me\u003c/td>\u003ctd>you (inf.)\u003c/td>\u003ctd>him, it, you-formal / her, it, you-formal-fem\u003c/td>\u003ctd>us\u003c/td>\u003ctd>them, you all\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Indirect object (to/for whom)\u003c/h4>\n\u003cp>\u003cb>le\u003c/b> = to him/her/you &nbsp;•&nbsp; \u003cb>les\u003c/b> = to them/you all\u003c/p>\n\u003ch4>Placement\u003c/h4>\n\u003cp>Before a conjugated verb; attached to infinitives and affirmative commands.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Lo veo.\u003c/span> \u003cspan class=\"e\">I see him/it.\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">Voy a esposarlo.\u003c/span> \u003cspan class=\"e\">I'm going to cuff him.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Quién lo ayudó?\u003c/span> \u003cspan class=\"e\">Who helped you?\u003c/span> &nbsp;•&nbsp; \u003cspan class=\"s\">Déme su pasaporte.\u003c/span> \u003cspan class=\"e\">Give me your passport.\u003c/span>\u003c/div>\n\u003cp>Field tip: when addressing a man formally, \"you\" as a direct object is \u003cb>lo\u003c/b>; a woman, \u003cb>la\u003c/b>. 'Le' for indirect: Le voy a hacer unas preguntas — I'm going to ask you some questions.\u003c/p>","quiz":[{"q":"'I see them (the men)' =","opts":["Veo los","Los veo","Les veo los","Veo ellos"],"a":1,"why":"Direct object pronoun goes before the conjugated verb: Los veo."},{"q":"'Give me your license' =","opts":["Dé me su licencia","Déme su licencia","Me dé su licencia","Su licencia déme"],"a":1,"why":"Pronoun attaches to affirmative commands: Déme."},{"q":"'I'm going to search it (the bag, la bolsa)' =","opts":["Voy a revisarlo","Voy a revisarla","La voy a revisarla","Voy a lo revisar"],"a":1,"why":"Bolsa is feminine → la, attached to the infinitive."},{"q":"'Who helped you (a man)?' =","opts":["¿Quién le ayudó a cruzar?","¿Quién lo ayudó?","¿Quién los ayudó a él?","Both A and B are heard"],"a":3,"why":"Lo is the textbook direct object; le is widespread too (leísmo). You'll hear both — use lo."},{"q":"'I'm going to ask you some questions' =","opts":["Voy a hacerle unas preguntas","Voy a hacer usted preguntas","Le voy a hacerle preguntas","Hago le preguntas"],"a":0,"why":"Indirect le attaches to the infinitive: hacerle."}]},{"id":"g9","title":"Preterite — The Interview Tense","tag":"Lesson XI","body":"\n\u003ch4>Completed past actions\u003c/h4>\n\u003cp>When did you cross? Who brought you? How much did you pay? — every one of these is preterite. It's the single most useful past tense for field questioning.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>cruzAR\u003c/th>\u003cth>comER/vivIR\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>crucé\u003c/td>\u003ctd>comí\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd>cruzaste\u003c/td>\u003ctd>comiste\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>\u003cb>cruzó\u003c/b>\u003c/td>\u003ctd>\u003cb>comió\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>cruzamos\u003c/td>\u003ctd>comimos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>cruzaron\u003c/td>\u003ctd>comieron\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>The irregular stems worth memorizing\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>usted form\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>tener\u003c/td>\u003ctd>tuvo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>estar\u003c/td>\u003ctd>estuvo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>hacer\u003c/td>\u003ctd>hizo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>decir\u003c/td>\u003ctd>dijo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>venir\u003c/td>\u003ctd>vino\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ir / ser\u003c/td>\u003ctd>fue (identical!)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>dar\u003c/td>\u003ctd>dio\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Cuándo cruzó? ¿Quién vino con usted? ¿Qué dijo el guía?\u003c/span>\u003cbr>\u003cspan class=\"e\">When did you cross? Who came with you? What did the guide say?\u003c/span>\u003c/div>","quiz":[{"q":"'When did you cross?' =","opts":["¿Cuándo cruza?","¿Cuándo cruzó?","¿Cuándo cruzaba?","¿Cuándo cruzar?"],"a":1,"why":"Completed past event → preterite usted form: cruzó."},{"q":"'He came alone' =","opts":["Vino solo","Venía solo","Viene solo","Vengo solo"],"a":0,"why":"Venir → vino in the preterite."},{"q":"'They paid $5,000' =","opts":["Pagan cinco mil","Pagaron cinco mil dólares","Pagaban cinco mil","Pagar cinco mil"],"a":1,"why":"-aron = ustedes/ellos preterite of -AR verbs."},{"q":"'Fue' can mean...","opts":["Only 'he went'","Only 'he was'","Either 'he went' or 'he was'","He will go"],"a":2,"why":"Ir and ser share identical preterite forms — context decides."},{"q":"'What did he say?' =","opts":["¿Qué dice?","¿Qué dijo?","¿Qué decía?","¿Qué diga?"],"a":1,"why":"Decir → dijo. One of the must-know irregulars."}]},{"id":"g10","title":"Imperfect — Setting the Scene","tag":"Lesson XI & XIII","body":"\n\u003ch4>The other past tense\u003c/h4>\n\u003cp>The imperfect describes ongoing, habitual, or background past — what \u003ci>was happening\u003c/i>, what things \u003ci>used to be\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>-AR (caminar)\u003c/th>\u003cth>-ER/-IR (vivir)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd>caminaba\u003c/td>\u003ctd>vivía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>usted/él\u003c/td>\u003ctd>caminaba\u003c/td>\u003ctd>vivía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd>caminábamos\u003c/td>\u003ctd>vivíamos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ustedes/ellos\u003c/td>\u003ctd>caminaban\u003c/td>\u003ctd>vivían\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Only three irregulars in the whole language: \u003cb>ser → era\u003c/b>, \u003cb>ir → iba\u003c/b>, \u003cb>ver → veía\u003c/b>.\u003c/p>\n\u003ch4>Preterite vs. imperfect in an interview\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Caminábamos por el bosque cuando vimos la luz.\u003c/span>\u003cbr>\u003cspan class=\"e\">We were walking through the woods (background–imperfect) when we saw the light (event–preterite).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Dónde vivía usted en Canadá?\u003c/span>\u003cbr>\u003cspan class=\"e\">Where were you living in Canada? (ongoing state)\u003c/span>\u003c/div>","quiz":[{"q":"'We were walking' (background action) =","opts":["Caminamos","Caminábamos","Caminaron","Caminemos"],"a":1,"why":"Ongoing past action → imperfect."},{"q":"'Where were you living?' =","opts":["¿Dónde vivió?","¿Dónde vivía?","¿Dónde vive?","¿Dónde vivirá?"],"a":1,"why":"Ongoing residence → imperfect vivía."},{"q":"The imperfect of 'ir' is...","opts":["fue","iba","vaya","irá"],"a":1,"why":"One of only three irregular imperfects: iba."},{"q":"'Había tres personas' means...","opts":["There will be three people","There were three people (scene)","Three people arrived","There are three people"],"a":1,"why":"Había = imperfect of hay: there was/were, describing a scene."},{"q":"Pick the correct combo: 'They were sleeping when we arrived' =","opts":["Durmieron cuando llegábamos","Dormían cuando llegamos","Duermen cuando llegaron","Dormían cuando llegábamos"],"a":1,"why":"Background = imperfect (dormían); interrupting event = preterite (llegamos)."}]},{"id":"g11","title":"Talking About the Future","tag":"Lesson XXI","body":"\n\u003ch4>The easy way: ir a + infinitive\u003c/h4>\n\u003cp>Conjugate ir (voy, va, vamos, van) + a + any infinitive. This covers 90% of field needs.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Voy a revisar su mochila. Vamos a la estación. ¿Quién lo va a recoger?\u003c/span>\u003c/div>\n\u003ch4>The true future tense\u003c/h4>\n\u003cp>Add endings straight onto the infinitive: \u003cb>-é, -ás, -á, -emos, -án\u003c/b>. Hablaré = I will speak. Irregular stems: tendr- (tener), har- (hacer), dir- (decir), podr- (poder), sabr- (saber), vendr- (venir), saldr- (salir), pondr- (poner).\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Un agente hablará con usted pronto.\u003c/span>\u003cbr>\u003cspan class=\"e\">An agent will speak with you soon.\u003c/span>\u003c/div>\n\u003cp>Bonus use — the future of probability: \u003cb>¿Dónde estarán los demás?\u003c/b> = I wonder where the others are.\u003c/p>","quiz":[{"q":"'I am going to help you' =","opts":["Voy ayudar","Voy a ayudarle","Iré a ayudo","Vaya ayudar"],"a":1,"why":"ir a + infinitive; the 'a' is required."},{"q":"'You will have an appointment' =","opts":["Tener una cita","Tendrá una cita","Tenerá una cita","Tiene que cita"],"a":1,"why":"Future of tener uses the irregular stem tendr-: tendrá."},{"q":"'We will return tomorrow' =","opts":["Regresamos ayer","Regresaremos mañana","Regresábamos mañana","Regresen mañana"],"a":1,"why":"Future -emos on the infinitive: regresaremos."},{"q":"'¿Serán las cinco?' most likely expresses...","opts":["A command","Probability: 'I wonder if it's five'","Past time","A negative"],"a":1,"why":"Future tense can express present probability or wondering."},{"q":"'He will say' =","opts":["decirá","dirá","dijá","dice"],"a":1,"why":"Decir → dir- + á."}]},{"id":"g12","title":"Reflexive Verbs","tag":"Lesson XXIII","body":"\n\u003ch4>Actions done to oneself\u003c/h4>\n\u003cp>Reflexive pronouns: \u003cb>me, te, se, nos, se\u003c/b>. The infinitive carries -se: llamarse, sentarse, pararse, quedarse, ponerse.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Verb\u003c/th>\u003cth>Field use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>llamarse\u003c/td>\u003ctd>¿Cómo se llama? — What's your name?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pararse\u003c/td>\u003ctd>¡Párese! — Stop/stand!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>sentarse\u003c/td>\u003ctd>Siéntese. — Sit down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>quedarse\u003c/td>\u003ctd>Quédese aquí. — Stay here.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>calmarse\u003c/td>\u003ctd>Cálmese. — Calm down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>quitarse\u003c/td>\u003ctd>Quítese la mochila. — Take off the backpack.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>esconderse\u003c/td>\u003ctd>¿Dónde se escondieron? — Where did they hide?\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>The reflexive passive\u003c/h4>\n\u003cp>Spanish prefers \u003cb>se\u003c/b> + verb where English uses the passive — straight from Lesson XXIII:\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Se prohíbe estacionarse aquí.\u003c/span> \u003cspan class=\"e\">Parking is prohibited here.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Aquí se habla español.\u003c/span> \u003cspan class=\"e\">Spanish is spoken here.\u003c/span>\u003c/div>","quiz":[{"q":"'What is your name?' literally asks...","opts":["What are you named by others?","How do you call yourself?","Which name is yours?","Who calls you?"],"a":1,"why":"¿Cómo se llama? = reflexive llamarse."},{"q":"'Stay here' =","opts":["Queda aquí","Quédese aquí","Se quede aquí","Quedarse aquí"],"a":1,"why":"Affirmative command with attached pronoun: Quédese."},{"q":"'Where did they hide?' =","opts":["¿Dónde escondieron?","¿Dónde se escondieron?","¿Dónde se esconden ayer?","¿Dónde escondían?"],"a":1,"why":"Esconderse is reflexive when hiding oneself."},{"q":"'Se venden carros' means...","opts":["They sell themselves cars","Cars are sold / for sale","Sell the cars!","The cars sold out"],"a":1,"why":"Se + verb = passive substitute."},{"q":"'Take off your jacket' =","opts":["Quite la chamarra","Quítese la chamarra","Se quite la chamarra","Quitarse chamarra"],"a":1,"why":"Quitarse = to take off (clothing); command form Quítese + article (not 'su')."}]},{"id":"g13","title":"Por vs. Para","tag":"Lesson XIV","body":"\n\u003ch4>PARA — destination & purpose\u003c/h4>\n\u003cp>Toward a goal: destination, purpose, deadline, recipient.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Salieron para Boston.\u003c/span> \u003cspan class=\"e\">They left FOR Boston (destination).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Documentos para trabajar.\u003c/span> \u003cspan class=\"e\">Documents (in order) to work.\u003c/span>\u003c/div>\n\u003ch4>POR — through, along, exchange, cause\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Cruzaron por el río.\u003c/span> \u003cspan class=\"e\">They crossed BY WAY OF the river.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Caminaron por el bosque por tres horas.\u003c/span> \u003cspan class=\"e\">Through the woods, for three hours (route + duration).\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Pagó dos mil por el viaje.\u003c/span> \u003cspan class=\"e\">He paid two thousand FOR (in exchange for) the trip.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Por su seguridad.\u003c/span> \u003cspan class=\"e\">For (the sake of) your safety.\u003c/span>\u003c/div>\n\u003cp>Interview shortcut: route and payment questions take \u003cb>por\u003c/b>; destination and purpose take \u003cb>para\u003c/b>.\u003c/p>","quiz":[{"q":"'They crossed through the woods' =","opts":["Cruzaron para el bosque","Cruzaron por el bosque","Cruzaron en para bosque","Cruzaron al bosque por"],"a":1,"why":"Route/through = por."},{"q":"'How much did you pay for the trip?' =","opts":["¿Cuánto pagó para el viaje?","¿Cuánto pagó por el viaje?","¿Cuánto para pagó?","¿Qué pagó a viaje?"],"a":1,"why":"Exchange = por."},{"q":"'They're heading for Montreal' =","opts":["Van por Montreal","Van para Montreal","Van en Montreal","Van de Montreal"],"a":1,"why":"Destination = para."},{"q":"'For your safety and mine' =","opts":["Para su seguridad","Por su seguridad y la mía","De su seguridad","En su seguridad"],"a":1,"why":"For the sake of = por."},{"q":"'He walked for two hours' =","opts":["Caminó para dos horas","Caminó por dos horas","Caminó a dos horas","Caminó en dos horas para"],"a":1,"why":"Duration = por."}]},{"id":"g14","title":"Numbers, Time & Dates","tag":"Lessons XII & XX","body":"\n\u003ch4>Numbers you'll actually say\u003c/h4>\n\u003cp>1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez · 11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 20 veinte · 21 veintiuno · 30 treinta · 31 treinta y uno · 40 cuarenta · 50 cincuenta · 60 sesenta · 70 setenta · 80 ochenta · 90 noventa · 100 cien(to) · 500 quinientos · 1000 mil\u003c/p>\n\u003cp>Only 16–29 are written as one word; 31+ use \u003cb>y\u003c/b>: cuarenta y cinco.\u003c/p>\n\u003ch4>Telling time\u003c/h4>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Qué hora es? — Es la una. / Son las tres y media. / Son las diez menos cuarto.\u003c/span>\u003cbr>\u003cspan class=\"e\">It's one. / It's 3:30. / It's 9:45.\u003c/span>\u003c/div>\n\u003ch4>Dates & days\u003c/h4>\n\u003cp>Days: lunes, martes, miércoles, jueves, viernes, sábado, domingo (not capitalized). Months: enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">¿Cuál es su fecha de nacimiento? — El quince de marzo de mil novecientos noventa.\u003c/span>\u003cbr>\u003cspan class=\"e\">March 15, 1990. Day first, then month.\u003c/span>\u003c/div>","quiz":[{"q":"45 =","opts":["cuarenta cinco","cuarenta y cinco","cuatro y cinco","cuarenticinco"],"a":1,"why":"31 and up: tens + y + units."},{"q":"'It's 3:30' =","opts":["Es las tres y media","Son las tres y media","Son tres treinta hora","Está las tres y media"],"a":1,"why":"Plural hours take son; y media = half past."},{"q":"15 =","opts":["diez y cinco","quince","cincuenta","doce"],"a":1,"why":"Quince. (Cincuenta = 50.)"},{"q":"In Spanish dates, which comes first?","opts":["Month","Day","Year","Weekday is required"],"a":1,"why":"Day first: el quince de marzo. A DOB given as 3/15 vs 15/3 matters on paperwork."},{"q":"500 =","opts":["cinco cientos","quinientos","cincocientos","quincecientos"],"a":1,"why":"Irregular hundred: quinientos."}]},{"id":"g15","title":"Subjunctive Starter Kit","tag":"Lesson XXV — simplified","body":"\n\u003ch4>Don't fear it — you already know it\u003c/h4>\n\u003cp>The usted command IS the subjunctive. Hable, venga, diga, se siente — same forms. The subjunctive appears after expressions of wanting, requesting, and necessity aimed at another person.\u003c/p>\n\u003ch4>The three triggers to start with\u003c/h4>\n\u003ctable>\u003ctr>\u003cth>Trigger\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>querer que\u003c/td>\u003ctd>Quiero que se siente. — I want you to sit down.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>es necesario que\u003c/td>\u003ctd>Es necesario que diga la verdad. — It's necessary that you tell the truth.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>para que\u003c/td>\u003ctd>Hable despacio para que yo entienda. — Speak slowly so that I understand.\u003c/td>\u003c/tr>\u003c/table>\n\u003ch4>Why English speakers miss it\u003c/h4>\n\u003cp>English says 'I want you TO SIT'; Spanish can't use the infinitive when the subject changes — it must switch to que + subjunctive.\u003c/p>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Necesito que espere aquí.\u003c/span> \u003cspan class=\"e\">I need you to wait here.\u003c/span>\u003c/div>\n\u003cdiv class=\"ex\">\u003cspan class=\"s\">Dígale a su amigo que venga.\u003c/span> \u003cspan class=\"e\">Tell your friend to come.\u003c/span>\u003c/div>","quiz":[{"q":"'I want you to sit down' =","opts":["Quiero usted sentarse","Quiero que se siente","Quiero que se sienta usted bien","Quiero sentarse"],"a":1,"why":"Change of subject → que + subjunctive: que se siente."},{"q":"'It's necessary that you sign' =","opts":["Es necesario que firma","Es necesario que firme","Es necesario firmar que","Necesario usted firma"],"a":1,"why":"Es necesario que + subjunctive: firme."},{"q":"The usted command and the usted subjunctive are...","opts":["Totally different forms","The same form","Only the same for -AR verbs","Only the same for irregulars"],"a":1,"why":"Master commands and you've already got the present subjunctive."},{"q":"'Tell him to come' =","opts":["Dígale que viene","Dígale que venga","Diga él venir","Dile que vino"],"a":1,"why":"Indirect command → que + subjunctive: venga."},{"q":"'Speak slowly so that I understand' =","opts":["...para que yo entiendo","...para que yo entienda","...por que entiendo","...para entiendo"],"a":1,"why":"Para que always triggers the subjunctive: entienda."}]}];
const VERBS=[{"inf":"hablar","en":"to speak","pres":["hablo","hablas","habla","hablamos","hablan"],"pret":["hablé","hablaste","habló","hablamos","hablaron"],"cmd":"hable"},{"inf":"caminar","en":"to walk","pres":["camino","caminas","camina","caminamos","caminan"],"pret":["caminé","caminaste","caminó","caminamos","caminaron"],"cmd":"camine"},{"inf":"comer","en":"to eat","pres":["como","comes","come","comemos","comen"],"pret":["comí","comiste","comió","comimos","comieron"],"cmd":"coma"},{"inf":"vivir","en":"to live","pres":["vivo","vives","vive","vivimos","viven"],"pret":["viví","viviste","vivió","vivimos","vivieron"],"cmd":"viva"},{"inf":"cruzar","en":"to cross","pres":["cruzo","cruzas","cruza","cruzamos","cruzan"],"pret":["crucé","cruzaste","cruzó","cruzamos","cruzaron"],"cmd":"cruce"},{"inf":"tener","en":"to have","pres":["tengo","tienes","tiene","tenemos","tienen"],"pret":["tuve","tuviste","tuvo","tuvimos","tuvieron"],"cmd":"tenga"},{"inf":"hacer","en":"to do, make","pres":["hago","haces","hace","hacemos","hacen"],"pret":["hice","hiciste","hizo","hicimos","hicieron"],"cmd":"haga"},{"inf":"decir","en":"to say, tell","pres":["digo","dices","dice","decimos","dicen"],"pret":["dije","dijiste","dijo","dijimos","dijeron"],"cmd":"diga"},{"inf":"venir","en":"to come","pres":["vengo","vienes","viene","venimos","vienen"],"pret":["vine","viniste","vino","vinimos","vinieron"],"cmd":"venga"},{"inf":"poder","en":"to be able, can","pres":["puedo","puedes","puede","podemos","pueden"],"pret":["pude","pudiste","pudo","pudimos","pudieron"],"cmd":"pueda"},{"inf":"querer","en":"to want","pres":["quiero","quieres","quiere","queremos","quieren"],"pret":["quise","quisiste","quiso","quisimos","quisieron"],"cmd":"quiera"},{"inf":"saber","en":"to know (facts)","pres":["sé","sabes","sabe","sabemos","saben"],"pret":["supe","supiste","supo","supimos","supieron"],"cmd":"sepa"},{"inf":"conocer","en":"to know (people/places)","pres":["conozco","conoces","conoce","conocemos","conocen"],"pret":["conocí","conociste","conoció","conocimos","conocieron"],"cmd":"conozca"},{"inf":"ir","en":"to go","pres":["voy","vas","va","vamos","van"],"pret":["fui","fuiste","fue","fuimos","fueron"],"cmd":"vaya"},{"inf":"ser","en":"to be (identity)","pres":["soy","eres","es","somos","son"],"pret":["fui","fuiste","fue","fuimos","fueron"],"cmd":"sea"},{"inf":"estar","en":"to be (location/state)","pres":["estoy","estás","está","estamos","están"],"pret":["estuve","estuviste","estuvo","estuvimos","estuvieron"],"cmd":"esté"},{"inf":"poner","en":"to put","pres":["pongo","pones","pone","ponemos","ponen"],"pret":["puse","pusiste","puso","pusimos","pusieron"],"cmd":"ponga"},{"inf":"salir","en":"to leave, go out","pres":["salgo","sales","sale","salimos","salen"],"pret":["salí","saliste","salió","salimos","salieron"],"cmd":"salga"},{"inf":"traer","en":"to bring","pres":["traigo","traes","trae","traemos","traen"],"pret":["traje","trajiste","trajo","trajimos","trajeron"],"cmd":"traiga"},{"inf":"dar","en":"to give","pres":["doy","das","da","damos","dan"],"pret":["di","diste","dio","dimos","dieron"],"cmd":"dé"},{"inf":"ver","en":"to see","pres":["veo","ves","ve","vemos","ven"],"pret":["vi","viste","vio","vimos","vieron"],"cmd":"vea"},{"inf":"oír","en":"to hear","pres":["oigo","oyes","oye","oímos","oyen"],"pret":["oí","oíste","oyó","oímos","oyeron"],"cmd":"oiga"},{"inf":"pagar","en":"to pay","pres":["pago","pagas","paga","pagamos","pagan"],"pret":["pagué","pagaste","pagó","pagamos","pagaron"],"cmd":"pague"},{"inf":"buscar","en":"to look for","pres":["busco","buscas","busca","buscamos","buscan"],"pret":["busqué","buscaste","buscó","buscamos","buscaron"],"cmd":"busque"}];
