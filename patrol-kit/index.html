at":"Statements","binding":"SCOTUS","front":"Missouri v. Seibert","cite":"542 U.S. 600","year":2004,"back":"Police deliberately questioned a suspect in custody without warnings until she confessed, then warned her and had her repeat the confession. The warned confession was inadmissible: the 'question first, warn later' tactic made the midstream warnings ineffective.","rule":"A deliberate two-step interrogation can sink the warned statement too.","field":"Warn at the start of custodial questioning. Don't plan to fix an unwarned confession with later warnings.","why":"Closes the 'question first' loophole.","flag":"Plurality decision. Justice Kennedy's concurrence, focused on deliberate tactics, is usually treated as controlling, so the rule is narrower than the plurality's.","source":"Missouri v. Seibert, 542 U.S. 600 (2004) (plurality)","verified":"https://www.law.cornell.edu/supremecourt/text/542/600"},{"id":"cl-fnu-lnu","type":"flip","cat":"Statements","binding":"2d Cir.","front":"United States v. FNU LNU","cite":"653 F.3d 144 (2d Cir. 2011)","year":2011,"back":"A traveler questioned in secondary inspection at an airport port of entry was not in custody for Miranda purposes, judged on the totality of the circumstances, so no warnings were needed. The court rejected the idea of a blanket border exception to Miranda, and said the officer's intent in asking the questions doesn't matter.","rule":"2d Cir.: no automatic border exception to Miranda. Custody at secondary is judged case by case, like anywhere else.","field":"Routine entry questioning in secondary usually isn't custody. Restraints, long holds or arrest-like treatment can make it custody, so warn before questioning about a crime.","why":"Binding in Vermont on Miranda at the port of entry and in secondary.","flag":"Fact-specific holding on the custody question. Verified through case summaries, not the full slip opinion.","source":"United States v. FNU LNU, 653 F.3d 144 (2d Cir. 2011)","verified":"https://caselaw.findlaw.com/us-2nd-circuit/1576880.html"},{"id":"cl-bivens","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Bivens v. Six Unknown Named Agents","cite":"403 U.S. 388","year":1971,"back":"Federal narcotics agents searched a home and arrested a man without a warrant or probable cause. The Court held the Fourth Amendment itself supports a damages claim against the individual federal agents, roughly the federal counterpart to § 1983 suits against state officers.","rule":"Bivens = a court-created damages suit against individual federal officers. Later cases have sharply limited it.","field":"Read with Ziglar, Hernandez and Egbert: courts now almost never extend Bivens to new contexts.","why":"The origin of personal damages suits against federal agents.","source":"Bivens v. Six Unknown Named Agents of Fed. Bureau of Narcotics, 403 U.S. 388 (1971)","verified":"https://www.law.cornell.edu/supremecourt/text/403/388"},{"id":"cl-ziglar","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Ziglar v. Abbasi","cite":"582 U.S. 120","year":2017,"back":"Expanding Bivens is a 'disfavored' judicial activity. If a claim differs meaningfully from the three Bivens cases the Court has approved, it's a new context, and courts shouldn't create a remedy if special factors counsel hesitation, such as national security, challenges to policy, or alternative remedies. No Bivens claim against senior officials over post-9/11 detention policy.","rule":"Two steps: (1) new context? (2) any special factors counseling hesitation? If yes, no Bivens.","field":"This is the framework Hernandez and Egbert applied to Border Patrol cases.","why":"Set the test that has nearly closed off new Bivens claims.","source":"Ziglar v. Abbasi, 582 U.S. 120 (2017)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-582/pdf/USREPORTS-582-120.pdf"},{"id":"cl-harlow","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Harlow v. Fitzgerald","cite":"457 U.S. 800","year":1982,"back":"Government officials performing discretionary functions are shielded from civil damages unless their conduct violated clearly established statutory or constitutional rights a reasonable person would have known. The test is objective. It replaced an inquiry into the official's subjective good faith.","rule":"Qualified immunity: liable only for violating clearly established law a reasonable official would have known.","field":"Immunity turns on what the law was and what you reasonably knew, not on your private motives.","why":"The modern qualified-immunity standard.","source":"Harlow v. Fitzgerald, 457 U.S. 800 (1982)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-457/pdf/USREPORTS-457-800.pdf"},{"id":"cl-pearson","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Pearson v. Callahan","cite":"555 U.S. 223","year":2009,"back":"Qualified immunity has two questions: did the officer violate a constitutional right, and was that right clearly established at the time? Courts may answer them in either order. The old rule requiring the violation question first (Saucier v. Katz) is no longer mandatory.","rule":"Two prongs, any order: (1) violation? (2) clearly established?","field":"A court can grant immunity without ever deciding whether what you did was lawful.","why":"Explains how judges structure a qualified-immunity ruling.","source":"Pearson v. Callahan, 555 U.S. 223 (2009)","verified":"https://law.cornell.edu/supct/pdf/07-751P.ZS"},{"id":"cl-vega","type":"flip","cat":"Liability","binding":"SCOTUS","front":"Vega v. Tekoh","cite":"597 U.S. 134","year":2022,"back":"A violation of the Miranda rules does not by itself support a § 1983 damages claim. Miranda is a prophylactic rule enforced by suppressing unwarned statements in the prosecution's case-in-chief, not by suing the officer.","rule":"Missed warnings = statement suppressed. Not, by itself, a civil-rights damages suit.","field":"Skipping warnings still costs you the statement and possibly the case. An actually coerced confession is a separate problem.","why":"Separates the criminal-case consequence of a Miranda error from civil liability.","flag":"Decided under § 1983 (state officers). It doesn't create a Miranda damages claim against federal agents either.","source":"Vega v. Tekoh, 597 U.S. 134 (2022)","verified":"https://law.justia.com/cases/federal/us/597/21-499/"},{"id":"cl-sc-lawyer-maybe","type":"scenario","cat":"Which Case Governs?","setup":"Forty minutes into a warned, waived custodial interview, the subject says, 'Maybe I should get a lawyer or something.'","q":"What does the law require?","choices":["Stop immediately: Edwards","Nothing: Davis. The remark is ambiguous, though asking 'Are you asking for a lawyer?' is good practice","Re-read the warnings and continue","Stop until the next day, then re-warn"],"answer":1,"explain":"Davis: only an unambiguous request triggers Edwards. Clarifying isn't required, but it protects the statement. A clear request ends questioning.","source":"Davis v. United States, 512 U.S. 452 (1994)","verified":"https://law.resource.org/pub/us/case/reporter/US/512/512.US.452.92-1949.html"},{"id":"cl-sc-gun-where","type":"scenario","cat":"Which Case Governs?","setup":"A subject seen tossing what looked like a pistol runs into a public park. You catch and cuff him. The holster on his belt is empty.","q":"Can you ask 'Where's the gun?' before warnings?","choices":["No: Miranda has no exceptions","Yes: Quarles public-safety exception. Ask about the gun, then warn before other questions","Yes, and you can question him about the whole incident","Only with his consent"],"answer":1,"explain":"Quarles allows limited unwarned questions prompted by an immediate safety concern. Once the danger is handled, warn before investigating the crime.","source":"New York v. Quarles, 467 U.S. 649 (1984)","verified":"https://openbooks.lib.msu.edu/cj275/chapter/new-york-v-quarles-1984/"},{"id":"cl-sc-secondary","type":"scenario","cat":"Which Case Governs?","setup":"A traveler entering from Canada is sent to secondary and asked routine questions about identity and citizenship. No handcuffs, no arrest.","q":"Which binding case addresses whether warnings are needed?","choices":["Riley v. California","United States v. FNU LNU (2d Cir.): custody judged on all the circumstances, usually not custody here","Martinez-Fuerte: no Miranda at the border, ever","Bivens"],"answer":1,"explain":"FNU LNU rejects a blanket border exception but found routine secondary questioning wasn't custody on its facts. Arrest-like treatment changes the answer.","source":"United States v. FNU LNU, 653 F.3d 144 (2d Cir. 2011)","verified":"https://caselaw.findlaw.com/us-2nd-circuit/1576880.html"},{"id":"cl-sc-reapproach","type":"scenario","cat":"Which Case Governs?","setup":"Yesterday a detained smuggling suspect clearly asked for a lawyer and you stopped. No lawyer has seen him. Today you want to re-warn and try again.","q":"Can you?","choices":["Yes: fresh warnings fix it","No: Edwards. Not unless counsel is present or he starts the conversation","Yes, if a different agent asks","Yes: Berghuis"],"answer":1,"explain":"Edwards bars police-initiated custodial questioning after a clear request for counsel. Fresh warnings don't cure it.","source":"Edwards v. Arizona, 451 U.S. 477 (1981)","verified":"https://www.law.cornell.edu/supremecourt/text/451/477"},{"id":"cl-sc-bivens","type":"scenario","cat":"Which Case Governs?","setup":"A property owner near the northern border sues a Border Patrol agent personally for damages, claiming excessive force during an encounter on his land.","q":"Which case most directly controls whether that suit can proceed under Bivens?","choices":["Bivens v. Six Unknown Named Agents: yes, it always can","Egbert v. Boule: no Bivens claim in this context","Graham v. Connor","Vega v. Tekoh"],"answer":1,"explain":"Egbert, applying the Ziglar framework, refused to extend Bivens to an excessive-force claim against a Border Patrol agent. Graham states the force standard, not whether a damages suit exists.","source":"Egbert v. Boule, 596 U.S. 482 (2022)","verified":"https://law.justia.com/cases/federal/us/596/21-147/"}]},{"meta":{"id":"force","name":"Use of Force","short":"UOF","color":"#B07A9E","order":5,"requireVerified":true,"blurb":"Graham factors, Garner, the regulation, and published CBP/DHS policy.","subModes":["browse"]},"categories":{"Constitutional Standard":{"why":"Courts judge every use of force against this standard."},"Policy":{"why":"Policy can be stricter than the Constitution, and you are held to both."},"Vehicles & Pursuits":{"why":"Vehicle encounters produce some of the hardest force decisions, and specific rules apply."},"Scenarios":{"why":"Applying the standard under stress is the skill being tested."}},"cards":[{"id":"uf-graham-order","type":"order","cat":"Constitutional Standard","binding":"SCOTUS","q":"Graham v. Connor: put the three factors in the order the Court listed them.","steps":["Severity of the crime at issue","Whether the suspect poses an immediate threat to the safety of officers or others","Whether the suspect is actively resisting arrest or attempting to evade arrest by flight"],"explain":"Severity → immediate threat → resisting or evading, judged from the view of a reasonable officer on the scene.","why":"Your report should address each factor.","source":"Graham v. Connor, 490 U.S. 386 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"uf-graham-perspective","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Under Graham, from whose perspective is the reasonableness of force judged?","choices":["The subject's","A reasonable officer on the scene, without 20/20 hindsight","The reviewing judge with all facts later learned","The officer's own good-faith intent"],"answer":1,"explain":"Objective test, at the moment, allowing for split-second decisions. The officer's intent, good or bad, is irrelevant.","why":"Write what you perceived at the time, not what you learned afterward.","source":"Graham v. Connor, 490 U.S. 386 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"uf-garner","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Tennessee v. Garner: deadly force to stop a fleeing suspect is allowed only when the officer has probable cause to believe the suspect…","choices":["committed any felony","poses a significant threat of death or serious physical injury to the officer or others","is likely to escape","refuses lawful commands"],"answer":1,"explain":"Flight alone, even from a felony, is not enough.","why":"The constitutional floor for deadly force on a fleeing subject.","source":"Tennessee v. Garner, 471 U.S. 1 (1985)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"uf-barnes","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"After Barnes v. Felix (2025), a court reviewing a shooting may consider…","choices":["Only the final seconds before the shot","The totality of the circumstances, including events leading up to the threat","Only the officer's stated reasons","Only what the subject knew"],"answer":1,"explain":"The Court unanimously rejected the 'moment of the threat' test.","flag":"The 2d Circuit had used the narrower moment-of-threat approach. Barnes overrides it.","why":"Your tactics before the critical moment are part of the review.","source":"Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://en.wikipedia.org/wiki/Barnes_v._Felix"},{"id":"uf-scott","type":"flip","cat":"Constitutional Standard","binding":"SCOTUS","front":"Ending a dangerous vehicle flight with force — the test","back":"Scott v. Harris: weigh the risk the force creates for the fleeing driver against the actual and imminent threat the driver's reckless flight poses to others, considering the number of lives at risk and the relative culpability of the parties.","why":"The framework for pursuits and vehicle interventions.","source":"Scott v. Harris, 550 U.S. 372 (2007)","verified":"https://law.justia.com/cases/federal/us/550/372/"},{"id":"uf-287-nondeadly","type":"flip","cat":"Constitutional Standard","binding":"regulation","front":"8 C.F.R. 287.8(a): when may you move up to a higher level of non-deadly force?","back":"Only when warranted by the subject's actions, apparent intentions, and apparent capabilities. Always use the minimum non-deadly force necessary to accomplish the mission.","why":"The regulation adds a 'minimum necessary' rule on top of Graham.","source":"8 C.F.R. § 287.8(a)(1)","verified":"https://chanrobles.com/usa/uslaws/cfr/title08/8-1.0.1.2.57.0.1.8.php"},{"id":"uf-287-deadly-def","type":"mc","cat":"Constitutional Standard","binding":"regulation","q":"8 C.F.R. 287.8(a): how does the regulation define deadly force?","choices":["Any use of a firearm","Any use of force likely to cause death or serious physical injury","Any force that actually causes injury","Any force above handcuffing"],"answer":1,"explain":"Deadly force = force likely to cause death or serious physical injury. Non-deadly force is everything else. The test is likelihood, not the tool used or the actual result.","why":"A baton strike to the head or a vehicle can be deadly force. A firearm isn't the only way to cross the line.","source":"8 C.F.R. § 287.8(a)(1)(i), (a)(2)(i)","verified":"https://www.govinfo.gov/content/pkg/CFR-2025-title8-vol1/pdf/CFR-2025-title8-vol1-sec287-8.pdf"},{"id":"uf-287-grounds","type":"flip","cat":"Constitutional Standard","binding":"regulation","front":"8 C.F.R. 287.8(a): the threshold for any non-deadly force","back":"A designated immigration officer may use non-deadly force only when the officer has reasonable grounds to believe such force is necessary.","why":"Even low-level force needs a reason you can articulate.","source":"8 C.F.R. § 287.8(a)(1)(ii)","verified":"https://www.govinfo.gov/content/pkg/CFR-2025-title8-vol1/pdf/CFR-2025-title8-vol1-sec287-8.pdf"},{"id":"uf-torres","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Torres v. Madrid (2021): officers shoot a fleeing driver, who is hit but keeps going and escapes. Was she seized?","choices":["No. A seizure requires that the person stop","Yes. Applying physical force to the body with intent to restrain is a seizure even if the person doesn't submit","Only if she was later arrested","Only if the officers had a warrant"],"answer":1,"explain":"A seizure by force happens the moment force is applied with objective intent to restrain. A seizure by a mere show of authority (commands, lights) still needs submission (California v. Hodari D.).","flag":"Torres decided only that a seizure occurred. It didn't decide whether the force was reasonable or whether the officers had qualified immunity.","why":"Force that fails to stop someone still gets judged under the Fourth Amendment.","source":"Torres v. Madrid, 592 U.S. 306 (2021)","verified":"https://law.cornell.edu/supremecourt/text/19-292"},{"id":"uf-mendez","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"County of Los Angeles v. Mendez (2017): if force was reasonable at the moment it was used, does an earlier, separate Fourth Amendment violation make it excessive?","choices":["Yes, under the 'provocation rule'","No. The Court rejected the provocation rule","Yes, if the earlier violation was intentional","Only in deadly-force cases"],"answer":1,"explain":"Unanimous: the Fourth Amendment gives no basis for the provocation rule. An earlier violation (here, a warrantless entry) is analyzed on its own, and may still create liability if it proximately caused the injury.","flag":"Mendez rejected one theory of liability. It didn't excuse the earlier violation. Barnes v. Felix (2025) separately says the lead-up is part of the totality.","why":"Bad tactics aren't a free pass. They can create their own liability.","source":"County of Los Angeles v. Mendez, 581 U.S. 420 (2017)","verified":"https://en.wikipedia.org/wiki/Los_Angeles_County_v._Mendez"},{"id":"uf-kingsley","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Kingsley v. Hendrickson (2015): what must a pretrial detainee prove in an excessive-force claim?","choices":["That the officer acted maliciously","That force purposely or knowingly used was objectively unreasonable","That the officer knew the force was excessive","That the injury was permanent"],"answer":1,"explain":"Objective standard. The detainee doesn't have to prove the officer's state of mind about whether the force was excessive.","flag":"Kingsley is a Fourteenth Amendment case about pretrial detainees in a jail. How it applies to other kinds of custody varies by court.","why":"Force in a holding area is judged objectively too.","source":"Kingsley v. Hendrickson, 576 U.S. 389 (2015)","verified":"https://law.justia.com/cases/federal/us/576/389/"},{"id":"uf-lombardo","type":"flip","cat":"Constitutional Standard","binding":"SCOTUS","front":"Lombardo v. St. Louis (2021): is prone restraint reasonable as long as the subject resists?","back":"Not automatically. The Court sent the case back for a fact-specific analysis: the kind, intensity and duration of the restraint, that the man was already handcuffed and leg-shackled, and evidence that officers were trained that pressing on a prone subject's back can cause suffocation.","flag":"Per curiam remand. The Court expressed no view on whether the force was excessive.","why":"Keeping weight on a restrained, prone subject is a known risk, and time spent in that position counts.","source":"Lombardo v. St. Louis, 594 U.S. 464 (2021)","verified":"https://www.supremecourt.gov/opinions/20pdf/594us2r60_2c83.pdf"},{"id":"uf-kisela","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Kisela v. Hughes (2018): an officer shot a woman holding a large kitchen knife who had moved toward another person and ignored at least two commands to drop it. Result?","choices":["Officer liable for excessive force","Qualified immunity: no clearly established law made this conduct unlawful","Case dismissed because no one was seized","New trial ordered on the Graham factors"],"answer":1,"explain":"Summary reversal. Without deciding whether there was a violation, the Court held the officer was entitled to qualified immunity, stressing that specificity matters in Fourth Amendment cases.","flag":"A qualified-immunity ruling, not an approval of the shooting.","why":"Shows how fast-moving knife encounters are reviewed.","source":"Kisela v. Hughes, 584 U.S. 100 (2018)","verified":"https://www.supremecourt.gov/opinions/17pdf/17-467_bqm1.pdf"},{"id":"uf-pearson","type":"flip","cat":"Constitutional Standard","binding":"SCOTUS","front":"Qualified immunity: the two questions (Saucier / Pearson)","back":"(1) Did the officer violate a constitutional right? (2) Was that right clearly established at the time? Saucier v. Katz (2001) required that order. Pearson v. Callahan (2009) made the order optional: courts may decide either question first.","why":"Explains why many force cases end without a ruling on whether the force was lawful.","source":"Pearson v. Callahan, 555 U.S. 223 (2009); Saucier v. Katz, 533 U.S. 194 (2001)","verified":"https://www.law.cornell.edu/supremecourt/text/07-751"},{"id":"uf-zorn","type":"mc","cat":"Constitutional Standard","binding":"SCOTUS","q":"Zorn v. Linton (2026), a Vermont case: a sergeant warned a sit-in protester he would use force, then used a rear wristlock to lift her. What did the Supreme Court hold?","choices":["The wristlock was excessive force","Qualified immunity: no precedent clearly made that conduct unlawful","Protesters can never be moved by force","The warning made any force reasonable"],"answer":1,"explain":"The Court reversed the 2d Circuit, holding that Amnesty America v. West Hartford (2d Cir. 2004) did not clearly establish that a routine wristlock after a verbal warning was unlawful.","flag":"A qualified-immunity ruling only. It doesn't hold that pain compliance on passive resisters is always lawful.","why":"The most recent Supreme Court force case from your circuit.","source":"Zorn v. Linton, 607 U.S. ___ (2026) (per curiam), No. 25-297","verified":"https://www.law.cornell.edu/supremecourt/text/25-297"},{"id":"uf-tracy","type":"flip","cat":"Constitutional Standard","binding":"2d Cir.","front":"Tracy v. Freshwater (2d Cir. 2010): pepper spray and handcuffs","back":"Most of the excessive-force claims failed, but the pepper-spray claim went forward because the facts were disputed about whether the subject was sprayed in the face after he was fully handcuffed. Timing relative to restraint mattered.","flag":"The court found a fact dispute. It didn't decide that the spray was unlawful.","why":"Force that may be fine during resistance can become excessive once the subject is restrained.","source":"Tracy v. Freshwater, 623 F.3d 90 (2d Cir. 2010)","verified":"https://caselaw.findlaw.com/us-2nd-circuit/1541031.html"},{"id":"uf-lennox","type":"mc","cat":"Constitutional Standard","binding":"2d Cir.","q":"Lennox v. Miller (2d Cir. 2020): what did the court say was clearly established?","choices":["Any takedown of an arrestee is excessive","It is impermissible to use significant force against a restrained arrestee who is not actively resisting","Handcuffs may never be used on a compliant arrestee","Officers must always wait for backup"],"answer":1,"explain":"Taking the facts in the plaintiff's favor, she wasn't resisting and was already secured, so the officer was denied qualified immunity. A second officer, busy with crowd control and without a realistic chance to intervene, got immunity.","flag":"An appeal on qualified immunity with facts viewed in the plaintiff's favor, not a final verdict.","why":"Once a subject is restrained and compliant, significant force is very hard to justify in this circuit.","source":"Lennox v. Miller, 968 F.3d 150 (2d Cir. 2020)","verified":"https://us2ndcircuitcourtofappealsopinions.justia.com/category/civil-rights/page/25"},{"id":"uf-anderson","type":"flip","cat":"Constitutional Standard","binding":"2d Cir.","front":"Anderson v. Branen (2d Cir. 1994): duty to intervene","back":"All law enforcement officials have an affirmative duty to intervene to protect people's constitutional rights from infringement by other officers in their presence. An officer who fails to intervene can be liable if they had a realistic opportunity to prevent the harm.","why":"A bystander officer can be liable for another officer's excessive force.","source":"Anderson v. Branen, 17 F.3d 552 (2d Cir. 1994)","verified":"https://law.resource.org/pub/us/case/reporter/F3/017/17.F3d.552.93-6179.719.html"},{"id":"uf-cbp-standard","type":"flip","cat":"Policy","binding":"policy","front":"CBP Use of Force Policy (2021): the general standard","back":"Officers and agents shall use only the force that is objectively reasonable to effectively bring an incident under control, while protecting the life of the officer/agent or others.","why":"CBP's own baseline, which tracks Graham.","flag":"Confirm against the current version issued to you. This is the publicly posted 2021 text.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-deadly","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: when is deadly force 'necessary'?","back":"When the officer/agent has a reasonable belief that the subject poses an imminent danger of death or serious bodily injury to the officer/agent or to another person.","why":"The policy deadly-force trigger.","flag":"Confirm against the current version issued to you.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-escape","type":"mc","cat":"Policy","binding":"policy","q":"CBP/DHS policy: may deadly force be used solely to prevent the escape of a fleeing subject?","choices":["Yes, if the subject is a felon","No","Yes, after a verbal warning","Only near the border"],"answer":1,"explain":"\"Deadly force shall not be used solely to prevent the escape of a fleeing subject.\" A fleeing subject who poses a significant threat of death or serious harm is a different analysis (Garner).","why":"Policy and Garner point the same way.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021); DHS Policy Statement 044-05","verified":"https://www.justsecurity.org/128498/dhs-doj-cbp-policy-force-vehicles/"},{"id":"uf-cbp-deesc","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: de-escalation","back":"When it is feasible and safe to do so, use de-escalation tactics and techniques to minimize the likelihood of needing force, or to minimize the force used.","why":"Expected whenever time and distance allow, and reviewed afterward.","flag":"Confirm against the current version issued to you.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-intervene","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: another agent is using clearly improper force","back":"The 2021 policy contains a duty to intervene in, and report, improper use of force.","why":"Silence carries its own exposure.","flag":"Confirm the exact wording and reporting chain in your current policy.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-dhs-choke","type":"mc","cat":"Policy","binding":"policy","q":"DHS Policy 044-05 Rev. 01 (2023): chokeholds and carotid restraints are…","choices":["Allowed at any level of resistance","Prohibited unless deadly force is otherwise authorized","Allowed if the subject is resisting","Prohibited in all circumstances"],"answer":1,"explain":"Prohibited unless the legal standard for deadly force is met.","flag":"DHS 044-05 Rev. 01 (Feb. 2023) status after 2025 is unclear in public sources. Confirm the policy currently in force.","why":"A department-wide rule that sits on top of CBP policy.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-dhs-aid","type":"flip","cat":"Policy","binding":"policy","front":"DHS 2023 policy: after you use force and someone is injured","back":"There is an affirmative duty to request and/or render medical aid.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"Aid after force is a policy duty, not a courtesy.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-dhs-self","type":"mc","cat":"Policy","binding":"policy","q":"DHS 2023 policy: may deadly force be used against a person who is a threat only to themselves or to property?","choices":["Yes","No","Only with a supervisor's approval","Only if the property is a vehicle"],"answer":1,"explain":"The 2023 update bars deadly force against someone who is only a threat to themselves or property.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"A suicidal subject or property damage alone doesn't meet the deadly-force threshold.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-cbp-necessary","type":"mc","cat":"Policy","binding":"policy","q":"CBP policy (2021): what force may be used, and what is strictly prohibited?","choices":["Any force the law allows. Nothing is prohibited","Only objectively reasonable and necessary force. Excessive force is strictly prohibited","Force a supervisor approves. Deadly force is prohibited","Force matching the subject's. Warnings are prohibited"],"answer":1,"explain":"\"Authorized Officers/Agents shall only use objectively reasonable and necessary force in all instances.\" The policy also states that excessive force is strictly prohibited.","flag":"Confirm against the current version issued to you.","why":"Policy adds 'necessary' on top of the constitutional 'reasonable.'","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-deadly-def","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: definition of deadly force","back":"Force likely to cause serious bodily injury or death of a person.","note":"The regulation uses nearly the same test: force likely to cause death or serious physical injury.","flag":"Confirm against the current version issued to you.","why":"The definition turns on likely result, not the tool.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-thrown","type":"mc","cat":"Policy","binding":"policy","q":"CBP policy: may you fire in response to thrown or launched projectiles (such as rocks)?","choices":["Yes, any thrown object is an assault","Only with a reasonable belief, based on the totality of circumstances, that the subject poses an imminent danger of serious bodily injury or death","Only after a warning shot","Never"],"answer":1,"explain":"The policy also points to tactical options such as seeking cover or distancing yourself from the immediate area of danger.","flag":"Confirm against the current version issued to you.","why":"Rock assaults are a recurring border situation, and this rule is written for them.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-warning-shots","type":"mc","cat":"Policy","binding":"policy","q":"CBP policy (2021): warning shots are…","choices":["Allowed whenever a subject ignores commands","Prohibited, except in the limited circumstances described in the policy","Allowed to disperse a crowd","Allowed if fired into the ground"],"answer":1,"explain":"\"Discharging a firearm as a warning is prohibited except for the limited circumstances described in Chapter 3.C.\"","flag":"Confirm against the current version issued to you, including what the limited exceptions cover.","why":"A warning shot is still a firearm discharge, with all the reporting and review that brings.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-medical","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: after any use of force, who gets medical assistance?","back":"Seek medical assistance for any person who appears to be injured or claims to be injured, or as otherwise required by the policy.","flag":"Confirm against the current version issued to you.","why":"A claimed injury triggers the duty even when you can't see one.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-cbp-report-improper","type":"flip","cat":"Policy","binding":"policy","front":"CBP policy: you know of an improper use of force by another officer","back":"Report it, without unreasonable delay, to your chain of command and/or the Office of Professional Responsibility. Failing to intervene or report is itself misconduct that can lead to discipline.","flag":"Confirm the exact reporting chain in your current policy and handbook.","why":"The duty applies to any CBP employee with knowledge, not only those on scene.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021); CBP Use of Force Administrative Guidelines and Procedures Handbook, HB 4500-002B (2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-admin-guide-procedure-handbook_4500-002B.pdf"},{"id":"uf-dhs-warning","type":"mc","cat":"Policy","binding":"policy","q":"DHS use-of-force policy: before applying force, when feasible, you must…","choices":["Call a supervisor","Attempt to identify yourself and issue a verbal warning to comply","Draw your weapon","Wait for backup"],"answer":1,"explain":"When feasible, identify yourself and warn. Where a warning is given, the subject should get a reasonable opportunity to comply voluntarily, where feasible. A warning may not be feasible if the delay would increase danger, allow escape, or let evidence be destroyed.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"A warning documents that force was a last step, not a first one.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/sites/default/files/2023-02/23_0206_s1_use-of-force-policy-update.pdf"},{"id":"uf-veh-brosseau","type":"flip","cat":"Vehicles & Pursuits","binding":"SCOTUS","front":"Brosseau v. Haugen (2004)","back":"An officer shot a man with a felony warrant in the back as he tried to drive away, saying he endangered officers and others nearby. The Court granted qualified immunity because the law did not clearly establish that her conduct was unconstitutional.","flag":"The Court didn't decide whether the shooting violated the Fourth Amendment, only immunity.","why":"Shows that shooting at a fleeing driver sits in a hazy area, which is why policy draws firmer lines.","source":"Brosseau v. Haugen, 543 U.S. 194 (2004) (per curiam)","verified":"https://www.law.cornell.edu/supremecourt/text/543/194"},{"id":"uf-veh-brower","type":"flip","cat":"Vehicles & Pursuits","binding":"SCOTUS","front":"Brower v. County of Inyo (1989): a fleeing driver crashes into a police roadblock","back":"That's a seizure. A Fourth Amendment seizure happens when the government ends a person's freedom of movement through means intentionally applied. Whether the roadblock was reasonable is a separate question.","why":"Roadblocks and other vehicle stops by design are seizures, and must be reasonable.","source":"Brower v. County of Inyo, 489 U.S. 593 (1989)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-489/pdf/USREPORTS-489-593.pdf"},{"id":"uf-veh-disable","type":"mc","cat":"Vehicles & Pursuits","binding":"policy","q":"CBP policy: may you fire at a vehicle solely to disable it (shoot the tires or engine)?","choices":["Yes, if it is fleeing","No. The policy's exception is for vessels in maritime operations, with specifically authorized firearms and ammunition","Yes, with a supervisor's approval","Yes, at night only"],"answer":1,"explain":"Firearms shall not be fired solely to disable motor vehicles, vessels, aircraft or other conveyances. DHS policy has the same rule.","flag":"Confirm against the current version issued to you.","why":"Disabling fire at a car is off the table on land.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021); DHS Policy Statement 044-05 Rev. 01 (2023)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-veh-path","type":"flip","cat":"Vehicles & Pursuits","binding":"policy","front":"CBP policy: safe tactics around a subject vehicle","back":"Don't place yourself in the path of a moving vehicle or use your body to block a vehicle's path.","flag":"Confirm against the current version issued to you.","why":"Stepping in front of a car can create the very threat later used to justify shooting, and after Barnes v. Felix the lead-up is reviewed too.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-veh-operator","type":"mc","cat":"Vehicles & Pursuits","binding":"policy","q":"DHS policy: may you fire at the operator of a moving vehicle?","choices":["Yes, whenever the vehicle is fleeing","Only if deadly force against the operator is justified under the policy's deadly-force standard","Only after a warning shot at the vehicle","Never"],"answer":1,"explain":"Firing at a moving vehicle's operator is prohibited unless deadly force against that person is justified. The 2023 update adds that you must consider the hazards an out-of-control vehicle may pose to officers and bystanders.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"The vehicle being a car doesn't change the standard. The person must pose the threat.","source":"DHS Policy Statement 044-05 (2018) and Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/sites/default/files/publications/mgmt/law-enforcement/mgmt-dir_044-05-department-policy-on-the-use-of-force.pdf"},{"id":"uf-veh-warning","type":"flip","cat":"Vehicles & Pursuits","binding":"policy","front":"DHS 2023 policy: warning shots at a moving vehicle","back":"Firearms shall not be discharged solely as a warning or signal at moving vehicles, vessels, aircraft or other conveyances, except in the limited circumstances the policy describes.","flag":"Confirm the policy currently in force (see 044-05 status note).","why":"Matches CBP's general bar on warning shots.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/sites/default/files/2023-02/23_0206_s1_use-of-force-policy-update.pdf"},{"id":"uf-veh-pursuit","type":"flip","cat":"Vehicles & Pursuits","binding":"policy","front":"CBP pursuit directive (Dec. 2025): when do you end a vehicle pursuit?","back":"Self-terminate when the law enforcement benefit of continuing no longer outweighs the risk to the public.","flag":"Pursuit policy has changed repeatedly (the 2023 directive was rescinded in Jan. 2025). Confirm the version and local procedures in force.","why":"The pursuit itself is a use of risk that you must keep re-weighing.","source":"CBP Directive No. 4510-026B, Emergency Driving Including Vehicular Pursuits (Dec. 2, 2025)","verified":"https://www.cbp.gov/sites/default/files/2025-12/intc-44545_-_cbp_directive_no._4510-026b_usbp_redacted.pdf"},{"id":"uf-sc-runner","type":"scenario","cat":"Scenarios","setup":"A subject who just crossed runs from you across an open field. Hands visible and empty, no weapon seen, no threat made.","q":"What force options are consistent with Garner and policy?","choices":["Deadly force to stop the escape","Pursue and use the minimum non-deadly force necessary to apprehend","Deadly force after a second ignored command","None. Let the subject go."],"answer":1,"explain":"No significant threat means no deadly force. Non-deadly force is limited to what's necessary, scaled to actions, apparent intentions and apparent capabilities.","source":"Tennessee v. Garner, 471 U.S. 1 (1985); 8 C.F.R. § 287.8(a)","verified":"https://law.justia.com/cases/federal/us/471/1/"},{"id":"uf-sc-knife","type":"scenario","cat":"Scenarios","setup":"At about 15 feet, a subject pulls a knife and advances on your partner, ignoring commands.","q":"Which standard decides whether deadly force is justified?","choices":["Whether the subject committed a felony","Reasonable belief of imminent danger of death or serious bodily injury to your partner","Whether the subject is fleeing","Whether a supervisor approves"],"answer":1,"explain":"The regulation, CBP policy and Graham's threat factor all turn on imminent danger of death or serious bodily injury, judged as a reasonable officer would see it then.","source":"8 C.F.R. § 287.8(a)(2); CBP Use of Force Policy (2021)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"uf-sc-report","type":"scenario","cat":"Scenarios","setup":"You used a takedown on a resisting subject. Now you're writing the report.","q":"What should the narrative cover?","choices":["Only that force was 'necessary'","Each Graham factor as you perceived it at the time, the subject's actions, and the de-escalation tried","Your intent to be fair","What you later learned from records"],"answer":1,"explain":"Graham judges the facts as a reasonable officer perceived them then. Barnes adds that the lead-up counts too.","source":"Graham v. Connor, 490 U.S. 386 (1989); Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://www.govinfo.gov/content/pkg/USREPORTS-490/pdf/USREPORTS-490-386.pdf"},{"id":"uf-sc-rocks","type":"scenario","cat":"Scenarios","binding":"policy","setup":"From across a drainage ditch, a subject starts throwing fist-sized rocks at you. A vehicle and a concrete barrier are a few steps away.","q":"What does CBP policy point you to first?","choices":["Return fire, since any rock is deadly force","Seek cover or distance. Firearms only with a reasonable belief of imminent danger of serious bodily injury or death","Fire a warning shot","Charge the subject"],"answer":1,"explain":"The thrown-projectile rule requires a reasonable belief, based on the totality of circumstances, of imminent danger of serious injury or death. The policy names cover and distance as tactical options.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-sc-veh-flee","type":"scenario","cat":"Scenarios","binding":"policy","setup":"A car you were approaching speeds away from you down an empty road. No one is in its path. You believe it is carrying people who just crossed.","q":"Can you shoot at the car or its tires to stop it?","choices":["Yes, at the tires only","No. Fleeing alone doesn't justify deadly force, and firing solely to disable a vehicle is prohibited","Yes, if you fire a warning shot first","Yes, because smuggling is a felony"],"answer":1,"explain":"Garner: flight alone isn't enough. CBP/DHS: no deadly force solely to prevent escape, and no firing solely to disable a vehicle.","source":"Tennessee v. Garner, 471 U.S. 1 (1985); CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-sc-veh-path","type":"scenario","cat":"Scenarios","binding":"policy","setup":"A driver at a stop refuses to get out and starts the engine. You could step in front of the bumper to keep the car from leaving.","q":"What's the right move?","choices":["Step in front so the driver has to stop","Stay out of the vehicle's path and use other options","Stand in front with your weapon drawn","Reach in and grab the wheel"],"answer":1,"explain":"Policy says don't place yourself in the path of a moving vehicle or block it with your body. If you create the danger, Barnes v. Felix lets a court weigh that lead-up.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021); Barnes v. Felix, 605 U.S. 73 (2025)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-sc-cuffed","type":"scenario","cat":"Scenarios","binding":"2d Cir.","setup":"A subject is handcuffed behind his back, seated, not resisting, and cursing at you.","q":"Is significant force, such as a takedown or pepper spray, justified now?","choices":["Yes, to stop the disrespect","No. Significant force on a restrained subject who isn't actively resisting is clearly established as unlawful in this circuit","Yes, if he refuses to stop talking","Yes, if a supervisor is present"],"answer":1,"explain":"Lennox v. Miller (2d Cir. 2020). Tracy v. Freshwater (2d Cir. 2010) shows that whether force came before or after full restraint is the key fact.","source":"Lennox v. Miller, 968 F.3d 150 (2d Cir. 2020); Tracy v. Freshwater, 623 F.3d 90 (2d Cir. 2010)","verified":"https://us2ndcircuitcourtofappealsopinions.justia.com/category/civil-rights/page/25"},{"id":"uf-sc-passive","type":"scenario","cat":"Scenarios","binding":"policy","setup":"A person sitting on the ground refuses to stand and move. No threats, no weapons, no attempts to strike. Time is not critical.","q":"What comes first?","choices":["Pepper spray to gain compliance","Identify yourself and give a verbal warning, with a reasonable chance to comply, then use only the minimum force needed","A takedown","A baton strike to the legs"],"answer":1,"explain":"DHS policy calls for a warning when feasible. The regulation requires the minimum non-deadly force necessary. In Zorn v. Linton (2026), a warning before a wristlock was part of why the officer got immunity.","source":"DHS Policy Statement 044-05 Rev. 01 (2023); 8 C.F.R. § 287.8(a)(1)(iii); Zorn v. Linton, 607 U.S. ___ (2026)","verified":"https://www.dhs.gov/sites/default/files/2023-02/23_0206_s1_use-of-force-policy-update.pdf"},{"id":"uf-sc-intervene","type":"scenario","cat":"Scenarios","binding":"2d Cir.","setup":"Your partner keeps striking a subject who is already handcuffed and face-down. You're right next to them.","q":"What are your duties?","choices":["None. It's your partner's use of force","Intervene to stop it, then report it without unreasonable delay","Report it at the end of the shift only if asked","Leave the area"],"answer":1,"explain":"Anderson v. Branen: a bystander officer with a realistic opportunity to intervene can be liable. CBP policy requires intervening and reporting, and failing to do either is misconduct.","source":"Anderson v. Branen, 17 F.3d 552 (2d Cir. 1994); CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://law.resource.org/pub/us/case/reporter/F3/017/17.F3d.552.93-6179.719.html"},{"id":"uf-sc-aid","type":"scenario","cat":"Scenarios","binding":"policy","setup":"After a takedown, the subject says his wrist hurts. You see no swelling or blood.","q":"What does CBP policy require?","choices":["Nothing, since no injury is visible","Seek medical assistance, because he claims an injury","Note it only if he complains again","Ask him to sign a waiver"],"answer":1,"explain":"The duty covers anyone who appears to be injured or claims to be injured. Document the complaint and the aid sought.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-sc-prone","type":"scenario","cat":"Scenarios","binding":"SCOTUS","setup":"A subject is handcuffed and leg-restrained, face-down, still struggling. Two officers are pressing on his back, and he says he can't breathe.","q":"Which statement is accurate?","choices":["Prone restraint is always reasonable while he resists","Prone restraint isn't automatically reasonable just because he resists. Its duration, the restraints already on, and the known suffocation risk all count","Weight on the back is fine once he's cuffed","Only the final seconds matter"],"answer":1,"explain":"Lombardo v. St. Louis (2021) rejected treating prone restraint as reasonable whenever a subject appears to resist. Barnes v. Felix also bars a moment-of-threat-only review.","source":"Lombardo v. St. Louis, 594 U.S. 464 (2021)","verified":"https://www.supremecourt.gov/opinions/20pdf/594us2r60_2c83.pdf"},{"id":"uf-sc-seizure","type":"scenario","cat":"Scenarios","binding":"SCOTUS","setup":"You grab a fleeing subject's arm to stop him. He twists free and escapes. Later he sues, claiming excessive force.","q":"Was he 'seized' under the Fourth Amendment?","choices":["No, because he got away","Yes. Physical force applied to the body with intent to restrain is a seizure even if he doesn't submit","Only if he was injured","Only if you announced an arrest"],"answer":1,"explain":"Torres v. Madrid (2021). Whether the force was reasonable is then judged under Graham.","source":"Torres v. Madrid, 592 U.S. 306 (2021)","verified":"https://law.cornell.edu/supremecourt/text/19-292"},{"id":"uf-sc-self","type":"scenario","cat":"Scenarios","binding":"policy","setup":"A man in a parked car holds a knife to his own throat. No one else is near him, and he isn't moving toward anyone.","q":"Does DHS policy allow deadly force?","choices":["Yes, to save his life","No. He poses a threat only to himself","Yes, if he refuses three commands","Yes, if he damages the car"],"answer":1,"explain":"The 2023 DHS policy bars deadly force against a person who is a threat only to themselves or property. Create time and distance and call for resources. If he turns the knife on someone else, the analysis changes.","source":"DHS Policy Statement 044-05 Rev. 01 (Feb. 6, 2023)","verified":"https://www.dhs.gov/news/2023/02/07/dhs-updates-department-wide-use-force-policy-advance-effective-accountable-law"},{"id":"uf-sc-warning-shot","type":"scenario","cat":"Scenarios","binding":"policy","setup":"On land, a group ignores commands to stop and keeps walking away. Your partner suggests a shot into the air to get their attention.","q":"Under CBP policy?","choices":["Fine, if fired into the air","Prohibited. Warning shots are barred except for the limited circumstances in the policy","Fine, if the supervisor agrees","Fine, at night"],"answer":1,"explain":"Discharging a firearm as a warning is prohibited except as the policy specifically allows. Ignoring commands and walking away is not a deadly-force threat.","source":"CBP Use of Force Policy, HB 4500-002A (Jan. 2021)","verified":"https://www.cbp.gov/sites/default/files/assets/documents/2021-Jul/cbp-use-of-force-policy_4500-002A.pdf"},{"id":"uf-sc-pursuit","type":"scenario","cat":"Scenarios","binding":"policy","setup":"You're following a car that failed to yield. It speeds into a busy town center at high speed, running lights, with pedestrians around.","q":"Under the current CBP pursuit directive, what is the test for continuing?","choices":["Continue until the driver stops","Terminate when the law enforcement benefit of continuing no longer outweighs the risk to the public","Continue if the driver is suspected of any federal offense","Only a supervisor can end a pursuit"],"answer":1,"explain":"Re-weigh benefit against public risk throughout. A low-level offense and rising danger point toward ending it.","source":"CBP Directive No. 4510-026B (Dec. 2, 2025)","verified":"https://www.cbp.gov/sites/default/files/2025-12/intc-44545_-_cbp_directive_no._4510-026b_usbp_redacted.pdf"}]},{"meta":{"id":"history","name":"BP History","short":"HIST","color":"#C2A878","order":12,"blurb":"Where the Patrol came from: origins, milestones, units, and traditions.","source":"CBP history pages and timeline; National Border Patrol Museum; HonorFirst.com (secondary) where noted","subModes":["browse"]},"categories":{"Origins":{"why":"The 1924 founding and the mounted guards before it explain why the Patrol is built the way it is."},"Milestones":{"why":"Knowing the big moves (DOJ, the title change, CBP) makes old reports, laws and stories make sense."},"Units & Firsts":{"why":"The specialty units and early firsts come up in training, ceremonies and recruiting."},"Northern Border":{"why":"The Patrol has worked the Canadian line since 1924, with Prohibition shaping its early years."},"Honor & Traditions":{"why":"The motto, badge and memorial are what the Patrol passes from class to class."}},"cards":[{"id":"hi-watchmen","type":"flip","cat":"Origins","front":"Mounted Watchmen / Mounted Guard (1904)","back":"From 1904, mounted watchmen of the Department of Commerce and Labor patrolled the border, working out of El Paso. Patrols were irregular, only when resources allowed, and the force never topped about 75 men.","source":"Congressional Record, H. Con. Res. 122 (1999); Wikipedia, \"United States Border Patrol\"","verified":"https://www.govinfo.gov/content/pkg/CRECB-1999-pt20/html/CRECB-1999-pt20-Pg29561.htm"},{"id":"hi-chinese-exclusion","type":"flip","cat":"Origins","front":"What were the pre-1924 mounted inspectors mainly enforcing?","back":"The Chinese Exclusion laws: stopping illegal Chinese immigration, much of it coming through Mexico.","source":"CBP, history pages and timeline (cbp.gov) (Jeff Milton timeline entry)","verified":"https://cbp.gov/about/history/timeline/timeline-date/jefferson-davis-milton-aka-jeff-milton-1861-1947"},{"id":"hi-milton","type":"flip","cat":"Origins","front":"Jeff Milton","back":"Joined the Bureau of Immigration in 1904 as a mounted Chinese inspector. CBP's timeline calls him the first officer appointed to the Border Patrol in 1924.","note":"Disputed: HonorFirst argues his retirement papers show he was never a Patrol Inspector, and that hiring in 1924 happened nationwide at once.","source":"CBP, history pages and timeline (cbp.gov); HonorFirst.com (retired-agent history site; secondary)","verified":"https://cbp.gov/about/history/timeline/timeline-date/jefferson-davis-milton-aka-jeff-milton-1861-1947"},{"id":"hi-1915","type":"flip","cat":"Origins","front":"Mounted inspectors (1915)","back":"In March 1915 Congress authorized a separate group of mounted inspectors. Most rode horses, but a few used cars, motorcycles and boats.","source":"Wikipedia, \"United States Border Patrol\" (secondary)","verified":"https://en.wikipedia.org/wiki/United_States_Border_Patrol"},{"id":"hi-1924-act","type":"flip","cat":"Origins","front":"What created the U.S. Border Patrol, and when?","back":"The Labor Appropriation Act of 1924, May 28, 1924. It set up the Border Patrol in the Immigration Bureau of the Department of Labor.","note":"Some secondary sources tie it to the Immigration Act passed days earlier. CBP uses May 28.","source":"CBP, history pages and timeline (cbp.gov), \"1924: Border Patrol Established\"","verified":"https://www.cbp.gov/about/history/1924-border-patrol-established"},{"id":"hi-1924-mc","type":"mc","cat":"Origins","q":"In 1924 the new Border Patrol belonged to which department?","choices":["Treasury","Justice","Labor","War"],"answer":2,"explain":"It began in the Immigration Bureau of the Department of Labor. It moved to Justice with the INS in 1940.","source":"CBP, history pages and timeline (cbp.gov), \"1924: Border Patrol Established\"","verified":"https://www.cbp.gov/about/history/1924-border-patrol-established"},{"id":"hi-first-force","type":"flip","cat":"Origins","front":"Size of the first Border Patrol","back":"About 450 Patrol Inspectors.","note":"Sources differ on timing: some say 450 at the start, others say it reached 450 in 1925 after seacoast duty was added.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-pay","type":"mc","cat":"Origins","q":"What was a Patrol Inspector's yearly salary in 1924?","choices":["$900","$1,680","$2,400","$3,200"],"answer":1,"explain":"$1,680 a year.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-equip","type":"flip","cat":"Origins","front":"What did the government issue the first Patrol Inspectors?","back":"A badge and a revolver. Recruits brought their own horse and saddle; the government paid for oats and hay.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-recruits","type":"flip","cat":"Origins","front":"Where did many early recruits come from?","back":"Texas Rangers, county sheriffs and their deputies, and railway mail clerks.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-uniform","type":"flip","cat":"Origins","front":"First uniform","back":"Congress funded uniforms in December 1924, and the first uniform order (General Order 42) was approved Dec. 11, 1924. Color: forest green. Inspectors did not actually wear uniforms until 1928.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com); HonorFirst.com (retired-agent history site; secondary), \"How has the USBP uniform evolved?\"","verified":"https://www.honorfirst.com/how-has-the-usbp-uniform-evolved.html"},{"id":"hi-1925-seacoast","type":"flip","cat":"Origins","front":"1925 expansion","back":"Patrol areas were extended to the seacoast along the Gulf of Mexico and Florida.","source":"CBP, history pages and timeline (cbp.gov), \"1924: Border Patrol Established\"","verified":"https://www.cbp.gov/about/history/1924-border-patrol-established"},{"id":"hi-1940-doj","type":"flip","cat":"Milestones","front":"June 14, 1940","back":"The INS, and the Border Patrol with it, moved from the Department of Labor to the Department of Justice. The worry was enemy agents entering the country.","note":"In September 1940 Congress also designated the Border Patrol a national defense agency (museum timeline).","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com); SAGE Encyclopedia of Economics and Society, \"Border Patrol\"","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-wwii","type":"flip","cat":"Milestones","front":"World War II duties","back":"Guarding enemy alien internment camps, guarding Axis diplomats, coastal patrol against submarines, and tracking escaped prisoners of war.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-1946","type":"flip","cat":"Milestones","front":"1946 vehicle-search law","back":"An Aug. 7, 1946 act let officers board and search vessels, rail cars, aircraft and vehicles for aliens, without a warrant, \"within a reasonable distance\" of the border. It was carried into INA § 287(a)(3) in 1952. The 100-mile figure comes from regulation, not the statute.","source":"Washington University Law Review article on Border Patrol search authority (secondary); 8 U.S.C. § 1357(a)(3)","verified":"https://journals.library.wustl.edu/lawreview/article/3012/galley/19845/view"},{"id":"hi-1970-title","type":"flip","cat":"Milestones","front":"June 28, 1970","back":"Patrol Inspectors became Border Patrol Agents. Badges and credentials issued after that date carried the new title.","source":"HonorFirst.com (retired-agent history site; secondary), \"This Week in USBP History\"","verified":"https://honorfirst.com/this-week-in-usbp-history-blog/this-week-in-usbp-histroy-vol-147"},{"id":"hi-cpa","type":"flip","cat":"Milestones","front":"Title history of the sector chief","back":"Patrol Inspector in Charge → Chief Patrol Inspector (1926) → Chief Patrol Agent (1970).","source":"HonorFirst.com (retired-agent history site; secondary), \"This Week in USBP History\"","verified":"https://www.honorfirst.com/this-week-in-usbp-history-blog/archives/05-2023"},{"id":"hi-hold-line","type":"flip","cat":"Milestones","front":"Operations Hold the Line (1993) and Gatekeeper (1994)","back":"Hold the Line put agents directly on the line in El Paso in 1993. Gatekeeper began Oct. 1, 1994 in San Diego. Both were built on \"prevention through deterrence\": stop entries rather than chase them afterward.","source":"DOJ Office of Inspector General, Special Report on Operation Gatekeeper (1998)","verified":"https://oig.justice.gov/sites/default/files/archive/special/9807/exec.htm"},{"id":"hi-2003-cbp","type":"flip","cat":"Milestones","front":"March 1, 2003","back":"U.S. Customs and Border Protection (CBP) was created in the new Department of Homeland Security. The Border Patrol moved from the INS into CBP, with Customs, Agriculture inspection (APHIS) and INS inspectors.","source":"CBP, history pages and timeline (cbp.gov), timeline: March 1, 2003","verified":"https://www.cbp.gov/about/history/timeline/timeline-date/march-1-2003"},{"id":"hi-2003-mc","type":"mc","cat":"Milestones","q":"Right before it joined CBP in 2003, the Border Patrol was part of…","choices":["U.S. Customs Service (Treasury)","INS (Department of Justice)","Department of Labor","U.S. Marshals Service"],"answer":1,"explain":"It was in the INS under the Department of Justice from 1940 until March 2003. The INS was then split among CBP, ICE and USCIS.","source":"CBP, history pages and timeline (cbp.gov), timeline: March 1, 2003","verified":"https://www.cbp.gov/about/history/timeline/timeline-date/march-1-2003"},{"id":"hi-centennial","type":"flip","cat":"Milestones","front":"May 28, 2024","back":"The Border Patrol's 100th anniversary. The Senate passed a bipartisan resolution marking the centennial.","source":"U.S. Sen. Susan Collins press release (May 28, 2024)","verified":"https://www.collins.senate.gov/newsroom/collins-king-celebrate-todays-100th-anniversary-of-the-us-border-patrol"},{"id":"hi-order-early","type":"order","cat":"Milestones","q":"Put these in chronological order.","steps":["Mounted watchmen begin patrolling (1904)","Congress authorizes mounted inspectors (1915)","Border Patrol established (1924)","Training school opens at Camp Chigas (1934)","INS moves to the Department of Justice (1940)"],"source":"CBP, history pages and timeline (cbp.gov); National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-order-modern","type":"order","cat":"Milestones","q":"Put these in chronological order.","steps":["Patrol Inspectors become Border Patrol Agents (1970)","BORTAC formed (1984)","BORSTAR formed (1998)","Border Patrol joins CBP under DHS (2003)","Basic training consolidated at Artesia (2004)"],"source":"CBP, history pages and timeline (cbp.gov); HonorFirst.com (retired-agent history site; secondary)","verified":"https://www.cbp.gov/about/history/timeline/timeline-date/march-1-2003"},{"id":"hi-chigas","type":"flip","cat":"Units & Firsts","front":"First Border Patrol training school","back":"Opened Dec. 3, 1934 at Camp Chigas, El Paso, Texas. 34 trainees took classes in marksmanship and horsemanship.","note":"CBP treats this class (Dec. 3, 1934 – Mar. 17, 1935) as the Academy's birthdate.","source":"CBP, history pages and timeline (cbp.gov), timeline: December 3, 1934","verified":"https://www.cbp.gov/about/history/timeline/timeline-date/december-3-1934"},{"id":"hi-chigas-subjects","type":"flip","cat":"Units & Firsts","front":"What modern subjects did the early El Paso school teach?","back":"Radios, fingerprints, Morse code, and an intensive Spanish course.","source":"CBP, history pages and timeline (cbp.gov), \"Border Patrol Academy Unified in Artesia\"","verified":"https://www.cbp.gov/about/history/cbp-20-20-establishment/border-patrol-academy-unified-in-artesia"},{"id":"hi-academy-1936","type":"flip","cat":"Units & Firsts","front":"When did academy training become national?","back":"1936. Before that, training was mostly done by individual districts and sub-districts. Classes were numbered starting in 1940, with Class #1 at Camp Chigas.","source":"CBP, history pages and timeline (cbp.gov), \"Border Patrol Academy Unified in Artesia\"","verified":"https://www.cbp.gov/about/history/cbp-20-20-establishment/border-patrol-academy-unified-in-artesia"},{"id":"hi-glynco","type":"flip","cat":"Units & Firsts","front":"Academy in the 1970s–90s","back":"In the 1970s the academy moved to the federal training center (FLETC) at Glynco, Georgia. Hiring surges added temporary sites: Fort McClellan, Alabama (1988) and Charleston, South Carolina (1996).","source":"CBP, history pages and timeline (cbp.gov), \"Border Patrol Academy Unified in Artesia\"; FLETC history","verified":"https://www.cbp.gov/about/history/cbp-20-20-establishment/border-patrol-academy-unified-in-artesia"},{"id":"hi-artesia","type":"flip","cat":"Units & Firsts","front":"Border Patrol Academy, Artesia, New Mexico","back":"FLETC opened a facility in Artesia around 1990. On Oct. 20, 2004, Session 583 reported there, and basic training was unified in one place for the first time in years.","source":"CBP, history pages and timeline (cbp.gov), \"Border Patrol Academy Unified in Artesia\"","verified":"https://www.cbp.gov/about/history/cbp-20-20-establishment/border-patrol-academy-unified-in-artesia"},{"id":"hi-academy-order","type":"order","cat":"Units & Firsts","q":"Put these academy homes in order, earliest first.","steps":["Camp Chigas, El Paso, Texas","FLETC Glynco, Georgia","Artesia, New Mexico (consolidated 2004)"],"source":"CBP, history pages and timeline (cbp.gov), \"Border Patrol Academy Unified in Artesia\"","verified":"https://www.cbp.gov/about/history/cbp-20-20-establishment/border-patrol-academy-unified-in-artesia"},{"id":"hi-autogiro","type":"flip","cat":"Units & Firsts","front":"First official Border Patrol aircraft","back":"Three autogiros obtained from the military, put in service in 1941. The program ended in November 1945 after a crash.","source":"National Border Patrol Museum, \"History\" (borderpatrolmuseum.com)","verified":"https://borderpatrolmuseum.com/history/"},{"id":"hi-bortac","type":"flip","cat":"Units & Firsts","front":"BORTAC","back":"Border Patrol Tactical Unit, formed in 1984. Its first job was handling disturbances at INS detention facilities; it grew into a national tactical and rapid-response unit.","source":"Wikipedia, \"BORTAC\" (secondary); Grey Dynamics (secondary)","verified":"https://en.wikipedia.org/wiki/BORTAC"},{"id":"hi-borstar","type":"flip","cat":"Units & Firsts","front":"BORSTAR","back":"Border Patrol Search, Trauma, and Rescue. Created in 1998: the first team formed in San Diego in July 1998 and the first BORSTAR Academy was held there that October.","why":"Before BORSTAR, injured agents in rough terrain waited on civilian rescue groups.","source":"Archived Border Patrol BORSTAR history (govdocs); DHS, \"CBP Search and Rescue Efforts for FY 2015\"","verified":"https://corpora.tika.apache.org/base/docs/govdocs1/613/613211.html"},{"id":"hi-borstar-why","type":"flip","cat":"Units & Firsts","front":"Why was BORSTAR created?","back":"Because of the growing number of injuries to Border Patrol agents and migrant deaths along the border.","source":"DHS, \"Customs and Border Protection Search and Rescue Efforts for FY 2015\"","verified":"https://dhs.gov/sites/default/files/publications/Customs%20and%20Border%20Protection%20-%20Search%20and%20Rescue%20Efforts%20for%20FY%202015.pdf"},{"id":"hi-sog","type":"flip","cat":"Units & Firsts","front":"Special Operations Group (2007)","back":"In 2007, BORTAC and BORSTAR were placed together under the newly formed Border Patrol Special Operations Group.","source":"Wikipedia, \"BORTAC\" and \"Border Patrol Search, Trauma, and Rescue\" (secondary)","verified":"https://en.wikipedia.org/wiki/Border_Patrol_Search,_Trauma,_and_Rescue"},{"id":"hi-units-mc","type":"mc","cat":"Units & Firsts","q":"Which unit was formed first?","choices":["BORSTAR","BORTAC","Special Operations Group","CBP"],"answer":1,"explain":"BORTAC 1984, BORSTAR 1998, CBP 2003, Special Operations Group 2007.","source":"Wikipedia, \"BORTAC\" (secondary); CBP, history pages and timeline (cbp.gov)","verified":"https://en.wikipedia.org/wiki/BORTAC"},{"id":"hi-nb-districts","type":"flip","cat":"Northern Border","front":"How was the 1924 Patrol organized?","back":"Under the Immigration Service's districts: 11 districts with 32 sub-districts along the borders, all stood up at about the same time in 1924. Northern districts included Montreal, Buffalo, Detroit and Grand Forks.","source":"HonorFirst.com (retired-agent history site; secondary), \"Which was the first sector?\"","verified":"https://www.honorfirst.com/which-was-the-first-sector.html"},{"id":"hi-nb-prohibition","type":"flip","cat":"Northern Border","front":"Prohibition on the northern border","back":"Liquor smuggling from Canada drove early northern border work. Rum runners also moved illegal crews and aliens across the line, and the Detroit office held most of the Patrol's inspectors for a time.","source":"CBP, history pages and timeline (cbp.gov), Detroit station history; SAGE Encyclopedia of Economics and Society, \"Border Patrol\"","verified":"https://www.cbp.gov/border-security/along-us-borders/border-patrol-sectors/detroit-sector-selfridge-angb-michigan/detroit-station"},{"id":"hi-nb-prohibition-mc","type":"mc","cat":"Northern Border","q":"In the 1920s, what contraband drove much of the Patrol's northern border growth?","choices":["Opium","Liquor","Firearms","Tobacco"],"answer":1,"explain":"Prohibition-era liquor smuggling from Canada.","source":"CBP, history pages and timeline (cbp.gov), Detroit sector history","verified":"https://cbp.gov/border-security/along-us-borders/border-patrol-sectors/detroit-sector"},{"id":"hi-nb-detroit-growth","type":"flip","cat":"Northern Border","front":"Detroit area manpower in the Prohibition years","back":"70 Patrol Inspectors by March 1926, 113 by July 1928.","source":"CBP, history pages and timeline (cbp.gov), Detroit sector history","verified":"https://cbp.gov/border-security/along-us-borders/border-patrol-sectors/detroit-sector"},{"id":"hi-nb-davenport","type":"flip","cat":"Northern Border","front":"First Chief Patrol Inspector at Detroit","back":"Major Ruel Davenport, designated in June 1924.","source":"CBP, history pages and timeline (cbp.gov), Detroit sector history","verified":"https://cbp.gov/border-security/along-us-borders/border-patrol-sectors/detroit-sector"},{"id":"hi-nb-patriot","type":"flip","cat":"Northern Border","front":"USA PATRIOT Act (2001), Sec. 402","back":"Authorized tripling Border Patrol, Customs and INS inspector staffing on the northern border. At the time the Patrol had about 300 agents there, versus 8,000+ on the southern border.","note":"It authorized the increase; funding came later.","source":"Britannica, \"USA PATRIOT Act\"; Sen. Patrick Leahy floor statement (2001)","verified":"https://avalon.law.yale.edu/sept11/leahy_003.asp"},{"id":"hi-nb-sectors","type":"mc","cat":"Northern Border","q":"How many Border Patrol sectors cover the U.S.–Canada border (CBP sector profiles, FY2015–FY2018)?","choices":["Four","Six","Eight","Twelve"],"answer":2,"explain":"Eight northern border sectors, from Washington State to Maine.","source":"CBP, USBP sector profile FY2018","verified":"https://www.CBP.gov/sites/default/files/assets/documents/2019-May/Sector%20Profile%20FY18.pdf"},{"id":"hi-honor-first","type":"flip","cat":"Honor & Traditions","front":"\"Honor First\"","back":"The Border Patrol motto. Its earliest known use is the 1927 Commissioner General of Immigration's annual report, which called it the Patrol's watchword. The El Paso district is the likely origin.","source":"HonorFirst.com (retired-agent history site; secondary), \"When and where did Honor First originate?\"","verified":"https://www.honorfirst.com/when-and-where-did-honor-first-originate.html"},{"id":"hi-honor-meaning","type":"flip","cat":"Honor & Traditions","front":"Is \"Honor First\" officially defined?","back":"No. Its meaning has never been officially defined. It's generally taken to mean integrity, and doing the job within the law, regulations and policy.","source":"HonorFirst.com (retired-agent history site; secondary), \"Honor First and esprit de corps\"","verified":"https://honorfirst.com/honor-first-and-esprit-de-corps.html"},{"id":"hi-motto-mc","type":"mc","cat":"Honor & Traditions","q":"The Border Patrol's motto is…","choices":["Semper Paratus","Honor First","Vigilance, Service, Integrity","Duty Above Self"],"answer":1,"explain":"Honor First. Semper Paratus is the Coast Guard's.","source":"HonorFirst.com (retired-agent history site; secondary)","verified":"https://www.honorfirst.com/when-and-where-did-honor-first-originate.html"},{"id":"hi-badge-finish","type":"flip","cat":"Honor & Traditions","front":"Early badge finish (1928 order)","back":"An April 1928 amendment to General Order 42 set oxidized silver badges for Patrol Inspectors and Senior Patrol Inspectors, and gilt for Chief Patrol Inspectors and Assistant Superintendents.","source":"CBP, Border Patrol General Order 42, First Amendment, Sixth Supplement (Apr. 4, 1928)","verified":"https://WWW.CBP.GOV/sites/default/files/assets/documents/2018-Oct/usbp-first-amendment-sixth-supplement-19280404.pdf"},{"id":"hi-badge-cloth","type":"flip","cat":"Honor & Traditions","front":"Badge changes since 1970","back":"1970: new badges with the \"Agent\" title. 2007: a cloth badge replaced the metal badge on the rough duty uniform.","source":"HonorFirst.com (retired-agent history site; secondary), \"How has the USBP uniform evolved?\"","verified":"https://www.honorfirst.com/how-has-the-usbp-uniform-evolved.html"},{"id":"hi-museum","type":"flip","cat":"Honor & Traditions","front":"National Border Patrol Museum","back":"In El Paso, Texas. Started by retired Border Patrol officers; first opened Oct. 1, 1985, and its current building opened in April 1994. It's a free, donation-run nonprofit.","source":"National Border Patrol Museum, \"About Us\"","verified":"https://borderpatrolmuseum.com/about-us/"},{"id":"hi-memorial","type":"flip","cat":"Honor & Traditions","front":"Fallen agent memorial ceremony","back":"Held each year at the National Border Patrol Museum, on or near the Patrol's founding anniversary. It includes a roll call of the fallen, a 21-gun salute, a helicopter flyover and a riderless horse.","source":"Homeland Security Today, \"U.S. Border Patrol Honors Fallen Heroes\"; CBP media release","verified":"https://www.hstoday.us/subject-matter-areas/border-security/u-s-border-patrol-honors-fallen-heroes/"}]},{"meta":{"id":"landnav","name":"Land Nav","short":"NAV","color":"#A3B86C","order":10,"blurb":"Basic navigation terms, compass use, pace count and terrain features.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","subModes":["browse"]},"categories":{"Terms & Strategies":{"why":"Choosing the right technique for the leg is most of navigation."},"Compass & Declination":{"why":"A wrong conversion puts you a few hundred meters off per kilometer walked."},"Pace & Distance":{"why":"When GPS fails in deep woods or cold, pace count is how you know how far you've gone."},"Terrain":{"why":"Matching contour shapes to the ground is how you confirm where you are."},"Map":{"why":"Reading the map's colors and margin quickly saves time on the ground."}},"cards":[{"id":"ln-azimuth","type":"flip","cat":"Terms & Strategies","front":"Azimuth","back":"A horizontal angle measured clockwise from a north base line, 0° to 360°. East = 90°, south = 180°, west = 270°.","note":"Always know which north it's measured from: grid, magnetic or true.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://en.wikipedia.org/wiki/Azimuth"},{"id":"ln-norths","type":"flip","cat":"Terms & Strategies","front":"The three norths","back":"True north: toward the geographic North Pole (where meridians meet). Magnetic north: where the compass needle points; it drifts over time. Grid north: the direction of the map's vertical grid lines.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-norths-mc","type":"mc","cat":"Terms & Strategies","q":"Your compass needle points to…","choices":["True north","Magnetic north","Grid north","Whichever north the map uses"],"answer":1,"explain":"The needle points to magnetic north. Grid north is the map's grid lines. True north is the geographic pole.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://maptools.com/learn/north-references"},{"id":"ln-orient","type":"flip","cat":"Terms & Strategies","front":"Orienting the map","back":"Turning the map so its north matches north on the ground, so the terrain lines up with what you see. By compass: account for declination, then turn the map until map north matches the needle. By terrain association: hold the map level and match map features to ground features.","note":"Army task standard for terrain association: oriented to within 30° of magnetic north.","source":"TC 3-25.26, Map Reading and Land Navigation (U.S. Army)","verified":"https://sofrep.com/specialoperations/selection-land-nav-basics-pinpoint-location-orient-map/"},{"id":"ln-terrain-assoc","type":"flip","cat":"Terms & Strategies","front":"Terrain association","back":"Navigating by recognizing natural and man-made features around you and matching them to the map: hills, draws, streams, roads.","why":"Faster than compass-and-pace in good visibility, and it keeps you aware of where you are.","source":"TC 3-25.26, ch. 11 (terrain association navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-dead-reckoning","type":"flip","cat":"Terms & Strategies","front":"Dead reckoning","back":"Navigating from a known point by direction and distance: hold a set azimuth and keep a pace count to estimate where you are.","why":"Your method when terrain features are useless: dense woods, fog, darkness, flat ground.","source":"TC 3-25.26, ch. 11 (dead reckoning navigation)","verified":"https://armyrotc.mst.edu/media/academic/armyrotc/documents/manualsadpadrpfmetc/TC 3-25.26.pdf"},{"id":"ln-handrail","type":"flip","cat":"Terms & Strategies","front":"Handrail","back":"A linear feature running along your route that you can follow: a stream, fence, road, power line, firebreak.","source":"Orienteering technique (common land-navigation usage; not TC 3-25.26 wording)","verified":"https://brainscape.com/flashcards/navigation-definitions-8369224/packs/14191102"},{"id":"ln-catching","type":"flip","cat":"Terms & Strategies","front":"Catching feature","back":"An obvious feature (usually linear) just beyond your objective. If you h
