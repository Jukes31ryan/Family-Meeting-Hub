ont":"¿Dónde nació usted?","back":"Where were you born?","note":"Preterite of nacer."},{"id":"es-p23","type":"flip","cat":"Identity & Citizenship","front":"¿Cómo se llama usted?","back":"What is your name?","note":"Literally 'How do you call yourself?' — reflexive llamarse."},{"id":"es-p24","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su nombre completo?","back":"What is your full name?"},{"id":"es-p25","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su apellido?","back":"What is your last name?"},{"id":"es-p26","type":"flip","cat":"Identity & Citizenship","front":"¿Cuántos años tiene usted?","back":"How old are you?","note":"Age uses TENER: literally 'How many years do you have?'"},{"id":"es-p27","type":"flip","cat":"Identity & Citizenship","front":"¿Cuál es su fecha de nacimiento?","back":"What is your date of birth?"},{"id":"es-p28","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene documentos para estar legalmente en los Estados Unidos?","back":"Do you have documents to be in the United States legally?"},{"id":"es-p29","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene pasaporte o visa?","back":"Do you have a passport or visa?","note":"Spanish drops 'a/an' after tener in questions like this."},{"id":"es-p30","type":"flip","cat":"Identity & Citizenship","front":"¿Tiene identificación?","back":"Do you have identification?"},{"id":"es-p31","type":"flip","cat":"Identity & Citizenship","front":"¿En qué trabaja usted?","back":"What do you do for work?","note":"The 1943 book's '¿En qué se ocupa Vd.?' — this is the modern version."},{"id":"es-p32","type":"flip","cat":"Identity & Citizenship","front":"¿Dónde vive usted?","back":"Where do you live?"},{"id":"es-p33","type":"flip","cat":"Identity & Citizenship","front":"¿Está usted casado?","back":"Are you married?","note":"ESTAR with marital status is standard in Mexico."},{"id":"es-p34","type":"flip","cat":"Identity & Citizenship","front":"¿Habla usted inglés?","back":"Do you speak English?"},{"id":"es-p35","type":"flip","cat":"Identity & Citizenship","front":"Hable más despacio, por favor.","back":"Speak more slowly, please."},{"id":"es-p36","type":"flip","cat":"Identity & Citizenship","front":"Repita, por favor.","back":"Repeat, please."},{"id":"es-p37","type":"flip","cat":"Identity & Citizenship","front":"No entiendo.","back":"I don't understand."},{"id":"es-p38","type":"flip","cat":"Identity & Citizenship","front":"¿Me entiende?","back":"Do you understand me?"},{"id":"es-p40","type":"flip","cat":"Crossing & Travel","front":"¿Cómo entró usted a los Estados Unidos?","back":"How did you enter the United States?","note":"Preterite of entrar."},{"id":"es-p41","type":"flip","cat":"Crossing & Travel","front":"¿Cuándo cruzó la frontera?","back":"When did you cross the border?"},{"id":"es-p42","type":"flip","cat":"Crossing & Travel","front":"¿Dónde cruzó?","back":"Where did you cross?"},{"id":"es-p43","type":"flip","cat":"Crossing & Travel","front":"¿Cruzó por el bosque?","back":"Did you cross through the woods?","note":"POR = through/along. Northern-border phrasing."},{"id":"es-p44","type":"flip","cat":"Crossing & Travel","front":"¿Quién lo ayudó a cruzar?","back":"Who helped you cross?","note":"'lo' = you (direct object, formal masc.). Use 'la' for a woman."},{"id":"es-p45","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto pagó?","back":"How much did you pay?"},{"id":"es-p46","type":"flip","cat":"Crossing & Travel","front":"¿Con quién viaja usted?","back":"Who are you traveling with?","note":"Preposition must come first: CON quién, never 'quién... con'."},{"id":"es-p47","type":"flip","cat":"Crossing & Travel","front":"¿Adónde va?","back":"Where are you going?","note":"'¿Adónde?' for motion, '¿Dónde?' for location."},{"id":"es-p48","type":"flip","cat":"Crossing & Travel","front":"¿De dónde viene?","back":"Where are you coming from?"},{"id":"es-p49","type":"flip","cat":"Crossing & Travel","front":"¿Quién lo va a recoger?","back":"Who is going to pick you up?"},{"id":"es-p50","type":"flip","cat":"Crossing & Travel","front":"¿Hay más personas con usted?","back":"Are there more people with you?","note":"HAY = there is / there are. One word, huge mileage."},{"id":"es-p51","type":"flip","cat":"Crossing & Travel","front":"¿Cuántas personas hay?","back":"How many people are there?","note":"Cuántas agrees with personas (fem. pl.)."},{"id":"es-p52","type":"flip","cat":"Crossing & Travel","front":"¿Hay niños en el grupo?","back":"Are there children in the group?"},{"id":"es-p53","type":"flip","cat":"Crossing & Travel","front":"¿Dónde están los demás?","back":"Where are the others?","note":"ESTAR for location, always."},{"id":"es-p54","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto tiempo caminó?","back":"How long did you walk?"},{"id":"es-p55","type":"flip","cat":"Crossing & Travel","front":"¿Cuánto tiempo hace que está aquí?","back":"How long have you been here?","note":"HACER time idiom: hace + time + que + present tense."},{"id":"es-p60","type":"flip","cat":"Safety & Medical","front":"¿Está usted herido?","back":"Are you hurt?","note":"ESTAR for conditions. Use 'herida' for a woman."},{"id":"es-p61","type":"flip","cat":"Safety & Medical","front":"¿Está usted bien?","back":"Are you okay?"},{"id":"es-p62","type":"flip","cat":"Safety & Medical","front":"¿Necesita agua?","back":"Do you need water?"},{"id":"es-p63","type":"flip","cat":"Safety & Medical","front":"¿Necesita un médico?","back":"Do you need a doctor?"},{"id":"es-p64","type":"flip","cat":"Safety & Medical","front":"¿Tiene frío?","back":"Are you cold?","note":"TENER idiom: literally 'Do you have cold?' Critical question in a Vermont winter."},{"id":"es-p65","type":"flip","cat":"Safety & Medical","front":"¿Puede caminar?","back":"Can you walk?"},{"id":"es-p66","type":"flip","cat":"Safety & Medical","front":"¿Dónde le duele?","back":"Where does it hurt?","note":"Doler works like gustar: 'Me duele la cabeza' = my head hurts."},{"id":"es-p67","type":"flip","cat":"Safety & Medical","front":"¿Tiene alguna enfermedad?","back":"Do you have any illness?"},{"id":"es-p68","type":"flip","cat":"Safety & Medical","front":"¿Toma alguna medicina?","back":"Do you take any medicine?"},{"id":"es-p69","type":"flip","cat":"Safety & Medical","front":"¿Está embarazada?","back":"Are you pregnant?"},{"id":"es-p70","type":"flip","cat":"Safety & Medical","front":"Voy a ayudarle.","back":"I am going to help you.","note":"IR A + infinitive = going to. Your easiest future tense."},{"id":"es-p71","type":"flip","cat":"Safety & Medical","front":"La ayuda viene en camino.","back":"Help is on the way."},{"id":"es-p72","type":"flip","cat":"Safety & Medical","front":"¿Tiene armas?","back":"Do you have weapons?"},{"id":"es-p73","type":"flip","cat":"Safety & Medical","front":"¿Tiene algo en los bolsillos que me pueda lastimar?","back":"Do you have anything in your pockets that could hurt me?","note":"The standard pat-down question. 'Pueda' is subjunctive after an uncertain 'algo... que'."},{"id":"es-p74","type":"flip","cat":"Safety & Medical","front":"Todo va a estar bien.","back":"Everything is going to be okay."},{"id":"es-p75","type":"flip","cat":"Safety & Medical","front":"Respire despacio.","back":"Breathe slowly."},{"id":"es-p80","type":"flip","cat":"Processing & Transport","front":"Usted está detenido.","back":"You are detained / under arrest.","note":"ESTAR + past participle for a resulting state. 'Detenida' for a woman."},{"id":"es-p81","type":"flip","cat":"Processing & Transport","front":"Voy a esposarlo por su seguridad y la mía.","back":"I am going to handcuff you for your safety and mine.","note":"Pronoun 'lo' attaches to the infinitive. POR = for the sake of."},{"id":"es-p82","type":"flip","cat":"Processing & Transport","front":"Voy a revisarlo.","back":"I am going to search you."},{"id":"es-p83","type":"flip","cat":"Processing & Transport","front":"Vacíe sus bolsillos.","back":"Empty your pockets."},{"id":"es-p84","type":"flip","cat":"Processing & Transport","front":"Suba a la camioneta.","back":"Get in the van/truck.","note":"Subir = go up / get in. Irregular-yo verb: subo → suba."},{"id":"es-p85","type":"flip","cat":"Processing & Transport","front":"Cuidado con la cabeza.","back":"Watch your head."},{"id":"es-p86","type":"flip","cat":"Processing & Transport","front":"Vamos a la estación.","back":"We are going to the station."},{"id":"es-p87","type":"flip","cat":"Processing & Transport","front":"Tiene derecho a hablar con su consulado.","back":"You have the right to speak with your consulate."},{"id":"es-p88","type":"flip","cat":"Processing & Transport","front":"Firme aquí, por favor.","back":"Sign here, please."},{"id":"es-p89","type":"flip","cat":"Processing & Transport","front":"Ponga su huella aquí.","back":"Put your fingerprint here.","note":"'Huella' = fingerprint AND footprint/track — same word you use cutting sign."},{"id":"es-p90","type":"flip","cat":"Processing & Transport","front":"¿Entiende sus derechos?","back":"Do you understand your rights?"},{"id":"es-p91","type":"flip","cat":"Processing & Transport","front":"Diga la verdad.","back":"Tell the truth.","note":"Irregular command of decir: diga."},{"id":"es-p92","type":"flip","cat":"Processing & Transport","front":"Siga las instrucciones.","back":"Follow the instructions.","note":"From seguir (e→i): siga."},{"id":"es-p93","type":"flip","cat":"Processing & Transport","front":"Espere su turno.","back":"Wait your turn."},{"id":"es-p94","type":"flip","cat":"Processing & Transport","front":"Mentir es un delito.","back":"Lying is a crime.","note":"Infinitive used as a noun — Lesson XXVI of the old manual."},{"id":"es-p100","type":"flip","cat":"Everyday & Idioms","front":"Tengo que verificar sus documentos.","back":"I have to verify your documents.","note":"TENER QUE + infinitive = to have to. The workhorse obligation idiom."},{"id":"es-p101","type":"flip","cat":"Everyday & Idioms","front":"Hay que esperar.","back":"One must wait. / We have to wait.","note":"HAY QUE + infinitive = impersonal 'it is necessary to'."},{"id":"es-p102","type":"flip","cat":"Everyday & Idioms","front":"Hace frío. / Hace calor.","back":"It's cold. / It's hot.","note":"Weather uses HACER, not ser/estar."},{"id":"es-p103","type":"flip","cat":"Everyday & Idioms","front":"¿Qué hora es?","back":"What time is it?"},{"id":"es-p104","type":"flip","cat":"Everyday & Idioms","front":"Hace dos días.","back":"Two days ago.","note":"HACE + time = ago. '¿Cuándo cruzó?' — 'Hace dos días.'"},{"id":"es-p105","type":"flip","cat":"Everyday & Idioms","front":"Acaba de llegar.","back":"He/she just arrived.","note":"ACABAR DE + infinitive = to have just done something."},{"id":"es-p106","type":"flip","cat":"Everyday & Idioms","front":"Otra vez. / De nuevo.","back":"Again."},{"id":"es-p107","type":"flip","cat":"Everyday & Idioms","front":"Tenga cuidado.","back":"Be careful.","note":"TENER idiom in command form."},{"id":"es-p108","type":"flip","cat":"Everyday & Idioms","front":"Con permiso. / Perdón.","back":"Excuse me. / Pardon.","note":"Con permiso to pass by; perdón after a bump or to get attention."},{"id":"es-p109","type":"flip","cat":"Everyday & Idioms","front":"Buenos días. / Buenas tardes. / Buenas noches.","back":"Good morning. / Good afternoon. / Good evening."},{"id":"es-p110","type":"flip","cat":"Everyday & Idioms","front":"Gracias. — De nada.","back":"Thank you. — You're welcome."},{"id":"es-p111","type":"flip","cat":"Everyday & Idioms","front":"Ya voy.","back":"I'm coming (right now).","note":"Straight from the 1943 manual — still exactly how it's said."},{"id":"es-p112","type":"flip","cat":"Everyday & Idioms","front":"Usted se equivoca.","back":"You are mistaken.","note":"Reflexive equivocarse — useful when a story doesn't add up."},{"id":"es-p113","type":"flip","cat":"Everyday & Idioms","front":"Me parece que...","back":"It seems to me that..."},{"id":"es-p114","type":"flip","cat":"Everyday & Idioms","front":"¿De veras? / ¿En serio?","back":"Really? / Seriously?"},{"id":"es-p115","type":"flip","cat":"Everyday & Idioms","front":"Poco a poco.","back":"Little by little.","note":"Also the honest answer to '¿Habla español?' while you're learning."},{"id":"es-n1","type":"flip","cat":"Numbers & Time","front":"cero, uno, dos, tres, cuatro","back":"0, 1, 2, 3, 4"},{"id":"es-n2","type":"flip","cat":"Numbers & Time","front":"cinco, seis, siete, ocho, nueve","back":"5, 6, 7, 8, 9"},{"id":"es-n3","type":"flip","cat":"Numbers & Time","front":"diez, once, doce, trece, catorce, quince","back":"10, 11, 12, 13, 14, 15"},{"id":"es-n4","type":"flip","cat":"Numbers & Time","front":"dieciséis, diecisiete, dieciocho, diecinueve, veinte","back":"16, 17, 18, 19, 20"},{"id":"es-n5","type":"flip","cat":"Numbers & Time","front":"treinta, cuarenta, cincuenta, sesenta","back":"30, 40, 50, 60"},{"id":"es-n6","type":"flip","cat":"Numbers & Time","front":"setenta, ochenta, noventa, cien","back":"70, 80, 90, 100","note":"Cien alone; ciento before more digits: ciento veinte = 120."},{"id":"es-n7","type":"flip","cat":"Numbers & Time","front":"mil / dos mil","back":"1,000 / 2,000","note":"Years: mil novecientos noventa = 1990; dos mil cinco = 2005."},{"id":"es-n8","type":"flip","cat":"Numbers & Time","front":"lunes, martes, miércoles, jueves","back":"Monday, Tuesday, Wednesday, Thursday","note":"Days aren't capitalized in Spanish."},{"id":"es-n9","type":"flip","cat":"Numbers & Time","front":"viernes, sábado, domingo","back":"Friday, Saturday, Sunday"},{"id":"es-n10","type":"flip","cat":"Numbers & Time","front":"enero, febrero, marzo, abril, mayo, junio","back":"January – June","note":"Months aren't capitalized."},{"id":"es-n11","type":"flip","cat":"Numbers & Time","front":"julio, agosto, septiembre, octubre, noviembre, diciembre","back":"July – December"},{"id":"es-n12","type":"flip","cat":"Numbers & Time","front":"Nací el cinco de marzo de mil novecientos noventa.","back":"I was born on March 5, 1990.","note":"Spanish order is day, month, year. 05/03/1990 means 5 March."},{"id":"es-n13","type":"flip","cat":"Numbers & Time","front":"¿Qué hora es? — Son las tres y media.","back":"What time is it? — It's 3:30."},{"id":"es-n14","type":"flip","cat":"Numbers & Time","front":"a las ocho de la mañana / de la noche","back":"at 8 in the morning / at night"},{"id":"es-n15","type":"flip","cat":"Numbers & Time","front":"anoche / esta mañana / la semana pasada","back":"last night / this morning / last week"},{"id":"es-n16","type":"flip","cat":"Numbers & Time","front":"hace una hora","back":"an hour ago","note":"Hace + time = ago."},{"id":"es-w1","type":"flip","cat":"Cold Weather","front":"¿Siente los dedos de los pies?","back":"Can you feel your toes?"},{"id":"es-w2","type":"flip","cat":"Cold Weather","front":"¿Puede mover los dedos?","back":"Can you move your fingers?"},{"id":"es-w3","type":"flip","cat":"Cold Weather","front":"¿Cuánto tiempo estuvo afuera?","back":"How long were you outside?"},{"id":"es-w4","type":"flip","cat":"Cold Weather","front":"¿Se mojó? ¿Se cayó al agua?","back":"Did you get wet? Did you fall in the water?"},{"id":"es-w5","type":"flip","cat":"Cold Weather","front":"Aquí tiene una manta.","back":"Here's a blanket."},{"id":"es-w6","type":"flip","cat":"Cold Weather","front":"Suba al vehículo; hay calefacción.","back":"Get in the vehicle; the heat's on."},{"id":"es-w7","type":"flip","cat":"Cold Weather","front":"¿Siente las manos?","back":"Can you feel your hands?","note":"Sentir = to feel. For feet: ¿Siente los pies?"},{"id":"es-w8","type":"flip","cat":"Cold Weather","front":"Quítese los calcetines mojados.","back":"Take off your wet socks.","note":"Reflexive command: quitarse → quítese."},{"id":"es-w9","type":"flip","cat":"Cold Weather","front":"Quítese la ropa mojada y póngase esto.","back":"Take off the wet clothes and put this on.","note":"CDC hypothermia first aid: remove wet clothing, then warm the person in dry layers or blankets.","source":"CDC, Preventing Hypothermia (first aid)","verified":"https://www.cdc.gov/winter-weather/prevention/index.html"},{"id":"es-w10","type":"flip","cat":"Cold Weather","front":"Siéntese aquí, cerca del calentador.","back":"Sit here, near the heater.","note":"Sentarse → siéntese. Cerca de + el = cerca del."},{"id":"es-w11","type":"flip","cat":"Cold Weather","front":"¿Se siente mareado?","back":"Do you feel dizzy?","note":"'Mareada' for a woman."},{"id":"es-w12","type":"flip","cat":"Cold Weather","front":"¿Tiene hambre? ¿Tiene sed?","back":"Are you hungry? Are you thirsty?","note":"TENER idioms, like ¿Tiene frío?"},{"id":"es-w13","type":"flip","cat":"Cold Weather","front":"¿Tiene mucho sueño?","back":"Are you very sleepy?","note":"CDC lists drowsiness, confusion, fumbling hands and slurred speech as hypothermia warning signs. They can look like intoxication.","source":"CDC, Preventing Hypothermia (warning signs)","verified":"https://www.cdc.gov/winter-weather/prevention/index.html"},{"id":"es-w14","type":"flip","cat":"Cold Weather","front":"No se frote las manos.","back":"Don't rub your hands.","note":"CDC frostbite first aid: don't rub or massage frostbitten skin.","source":"CDC, Preventing Frostbite (first aid)","verified":"https://www.cdc.gov/winter-weather/prevention/preventing-frostbite.html"},{"id":"es-n-mc","type":"mc","cat":"Numbers & Time","q":"A subject writes their date of birth as 05/03/1990. Most likely meaning?","choices":["May 3, 1990","March 5, 1990","It can't be either","March 1990, 5th week"],"answer":1,"explain":"Spanish-speaking countries write day/month/year. Confirm out loud: « ¿el cinco de marzo? »"}]},{"meta":{"id":"statutes","reverseFlip":true,"reverseAsk":"Which statute or regulation is this?","name":"Statutes & Authority","short":"USC","color":"#6FB3A8","order":4,"requireVerified":true,"blurb":"Where your authority comes from: 8 U.S.C. § 1357, 8 C.F.R. 287, and the crimes you charge.","subModes":["browse"]},"categories":{"Powers — 8 USC 1357":{"why":"Every warrantless action you take has to trace back to one of these powers."},"Regulations — 8 CFR 287":{"why":"The regulations define the terms in § 1357 and set the standards you're held to."},"Offenses":{"why":"Knowing the elements tells you what facts to document."},"Customs Authority":{"why":"Customs authority sits alongside immigration authority at and near the border."},"Which Authority?":{"why":"Naming the exact authority is how you articulate your legal basis."}},"cards":[{"id":"st-1357-a1","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(1) — interrogate","back":"Power without warrant \"to interrogate any alien or person believed to be an alien as to his right to be or to remain in the United States.\"","note":"The statute doesn't override the Fourth Amendment. Detaining someone to question them still needs reasonable suspicion (8 C.F.R. 287.8(b)).","why":"Your authority to ask about status.","source":"8 U.S.C. § 1357(a)(1)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-1357-a2","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(2) — warrantless immigration arrest","back":"Power to arrest any alien who, in the officer's presence or view, is entering or attempting to enter in violation of immigration law, or to arrest any alien in the U.S. if the officer has reason to believe the alien is here in violation of such law AND is likely to escape before a warrant can be obtained.","note":"Two prongs for interior arrests: reason to believe the person is unlawfully present + likelihood of escape. Document both.","why":"The basis for most administrative immigration arrests in the field.","source":"8 U.S.C. § 1357(a)(2)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-1357-a3","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(3) — conveyances and private lands","back":"Within a reasonable distance from any external boundary: board and search for aliens any vessel in U.S. territorial waters and any railway car, aircraft, conveyance or vehicle. Within 25 miles of the boundary: access to private lands, but not dwellings, to patrol the border and prevent illegal entry.","note":"'Reasonable distance' = 100 air miles under 8 C.F.R. 287.1(a)(2). The 25-mile private-lands access excludes dwellings.","flag":"The Fourth Amendment still applies: Almeida-Sanchez requires probable cause or consent for roving-patrol vehicle searches, and Brignoni-Ponce requires reasonable suspicion for roving stops.","why":"The geographic basis of Border Patrol authority, and its limits.","source":"8 U.S.C. § 1357(a)(3)","verified":"https://www.govinfo.gov/link/statute/66/26"},{"id":"st-1357-a4","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(4) — immigration felonies","back":"Power to arrest for felonies under laws regulating admission, exclusion, expulsion or removal of aliens, if the officer has reason to believe the person is guilty AND is likely to escape before a warrant can be obtained. The person must be taken without unnecessary delay before the nearest available officer empowered to commit persons charged with federal offenses.","why":"Covers felony arrests such as § 1326 reentry.","source":"8 U.S.C. § 1357(a)(4)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-a5","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(a)(5) — general federal arrests","back":"(A) Any federal offense committed in the officer's presence. (B) Any federal felony, if there are reasonable grounds to believe the person committed or is committing it, the officer is performing immigration-enforcement duties at the time, and there is a likelihood of escape before a warrant can be obtained.","why":"Your authority for non-immigration federal crimes you come across, such as drugs or assault.","source":"8 U.S.C. § 1357(a)(5)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-c","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(c) — search of persons seeking admission","back":"Power to search, without warrant, the person and personal effects of anyone seeking admission, when the officer has reasonable cause to suspect that grounds for denial of admission exist that the search would reveal.","why":"Statutory search authority for people seeking admission.","source":"8 U.S.C. § 1357(c)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-2871-a2","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.1(a)(2) — 'reasonable distance'","back":"Within 100 air miles from any external boundary of the United States, or any shorter distance fixed by the chief patrol agent (CBP) or special agent in charge (ICE).","note":"287.1(b): fixing distances considers topography, transportation routes, population density, inconvenience to the public, conveyance types, and reliable information on illegal-entry movements. A longer distance needs a report to and approval by the CBP Commissioner.","why":"Defines the 'reasonable distance' in § 1357(a)(3).","source":"8 C.F.R. § 287.1(a)(2), (b)","verified":"https://www.law.cornell.edu/cfr/text/8/287.1"},{"id":"st-2878-b","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(b) — interrogation and brief detention","back":"Any officer may ask anyone questions as long as the officer doesn't restrain the freedom of a person not under arrest to walk away. With reasonable suspicion, based on specific articulable facts, that the person is engaged in an offense against the U.S. or is an alien illegally in the U.S., the officer may briefly detain the person for questioning.","why":"Codifies the consensual / Terry line for immigration officers.","source":"8 C.F.R. § 287.8(b)","verified":"https://www.govinfo.gov/content/pkg/CFR-2024-title8-vol1/pdf/CFR-2024-title8-vol1-sec287-8.pdf"},{"id":"st-2878-c2i","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(c)(2)(i) — basis for arrest","back":"An arrest shall be made only when the designated immigration officer has reason to believe the person has committed an offense against the United States or is an alien illegally in the United States.","why":"The regulatory arrest standard.","source":"8 C.F.R. § 287.8(c)(2)(i)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-2878-c2iii","type":"order","cat":"Regulations — 8 CFR 287","binding":"regulation","q":"At the time of arrest, as soon as it is practical and safe, what does 287.8(c)(2)(iii) require — in order?","steps":["Identify yourself as an immigration officer authorized to execute an arrest","State that the person is under arrest","State the reason for the arrest"],"explain":"Identify, then announce the arrest and its reason, as soon as practical and safe.","why":"Regulatory requirement on every arrest.","source":"8 C.F.R. § 287.8(c)(2)(iii)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-2878-a-nondeadly","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(a) — non-deadly force","back":"Always use the minimum non-deadly force necessary to accomplish the mission. Escalate to a higher level only when warranted by the subject's actions, apparent intentions, and apparent capabilities.","why":"The regulatory force continuum. Pairs with Graham v. Connor.","source":"8 C.F.R. § 287.8(a)(1)","verified":"https://chanrobles.com/usa/uslaws/cfr/title08/8-1.0.1.2.57.0.1.8.php"},{"id":"st-2878-a-deadly","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(a)(2) — deadly force","back":"Deadly force (force likely to cause death or serious physical injury) may be used only when the designated officer has reasonable grounds to believe it is necessary to protect the officer or others from the imminent danger of death or serious physical injury.","why":"The regulatory deadly-force standard.","source":"8 C.F.R. § 287.8(a)(2)","verified":"https://www.law.cornell.edu/cfr/text/8/287.8"},{"id":"st-1325a","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1325(a) — improper entry","back":"An alien who (1) enters or attempts to enter at any time or place other than as designated by immigration officers, (2) eludes examination or inspection, or (3) attempts to enter or obtains entry by a willfully false or misleading representation or willful concealment of a material fact. First offense: fine and/or up to 6 months. Subsequent: fine and/or up to 2 years.","why":"The base illegal-entry charge.","source":"8 U.S.C. § 1325(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2024-title8/html/USCODE-2024-title8-chap12-subchapII-partVIII-sec1325.htm"},{"id":"st-1326a","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1326(a) — reentry after removal","back":"An alien who has been denied admission, excluded, deported or removed (or departed while such an order was outstanding) and then enters, attempts to enter, or is at any time found in the U.S., without the Attorney General's express consent to reapply. Fine and/or up to 2 years.","note":"'Found in' — the offense can be complete when you encounter the person, not only at the moment of crossing.","why":"The reentry felony. Prior removal is the key fact to confirm.","source":"8 U.S.C. § 1326(a)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-1326b","type":"mc","cat":"Offenses","binding":"statute","q":"Reentry after removal that followed an aggravated-felony conviction: up to 20 years. Which provision?","choices":["8 U.S.C. § 1325(a)","8 U.S.C. § 1326(a)","8 U.S.C. § 1326(b)(2)","8 U.S.C. § 1324(a)(2)"],"answer":2,"explain":"(b)(2): aggravated felony = up to 20 years. (b)(1): three or more drug or person misdemeanors, or a non-aggravated felony = up to 10 years. Base (a) = 2 years.","why":"Criminal history drives the charge. Run it every time.","source":"8 U.S.C. § 1326(b)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-1324-i","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(i) — bringing in","back":"Knowing that a person is an alien, bringing or attempting to bring the person to the U.S. in any manner at a place other than a designated port of entry or place designated by the Commissioner, regardless of whether the alien has prior official authorization.","why":"Smuggling at the line.","source":"8 U.S.C. § 1324(a)(1)(A)(i)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1324-ii","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(ii) — transporting","back":"Knowing or in reckless disregard of the fact that an alien came to, entered or remains in the U.S. in violation of law, transporting or moving (or attempting to) the alien within the U.S., by means of transportation or otherwise, in furtherance of that violation.","note":"Elements to document: transport, the alien's unlawful status, the driver's knowledge or reckless disregard, and 'in furtherance'.","why":"The most common smuggling charge from a vehicle stop.","source":"8 U.S.C. § 1324(a)(1)(A)(ii)","verified":"https://www.pbwt.com/second-circuit-blog/upon-further-review-second-circuit-holds-that-defendants-conduct-not-in-furtherance-of-aliens-unlawful-presence-in-united-states"},{"id":"st-1324-iii","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(1)(A)(iii) — harboring","back":"Knowing or in reckless disregard of an alien's unlawful entry or presence, concealing, harboring or shielding from detection (or attempting to) the alien in any place, including any building or means of transportation.","why":"Covers stash houses and hiding people in vehicles.","source":"8 U.S.C. § 1324(a)(1)(A)(iii)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1324-mc","type":"mc","cat":"Offenses","binding":"statute","q":"Which § 1324(a)(1)(A) clause covers encouraging or inducing an alien to come to or remain in the U.S.?","choices":["(i)","(ii)","(iii)","(iv)"],"answer":3,"explain":"(i) bringing in, (ii) transporting, (iii) harboring, (iv) encouraging/inducing, (v) conspiracy or aiding and abetting.","why":"The right subsection goes on the complaint.","source":"8 U.S.C. § 1324(a)(1)(A)(i)–(v)","verified":"https://law.counselstack.com/usc/8/1324"},{"id":"st-1304e","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1304(e) — carrying registration","back":"Every alien 18 and over shall at all times carry and have in personal possession any certificate of alien registration or registration receipt card issued to him. Failure is a misdemeanor: fine up to $100 and/or up to 30 days per offense.","why":"Why lawful residents should be able to produce documents on request.","source":"8 U.S.C. § 1304(e)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2024-title8/html/USCODE-2024-title8-chap12-subchapII-partVII-sec1304.htm"},{"id":"st-1581a","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1581(a) — customs boarding","back":"Any officer of the customs may at any time go on board any vessel or vehicle at any place in the U.S. or within customs waters to examine the manifest and documents, and examine, inspect and search the vessel or vehicle and any person, trunk, package or cargo aboard. The officer may hail and stop it and use all necessary force to compel compliance.","flag":"Statutory breadth doesn't remove Fourth Amendment limits away from the border (see Almeida-Sanchez, Ortiz).","why":"The broad customs boarding power. Know its text and its Fourth Amendment limits.","source":"19 U.S.C. § 1581(a)","verified":"https://www.law.cornell.edu/uscode/text/19/1581"},{"id":"st-sc-land","type":"scenario","cat":"Which Authority?","setup":"Following foot sign across a farm field 10 miles from the boundary. There's a house and a barn on the property. The owner isn't around.","q":"Which authority lets you enter that private land to patrol the border, but not the dwelling?","choices":["8 U.S.C. § 1357(e)","8 U.S.C. § 1357(a)(3)","8 U.S.C. § 1357(c)","19 U.S.C. § 1581(a)"],"answer":1,"explain":"§ 1357(a)(3). Within 25 miles: access to private lands, but not dwellings, to patrol the border.","source":"8 U.S.C. § 1357(a)(3)","verified":"https://www.govinfo.gov/link/statute/66/26"},{"id":"st-sc-distance","type":"scenario","cat":"Which Authority?","setup":"You're 60 air miles from the boundary and want to stop a vehicle on roving patrol.","q":"What do you need?","choices":["Nothing: inside 100 air miles any vehicle may be searched","Reasonable suspicion (Brignoni-Ponce). The 100-mile zone doesn't remove the Fourth Amendment","Probable cause to stop","A checkpoint"],"answer":1,"explain":"287.1 defines where § 1357(a)(3) applies. Brignoni-Ponce and Almeida-Sanchez still set the stop and search standards.","source":"8 C.F.R. § 287.1(a)(2); 8 U.S.C. § 1357(a)(3)","verified":"https://www.law.cornell.edu/cfr/text/8/287.1"},{"id":"st-sc-arrest-interior","type":"scenario","cat":"Which Authority?","setup":"Inland, a subject admits being unlawfully present and has a car and a bus ticket out of state tonight. No warrant exists.","q":"Which authority supports a warrantless administrative arrest?","choices":["§ 1357(a)(1)","§ 1357(a)(2): reason to believe unlawfully present + likely to escape","§ 1304(e)","§ 1357(c)"],"answer":1,"explain":"(a)(2) needs both prongs. The ticket and car support the likelihood of escape. Write them down.","source":"8 U.S.C. § 1357(a)(2)","verified":"https://www.law.cornell.edu/uscode/text/8/1357"},{"id":"st-sc-found-in","type":"scenario","cat":"Which Authority?","setup":"Records show a subject you've just encountered was removed two years ago. The subject has no consent to reapply.","q":"What is the likely charge?","choices":["§ 1325(a) improper entry","§ 1326(a) reentry ('found in')","§ 1324(a)(1)(A)(ii)","§ 1304(e)"],"answer":1,"explain":"A prior removal plus being found in the U.S. without consent = § 1326. Then check (b) for prior convictions.","source":"8 U.S.C. § 1326(a)","verified":"https://www.law.cornell.edu/uscode/text/8/1326"},{"id":"st-sc-driver","type":"scenario","cat":"Which Authority?","setup":"A driver picks up four people walking out of the woods just south of the line and drives them toward a city. Their story: 'I'm giving hitchhikers a ride.'","q":"Which offense, and what's the key element to develop?","choices":["§ 1325, entry","§ 1324(a)(1)(A)(ii) transporting: knowledge or reckless disregard of their status","§ 1326, reentry","§ 1304(e)"],"answer":1,"explain":"Transporting requires knowing or reckless disregard of unlawful status and 'in furtherance'. Document pickup location, timing, payment, phones, and what was said.","source":"8 U.S.C. § 1324(a)(1)(A)(ii)","verified":"https://www.pbwt.com/second-circuit-blog/upon-further-review-second-circuit-holds-that-defendants-conduct-not-in-furtherance-of-aliens-unlawful-presence-in-united-states"},{"id":"st-sc-drugs","type":"scenario","cat":"Which Authority?","setup":"During an immigration-status stop you see a firearm and drugs in plain view. The driver is a U.S. citizen.","q":"What is your arrest authority for the federal drug felony?","choices":["None: citizens are outside immigration authority","§ 1357(a)(5)(B): federal felony, reasonable grounds, on immigration duty, likely escape","§ 1357(a)(2)","§ 1304(e)"],"answer":1,"explain":"(a)(5) covers non-immigration federal offenses: in your presence (A), or felonies with the (B) conditions.","source":"8 U.S.C. § 1357(a)(5)","verified":"https://lawofselfdefense.com/statute/8-usc-1357-powers-of-immigration-officers-and-employees/"},{"id":"st-1357-e","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1357(e) — farms","back":"Except as provided in § 1357(a)(3), an officer may not enter the premises of a farm or other outdoor agricultural operation to question a person believed to be an alien about their right to be in the U.S. without the owner's (or agent's) consent or a properly executed warrant.","note":"The carve-out is (a)(3): within 25 miles, access to private lands (not dwellings) to patrol the border and prevent illegal entry is not limited by (e).","why":"Interior farm checks for questioning need consent or a warrant. Border patrolling inside 25 miles is different.","source":"8 U.S.C. § 1357(e)","verified":"https://uscode.house.gov/view.xhtml?req=%28title%3A8+section%3A1357+edition%3Aprelim%29"},{"id":"st-1182-a6ai","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1182(a)(6)(A)(i) — present without admission","back":"An alien present in the U.S. without being admitted or paroled, or who arrives at any time or place other than as designated, is inadmissible.","note":"A ground of inadmissibility (civil, removal), not a crime. The criminal counterpart for the entry itself is § 1325(a).","why":"The civil charge that goes with most EWIs (entries without inspection).","source":"8 U.S.C. § 1182(a)(6)(A)(i)","verified":"https://www.ca5.uscourts.gov/Opinions/pub/04/04-60234-CV0.wpd.pdf"},{"id":"st-1225-a","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1225(a)(1) and (a)(3) — applicants for admission","back":"(a)(1): an alien present in the U.S. who has not been admitted, or who arrives (at a port or not), is deemed an applicant for admission. (a)(3): all applicants for admission or others seeking admission, readmission or transit shall be inspected by immigration officers.","why":"Someone who crossed between ports is legally still an applicant for admission.","source":"8 U.S.C. § 1225(a)(1), (a)(3)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2017-title8/html/USCODE-2017-title8-chap12-subchapII-partIV-sec1225.htm"},{"id":"st-1225-b1","type":"flip","cat":"Powers — 8 USC 1357","binding":"statute","front":"8 U.S.C. § 1225(b)(1)(A) — expedited removal","back":"If an officer determines an arriving alien is inadmissible under § 1182(a)(6)(C) (fraud or misrepresentation) or (a)(7) (no valid documents), the officer orders removal without further hearing or review, UNLESS the alien indicates an intention to apply for asylum or a fear of persecution. Then the officer refers the alien for an interview by an asylum officer.","flag":"Who else is subject to expedited removal depends on current DHS designations. Confirm the scope in force.","why":"Any expression of fear triggers referral. Document it if it's said.","source":"8 U.S.C. § 1225(b)(1)(A)","verified":"https://www.law.cornell.edu/uscode/text/8/lii:usc:t:8:s:1225:b"},{"id":"st-18-111","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 111 — assaulting a federal officer","back":"Forcibly assaulting, resisting, opposing, impeding, intimidating or interfering with a covered federal officer engaged in, or because of, official duties. Simple assault: up to 1 year. Physical contact or intent to commit another felony: up to 8 years. (b) Deadly or dangerous weapon, or bodily injury: up to 20 years.","why":"Resisting you is a federal crime. The facts you document decide the tier.","source":"18 U.S.C. § 111","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap7-sec111.htm"},{"id":"st-18-111-mc","type":"mc","cat":"Offenses","binding":"statute","q":"A subject swings a tire iron at you during an arrest. Which § 111 tier?","choices":["Simple assault: up to 1 year","Physical contact: up to 8 years","(b) deadly or dangerous weapon: up to 20 years","Not covered: no injury"],"answer":2,"explain":"Using a deadly or dangerous weapon triggers (b), even with no injury.","source":"18 U.S.C. § 111(b)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap7-sec111.htm"},{"id":"st-18-1001","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 1001 — false statements","back":"In any matter within federal executive, legislative or judicial jurisdiction, knowingly and willfully (1) falsifying or concealing a material fact by trick, scheme or device, (2) making a materially false, fictitious or fraudulent statement, or (3) using a false writing knowing it contains one. Up to 5 years (8 if terrorism-related).","note":"Elements to document: the exact words, that they were false, that they were material, and that the subject knew.","why":"A false name or false citizenship claim to you can be its own federal charge.","source":"18 U.S.C. § 1001(a)","verified":"https://www.law.cornell.edu/uscode/text/18/1001"},{"id":"st-18-1546","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 1546(a) — fraudulent immigration documents","back":"Knowingly forging, counterfeiting or altering a visa, permit, border crossing card, alien registration receipt card or other entry or status document, or using, possessing or receiving one knowing it is forged, altered or obtained by fraud. Up to 10 years for the base offense.","why":"A fake green card or visa in a wallet is a felony, not just an inadmissibility ground.","source":"18 U.S.C. § 1546(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap75-sec1546.htm"},{"id":"st-18-922g5","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 922(g)(5)(A) — firearm possession","back":"Unlawful for an alien illegally or unlawfully in the U.S. to possess, in or affecting commerce, any firearm or ammunition. Penalty under § 924(a)(8): up to 15 years.","note":"The 2d Circuit upheld (g)(5) as applied in United States v. Perez.","why":"A gun or even ammunition found with an unlawfully present subject is a separate felony.","source":"18 U.S.C. §§ 922(g)(5)(A), 924(a)(8)","verified":"https://www.govinfo.gov/content/pkg/USCOURTS-ca2-19-00620/pdf/USCOURTS-ca2-19-00620-0.pdf"},{"id":"st-sc-farm-interior","type":"scenario","cat":"Which Authority?","setup":"Well beyond 25 miles from the line, you want to walk onto a working farm to question its field workers about status. The owner refuses and you have no warrant.","q":"Can you enter to question them?","choices":["Yes: § 1357(a)(1) lets you question anyone","No: § 1357(e) requires the owner's consent or a warrant","Yes, if you stay out of the farmhouse","Yes, inside 100 air miles"],"answer":1,"explain":"(e) bars entry onto farm premises for status questioning without consent or a warrant. Only (a)(3) border patrolling within 25 miles is carved out.","source":"8 U.S.C. § 1357(e)","verified":"https://uscode.house.gov/view.xhtml?req=%28title%3A8+section%3A1357+edition%3Aprelim%29"},{"id":"st-sc-false-name","type":"scenario","cat":"Which Authority?","setup":"A subject gives you a false name and claims U.S. citizenship. Fingerprints later show both were false and that the subject is a foreign national.","q":"Which federal statute covers the lie itself?","choices":["18 U.S.C. § 1001","8 U.S.C. § 1304(e)","18 U.S.C. § 111","8 U.S.C. § 1357(c)"],"answer":0,"explain":"Knowing and willful materially false statements in a federal matter. Record the exact words. A false claim to citizenship can carry other consequences too.","source":"18 U.S.C. § 1001(a)","verified":"https://www.law.cornell.edu/uscode/text/18/1001"},{"id":"st-sc-fake-card","type":"scenario","cat":"Which Authority?","setup":"A passenger hands you a permanent resident card. The security features are wrong and records show no such card was issued.","q":"Which criminal statute fits possessing and using it?","choices":["18 U.S.C. § 1546(a)","8 U.S.C. § 1325(a)","18 U.S.C. § 922(g)(5)","8 U.S.C. § 1326"],"answer":0,"explain":"Knowing possession or use of a forged alien registration receipt card. Seize it as evidence.","source":"18 U.S.C. § 1546(a)","verified":"https://www.govinfo.gov/content/pkg/USCODE-2023-title18/html/USCODE-2023-title18-partI-chap75-sec1546.htm"},{"id":"st-sc-fear","type":"scenario","cat":"Which Authority?","setup":"An arriving subject with no valid documents tells you they're afraid to go back to their country.","q":"In expedited removal, which statute requires referring them to an asylum officer instead of removing them?","choices":["8 U.S.C. § 1326(a)","8 U.S.C. § 1357(a)(2)","8 U.S.C. § 1225(b)(1)(A)","8 U.S.C. § 1182(a)(6)(A)(i)"],"answer":2,"explain":"§ 1225(b)(1)(A). An expressed fear or asylum intent means referral to an asylum officer, not summary removal.","source":"8 U.S.C. § 1225(b)(1)(A)","verified":"https://www.law.cornell.edu/uscode/text/8/lii:usc:t:8:s:1225:b"},{"id":"st-1401i","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1401(i) — 'officer of the customs'","back":"Paraphrase: any customs officer, any commissioned, warrant or petty officer of the Coast Guard, or any agent or other person (including foreign law enforcement officers) authorized by law or designated by the Secretary of the Treasury to perform the duties of a customs officer.","note":"Customs powers like § 1581 belong to 'officers of the customs'. Courts have upheld Border Patrol searches where the officers were designated as customs officers (United States v. Thompson, 475 F.2d 1359 (5th Cir. 1973), persuasive only).","why":"The definition that customs search and seizure powers hang on.","source":"19 U.S.C. § 1401(i)","verified":"https://definitions.uslegal.com/c/customs-officer/"},{"id":"st-1581e","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1581(e)–(f) — seizure and arrest after boarding","back":"(e) If examining a vessel or vehicle shows a breach of U.S. law that makes it, or merchandise on it or brought in by it, liable to forfeiture or to secure a fine or penalty, it is seized and the violator arrested. (f) Customs officers have a duty to seize and secure anything liable to seizure and arrest anyone liable to arrest.","why":"What follows when a § 1581 examination turns something up.","source":"19 U.S.C. § 1581(e), (f)","verified":"https://www.law.cornell.edu/uscode/text/19/1581"},{"id":"st-1582","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1582 — persons and baggage from abroad","back":"The Secretary of the Treasury may prescribe regulations for searching persons and baggage. All persons coming into the U.S. from foreign countries are liable to detention and search by authorized officers under those regulations.","note":"Implementing regulations: 19 C.F.R. part 162. On its face § 1582 requires no suspicion for a search at the point of entry.","why":"The statutory basis for routine searches of people entering the country.","source":"19 U.S.C. § 1582","verified":"https://www.law.cornell.edu/uscode/text/19/1582"},{"id":"st-482","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 482 — search of vehicles and persons","back":"Officers authorized to board or search vessels may stop, search and examine any vehicle, beast or person they suspect is carrying merchandise subject to duty or introduced contrary to law. They may search any trunk or envelope, wherever found, they have reasonable cause to suspect holds such merchandise, and must seize any they reasonably believe is dutiable or unlawfully introduced.","note":"Courts have read § 482 as the provision for searches away from the border; § 1581 and § 1582 cover the border itself.","flag":"Away from the border the Fourth Amendment still controls, whatever the statute's text allows.","why":"Customs search power that isn't tied to the port of entry.","source":"19 U.S.C. § 482","verified":"https://www.govinfo.gov/content/pkg/USCODE-2018-title19/html/USCODE-2018-title19-chap3-subtitleIV-other-part5.htm"},{"id":"st-1589a","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1589a — enforcement powers of customs officers","back":"Subject to the Treasury Secretary's direction, a customs officer may (1) carry a firearm, (2) execute and serve any order, warrant, subpoena, summons or other process, (3) arrest without warrant for any federal offense committed in the officer's presence, or for a federal felony committed outside it if there are reasonable grounds to believe the person committed or is committing it, and (4) perform any other law enforcement duty the Secretary designates.","note":"Compare 8 U.S.C. § 1357(a)(5)(B), which for out-of-presence felonies also requires immigration duty and likelihood of escape.","why":"Customs arrest authority runs alongside your immigration arrest authority.","source":"19 U.S.C. § 1589a","verified":"https://www.law.cornell.edu/uscode/text/19/1589a"},{"id":"st-1595a","type":"flip","cat":"Customs Authority","binding":"statute","front":"19 U.S.C. § 1595a — forfeiture","back":"(a) A vessel, vehicle, aircraft, animal or other thing used to aid the unlawful importation or later transport of merchandise introduced contrary to law may be seized and forfeited. (c)(1) Merchandise must be seized and forfeited if it is stolen, smuggled or clandestinely imported, or is a controlled substance not imported according to law (among other listed items).","note":"(b): a person who directs, assists financially or is otherwise concerned in the unlawful importation faces a civil penalty equal to the value of the merchandise.","why":"The car used to move smuggled goods can be seized, not just the goods.","source":"19 U.S.C. § 1595a(a)–(c)","verified":"https://law.counselstack.com/usc/19/1595a"},{"id":"st-2871-a1","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.1(a)(1) and (c) — 'external boundary' and 'patrolling the border'","back":"(a)(1) External boundary: the land boundaries and the territorial sea of the U.S., extending 12 nautical miles from the baselines. (c) Patrolling the border to prevent the illegal entry of aliens: conducting such activities as are customary, or reasonable and necessary, to prevent illegal entry.","why":"The 100-mile and 25-mile distances in § 1357(a)(3) are measured from this boundary.","source":"8 C.F.R. § 287.1(a)(1), (c)","verified":"https://www.law.cornell.edu/cfr/text/8/287.1"},{"id":"st-2873-a","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.3(a) — examination after warrantless arrest","back":"An alien arrested without a warrant under § 1357(a)(2) is examined by an officer other than the arresting officer. Exception: the arresting officer may examine if no other qualified officer is readily available and taking the alien to another officer would cause unnecessary delay.","why":"Processing has its own rules. Know who may do the examination.","source":"8 C.F.R. § 287.3(a)","verified":"https://www.law.cornell.edu/cfr/text/8/287.3"},{"id":"st-2873-d","type":"mc","cat":"Regulations — 8 CFR 287","binding":"regulation","q":"After a warrantless arrest, a custody determination is due within 48 hours (more in an emergency or extraordinary circumstance). Which regulation?","choices":["8 C.F.R. 287.7(d)","8 C.F.R. 287.3(d)","8 C.F.R. 287.8(c)","8 C.F.R. 287.1(a)"],"answer":1,"explain":"8 C.F.R. 287.3(d): 48 hours from the arrest. An emergency or other extraordinary circumstance allows an additional reasonable period. The rule was 24 hours before 2001.","why":"Delays in processing have a regulatory clock.","source":"8 C.F.R. § 287.3(d)","verified":"https://syfert.com/cfr/sections/8-287.3.html"},{"id":"st-2877-d","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.7(d) — detainer hold period","back":"When DHS issues a detainer on an alien not otherwise detained by a criminal justice agency, that agency shall maintain custody for a period not to exceed 48 hours, excluding Saturdays, Sundays and holidays, so DHS can assume custody.","flag":"Whether a local agency is bound to hold is litigated. Some courts treat a detainer as a request. Pick up promptly.","why":"The clock is short. Plan the pickup when you lodge the detainer.","source":"8 C.F.R. § 287.7(d)","verified":"https://www.law.cornell.edu/cfr/text/8/287.7"},{"id":"st-2878-c2ii","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(c)(2)(ii) — when a warrant is needed","back":"A warrant of arrest shall be obtained except when the designated immigration officer has reason to believe the person is likely to escape before a warrant can be obtained.","note":"Mirrors § 1357(a)(2). Courts look for individualized facts on likelihood of escape, not presence alone.","flag":"How 'likely to escape' is applied is under active litigation in several districts. Follow current guidance and document specific facts.","why":"Warrantless is the exception. Articulate why waiting for a warrant wasn't possible.","source":"8 C.F.R. § 287.8(c)(2)(ii)","verified":"https://www.aclu-co.org/app/uploads/2025/10/112-Order-on-Mot-to-Enforce.pdf"},{"id":"st-2878-c2vii","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(c)(2)(vii) — no coercion","back":"Using threats, coercion or physical abuse to induce a suspect to waive his or her rights or to make a statement is prohibited.","note":"Violations of 287.8 are reported to the Office of the Inspector General (287.10).","why":"A coerced statement or waiver can sink the case and your career.","source":"8 C.F.R. § 287.8(c)(2)(vii)","verified":"https://www.ecfr.gov/current/title-8/chapter-I/subchapter-B/part-287/section-287.8"},{"id":"st-2878-f2","type":"flip","cat":"Regulations — 8 CFR 287","binding":"regulation","front":"8 C.F.R. 287.8(f)(2) — site inspections","back":"An officer may not enter the non-public areas of a business, a residence including the curtilage, or a farm or other outdoor agricultural operation (except as provided in § 1357(a)(3)) to question occupants or employees about their right to be in the U.S. without a warrant or the consent of the owner or other person in control. Note on the report that consent was given and, if possible, by whom.","note":"287.8(f)(4): areas open to the general public can be entered without a warrant or consent.","why":"Public areas are open. Non-public areas need consent or a warrant.","source":"8 C.F.R. § 287.8(f)(2), (f)(4)","verified":"https://agworkforce.cals.cornell.edu/?p=4841"},{"id":"st-1324-a2","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1324(a)(2) — bringing in without authorization","back":"Knowing or in reckless disregard that an alien has not received prior official authorization to come to, enter or reside in the U.S., bringing or attempting to bring the alien to the U.S. in any manner. Base penalty (A): fine and/or up to 1 year per alien.","note":"(B) raises the penalty, with mandatory minimums, where the offense is with intent to commit a crime, for commercial advantage or private financial gain, or the alien isn't immediately presented to an immigration officer at a port of entry.","why":"Covers bringing someone in even at a port. Payment and failure to present drive the felony tier.","source":"8 U.S.C. § 1324(a)(2)","verified":"https://www.justice.gov/archives/jm/criminal-resource-manual-1907-title-8-usc-1324a-offenses"},{"id":"st-1327","type":"flip","cat":"Offenses","binding":"statute","front":"8 U.S.C. § 1327 — aiding entry of criminal or security inadmissibles","back":"Knowingly aiding or assisting an alien inadmissible under § 1182(a)(2) (insofar as it relates to an aggravated-felony conviction) or § 1182(a)(3) (other than (E)) to enter, or conniving or conspiring to allow entry. Fine and/or up to 10 years.","why":"Smuggling an aggravated felon or a security risk is a heavier charge than ordinary smuggling.","source":"8 U.S.C. § 1327","verified":"https://www.law.cornell.edu/uscode/text/8/1327"},{"id":"st-18-911","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 911 — false claim of citizenship","back":"Whoever falsely and willfully represents himself to be a citizen of the United States. Fine and/or up to 3 years.","note":"Record the exact words. An implied claim may not be enough; a direct statement is the clearest case.","flag":"Elements here follow the 9th Circuit model instruction (direct claim, made to someone with good reason to ask). The 2d Circuit's formulation wasn't confirmed.","why":"'I'm a U.S. citizen' said falsely to you is its own felony.","source":"18 U.S.C. § 911","verified":"https://law.justia.com/codes/us/title-18/part-i/chapter-43/sec-911"},{"id":"st-18-758","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 758 — high-speed flight from a checkpoint","back":"Fleeing or evading a checkpoint operated by the former INS or any other federal law enforcement agency in a motor vehicle, and fleeing federal, state or local law enforcement agents in excess of the legal speed limit. Fine and/or up to 5 years.","note":"Two parts: evading the checkpoint, then fleeing over the speed limit. Document speeds and the posted limit.","why":"Checkpoint runners face a federal felony on top of whatever else is in the vehicle.","source":"18 U.S.C. § 758","verified":"https://www.law.cornell.edu/uscode/text/18/758"},{"id":"st-18-545","type":"flip","cat":"Offenses","binding":"statute","front":"18 U.S.C. § 545 — smuggling goods","back":"Knowingly and willfully, with intent to defraud the U.S., smuggling or clandestinely introducing merchandise that should have been invoiced, OR fraudulently or knowingly importing merchandise contrary to law, or receiving, concealing, buying, selling or facilitating its transport knowing it was imported contrary to law. Fine and/or up to 20 years.","note":"Unexplained possession of such goods can be enough to convict. The merchandise is subject to forfeiture.","why":"The general criminal charge for goods (not people) brought in unlawfully.","source":"18 U.S.C. § 545","verified":"https://www.casemine.com/act/us/591974dbadd7b05bd4d9af07"},{"id":"st-sc-checkpoint-run","type":"scenario","cat":"Which Authority?","setup":"A car drives around the checkpoint lane without stopping. Local and federal units pursue it well over the posted speed limit before it stops.","q":"Which federal offense fits the flight itself?","choices":["18 U.S.C. § 111","18 U.S.C. § 758","8 U.S.C. § 1325(a)","19 U.S.C. § 1581"],"answer":1,"explain":"§ 758: evading a federal checkpoint in a motor vehicle and fleeing officers above the speed limit. Up to 5 years.","source":"18 U.S.C. § 758","verified":"https://www.law.cornell.edu/uscode/text/18/758"},{"id":"st-sc-citizen-claim","type":"scenario","cat":"Which Authority?","setup":"Asked about status, a passenger says clearly, 'I'm a U.S. citizen.' Records later show the passenger is a foreign national who never naturalized.","q":"Which statute is aimed specifically at that false claim?","choices":["18 U.S.C. § 911","8 U.S.C. § 1304(e)","8 U.S.C. § 1327","19 U.S.C. § 1589a"],"answer":0,"explain":"§ 911 targets a false and willful claim to U.S. citizenship. § 1001 may also apply. Write down the exact words.","source":"18 U.S.C. § 911","verified":"https://law.justia.com/codes/us/title-18/part-i/chapter-43/sec-911"},{"id":"st-sc-goods-vehicle","type":"scenario","cat":"Which Authority?","setup":"A vehicle stopped near the border has undeclared merchandise hidden in a false floor. The driver admits bringing it across between ports.","q":"What authority supports seizing the vehicle itself?","choices":["8 U.S.C. § 1357(a)(3)","19 U.S.C. § 1595a(a)","8 C.F.R. 287.7","18 U.S.C. § 758"],"answer":1,"explain":"§ 1595a(a): a vehicle used to aid unlawful importation or transport of merchandise may be seized and forfeited. The goods fall under (c).","source":"19 U.S.C. § 1595a(a)","verified":"https://law.counselstack.com/usc/19/1595a"}]},{"meta":{"id":"tracking","name":"Tracking","short":"TRK","color":"#B8925A","order":9,"blurb":"Sign cutting basics: what sign looks like, following it, losing it and getting it back.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","subModes":["browse"]},"categories":{"Why Track":{"why":"A direction from the sign shrinks the search more than anything else you can do early."},"Sign":{"why":"You can only follow what you can see. These are the things to look for."},"Following Sign":{"why":"Measuring and marking keep you on the right sign line and let others help."},"Lost Sign":{"why":"Everyone loses the sign. Getting it back without wrecking it is the skill."},"Team & Scene":{"why":"Sign is evidence. A careless team destroys it faster than weather does."}},"cards":[{"id":"trk-why","type":"flip","cat":"Why Track","front":"What does tracking give a search?","back":"Direction, time, and a shoe description. It turns the circle around the place last seen into a pie slice.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-pls","type":"flip","cat":"Why Track","front":"PLS / LKP","back":"Place Last Seen / Last Known Point. Where the search and the sign line start.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-area","type":"flip","cat":"Why Track","front":"How big is the search area if you don't know direction?","back":"A circle: area = 3.14 × radius². Radius = time elapsed × the subject's speed.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-area-mc","type":"mc","cat":"Why Track","q":"A subject on foot moves about 2.5 km/h and left 4 hours ago. Direction unknown. Roughly how big is the search area?","choices":["About 10 km²","About 31 km²","About 314 km²","About 1,000 km²"],"answer":2,"explain":"Radius = 2.5 × 4 = 10 km. Area = 3.14 × 10² ≈ 314 km². A tracker who finds the direction cuts that to a slice.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-sector-mc","type":"mc","cat":"Why Track","q":"Why is getting a direction from the sign early so valuable?","choices":["It proves who the subject is","It turns the whole circle into a sector, so the same people search a much smaller area","It lets you skip the PLS","It means you no longer need to look for sign"],"answer":1,"explain":"In the source's example, a general direction shrinks the area to about 1/8 the size: the same 400 searchers go from 1 per km² to about 10 per km².","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-cordons","type":"order","cat":"Why Track","q":"Put the search rings in order, from the place last seen outward.","steps":["Point search (right around the PLS)","Inner cordon","Middle cordon","Outer cordon"],"explain":"Trackers work the point search to find the sign and the sector; the cordons widen as time passes.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-random","type":"flip","cat":"Why Track","front":"How do people move through terrain?","back":"Not randomly. Most take the path of least resistance and aim toward something. Look for what might draw them.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002); Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-five","type":"flip","cat":"Sign","front":"The 5 characteristics of sign","back":"Flattening, regularity, color change, disturbance, transfer.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-flat","type":"flip","cat":"Sign","front":"Flattening","back":"Rocks, twigs and dirt leveled by the weight and pressure of a foot.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-reg","type":"flip","cat":"Sign","front":"Regularity","back":"Straight lines, curves or geometric shapes pressed into the ground by a shoe. Nature rarely makes clean lines.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-color","type":"flip","cat":"Sign","front":"Color change","back":"Soil, plants, twigs or rocks that look different where a foot pressed or scuffed: a snapped twig, a turned leaf, scuffed soil.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-dist","type":"flip","cat":"Sign","front":"Disturbance","back":"Stones, twigs or plants knocked out of their natural place.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-transfer","type":"flip","cat":"Sign","front":"Transfer","back":"Material carried by the sole of a shoe and left somewhere it doesn't belong.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-five-mc","type":"mc","cat":"Sign","q":"Which is NOT one of the 5 characteristics of sign?","choices":["Transfer","Regularity","Scent","Color change"],"answer":2,"explain":"The five are flattening, regularity, color change, disturbance and transfer. Scent isn't visual sign.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-sc-transfer","type":"scenario","cat":"Sign","setup":"Fifty meters past a muddy creek bank you find wet mud smeared on a dry, flat rock.","q":"What kind of sign is that?","choices":["Transfer","Flattening","Regularity","Not sign, natural"],"answer":0,"explain":"Mud carried off the bank on a sole and left on the rock is transfer.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-dew","type":"flip","cat":"Sign","front":"Grass and low brush early in the morning","back":"They show passage and direction well: the dew is knocked off where someone walked.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-sun","type":"flip","cat":"Sign","front":"Using light to see sign","back":"Look toward the light, with the sign between you and the sun. Low-angle light throws more shadow, so sign shows best when the sun is low. At night, hold the flashlight close to the ground and shine it across the sign.","note":"Sun at your back, you'll see next to nothing. Heavy overcast and flat light make it harder too.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002); Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 17–18","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-sun-mc","type":"mc","cat":"Sign","q":"When does sign usually stand out best?","choices":["Midday, sun straight overhead","Early or late, sun low","Under overcast only","It makes no difference"],"answer":1,"explain":"A low sun casts long shadows across prints and flattened ground. Overhead sun washes them out.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-levels","type":"flip","cat":"Sign","front":"Where do you look for sign?","back":"On the ground and up in the vegetation. Ground sign is at your feet; top sign is above it: bent leaves, broken stems, branches grabbed for balance, cobwebs.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 66, 80","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-aging","type":"flip","cat":"Sign","front":"Aging sign","back":"Judge age from what weather and time do to it: rain, moisture, temperature, sun exposure and color change. Compare it with sign you know the age of.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-step","type":"flip","cat":"Following Sign","front":"Step-by-step tracking","back":"Following the sign line one print at a time, not moving on until you've found the next one.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-cutting","type":"flip","cat":"Following Sign","front":"Sign cutting","back":"Searching across likely ground for sign to find a sign line or pick it up again, instead of following print to print.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-perimeter","type":"flip","cat":"Following Sign","front":"Perimeter cutting","back":"Cutting for sign in a loop around the PLS or a known point to find where the subject left the area.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-tt","type":"flip","cat":"Following Sign","front":"Track trap","back":"Any ground, vegetation or surface where someone has to leave sign if they cross it. Natural (sand, mud, stream banks, grass) or man-made (raked roads, ditches).","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 59; Original Wisdom, \"The Secrets of Success for Tracking: The Lost Trail Drill\"","verified":"https://www.originalwisdom.com/the-secrets-of-success-for-tracking-the-lost-trail-drill/"},{"id":"trk-draw","type":"flip","cat":"Following Sign","front":"First thing to do with a good print","back":"Draw it in detail and measure it: heel-to-toe length, width across the ball, and the heel's length and width.","note":"Learn to describe it clearly over the radio for searchers ahead of you.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-stick","type":"flip","cat":"Following Sign","front":"What does a tracking stick record?","back":"Step interval (toe of the back print to heel of the front print), foot length (toe to heel of one print), and stride (stick tip to the second marker).","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-stick-use","type":"flip","cat":"Following Sign","front":"Using the tracking stick","back":"Hold the stick at the second marker over the back edge of the last heel print. Swing the tip in an arc; the next heel print should be near the tip.","note":"Terrain changes stride length, but the print has to be near the arc.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-mark","type":"flip","cat":"Following Sign","front":"Marking sign","back":"Mark each good print at the heel (crepe paper on a twig works). A line of marks shows direction when the sign gets faint.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-leapfrog","type":"flip","cat":"Following Sign","front":"Leapfrogging","back":"Sending tracker teams ahead along the likely route to cut for sign and get in front of a subject who is still moving.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-lost","type":"order","cat":"Lost Sign","q":"You've lost the sign. Put the recovery steps in order.","steps":["Stop and mark your last good sign","Go back 5–30 m to the last confirmed print","Check the most likely routes first","Cut around at track traps along the subject's heading"],"explain":"STOP first. Never jump ahead without marking the last sign. Work outward from what you know, then use track traps to check ahead.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 31–32; Original Wisdom, \"The Secrets of Success for Tracking: The Lost Trail Drill\"","verified":"https://www.originalwisdom.com/the-secrets-of-success-for-tracking-the-lost-trail-drill/"},{"id":"trk-sc-gravel","type":"scenario","cat":"Lost Sign","setup":"The sign line runs to a hard gravel road and disappears.","q":"Best move?","choices":["Mark the last print, then cut both road edges and the soft shoulders on the far side","Guess a direction and run it","Drive the road looking out the window","Call it lost"],"answer":0,"explain":"People cross or follow roads. The edges and shoulders are track traps. Mark first so you can always come back.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing); Original Wisdom, \"The Secrets of Success for Tracking: The Lost Trail Drill\"","verified":"https://www.originalwisdom.com/the-secrets-of-success-for-tracking-the-lost-trail-drill/"},{"id":"trk-overshoot","type":"mc","cat":"Lost Sign","q":"A common way eager trackers lose the sign is…","choices":["Moving too slowly","Overshooting: pushing past the last sign without marking it","Measuring too often","Using flankers"],"answer":1,"explain":"The source names overshoot by eager trackers as one of the situations that force you to relocate the sign.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-team","type":"flip","cat":"Team & Scene","front":"Basic tracking team","back":"One sign cutter with two flankers. Flankers work to the sides of the sign and slightly behind the cutter.","note":"Flankers must be careful not to destroy sign when the cutter is struggling to find the next print.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-beside","type":"flip","cat":"Team & Scene","front":"Where do you walk?","back":"Beside the sign line, never on it. The sign may be evidence.","source":"Mantracking workshop notes, U.S. Border Patrol tracking workshop (N.E. K-9 SAR, 2002); Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://www.originalwisdom.com/wp-content/uploads/bsk-pdf-manager/2019/03/Dubay-and-Batchelder_US-border-patrol-workshop.pdf"},{"id":"trk-contam","type":"flip","cat":"Team & Scene","front":"Protecting the start point","back":"Keep people off the PLS, vehicle, doorway and trails until the sign is found and secured. Every extra set of boots contaminates it.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing)","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-sun-dir-mc","type":"mc","cat":"Sign","q":"Where should the sun be when you're looking for a faint print?","choices":["At your back","In front of you, with the sign between you and the sun","Straight overhead","It doesn't matter"],"answer":1,"explain":"Looking toward the light makes the tiny shadows in a print show up. With the sun at your back you see almost nothing.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 17–18","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-flagging","type":"flip","cat":"Sign","front":"Pointers / flagging","back":"Grass and plants bent over by a passing foot, pointing the way the person was moving.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 68","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-shine","type":"flip","cat":"Sign","front":"Shine","back":"Pressed-down grass or leaves catch the light differently from the plants around them, so the trail looks lighter or glossier.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 68","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-nesting","type":"flip","cat":"Sign","front":"Nesting","back":"Grass or leaves pressed down into a foot-shaped bed.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 66","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-crushed","type":"flip","cat":"Sign","front":"Crushed","back":"Plants, twigs or even insects crushed under a foot.","source":"Nellemann, Kearney & Nårstad, Sign and the Art of Tracking (INTERPOL / UNEP GRID-Arendal, 2013, 2nd printing), p. 70","verified":"https://bibsok.no/?tnr=387081"},{"id":"trk-ontop","type":"flip","cat":"Sign","front":"One print on top of another","back":"The one on top was made later. A vehicle track over two sets of prints means the vehicle came after both.","source":"Nellema
