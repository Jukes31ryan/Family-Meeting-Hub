}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);font-weight:700;color:var(--ink);background:var(--bg);background-color:#EEF8FF;
-webkit-font-smoothing:antialiased;transition:color .3s}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
.d{font-family:var(--fd);font-weight:400;letter-spacing:.01em}

/* screens */
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.scr.on{display:block}
.scr.on > .wrap{animation:scrIn .32s var(--spring) both}
.scr.rev.on > .wrap{animation-name:scrBack}
@keyframes scrIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.wrap{max-width:520px;margin:0 auto}

/* sticker cards and chunky buttons */
.stk{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.btn3d{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border:none;border-radius:20px;
font-family:var(--fd);font-size:23px;letter-spacing:.03em;color:#fff;background:var(--c,var(--eat));
box-shadow:0 6px 0 var(--cd,var(--eat-d));transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn3d:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd,var(--eat-d))}
.btn3d.small{min-height:48px;font-size:18px;border-radius:16px}
.btn3d.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);text-shadow:none}
.btn3d.ghost:active{box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:900;
letter-spacing:.06em;text-transform:uppercase}

/* ── HOME ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.icon-btn{width:46px;height:46px;border-radius:15px;border:none;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;
box-shadow:0 3px 0 rgba(0,0,0,.12)}
.icon-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hello{font-family:var(--fb);font-weight:900;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}

.board{background:var(--board);border-radius:26px;padding:18px 16px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25),inset 0 0 0 4px #2A3168;
position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.5px);
background-size:7px 7px;pointer-events:none}
.board-top{display:flex;align-items:center;justify-content:space-between;position:relative}
.board-title{font-family:var(--fd);font-size:34px;line-height:1;color:var(--gold);letter-spacing:.04em;text-shadow:0 0 14px rgba(255,210,63,.45)}
.board-date{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8C95D8;margin-top:6px}
.jersey{width:64px;height:60px;position:relative;flex:0 0 auto}
.jersey svg{width:100%;height:100%}
.jersey b{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:var(--fd);font-weight:400;font-size:22px;color:#fff;
text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px;position:relative}
.tile{border-radius:14px;background:var(--tile-off);aspect-ratio:1/1.18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
font-size:26px;line-height:1;color:var(--tile-off-ink);border:none;padding:0;transition:background .3s,color .3s}
.tile .ti{filter:grayscale(1);opacity:.4;display:flex;align-items:center;justify-content:center;height:28px;font-size:23px;line-height:1}
.tile .ti svg{width:30px;height:22px}
.tile.lit .ti,.tile.half .ti{filter:none;opacity:1}
.tile small{font-family:var(--fb);font-size:11.5px;font-weight:900;letter-spacing:.02em;color:#8C95D8}
.tile.lit small,.tile.half small{color:#fff}
.tile.lit{background:var(--c);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -4px 0 rgba(0,0,0,.18);
animation:litPop .5s var(--spring)}
.tile.cap{position:relative;overflow:hidden;--band-ink:var(--tile-off)}
.tile.cap .ti{color:#8C95D8}
.tile.cap.lit .ti,.tile.cap.half .ti{color:#fff}
.tile.cap.lit{--band-ink:var(--cap-d)}
.tile.cap.half{background:linear-gradient(0deg,var(--cap) 50%,var(--tile-off) 50%);color:#fff;--band-ink:var(--cap-d)}
.band-big{display:inline-block;color:#fff;--band-ink:var(--cap-d);line-height:0}
@keyframes litPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.board-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;position:relative;gap:10px}
.streak{display:flex;align-items:center;gap:8px;color:#fff;font-weight:900;font-size:15px}
.streak .fire{font-size:24px;filter:drop-shadow(0 0 6px rgba(255,140,0,.6))}
.streak.cold .fire{filter:grayscale(1);opacity:.5}
.stars{color:var(--gold);font-size:15px;font-weight:900;letter-spacing:.04em}

.cta{margin:20px 0 6px}
.half-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.half-h .d{font-size:24px;color:var(--ink)}
body[data-theme="day"] .half-h .d{color:#163A63}
.half-h span{font-size:12px;font-weight:900;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.half-h em{font-style:normal;font-family:var(--fb);font-weight:900;font-size:15px;opacity:.7;margin-left:4px}
body[data-theme="day"] .half-h span{color:#4D6C93}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctile{position:relative;border:none;border-radius:22px;padding:14px 14px 13px;text-align:left;background:var(--c);color:#fff;
box-shadow:0 6px 0 var(--cd);min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s,box-shadow .08s}
.ctile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.ctile .emo{font-size:38px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.ctile .nm{font-family:var(--fd);font-size:21px;line-height:1.05;margin-top:8px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.ctile .sb{font-size:12.5px;font-weight:800;opacity:.92;margin-top:3px;line-height:1.25}
.ctile .lt{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.25);
display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px}
.ctile.done .lt{background:var(--gold);color:#6B4A00;font-size:17px}
.ctile.done::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55);pointer-events:none}
.ctile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.ctile.wide .nm{margin-top:0}
.ctile .when{position:absolute;top:12px;right:10px;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
background:rgba(0,0,0,.18);padding:4px 8px;border-radius:8px}
.quote{margin-top:26px;border-left:8px solid var(--cap)}
.quote .ql{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cap-d)}
.quote .qt{font-size:19px;font-weight:800;line-height:1.35;margin-top:8px}
.quote .qa{font-size:13px;font-weight:900;color:var(--ink3);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}

/* ── CARD SCREEN ── */
.cbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{display:flex;align-items:center;gap:4px;height:42px;padding:0 14px 0 8px;border:none;border-radius:14px;background:var(--card);
box-shadow:0 3px 0 var(--line);font-weight:900;font-size:15px}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dots{flex:1;display:flex;gap:6px;justify-content:flex-end}
.dots i{display:block;width:26px;height:10px;border-radius:6px;background:rgba(255,255,255,.45)}
.dots i.on{background:var(--c)}
.dots i.done{background:var(--gold)}
.hero{border-radius:26px;background:var(--c);color:#fff;padding:18px 18px 20px;box-shadow:0 6px 0 var(--cd);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .emo{font-size:52px;line-height:1;position:absolute;right:18px;top:16px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));z-index:1}
.hero .tag{background:rgba(255,255,255,.22)}
.hero h1{font-family:var(--fd);font-weight:400;font-size:38px;line-height:1;margin-top:12px;text-shadow:0 3px 0 rgba(0,0,0,.15);max-width:78%}
.hero p{font-size:16px;font-weight:800;margin-top:8px;opacity:.95;max-width:84%;line-height:1.35}
.cbody{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.sec-l{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
background:linear-gradient(180deg,transparent,var(--chrome) 34%);z-index:5}
.foot .btn3d{max-width:520px;margin:0 auto}
#card.gated .foot{display:none}
.skip-link{display:block;margin:6px auto 0;border:none;background:none;font-weight:900;font-size:14px;color:var(--ink3);
text-decoration:underline;text-underline-offset:3px;padding:10px}
body[data-theme="day"] .skip-link{color:#4D6C93}

/* ── FUEL UP: THE FOOD GROUP SORT ── */
.fs-top{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:14px;color:var(--ink3);
text-transform:uppercase;letter-spacing:.08em}
.fs-score{color:var(--eat-d)}
.fs-food{display:flex;align-items:center;gap:16px;margin:14px 0 4px}
.fs-emo{font-size:76px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12));animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}100%{transform:none}}
.fs-name{font-family:var(--fd);font-size:32px;line-height:1.05}
.fs-q{font-size:15px;font-weight:900;color:var(--ink2);margin-top:4px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gbtn{border:none;border-radius:16px;min-height:58px;font-family:var(--fd);font-size:21px;color:#fff;background:var(--gc);
box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 70%,#000);transition:transform .08s,box-shadow .08s,opacity .2s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.gbtn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--gc) 70%,#000)}
.gbtn:last-child{grid-column:1/-1}
.gbtn.dim,.qbtn.dim{opacity:.3}
.gbtn.right{outline:5px solid #19C35A;outline-offset:2px}
.gbtn.wrong{outline:5px solid #FF3B3B;outline-offset:2px;opacity:.85}
.fs-quiz{margin:12px 0 4px}
.fs-tag{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--edu)}
.fs-qq{font-family:var(--fb);font-weight:900;font-size:23px;line-height:1.3;margin-top:6px}
.qbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qbtn{border:3px solid var(--line);border-radius:16px;background:var(--card);min-height:56px;padding:12px 16px;text-align:left;
font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.qbtn:active{transform:translateY(3px)}
.qbtn.right{border-color:#19C35A;background:color-mix(in srgb,#19C35A 16%,var(--card))}
.qbtn.wrong{border-color:#FF3B3B;background:color-mix(in srgb,#FF3B3B 14%,var(--card))}
.gbtn:disabled{cursor:default}
.fs-res{margin-top:16px;animation:pop .35s var(--spring)}
.fs-head{font-family:var(--fd);font-size:25px;line-height:1.1}
.fs-head.ok{color:var(--eat-d)}
.fs-head.no{color:#D92B2B}
.fs-why{font-size:16px;font-weight:800;line-height:1.4;margin-top:6px}
.dyk{margin-top:14px;border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--cap) 22%,var(--card));border:3px solid var(--cap)}
.dyk b{display:block;font-family:var(--fd);font-weight:400;font-size:19px;color:var(--cap-d);margin-bottom:4px}
.dyk p{font-size:17px;font-weight:800;line-height:1.4}
.src{font-size:11.5px;font-weight:800;color:var(--ink3);margin-top:8px;line-height:1.35}
.fs-next{margin-top:16px}
.fs-done{text-align:center}
.fs-big{font-family:var(--fd);font-size:60px;line-height:1;color:var(--eat-d);margin-top:6px}
.fs-title{font-family:var(--fd);font-size:26px;margin-top:4px}
.spot{text-align:left;margin-top:16px;border-radius:18px;padding:16px;color:#fff;background:var(--gc);box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 70%,#000)}
.spot .pill{background:rgba(255,255,255,.22)}
.spot h3{font-family:var(--fd);font-weight:400;font-size:26px;margin-top:8px}
.spot p{font-size:16px;font-weight:800;line-height:1.4;margin-top:6px}
.spot .src{color:rgba(255,255,255,.85)}

/* ── WARM-UP ── */
.wu{text-align:center}
.wu-name{font-size:24px}
.wu-note{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.4}
.wu-ring{position:relative;width:210px;height:210px;margin:18px auto 6px}
.wu-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wu-track{fill:none;stroke:var(--card2);stroke-width:10}
.wu-prog{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;stroke-dasharray:339.3;transition:stroke-dashoffset 1s linear}
.wu-fig{position:absolute;inset:34px;color:var(--c)}
.wu-fig svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transform:none}
.wu-move{font-size:28px;margin-top:6px}
.wu-cue{font-size:16px;font-weight:800;color:var(--ink2);line-height:1.4;margin:6px 6px 0;min-height:44px}
.wu-time{font-size:40px;margin-top:6px;font-variant-numeric:tabular-nums}
.wu-dots{display:flex;justify-content:center;gap:6px;margin:10px 0 16px}
.wu-dots i{width:10px;height:10px;border-radius:50%;background:var(--card2)}
.wu-dots i.on{background:var(--c);transform:scale(1.3)}
.wu-dots i.seen{background:var(--gold)}
.wu-go .fig-sway{animation:figSway 3.2s ease-in-out infinite}
.wu-go .fig-roll{animation:figRoll 4s linear infinite;transform-origin:center}
.wu-go .fig-arch{animation:figArch 4s ease-in-out infinite}
.wu-go .fig-reach{animation:figReach 1.6s ease-in-out infinite}
.wu-go .fig-sink{animation:figSink 4.4s ease-in-out infinite}
.wu-go .fig-twist{animation:figTwist 4s ease-in-out infinite}
@keyframes figSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes figRoll{to{transform:rotate(360deg)}}
@keyframes figArch{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-5px) scaleY(.9)}}
@keyframes figReach{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes figSink{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes figTwist{0%,100%{transform:rotate(-11deg) skewX(0deg)}50%{transform:rotate(11deg) skewX(-4deg)}}
.safety{font-size:13px;color:var(--ink3);font-weight:800;margin-top:12px}

/* ── SPORTS BRAIN ── */
.bz-today{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.bz-today span{font-size:22px}
.more{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;border-radius:14px;padding:10px 14px;font-weight:900;font-size:15px;background:var(--card2);color:var(--ink);
box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--edu);color:#fff;box-shadow:0 3px 0 var(--edu-d)}
.chip:active{transform:translateY(2px)}
.big-q{font-weight:900;font-size:22px;line-height:1.3;margin-top:8px}
.who-clue{display:flex;gap:10px;font-size:17px;font-weight:800;line-height:1.4;margin-top:10px;animation:pop .35s var(--spring)}
.who-clue b{flex:0 0 58px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--edu);padding-top:4px}
.who-clue.locked{color:var(--ink3);font-style:italic;animation:none}
.who-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.who-pts{font-size:15px;font-weight:900;color:var(--ink2)}
.sport-pill{background:var(--card2);color:var(--ink2)}
.pb-name,.sk-name{font-family:var(--fd);font-size:30px;line-height:1.05;margin-top:8px}
.pb-what,.sk-what{font-size:16px;font-weight:800;color:var(--ink2);line-height:1.4;margin-top:6px}
.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.steps li{counter-increment:st;display:flex;gap:12px;font-size:16px;font-weight:800;line-height:1.4}
.steps li::before{content:counter(st);flex:0 0 28px;height:28px;border-radius:10px;background:var(--edu);color:#fff;
font-family:var(--fd);font-size:16px;display:flex;align-items:center;justify-content:center}
.box{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--card2);font-size:16px;font-weight:800;line-height:1.4}
.box b{display:block;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--edu);margin-bottom:4px}
.pb-wrap{margin:14px 0 4px}
.pb-svg{display:block;width:100%;height:auto;border-radius:14px}
.pb-grass{fill:color-mix(in srgb,#3DBE5C 30%,var(--card))}
.pb-line{fill:none;stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:.45}
.pb-zone{fill:color-mix(in srgb,#3DBE5C 45%,var(--card))}
.pb-u{fill:#2F7BF0;stroke:var(--card);stroke-width:.6}
.pb-t{fill:#F0443A;stroke:var(--card);stroke-width:.6}
.pb-ball{fill:#fff;stroke:#222;stroke-width:.45}
.pb-a{fill:none;stroke:var(--ink);stroke-width:.75;stroke-linecap:round}
.pb-a.pass{stroke-dasharray:2.2 1.6}
.pb-a.dribble{stroke-dasharray:.1 1.4;stroke-width:1.05}
.pb-head{fill:var(--ink)}
.pb-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:800;color:var(--ink2);margin-top:8px}
.pb-key span{display:inline-flex;align-items:center;gap:6px}
.pb-key i{display:inline-block;width:11px;height:11px;border-radius:50%}
.pb-key svg{width:22px;height:8px}
.count-row{display:flex;gap:10px;margin-top:10px}
.count-row .txt-in{flex:1;min-width:0}
.best{font-size:15px;font-weight:900;color:var(--ink2);margin-top:8px;min-height:20px}
/* crossword */
.cw-grid{display:grid;gap:3px;width:100%;max-width:300px;margin:12px auto 0}
.cw-cell{position:relative;aspect-ratio:1;background:var(--card2);border-radius:8px}
.cw-cell.blk{background:none}
.cw-cell input{width:100%;height:100%;border:none;background:none;text-align:center;font-family:var(--fd);font-size:24px;color:var(--ink);
text-transform:uppercase;outline:none;caret-color:transparent;padding:0;border-radius:8px}
.cw-cell.hl{background:color-mix(in srgb,var(--edu) 22%,var(--card2))}
.cw-cell.sel{box-shadow:inset 0 0 0 3px var(--edu)}
.cw-cell.good input{color:#19A34A}
.cw-cell.bad input{color:#E53935}
.cw-cell.won{animation:pop .5s var(--spring) both}
.cw-num{position:absolute;top:2px;left:4px;font-size:9px;font-weight:900;color:var(--ink3);pointer-events:none}
.cw-clue{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card2);min-height:62px}
.cw-clue-l{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--edu);display:flex;justify-content:space-between}
.cw-clue-l button{border:none;background:none;color:var(--edu);font-weight:900;font-size:13px}

const MIND=[
["Replay your best play","🎬",["Get comfortable and let your body go heavy.","Think of the best thing you did today. Big or small.","Now play it back in slow motion, like a highlight.","Notice where you were and what you did.","Hear the cheer. Feel how good it felt.","Keep that feeling and let your eyes get sleepy."]],
["The perfect free kick","⚽",["Picture the ball sitting still on the grass.","You take a few steps back. The stadium goes quiet.","You breathe in. You feel calm and ready.","You run up and strike it clean.","Watch it curl over the wall and into the corner.","Goal. Let the cheer fade away into quiet."]],
["The perfect spiral","🏈",["Picture the football in your hand, fingers on the laces.","You drop back. Everything slows down.","You see your receiver break open.","You step and throw. The ball spins in a perfect spiral.","It drops right into their hands. Touchdown.","Let the stadium lights dim, one by one."]],
["Rest after the big game","🛌",["Lie still, like you're resting after a big game.","Let your feet and legs get heavy. They worked hard today.","Let your belly rise and fall slowly.","Let your shoulders drop and your arms go loose.","Let your face relax, even your eyebrows.","Your whole body is resting now. Good game."]],
["Calm at the penalty spot","🥅",["Picture yourself walking up to the penalty spot.","Your heart is beating fast. That's okay.","You take one slow breath in, and a long breath out.","You pick your spot and you trust it.","Your body feels calm and steady.","Bring that calm with you into sleep."]],
["The diving catch","🧤",["Picture a long pass flying through the night sky.","You're running, and everything feels easy.","You stretch out, eyes on the ball.","It lands softly in your hands.","You roll on the grass and hold on tight.","Feel how proud you are, and let your body rest."]],
["Game film","📼",["Pretend you're watching film of your day.","Fast-forward to something that went well.","Pause there. What did you do right?","Now think of one thing you'll try tomorrow.","Picture yourself doing it well.","Turn off the screen. The film can wait until morning."]],
["Team huddle","🤝",["Picture your team in a huddle, arms around each other.","Think of someone who helped you today.","Say thank you to them in your head.","Think of someone you helped too.","Feel how good it is to be on a team.","Break the huddle, and let sleep come."]],
["Practice in your mind","🎯",["Pick one skill you're working on.","Picture yourself doing it slowly, step by step.","Now picture it again, a little faster.","See yourself doing it just right.","Tomorrow, you'll try it for real.","Let your body relax and rest now."]],
["Stadium lights out","🏟️",["Picture an empty stadium after the game.","The crowd has gone home. It's quiet.","One by one, the big lights switch off.","Now it's just the stars above the field.","The grass is cool and the air is still.","Goodnight, stadium. Goodnight, you."]],
["The breakaway","💨",["Picture yourself with the ball and open field ahead.","Your legs feel strong and light.","The wind rushes past as you run.","Nobody can catch you. You feel free.","You cross the line and slow to a walk.","Breathe slow. Let your legs rest now."]],
["Next play","🔁",["Think of something that didn't go your way today.","That's okay. Everybody has plays like that.","Picture yourself shaking it off, like a pro.","Say to yourself: next play.","Tomorrow is a brand new game.","Let it go, and let yourself rest."]],

["Warm night on the field","🌙",["Picture lying on the soft grass of your favorite field.","The sky above is full of stars.","You can hear crickets and a gentle breeze.","Your body sinks into the cool grass.","Each breath out makes you a little sleepier.","Close your eyes and rest."]]

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>dateKey(new Date());
const dayNumber=k=>Math.round(new Date((k||todayKey())+'T12:00:00')/864e5);
function readJSON(k,fb){try{return JSON.parse(localStorage.getItem(k))||fb}catch(e){return fb}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function splitLine(s){const i=String(s).indexOf('|');return i<0?[String(s).trim(),'']:[s.slice(0,i).trim(),s.slice(i+1).trim()]}
function seeded(str){                      // small, stable PRNG from a string
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296};
}
function shuffled(arr,seed){const a=arr.slice(),r=seeded(seed);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* Today's item from a bank: shuffled once, walked a step a day, so nothing
   repeats until the whole bank has had its turn. */
function daily(n,seed,day){
  if(!n)return 0;
  const order=shuffled([...Array(n).keys()],KP+seed);
  return order[dayNumber(day)%n];
}

function haptic(p){if(!S.haptics)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let actx=null;
function audio(){if(!S.sound)return null;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
function tone(freq,at,dur,vol,type){
  const c=audio();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+at;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.05);
}
function tick(f){tone(f||620,0,0.06,0.05,'triangle')}
function chime(){[523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.1,0.9,0.1,'triangle'))}
function fanfare(){[392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.09,1.1,0.09,'triangle'))}
function whistle(){tone(2200,0,0.18,0.05,'square');tone(2200,0.24,0.5,0.05,'square')}
function confetti(n){
  if(REDUCED)return;
  const fx=$('fx'),cols=['#FF7A1A','#1FB45A','#2F7BF0','#FFB300','#7C5CFF','#12B5A6','#FF4D6D'];
  for(let i=0;i<(n||70);i++){
    const p=document.createElement('i');p.className='cf';
    p.style.left=(Math.random()*100)+'%';
    p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',((Math.random()-.5)*160).toFixed(0)+'px');
    p.style.setProperty('--r',((Math.random()-.5)*900).toFixed(0)+'deg');
    p.style.animationDuration=(1.6+Math.random()*1.4).toFixed(2)+'s';
    p.style.animationDelay=(Math.random()*.4).toFixed(2)+'s';
    fx.appendChild(p);
  }
  setTimeout(()=>{fx.innerHTML=''},3600);
}

let histArmed=false,histSkip=false,cur='home';
function armHist(){if(histArmed)return;try{window.history.pushState({gd:1},'');histArmed=true}catch(e){}}
function disarmHist(){if(!histArmed)return;histArmed=false;histSkip=true;try{window.history.back()}catch(e){histSkip=false}}
addEventListener('popstate',()=>{
  if(histSkip){histSkip=false;return}
  histArmed=false;
  if(cur!=='home')navBack();
});
function show(id,back){
  document.querySelectorAll('.scr.on').forEach(s=>s.classList.remove('on','rev'));

/* ═══════════ A CARD ═══════════ */
let curCard=null;
const RENDER={};
function openCard(id){
  const c=CARD[id];if(!c)return;
  curCard=c;stopTimers();
  const card=$('card');card.setAttribute('style',colorOf(c.k));
  $('heroEmo').innerHTML=emoOf(c);
  $('heroTag').textContent=c.word;
  $('heroH').textContent=c.name;
  $('heroP').textContent=c.lead;
  const hc=halfCards(c.half);
  $('dots').innerHTML=hc.map(x=>'<i class="'+(x.id===id?'on':isDone(x.id)?'done':'')+'"></i>').join('');
  const body=$('cbody');body.innerHTML='';
  (RENDER[id]||renderSoon)(body,c);
  /* a game's Next button waits until the game is over, so a tap meant for
     the game can't skip it; a quiet link below still lets him move on */
  if(c.gate&&!isDone(id)){
    const sk=document.createElement('button');sk.className='skip-link';sk.textContent='Skip this one for today';
    sk.onclick=()=>{stopTimers();const n=nextInHalf(c);if(n)openCard(n.id);else showFinal(c.half)};
    body.appendChild(sk);
  }
  paintNext();
  go('card');
}
function nextInHalf(c){const hc=halfCards(c.half),i=hc.indexOf(c);return hc.slice(i+1).find(x=>!isDone(x.id))||null}

  const c=curCard,n=nextInHalf(c);
  $('card').classList.toggle('gated',!!(c.gate&&!isDone(c.id)));
  const sk=document.querySelector('#cbody .skip-link');if(sk&&isDone(c.id))sk.remove();
  $('cardNext').textContent=n?'Done! Next: '+n.name+' ▶':(c.half===1?'Finish Pre-Game ▶':'Finish the day ▶');

  if(isDone(id))return;

/* ═══════════ STREAK: wins in a row, one grace day a week ═══════════ */
const dayBefore=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()-(n||1));return dateKey(d)};
function streakInfo(){
  const n=+localStorage.getItem(KP+'Streak')||0,last=localStorage.getItem(KP+'Done');
  /* a streak whose last win is more than two days back has already ended */
  const alive=last&&(last===todayKey()||last===dayBefore(todayKey(),1)||(last===dayBefore(todayKey(),2)&&graceAvailable()));
  return {n:alive?n:0};
}
function graceAvailable(){
  const g=localStorage.getItem(KP+'Grace');
  if(!g)return true;
  return Math.round((new Date(todayKey()+'T12:00:00')-new Date(g+'T12:00:00'))/864e5)>=7;
}
function winDay(){
  const today=todayKey(),last=localStorage.getItem(KP+'Done');
  if(last===today)return;
  let n=+localStorage.getItem(KP+'Streak')||0;
  if(last===dayBefore(today,1))n+=1;
  else if(last===dayBefore(today,2)&&graceAvailable()){n+=1;try{localStorage.setItem(KP+'Grace',today)}catch(e){}}
  else n=1;
  try{localStorage.setItem(KP+'Streak',n);localStorage.setItem(KP+'Done',today)}catch(e){}
  const h=readJSON(KP+'History',{});h[today]=1;writeJSON(KP+'History',h);
}

/* ═══════════ FUEL UP: THE FOOD GROUP CHALLENGE ═══════════
   The lesson: MyPlate's five food groups, what's in each, and what each one
   does for your body. Six questions a day: three "which group?" sorts (one
   of them a tricky food) and three about what food does for you. Every fact
   is sourced in content/fuel.py; the sources are listed for grown-ups in
   Settings, not on his screen. */
const groupOf=k=>FOOD_GROUPS.find(g=>g.k===k);
function fsState(){DAY.fuel=DAY.fuel&&DAY.fuel.v===3?DAY.fuel:{v:3,r:0,i:0,picks:[]};return DAY.fuel}
function fsRound(r,day){
  if(!FOODS.length||!FOOD_QUIZ.length)return[];
  const d=dayNumber(day)+(r||0)*7;
  const regular=shuffled(FOODS.map((f,i)=>i).filter(i=>!FOODS[i].why),KP+'foods');
  const tricky=shuffled(FOODS.map((f,i)=>i).filter(i=>FOODS[i].why),KP+'foods-tricky');
  const quiz=shuffled(FOOD_QUIZ.map((q,i)=>i),KP+'food-quiz');
  const a=regular[(d*2)%regular.length];let b=regular[(d*2+1)%regular.length];
  for(let k=1;k<regular.length&&FOODS[b].g[0]===FOODS[a].g[0];k++)b=regular[(d*2+1+k)%regular.length];
  const q=j=>quiz[(d*3+j)%quiz.length];
  return [{t:'sort',i:a},{t:'quiz',i:q(0)},{t:'sort',i:tricky[d%tricky.length]},{t:'quiz',i:q(1)},{t:'sort',i:b},{t:'quiz',i:q(2)}];
}
const fsRight=(f,k)=>f.g.indexOf(k)>=0;
function fsIsRight(item,pick){return item.t==='sort'?fsRight(FOODS[item.i],pick):pick===0}
const fsNugget=(k,seed)=>{const ns=FOOD_NUGGETS[k]||[];return ns.length?ns[seed%ns.length]:null};
RENDER.fuel=function(body){body.innerHTML='<div class="stk" id="fsCard"></div>';fsPaint()};
function fsPaint(){
  const st=fsState(),items=fsRound(st.r),box=$('fsCard');if(!box)return;
  if(st.i>=items.length)return fsSummary();
  const it=items[st.i],picked=st.picks[st.i],done=picked!==undefined;
  const score=st.picks.filter((p,i)=>fsIsRight(items[i],p)).length;
  let h='<div class="fs-top"><span>Question '+(st.i+1)+' of '+items.length+'</span><span class="fs-score">★ '+score+'</span></div>';
  if(it.t==='sort'){
    const f=FOODS[it.i];
    h+='<div class="fs-food"><div class="fs-emo">'+f.e+'</div><div><div class="fs-name">'+esc(f.n)+'</div>'+
      '<div class="fs-q">Which food group is it in?</div></div></div><div class="gbtns">'+
      FOOD_GROUPS.map(g=>{
        let cls='gbtn',mark='';
        if(done){if(fsRight(f,g.k)){cls+=' right';mark='✓ '}else if(g.k===picked){cls+=' wrong';mark='✗ '}else cls+=' dim'}
        return '<button class="'+cls+'" style="--gc:'+g.c+'" data-a="'+g.k+'"'+(done?' disabled':'')+'>'+mark+esc(g.name)+'</button>'}).join('')+'</div>';
  }else{
    const q=FOOD_QUIZ[it.i],order=shuffled(q.c.map((c,i)=>i),todayKey()+':fq:'+it.i);
    h+='<div class="fs-quiz"><div class="fs-tag">🧠 Quick question</div><div class="fs-qq">'+esc(q.q)+'</div></div><div class="qbtns">'+
      order.map(ci=>{
        let cls='qbtn',mark='';
        if(done){if(ci===0){cls+=' right';mark='✓ '}else if(ci===picked){cls+=' wrong';mark='✗ '}else cls+=' dim'}
        return '<button class="'+cls+'" data-a="'+ci+'"'+(done?' disabled':'')+'>'+mark+esc(q.c[ci])+'</button>'}).join('')+'</div>';
  }
  if(done){
    const ok=fsIsRight(it,picked);
    h+='<div class="fs-res">';
    if(it.t==='sort'){
      const f=FOODS[it.i],where=f.g.map(k=>groupOf(k).name).join(' or ');
      const nug=fsNugget(f.g[0],dayNumber()+it.i);
      h+='<div class="fs-head '+(ok?'ok':'no')+'">'+(ok?'✅ Yes!':'❌ Not quite.')+'</div>'+
        '<div class="fs-why">'+esc(f.n)+(f.g.length>1?' can go in '+esc(where)+'.':' '+(/s$/.test(f.n)&&!/ss$/.test(f.n)?'are':'is')+' in the '+esc(where)+' group.')+
        (f.why?' '+esc(f.why):'')+'</div>'+
        (nug?'<div class="dyk"><b>💡 Did you know?</b><p>'+esc(nug[0])+'</p></div>':'');
    }else{
      const q=FOOD_QUIZ[it.i];
      h+='<div class="fs-head '+(ok?'ok':'no')+'">'+(ok?'✅ Yes!':'❌ Not quite. It’s '+esc(q.c[0])+'.')+'</div>'+
        '<div class="dyk"><b>💡 Did you know?</b><p>'+esc(q.why)+'</p></div>';
    }
    h+='<button class="btn3d small fs-next" style="'+colorOf('eat')+'" onclick="fsNext()">'+(st.i+1>=items.length?'See my score ▶':'Next question ▶')+'</button></div>';
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!b.disabled)fsAnswer(it.t==='sort'?b.dataset.a:+b.dataset.a)});
}
function fsAnswer(a){
  const st=fsState();if(st.picks[st.i]!==undefined)return;
  const it=fsRound(st.r)[st.i];
  st.picks[st.i]=a;const ok=fsIsRight(it,a);
  const s=readJSON(KP+'Food',{right:0,n:0});s.n++;if(ok)s.right++;writeJSON(KP+'Food',s);
  saveDay();haptic(ok?[14,40,24]:[30]);if(ok)tick(760);else tick(300);
  fsPaint();
  const res=document.querySelector('.fs-res');if(res)setTimeout(()=>res.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'}),60);
}
function fsNext(){const st=fsState();st.i++;saveDay();haptic(8);fsPaint();$('card').scrollTo({top:0,behavior:REDUCED?'auto':'smooth'})}
function fsSummary(){
  const st=fsState(),items=fsRound(st.r),n=items.length,right=st.picks.filter((p,i)=>fsIsRight(items[i],p)).length;
  const title=right===n?'Perfect! Food Group MVP':right>=n-2?'Food Group Pro':'Nice work, Rookie!';

  $('fsCard').innerHTML='<div class="fs-done"><div class="sec-l">Today’s challenge</div><div class="fs-big">'+right+' / '+n+'</div>'+
    '<div class="fs-title">'+esc(title)+'</div>'+
    '<div class="spot" style="--gc:'+g.c+'"><span class="pill">Group of the day</span><h3>'+esc(g.name)+'</h3>'+
    '<p>'+esc(g.does)+'</p><p>Tip: '+esc(g.tip)+'</p></div>'+
    '<button class="btn3d small ghost fs-next" onclick="fsMore()">Play 6 more ↻</button></div>';
  if(!isDone('fuel')){markDone('fuel');paintNext()}
}
function fsMore(){const st=fsState();st.r++;st.i=0;st.picks=[];saveDay();haptic(8);fsPaint();$('card').scrollTo({top:0})}

const fmt=t=>{t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

/* The diagram is data: dots, a ball and arrows on a 100 by 60 field, his team
   attacking to the right. Colours come from the theme. */
function pbSvg(p){
  const d=p.d,soccer=p.s==='soccer',o=[];
  o.push('<svg class="pb-svg" viewBox="-2 -2 104 64" role="img" aria-label="Diagram: '+esc(p.name)+'">');
  o.push('<defs><marker id="pbHead" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="pb-head" d="M0 0L6 3L0 6z"/></marker></defs>');
  o.push('<rect class="pb-grass" x="-2" y="-2" width="104" height="64" rx="3"/>');
  if(soccer){
    o.push('<rect class="pb-line" x="0" y="0" width="100" height="60"/><path class="pb-line" d="M50 0V60"/><circle class="pb-line" cx="50" cy="30" r="8"/>'+
      '<rect class="pb-line" x="0" y="14" width="15" height="32"/><rect class="pb-line" x="85" y="14" width="15" height="32"/>'+
      '<rect class="pb-line" x="0" y="23" width="5" height="14"/><rect class="pb-line" x="95" y="23" width="5" height="14"/>'+
      '<path class="pb-line" d="M0 26.5V33.5M100 26.5V33.5" style="stroke-width:1.6"/>');
  }else{
    o.push('<rect class="pb-zone" x="0" y="0" width="8" height="60"/><rect class="pb-zone" x="92" y="0" width="8" height="60"/>');
    let lines='';for(let x=8;x<=92;x+=8.4)lines+='M'+x.toFixed(1)+' 0V60';
    o.push('<path class="pb-line" d="'+lines+'"/><rect class="pb-line" x="0" y="0" width="100" height="60"/>');
  }
  d.a.forEach(([k,x1,y1,x2,y2])=>{
    if(k==='dribble'){
      const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,steps=Math.max(2,Math.round(len/4));
      let path='M'+x1+' '+y1;
      for(let i=1;i<=steps;i++){const t=i/steps,w=(i===steps?0:(i%2?1.2:-1.2));path+='L'+(x1+dx*t+nx*w).toFixed(2)+' '+(y1+dy*t+ny*w).toFixed(2)}
      o.push('<path class="pb-a dribble" d="'+path+'" marker-end="url(#pbHead)"/>');
    }else o.push('<path class="pb-a '+k+'" d="M'+x1+' '+y1+'L'+x2+' '+y2+'" marker-end="url(#pbHead)"/>');
  });
  d.p.forEach(([t,x,y])=>o.push('<circle class="pb-'+(t==='u'?'u':'t')+'" cx="'+x+'" cy="'+y+'" r="2.7"/>'));
  o.push('<circle class="pb-ball" cx="'+d.b[0]+'" cy="'+(d.b[1]-0.1)+'" r="1.4"/></svg>');
  const kinds=[...new Set(d.a.map(a=>a[0]))];
  const line=k=>'<svg viewBox="0 0 22 8"><path class="pb-a '+k+'" d="M1 4H17" style="stroke-width:1.4"/><path class="pb-head" d="M16 1L21 4L16 7z"/></svg>';
  return o.join('')+'<div class="pb-key"><span><i style="background:#2F7BF0"></i>Your team</span>'+
    (d.p.some(x=>x[0]==='t')?'<span><i style="background:#F0443A"></i>Other team</span>':'')+
    ['run','pass','dribble'].filter(k=>kinds.indexOf(k)>=0).map(k=>'<span>'+line(k)+k[0].toUpperCase()+k.slice(1)+'</span>').join('')+'</div>';
}

/* ── Crossword: 5×5, mostly sports words ── */
let CW=null;
function cwBuild(p){
  const N=p.r.length,g=p.r.map(r=>r.split('')),num={},across=[],down=[];let n=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(g[r][c]==='#')continue;
    const sa=(c===0||g[r][c-1]==='#')&&(c<N-1&&g[r][c+1]!=='#'),sd=(r===0||g[r-1][c]==='#')&&(r<N-1&&g[r+1][c]!=='#');
    if(sa||sd)num[r+','+c]=++n;
    if(sa){const e=[];for(let i=c;i<N&&g[r][i]!=='#';i++)e.push([r,i]);across.push({n:n,cells:e,dir:'a'})}
    if(sd){const e=[];for(let i=r;i<N&&g[i][c]!=='#';i++)e.push([i,c]);down.push({n:n,cells:e,dir:'d'})}
  }
  [].concat(across,down).forEach(e=>{e.answer=e.cells.map(([r,c])=>g[r][c]).join('');e.clue=p.c[e.answer]||''});
  return {N:N,g:g,num:num,across:across,down:down,entries:across.concat(down)};
}
function cwOpen(){
  if(!PUZZLES.length)return;
  CW=cwBuild(PUZZLES[daily(PUZZLES.length,'cw')]);
  CW.key=KP+'CW-'+todayKey();CW.letters=readJSON(CW.key,{});CW.dir='a';CW.sel=null;
  $('bz').innerHTML='<div class="cw-clue"><div class="cw-clue-l"><span id="cwClueL"></span><button id="cwFlip" onclick="cwFlip()"></button></div><div class="cw-clue-t" id="cwClueT"></div></div>'+
    '<div class="cw-grid" id="cwGrid"></div><div class="cw-msg" id="cwMsg"></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn3d small ghost" onclick="cwCheck()">Check</button><button class="btn3d small ghost" onclick="cwReveal()">Show answers</button></div>';
  const grid=$('cwGrid');grid.style.gridTemplateColumns='repeat('+CW.N+',1fr)';
  for(let r=0;r<CW.N;r++)for(let c=0;c<CW.N;c++){
    const cell=document.createElement('div');
    if(CW.g[r][c]==='#'){cell.className='cw-cell blk';grid.appendChild(cell);continue}
    cell.className='cw-cell';cell.id='cw-'+r+'-'+c;
    const nm=CW.num[r+','+c];if(nm)cell.innerHTML='<span class="cw-num">'+nm+'</span>';
    const inp=document.createElement('input');
    inp.type='text';inp.maxLength=1;inp.autocapitalize='characters';inp.autocomplete='off';inp.spellcheck=false;inp.value=CW.letters[r+','+c]||'';
    inp.onfocus=()=>cwSelect(r,c,CW.dir,false);
    inp.onmousedown=e=>{if(CW.sel&&CW.sel[0]===r&&CW.sel[1]===c){e.preventDefault();cwSelect(r,c,CW.dir==='a'?'d':'a',true)}};
    inp.oninput=e=>{
      const v=(e.target.value||'').replace(/[^a-zA-Z]/g,'').toUpperCase().slice(-1);e.target.value=v;cell.classList.remove('bad','good');
      if(v){CW.letters[r+','+c]=v;writeJSON(CW.key,CW.letters);haptic(5);cwStep(1)}else{delete CW.letters[r+','+c];writeJSON(CW.key,CW.letters)}
      if(cwSolved())cwWin();
    };
    inp.onkeydown=e=>{if(e.key==='Backspace'&&!e.target.value){e.preventDefault();cwStep(-1)}};
    cell.appendChild(inp);grid.appendChild(cell);
  }
  const f=CW.across[0];cwSelect(f.cells[0][0],f.cells[0][1],'a',false);
}
const cwEntryAt=(r,c,dir)=>CW.entries.find(e=>e.dir===dir&&e.cells.some(x=>x[0]===r&&x[1]===c));
function cwSelect(r,c,dir,focus){
  if(!cwEntryAt(r,c,dir))dir=dir==='a'?'d':'a';
  CW.sel=[r,c];CW.dir=dir;const e=cwEntryAt(r,c,dir);
  document.querySelectorAll('.cw-cell').forEach(x=>x.classList.remove('hl','sel'));
  if(e)e.cells.forEach(([rr,cc])=>$('cw-'+rr+'-'+cc).classList.add('hl'));
  const cur=$('cw-'+r+'-'+c);cur.classList.add('sel');
  if(e){$('cwClueL').textContent=(dir==='a'?'Across':'Down')+' '+e.n;$('cwClueT').textContent=e.clue}
  const other=cwEntryAt(r,c,dir==='a'?'d':'a');$('cwFlip').style.visibility=other?'visible':'hidden';
  $('cwFlip').textContent='Switch to '+(dir==='a'?'Down':'Across')+' ⇅';
  if(focus)cur.querySelector('input').focus();
}
function cwFlip(){if(CW&&CW.sel)cwSelect(CW.sel[0],CW.sel[1],CW.dir==='a'?'d':'a',true)}
function cwStep(d){const [r,c]=CW.sel,e=cwEntryAt(r,c,CW.dir);if(!e)return;const i=e.cells.findIndex(x=>x[0]===r&&x[1]===c),nx=e.cells[i+d];if(nx)cwSelect(nx[0],nx[1],CW.dir,true)}
const cwSolved=()=>CW.entries.every(e=>e.cells.every(([r,c],i)=>(CW.letters[r+','+c]||'')===e.answer[i]));
function cwCheck(){
  let wrong=0,blank=0;
  for(let r=0;r<CW.N;r++)for(let c=0;c<CW.N;c++){if(CW.g[r][c]==='#')continue;
    const el=$('cw-'+r+'-'+c),v=CW.letters[r+','+c];el.classList.remove('bad','good');
    if(!v){blank++;continue}if(v===CW.g[r][c])el.classList.add('good');else{el.classList.add('bad');wrong++}}
  if(!wrong&&!blank)return cwWin();
  $('cwMsg').textContent=wrong?wrong+(wrong===1?' letter is':' letters are')+' off. You can fix them!':'Looking good! '+blank+' to go.';
}
function cwWin(){
  $('cwMsg').textContent='🎉 Solved it!';fanfare();confetti();haptic([18,40,22,40,60]);
  document.querySelectorAll('.cw-cell:not(.blk)').forEach((el,i)=>{el.classList.add('won');el.style.animationDelay=(i*22)+'ms'});
  brainWin();
}
function cwReveal(){
  for(let r=0;r<CW.N;r++)for(let c=0;c<CW.N;c++){if(CW.g[r][c]==='#')continue;CW.letters[r+','+c]=CW.g[r][c];$('cw-'+r+'-'+c).querySelector('input').value=CW.g[r][c]}
  writeJSON(CW.key,CW.letters);$('cwMsg').textContent='Here are the answers. New puzzle tomorrow!';brainWin();
}

/* ═══════════ RECOVERY ═══════════
   Tonight's sleep fact, his bedtime against the hours kids his age need,
   tonight's plan, and a one-minute cool-down. */
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):null};
const clock=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+(h<12?' AM':' PM')};
/* AASM: 9 to 12 hours for ages 6 to 12, 8 to 10 for 13 to 18 */
function kidHours(){const a=+S.age||10,r=KID_HOURS_BY_AGE.find(([f,t])=>a>=f&&a<=t);return r?r[2]:KID_HOURS_BY_AGE[0][2]}
const hrsLabel=h=>h==null?'':(Math.round(h*4)/4).toString().replace('.25','¼').replace('.5','½').replace('.75','¾');
function sleepHours(){const b=toMin(S.bed),w=toMin(S.wake);if(b==null||w==null)return null;return (((w-b)%1440)+1440)%1440/60}
function sleepState(){DAY.sleep=DAY.sleep||{plan:[]};return DAY.sleep}
RENDER.recovery=function(body){
  const st=sleepState(),f=SLEEP_FACTS[daily(SLEEP_FACTS.length,'sleep')],h=sleepHours();
  const [lo,hi]=kidHours();
  const hrs=hrsLabel(h);
  const verdict=h==null?'':h>=lo&&h<=hi?'✅ That’s right in the '+lo+' to '+hi+' hours kids your age need.'
    :h<lo?'⚠️ That’s less than the '+lo+' to '+hi+' hours kids your age need. Ask a grown-up about an earlier bedtime.'
    :'That’s more than '+hi+' hours. Check your times in Settings.';
  body.insertAdjacentHTML('afterbegin',(f?'<div class="stk fact" style="border-left:8px solid var(--slp)"><div class="sec-l">Recovery fact</div><div class="big-q" style="font-size:20px;margin-top:0">'+esc(f[0])+'</div></div>':'')+
    '<div class="stk"><div class="sec-l">Tonight’s sleep</div><div class="bed"><div class="moon">🛏️</div><div>'+
    '<div class="bed-big">Lights out '+esc(clock(toMin(S.bed)))+'</div><div class="bed-p">Up at '+esc(clock(toMin(S.wake)))+'. That’s '+hrs+' hours of recovery.</div></div></div>'+
    '<div class="bed-p" style="margin-top:10px">'+esc(verdict)+'</div></div>'+
    '<div class="stk"><div class="sec-l">Tonight’s game plan</div><div class="plan" id="sleepPlan"></div></div><div id="coolBox"></div>');
  const paint=()=>{$('sleepPlan').innerHTML=SLEEP_PLAN.map(([t],i)=>'<div class="job'+(st.plan[i]?' done':'')+'"><button class="tick" data-i="'+i+'">'+(st.plan[i]?'✓':'')+'</button><span>'+esc(t)+'</span></div>').join('')};
  paint();
  $('sleepPlan').onclick=e=>{const b=e.target.closest('.tick');if(!b)return;const i=+b.dataset.i;st.plan[i]=!st.plan[i];saveDay();haptic(st.plan[i]?[12,30,14]:6);if(st.plan[i])tick(760);paint()};
  wuMount($('coolBox'),COOLDOWN,'recovery','All loosened up. 😌','Your muscles are ready to rest.');
};

}

    $('suNum').oninput=e=>{S.num=Math.max(0,Math.min(99,parseInt(e.target.value,10)||0));saveS();$('suJersey').innerHTML=jerseySvg(S.color,S.num)};
    $('suColors').onclick=e=>{const c=e.target.closest('.sw');if(!c)return;S.color=c.dataset.c;saveS();haptic(8);
      $('suColors').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===c));$('suJersey').innerHTML=jerseySvg(S.color,S.num)};
  }else if(suStep===1){
    b.innerHTML='<div class="su-h">What do you love to play?</div><div class="su-p">Your trivia, plays and skills will match.</div>'+
      '<div class="sports" id="suSport">'+[['soccer','⚽','Soccer'],['football','🏈','Football'],['both','⚽🏈','Both']].map(([k,e,l])=>
        '<button class="sport-b'+(S.sport===k?' on':'')+'" data-v="'+k+'"><span>'+e+'</span>'+l+'</button>').join('')+'</div>';
    $('suSport').onclick=e=>{const x=e.target.closest('button');if(!x)return;S.sport=x.dataset.v;saveS();haptic(8);tick(700);
      $('suSport').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x))};
  }else{
    b.innerHTML='<div class="su-h">How old are you?</div><div class="su-p">So we know how much sleep you need to recover.</div>'+
      '<div class="stk">'+ageGrid('suAge')+'</div>'+
      '<div class="stk"><div class="sec-l">Bedtime and wake-up</div><div class="row">'+
      '<label style="flex:1;font-weight:900;font-size:14px;color:var(--ink2)">Lights out<input class="txt-in" id="suBed" type="time" value="'+esc(S.bed)+'"></label>'+
      '<label style="flex:1;font-weight:900;font-size:14px;color:var(--ink2)">Wake up<input class="txt-in" id="suWake" type="time" value="'+esc(S.wake)+'"></label></div>'+
      '<div class="bed-p" id="suHours" style="margin-top:12px"></div></div>';
    const hours=()=>{const h=sleepHours(),[lo,hi]=kidHours();
      $('suHours').textContent=h==null?'':(h>=lo&&h<=hi?'✅ ':'⚠️ ')+'That’s '+hrsLabel(h)+' hours of sleep. Kids your age need '+lo+' to '+hi+'.'};
    hours();
    $('suAge').onclick=e=>{const x=e.target.closest('button');if(!x)return;S.age=+x.dataset.v;saveS();haptic(6);
      $('suAge').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x));hours()};
    $('suBed').onchange=e=>{if(toMin(e.target.value)!=null){S.bed=e.target.value;saveS();hours()}};
    $('suWake').onchange=e=>{if(toMin(e.target.value)!=null){S.wake=e.target.value;saveS();hours()}};
  }
  suFoot();
}
function suFoot(){
  const n=$('suNext');n.disabled=suStep===0&&!S.name;
  n.textContent=suStep<2?'Next ▶':'Let’s play ▶';
  n.style.cssText=colorOf(suStep<2?'edu':'eat');
}
function suGo(d){
  if(d>0&&suStep===0&&!S.name){$('suName').focus();return}
  if(d>0&&suStep===2){S.setup=true;saveS();fanfare();confetti(60);go('home');return}
  suStep=Math.max(0,suStep+d);haptic(8);suPaint();$('setup').scrollTop=0;
}

    '<div class="stk"><div class="sec-l">Favorite sport</div>'+seg('setSport',[['both','Both'],['soccer','⚽ Soccer'],['football','🏈 Football']],S.sport)+'</div>'+

      '<label style="flex:1;font-weight:900;font-size:14px;color:var(--ink2)">Wake up<input class="txt-in" id="setWake" type="time" value="'+esc(S.wake)+'"></label></div></div>'+
    '<div class="stk"><div class="sec-l">Sounds and buzz</div>'+seg('setSound',[['on','On'],['off','Off']],S.sound?'on':'off')+'</div>'+
    '<div class="stk"><div class="sec-l">For grown-ups: put it on the home screen</div><div class="bed-p" style="margin:0">'+

    '<div class="stk"><div class="sec-l">For grown-ups: backup</div><div class="bed-p" style="margin:0 0 10px">Everything is saved on this device only. Save a backup file now and then, so a lost or reset phone doesn’t lose the streak.</div>'+

  onSeg('setSport',v=>{S.sport=v});

/* backup: a JSON file of every Game Day key (gd*), and nothing from other apps */
function exportData(){
  const out={app:APP.id,version:APP_VERSION,exported:new Date().toISOString(),data:{}};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(KP)===0)out.data[k]=localStorage.getItem(k)}
  const name=APP.backup+'-backup-'+todayKey()+'.json';
  try{
    const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    $('backupMsg').textContent='Saved '+name+'. Keep it somewhere safe.';
  }catch(e){$('backupMsg').textContent='Could not save a file on this device.'}
}
function importFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let obj;try{obj=JSON.parse(String(rd.result))}catch(e){$('backupMsg').textContent='That isn’t a Game Day backup.';return}
    if(!obj||obj.app!==APP.id||!obj.data){$('backupMsg').textContent='That isn’t a Game Day backup.';return}
    const keys=Object.keys(obj.data).filter(k=>k.indexOf(KP)===0);
    if(!keys.length||!confirm('Restore '+keys.length+' saved items? This replaces what’s on this device.'))return;
    keys.forEach(k=>{try{localStorage.setItem(k,String(obj.data[k]))}catch(e){}});
    $('backupMsg').textContent='Restored. Reloading…';setTimeout(()=>location.reload(),600);
  };
  rd.readAsText(f);input.value='';
}
function renderSettingsJersey(){const j=document.querySelector('#setBody .jersey');if(j)j.innerHTML=jerseySvg(S.color,S.num)}

/* timers belong to whichever card started them */
const TIMERS=new Set();
function stopTimers(){TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS.clear()}

/* ═══════════ OFFLINE AND UPDATES ═══════════ */
/* Ask the browser not to clear his data under storage pressure, where it lets us ask. */
function askPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{})},()=>{})}catch(e){}}
let swReg=null;
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      swReg=reg;
      /* a worker that finished installing on an earlier visit is already waiting */
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
      reg.addEventListener('updatefound',()=>{const sw=reg.installing;if(!sw)return;
        sw.addEventListener('statechange',()=>{if(sw.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    }).catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.hidden||!swReg)return;
      if(swReg.waiting&&navigator.serviceWorker.controller)showUpdate();swReg.update().catch(()=>{})});
    const hadController=!!navigator.serviceWorker.controller;let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;location.reload()});
  });
}
function showUpdate(){
  const b=$('updateBar');if(!b)return;b.style.display='';
  b.onclick=()=>{b.textContent='Updating…';navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.waiting)r.waiting.postMessage('skipWaiting');else location.reload()})};
}

document.addEventListener('pointerdown',()=>audio(),{once:true});

  if(cur==='home')renderHome();else applyTheme();
});
